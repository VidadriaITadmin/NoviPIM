<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIM – demo prenove</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f6f9;--surface:#fff;--subtle:#fafbfc;--hover:#f8fafc;--border:#e5e7eb;--border-s:#d1d5db;--soft:#f1f5f9;
 --text:#111827;--strong:#1e293b;--muted:#666d76;--soft-t:#475569;
 --primary:#4f46e5;--primary-h:#4338ca;--ring:rgba(79,70,229,.14);--primary-bg:#eef2ff;
 --accent:#f97316;--accent-h:#ea580c;--rail:#0f172a;--rail2:#172033;--rail-on:#21304a;--rail-t:#cbd5e1;
 --good-bg:#ecfdf5;--good-b:#a7f3d0;--good:#047857;--good-bar:#22c55e;
 --warn-bg:#fffbeb;--warn-b:#fde68a;--warn:#b45309;--warn-bar:#f59e0b;
 --bad-bg:#fef2f2;--bad-b:#fecaca;--bad:#b91c1c;
 --info-bg:#eff6ff;--info-b:#bfdbfe;--info:#2563eb;
 --neu-bg:#f1f5f9;--neu-b:#e2e8f0;--neu:#475569;
 --ai:#7c3aed;--ai-bg:#f5f3ff;--ai-b:#ddd6fe;
 --r:12px;--r-sm:8px;--sh:0 1px 3px rgba(15,23,42,.06);--sh-h:0 8px 20px rgba(15,23,42,.10)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--primary);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
code{background:var(--soft);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:12px}
#app{display:flex;height:100vh;overflow:hidden}
/* ozek meni (Akeneo oblika, naše barve) */
#rail{width:84px;flex:none;background:var(--rail);display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid #1e293b}
.brand{height:68px;display:grid;place-items:center;flex:none}
.brand span{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px}
.ri{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;color:var(--rail-t);cursor:pointer;font-size:11px;font-weight:500;text-align:center;position:relative;margin:1px 8px;border-radius:10px;user-select:none}
.ri svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ri:hover{background:var(--rail2);color:#fff}
.ri.on{background:var(--rail-on);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.ri.on svg{stroke:#fb923c}
.ri .nb{position:absolute;top:4px;right:10px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;line-height:16px;padding:0 5px;font-weight:700}
.rspace{flex:1}
/* podmeni */
#sub{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:18px 12px}
.sh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:700;margin:4px 10px 8px}
.sh.m{margin-top:20px}
.sn{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--soft-t);margin-bottom:1px;font-weight:500;font-size:13.5px}
.sn:hover{background:var(--hover);text-decoration:none;color:var(--text)}
.sn.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.sn .c{font-size:11px;background:var(--soft);color:var(--soft-t);border-radius:10px;padding:0 7px;font-weight:600}
.sn.on .c{background:#fff}
.sn .c.w{background:var(--warn-bg);color:var(--warn)}.sn .c.b{background:var(--bad-bg);color:var(--bad)}
main{flex:1;overflow:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 32px;min-height:60px}
.cmd{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;border:1px solid var(--border-s);border-radius:10px;padding:0 12px;height:38px;color:var(--muted);cursor:text;background:var(--subtle)}
.cmd:hover{border-color:var(--primary)}
.cmd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cmd kbd{margin-left:auto;font:600 11px Inter;border:1px solid var(--border);border-radius:5px;padding:1px 6px;background:#fff}
.tr{margin-left:auto;display:flex;align-items:center;gap:12px}
.ctx select{height:34px;border:1px solid var(--border-s);border-radius:8px;padding:0 8px;font:500 13px Inter;color:var(--strong);background:#fff}
.user{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--soft-t)}
.av{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.content{padding:24px 32px 120px;max-width:1400px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px}.crumbs a{color:var(--muted)}
.hdr{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ht{flex:1;min-width:260px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;color:var(--text)}
h2{font-size:16px;font-weight:600;margin:0 0 12px;color:var(--strong)}
h3{font-size:13px;font-weight:600;color:var(--strong);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.lead{color:var(--muted);font-size:14px;margin:0;max-width:820px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-s);background:#fff;color:var(--strong);font:600 13px Inter;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);border-color:#9ca3af}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn.p:hover{background:var(--primary-h)}
.btn.ai{background:var(--ai-bg);border-color:var(--ai-b);color:var(--ai)}.btn.ai:hover{background:#ede9fe}
.btn.d{color:var(--bad);border-color:var(--bad-b)}.btn.d:hover{background:var(--bad-bg)}
.btn.g{border-color:transparent;background:transparent;color:var(--soft-t)}.btn.g:hover{background:var(--soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.inp,.sel,textarea.inp{height:38px;border:1px solid var(--border-s);border-radius:8px;padding:0 11px;font:14px Inter;color:var(--strong);background:#fff;width:100%;max-width:520px}
textarea.inp{height:auto;min-height:96px;padding:9px 11px;resize:vertical;line-height:1.55}
.inp:focus,.sel:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.inp:disabled,.sel:disabled,textarea.inp:disabled{background:var(--soft);color:var(--muted)}
.inp.sm,.sel.sm{height:32px;font-size:13px;max-width:200px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.sticky{position:sticky;top:76px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.pill.good{background:var(--good-bg);border-color:var(--good-b);color:var(--good)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn-b);color:var(--warn)}
.pill.bad{background:var(--bad-bg);border-color:var(--bad-b);color:var(--bad)}
.pill.info{background:var(--info-bg);border-color:var(--info-b);color:var(--info)}
.pill.neu{background:var(--neu-bg);border-color:var(--neu-b);color:var(--neu)}
.pill.ai{background:var(--ai-bg);border-color:var(--ai-b);color:var(--ai)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.good{background:var(--good-bar)}.dot.warn{background:var(--warn-bar)}.dot.bad{background:#ef4444}.dot.neu{background:#94a3b8}.dot.info{background:#3b82f6}
.muted{color:var(--muted);font-size:13px}.small{font-size:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tbl th{text-align:left;font-weight:600;color:var(--muted);background:var(--subtle);border-bottom:1px solid var(--border);padding:10px 14px;font-size:12px;white-space:nowrap}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--primary)}
.tbl td{border-bottom:1px solid var(--soft);padding:11px 14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:var(--hover)}
.tbl tr.sel td{background:#f5f7ff}
.tbl .num{text-align:right;white-space:nowrap}
.tbl.plain{box-shadow:none}
.thumb{width:44px;height:44px;border:1px solid var(--border);border-radius:8px;object-fit:cover;background:var(--soft);display:block}
.thumb.e{display:grid;place-items:center;color:#94a3b8;font-size:10px;text-align:center}
.nm{font-weight:600;color:var(--text)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search input{padding-left:36px;max-width:none}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font:500 13px Inter;color:var(--soft-t);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--sh);font-weight:600}
.seg .c{font-size:11px;color:var(--muted)}
.fsel{height:34px;border:1px solid var(--border-s);border-radius:8px;padding:0 8px;font:13px Inter;background:#fff;color:var(--strong)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:6px 0 18px;overflow-x:auto}
.tab{padding:9px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--text)}.tab.on{color:var(--primary);border-color:var(--primary)}
.cnt{font-size:11px;border-radius:10px;padding:0 7px;font-weight:700;line-height:18px}
.cnt.bad{background:var(--bad-bg);color:var(--bad)}.cnt.warn{background:var(--warn-bg);color:var(--warn)}.cnt.neu{background:var(--soft);color:var(--soft-t)}
.help{border:1px solid var(--info-b);background:var(--info-bg);padding:10px 14px;border-radius:10px;margin:0 0 18px;color:#1e3a8a;font-size:13px;display:flex;gap:10px}
.help .x{margin-left:auto}
.x{border:none;background:none;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.task{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r);background:#fff;margin-bottom:10px;box-shadow:var(--sh)}
.task .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px}
.ic.bad{background:var(--bad-bg);color:var(--bad)}.ic.warn{background:var(--warn-bg);color:var(--warn)}.ic.ai{background:var(--ai-bg);color:var(--ai)}.ic.info{background:var(--info-bg);color:var(--info)}.ic.good{background:var(--good-bg);color:var(--good)}.ic.neu{background:var(--soft);color:var(--soft-t)}
.task .tt{font-weight:600;color:var(--text)}.task .td{color:var(--muted);font-size:13px;margin-top:2px}
.task .ta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.feed div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.feed div:last-child{border-bottom:none}
.feed .t{color:var(--muted);width:48px;flex:none}
.kpi{padding:16px 18px}.kpi .k{color:var(--muted);font-size:13px;font-weight:500}.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.click{cursor:pointer}.kpi.click:hover{box-shadow:var(--sh-h)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--good-bar);border-radius:4px}
.bar.w i{background:var(--warn-bar)}.bar.b i{background:#ef4444}.bar.p i{background:var(--primary)}
.check{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.check:last-child{border-bottom:none}
.check .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.ci.good{background:var(--good-bg);color:var(--good)}.ci.bad{background:var(--bad-bg);color:var(--bad)}.ci.warn{background:var(--warn-bg);color:var(--warn)}.ci.neu{background:var(--soft);color:var(--muted)}
.check .cn{font-weight:600}.check .cd{font-size:13px;color:var(--muted)}
.miss{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12.5px;margin:4px 4px 0 0;cursor:pointer;border:1px solid}
.miss.bad{background:var(--bad-bg);border-color:var(--bad-b);color:var(--bad)}.miss.warn{background:var(--warn-bg);border-color:var(--warn-b);color:var(--warn)}
.miss:hover{filter:brightness(.97);text-decoration:underline}
.ehd{display:flex;gap:18px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.bigimg{width:92px;height:92px;border:1px solid var(--border);border-radius:12px;object-fit:cover;background:var(--soft);flex:none}
.bigimg.e{display:grid;place-items:center;color:#94a3b8;font-size:12px}
.statusline{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:14px}
.fld{margin-bottom:16px;scroll-margin-top:90px}
.fld>label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--strong);margin-bottom:6px;flex-wrap:wrap}
.fld .hint{font-weight:400;color:var(--muted);font-size:12px}
.fld.bad .inp,.fld.bad .sel{border-color:#f87171;background:#fffafa}
.fld.warn .inp,.fld.warn .sel{border-color:#fbbf24}
.fld .fm{font-size:12px;margin-top:4px}
.fld.bad .fm{color:var(--bad)}.fld.warn .fm{color:var(--warn)}
.fld.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{background:#eef2ff;box-shadow:0 0 0 8px #eef2ff;border-radius:6px}100%{background:transparent;box-shadow:none}}
.lock{font-size:11.5px;font-weight:500;color:#8a5a00;background:#fff7e6;border:1px solid #fde2a8;border-radius:6px;padding:0 6px}
.pend{font-size:12.5px;color:var(--info);margin-top:4px}
.note{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-b);color:#78350f}
.note.bad{background:var(--bad-bg);border:1px solid var(--bad-b);color:#7f1d1d}
.note.info{background:var(--info-bg);border:1px solid var(--info-b);color:#1e3a8a}
.note.good{background:var(--good-bg);border:1px solid var(--good-b);color:#064e3b}
.note.ai{background:var(--ai-bg);border:1px solid var(--ai-b);color:#4c1d95}
.savebar{position:fixed;left:320px;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(15,23,42,.08);padding:12px 32px;display:flex;align-items:center;gap:12px;z-index:30}
.bulk{position:fixed;left:320px;right:0;bottom:0;background:var(--rail);color:#fff;padding:12px 32px;display:flex;gap:10px;align-items:center;z-index:30;flex-wrap:wrap}
.bulk .btn{background:#1e293b;border-color:#334155;color:#fff}.bulk .btn:hover{background:#334155}.bulk .btn.ai{background:#4c1d95;border-color:#6d28d9}
.langs{display:inline-flex;gap:4px}.langs button{border:1px solid var(--border-s);background:#fff;border-radius:7px;padding:3px 10px;font:600 12px Inter;cursor:pointer;color:var(--soft-t);position:relative}
.langs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.langs button .md{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.ref{background:var(--soft);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--soft-t);margin-top:6px;max-width:520px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.imgt{border:1px solid var(--border);border-radius:10px;padding:6px;background:#fff}
.imgt img{width:100%;height:120px;object-fit:cover;border-radius:7px;display:block}
.tree{margin:6px 0}
.tn{display:flex;align-items:center;gap:2px;padding:1px 0}
.tw{width:16px;flex:none;text-align:center;color:var(--muted);cursor:pointer;font-size:11px}
.tl{padding:4px 8px;border-radius:7px;cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;color:var(--soft-t);font-size:13px}
.tl:hover{background:var(--hover)}.tl.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.tl .c{margin-left:auto;color:#94a3b8;font-size:11px}
.sw{width:38px;height:22px;border-radius:11px;border:none;background:#cbd5e1;position:relative;cursor:pointer;flex:none;vertical-align:middle}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--primary)}.sw.on::after{left:19px}.sw:disabled{opacity:.5;cursor:default}
.swl{display:inline-flex;align-items:center;gap:10px;font-size:14px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}
.flow span{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12.5px;color:var(--soft-t)}
.flow span.on{background:var(--primary);border-color:var(--primary);color:#fff}
.flow i{color:#94a3b8;font-style:normal}
.hub{cursor:pointer;display:flex;flex-direction:column;gap:6px}
.hub:hover{box-shadow:var(--sh-h);border-color:#c7d2fe}
.hub .ht2{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:start center;padding:10vh 16px 16px;z-index:60}
.dlg{background:#fff;border-radius:14px;width:min(620px,100%);max-height:80vh;overflow:auto;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.wide{width:min(900px,100%)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.fr{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center;margin-bottom:12px}
.fr>label{color:var(--soft-t);font-size:13px;font-weight:500}
.pal input{border:none;outline:none;font:16px Inter;width:100%;padding:6px 2px}
.pal .it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer}
.pal .it:hover,.pal .it.on{background:var(--primary-bg)}
.pal .gh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;font-weight:700;margin:12px 10px 4px}
#toasts{position:fixed;bottom:20px;right:20px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:420px}
.toast{background:var(--rail);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 16px;border-radius:10px;font-size:13.5px;border-left:4px solid var(--good-bar);animation:tin .2s}
.toast.err{border-left-color:#ef4444}.toast.info{border-left-color:#818cf8}.toast.warn{border-left-color:var(--warn-bar)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:11px 14px;border-radius:14px;font-size:14px}
.msg.u{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-s);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--soft-t)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.aic{border:1px solid var(--ai-b);background:linear-gradient(180deg,#faf8ff,#fff);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.aic .q{background:#fff;border:1px dashed var(--ai-b);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tech{border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}
details summary{cursor:pointer;color:var(--soft-t);font-weight:600;font-size:13px;margin:8px 0}

  if(q.includes('slik')){const l=ps.filter(p=>!p.images.length);return l.length?`Brez slike ${l.length===1?'je':'so'} ${pl(l.length,'artikel','artikla','artikli','artiklov')}:<ul>${l.map(p=>`<li>${plink(p)}</li>`).join('')}</ul>Glavna slika je obvezna za splet, zato ti artikli ne gredo v katalog.`:'Vsi artikli imajo sliko. 👍'}
  if(q.includes('zalog')||q.includes('zmanjk')){const l=ps.filter(p=>p.stock.some(s=>s.qty<s.min));return l.length?`Pod minimumom ${l.length===1?'je':'so'} ${pl(l.length,'artikel','artikla','artikli','artiklov')}:<ul>${l.map(p=>{const s=p.stock[0];return `<li>${plink(p)} – na voljo ${s.qty}, minimum ${s.min}${p.supplierStock&&p.supplierStock.qty?`, dobavitelj ima ${p.supplierStock.qty}`:''}</li>`}).join('')}</ul>`:'Nobeden artikel ni pod minimumom.'}

function buildCatalog(interactive){const rows=[];const held=[];const g=Object.fromEntries(S.guards.map(x=>[x.code,x]));const newCodes=new Set();
  S.products.forEach(p=>{if(catalogReason(p))return;newCodes.add(p.code);const r=catalogRowRaw(p,S);const old=S.published[p.code];
    if(g.PRICE_JUMP.on&&old&&old.cena_mpc&&r.cena_mpc){const ratio=Number(r.cena_mpc)/Number(old.cena_mpc);if(ratio>=g.PRICE_JUMP.threshold||ratio<=1/g.PRICE_JUMP.threshold){held.push({code:p.code,field:'Maloprodajna cena',last:eur(old.cena_mpc),now:eur(r.cena_mpc),change:ratio>=1?'×'+Math.round(ratio):'÷'+Math.round(1/ratio),state:'Čaka potrditev',note:''});rows.push(old);return}}
    rows.push(r)});
  const removed=Object.keys(S.published).filter(c=>!newCodes.has(c));
  if(g.MASS_REMOVAL.on&&removed.length>g.MASS_REMOVAL.threshold){removed.forEach(c=>{held.push({code:c,field:'Umik s spleta',last:'na spletu',now:'umik',change:'umik',state:'Čaka potrditev',note:''});rows.push(S.published[c])})}
  if(g.MIN_ROWS.on&&rows.length<g.MIN_ROWS.threshold){S.checks.unshift({id:++S.seq,time:now(),area:'Katalog za splet',outcome:'Ni objavljeno',summary:`Samo ${rows.length} artiklov – pod pragom. Stara datoteka ostane.`,onWeb:Object.keys(S.published).length,items:[]});save();render();toast('Katalog ni objavljen – premalo artiklov','err');return}
  const heldCodes=new Set(held.map(h=>h.code));rows.forEach(r=>{if(!heldCodes.has(r.sku))S.published[r.sku]=r});removed.forEach(c=>{if(!heldCodes.has(c))delete S.published[c]});
  S.checks.forEach(c=>{c.items.forEach(i=>{if(i.state==='Čaka potrditev'&&heldCodes.has(i.code))i.state='Nadomeščeno'});if(c.outcome==='Čaka potrditev'&&!c.items.some(i=>i.state==='Čaka potrditev'))c.outcome='Nadomeščeno'});
  S.files['katalog.csv']={content:toCSV([CATALOG_COLS,...rows.map(r=>CATALOG_COLS.map(c=>r[c]))]),time:now(),rows:rows.length};
  S.checks.unshift({id:++S.seq,time:now(),area:'Katalog za splet',outcome:held.length?'Čaka potrditev':removed.length?'Z opozorili':'Brez ugotovitev',summary:held.length?`${held.length} zadržanih, ostali objavljeni`:`Objavljeno ${rows.length} artiklov${removed.length?`, ${removed.length} umaknjenih`:''}`,onWeb:rows.length,items:held});
  buildCustomers(true);const j=S.jobs.find(x=>x.key==='WEB_CATALOG');j.last=now();j.status='ok';j.note=held.length?`${held.length} zadržan`:`${rows.length} artiklov`;S.runs.unshift({job:'WEB_CATALOG',time:now(),by:ME().name,summary:j.note});
  save();render();if(interactive)toast(held.length?`Katalog objavljen · ${held.length} artikel zadržan`:`Katalog objavljen · ${rows.length} artiklov`,held.length?'warn':'ok')}

function ensureDraft(id){if(UI.draft&&UI.draft.id===id)return;const p=prod(id);if(!p){UI.draft=null;return}UI.draft={id,route:location.hash,data:clone(p),dirty:false};UI.tab='pregled'}

  if(d.data.images.join('|')!==o.images.join('|')&&!ch.some(c=>c.key==='images'))ch.push({key:'images',label:'Slike',old:o.images.length,new:d.data.images.length,own:'PIM'});
  if(JSON.stringify(d.data.clearance)!==JSON.stringify(o.clearance))ch.push({key:'clearance',label:'Odprodaja',old:'',new:'',own:'PIM'});return ch}

  const pimCh=ch.filter(c=>c.own==='PIM'),saopCh=ch.filter(c=>c.own==='SAOP');pimCh.forEach(c=>{if(c.key!=='images'&&c.key!=='clearance')setFlat(p,c.key,c.new)});p.images=clone(d.data.images);p.clearance=clone(d.data.clearance);

  p.updated=now();p.history.unshift({date:now(),user:ME().name,source:'Kartica artikla',title:saopCh.length?`Shranjeno · ${saopCh.length} v potrditev za SAOP`:'Shranjeno',changes:ch.filter(c=>c.key!=='clearance').map(c=>({f:c.label+(c.own==='SAOP'?' (čaka SAOP)':''),o:fmtFlat(c.key,c.old),n:fmtFlat(c.key,c.new)}))});

function parseCSV(text,d){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function readWorkbook(){const f=$('#wbf').files[0];if(!f)return toast('Izberi datoteko.','err');const desc=$('#wbd').value;const r=new FileReader();r.onload=()=>{try{const t=String(r.result).replace(/^\uFEFF/,'');const d=t.split('\n')[0].includes(';')?';':',';const rows=parseCSV(t,d);const head=rows.shift().map(h=>{const m=h.match(/\[([^\]]+)\]\s*$/);return m?m[1]:h.trim()});
   if(!head.includes('code'))throw new Error('Manjka stolpec »Šifra artikla [code]«.');const changes=[],warn=[];
   rows.forEach((r,ix)=>{const o={};head.forEach((h,i)=>o[h]=(r[i]??'').trim());const p=byCode(o.code);if(!p){warn.push(`Vrstica ${ix+2}: artikla ${o.code} ni – preskočeno`);return}
     head.forEach(k=>{if(!WB_COLS.includes(k))return;let v=o[k];const old=getFlat(p,k);const isBool=typeof old==='boolean'||k.startsWith('site:')||k==='pimPublished';
       if(isBool){if(v==='')return;const b=fromDN(v);if(b===null){warn.push(`Vrstica ${ix+2}: ${flatLabel(k)} »${v}« ni D ali N`);return}v=b}
       else if(k==='attr.power'||k==='attr.flux'||k==='erp.netWeight'){v=v===''?null:Number(v.replace(',','.'));if(v!==null&&isNaN(v)){warn.push(`Vrstica ${ix+2}: ${flatLabel(k)} ni število`);return}}
       else if(k.startsWith('cat:')&&v&&!catOf(v)){warn.push(`Vrstica ${ix+2}: neznana kategorija »${v}«`);return}
       if(JSON.stringify(old??'')===JSON.stringify(v??''))return;if((v===''||v==null)&&flatOwner(k)==='SAOP'){warn.push(`Vrstica ${ix+2}: prazna vrednost za ${flatLabel(k)} se v SAOP ne pošlje`);return}
       changes.push({row:ix+2,code:p.code,key:k,label:flatLabel(k),old,new:v,target:flatOwner(k)})})});
   UI.preview={file:f.name,desc,rows:rows.length,changes,warn};render()}catch(e){toast('Napaka: '+e.message,'err')}};r.readAsText(f,'utf-8')}
function applyWorkbook(){const pv=UI.preview;const run={id:Math.max(0,...S.imports.map(i=>i.id))+1,time:now(),kind:'Izdelki',file:pv.file,desc:pv.desc||'',user:ME().name,rows:pv.rows,state:'uveljavljen',changes:[]};

   ${Object.values(byP).map(list=>{const p=list[0].p;return `<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:6px">${thumb(p)}<div><div class="nm">${plink(p)}</div><div class="muted">${statePill(p)} ${esc(stateOf(p).text)}</div></div></div>
    ${list.map(x=>`<div class="aic"><div style="display:flex;gap:8px;align-items:center"><b>${esc(flatLabel(x.key))}</b>${pill(x.conf==='visoka'?'good':'warn','zanesljivost '+x.conf)}</div><div class="muted small">${esc(x.why)}</div><div class="q" contenteditable="true" id="ai-${esc(x.id).replace(/[^a-z0-9]/gi,'_')}">${esc(x.val)}</div><div style="display:flex;gap:6px"><button class="btn sm ai" onclick="acceptAi('${esc(x.id)}')">Sprejmi</button><button class="btn sm" onclick="const el=document.getElementById('ai-${esc(x.id).replace(/[^a-z0-9]/gi,'_')}');const s=aiSuggestions().find(y=>y.id==='${esc(x.id)}');setFlat(s.p,s.key,el.textContent.trim());s.p.updated=now();S.aiDismissed.push(s.id);save();render();toast('Shranjen popravljen predlog')">Shrani popravljeno</button><button class="btn sm g" onclick="S.aiDismissed.push('${esc(x.id)}');save();render()">Zavrni</button></div></div>`).join('')}</div>`}).join('')||'<div class="card empty">Ni predlogov – vsa besedila so izpolnjena. ✨</div>'}`;
  return frame({crumbs:['AI'],title:'Predlogi za pregled',lead:`AI je pripravil ${pl(s.length,'predlog','predloga','predloge','predlogov')}. Besedilo lahko pred sprejemom popraviš neposredno v okvirju.`,body,helpKey:'ai'})}
function acceptAllAi(){const l=aiSuggestions().filter(x=>x.conf==='visoka'&&(!UI.aiFilter||UI.aiFilter.includes(x.p.code)));l.forEach(s=>{const o=getFlat(s.p,s.key);setFlat(s.p,s.key,s.val);s.p.updated=now();s.p.history.unshift({date:now(),user:ME().name,source:'Predlog AI',title:'Sprejet predlog AI',changes:[{f:flatLabel(s.key),o:fmtFlat(s.key,o),n:s.val}]});S.aiDismissed.push(s.id)});save();render();toast(`Sprejetih ${l.length} predlogov`)}
function pgAutomations(){const body=`${S.automations.map((a,i)=>`<div class="task"><div class="ic ${a.on?(a.mode==='Samodejno'?'good':'ai'):'neu'}">${a.mode==='Samodejno'?'⚡':'✨'}</div><div style="flex:1"><div class="tt"><span class="muted" style="font-weight:500">Ko</span> ${esc(a.when)}</div><div class="td"><span style="font-weight:600;color:var(--soft-t)">potem</span> ${esc(a.then)}</div><div class="small muted" style="margin-top:4px">${a.on?`Ta teden ${a.week}× · zadnjič ${a.last?ago(a.last):'—'}`:'Izklopljeno'}</div></div>
    <div class="ta" style="align-items:center"><select class="fsel" onchange="S.automations[${i}].mode=this.value;save();render()">${opt('S potrditvijo','S potrditvijo',a.mode)}${opt('Samodejno','Samodejno',a.mode)}</select><button class="sw ${a.on?'on':''}" onclick="S.automations[${i}].on=!S.automations[${i}].on;save();render()"></button></div></div>`).join('')}
   <div class="card" style="margin-top:14px"><b>Nova avtomatizacija</b><p class="muted">Opiši z besedami, kaj naj se zgodi – PIM pripravi pravilo, ki ga pregledaš.</p><div style="display:flex;gap:8px"><input class="inp" id="au" style="max-width:none" placeholder="npr. Ko artikel 60 dni nima prodaje, ga predlagaj za odprodajo s 30 % popustom"><button class="btn ai" onclick="const v=$('#au').value.trim();if(!v)return;S.automations.push({id:++S.seq,on:false,mode:'S potrditvijo',when:v.replace(/^ko\\s*/i,'').split(/,| potem /)[0],then:'(osnutek AI – preglej in vklopi) '+v,week:0,last:''});save();render();toast('Osnutek avtomatizacije dodan – izklopljen, dokler ga ne pregledaš','info')">✨ Pripravi</button></div></div>`;
  return frame({crumbs:['AI'],title:'Avtomatizacije',lead:'»S potrditvijo« pripravi predlog, ki ga nekdo potrdi. »Samodejno« naredi sam in te samo obvesti.',body,helpKey:'ai'})}
function pgAssistant(){if(!UI.chat.length)UI.chat=[{a:'Živjo! Vprašaj me karkoli o katalogu – npr. zakaj artikel ni na spletu, kje zmanjkuje zaloge ali kaj čaka SAOP.'}];
  const body=`<div class="card" style="max-width:860px"><div class="chat">${UI.chat.map(m=>m.u?`<div class="msg u">${esc(m.u)}</div>`:`<div class="msg a">${m.a}</div>`).join('')}</div>
   <div class="chips" style="margin:16px 0 10px">${['Kateri artikli ne gredo na splet in zakaj?','Katerim artiklom manjka slika?','Kje zmanjkuje zaloge?','Kaj čaka potrditev za SAOP?','Ali je kakšna cena sumljiva?','Kje manjkajo prevodi?'].map(x=>`<span class="chip" onclick="askAi('${x}')">${x}</span>`).join('')}</div>
   <div style="display:flex;gap:8px"><input class="inp" id="chq" style="max-width:none" placeholder="Vprašaj …" onkeydown="if(event.key==='Enter'&&this.value.trim())askAi(this.value.trim())"><button class="btn p" onclick="const v=$('#chq').value.trim();if(v)askAi(v)">Vprašaj</button></div></div>
   <p class="muted">V demu so odgovori sestavljeni iz podatkov v PIM-u po ključnih besedah. V pravi aplikaciji bi odgovarjal jezikovni model z dostopom do PIM podatkov (samo branje).</p>`;
  setTimeout(()=>{const i=$('#chq');i&&i.focus()},20);return frame({crumbs:['AI'],title:'Vprašaj PIM',body})}

/* ================= SISTEM ================= */
function pgSystem(){const flows=[...new Set(S.jobs.map(j=>j.flow))];const bad=S.jobs.filter(j=>j.status!=='ok');
  const body=`<div class="note ${bad.length?'warn':'good'}">${bad.length?`⚠ ${bad.map(j=>`${j.name}: ${j.note}`).join(' · ')}`:'✓ Vsi posli tečejo po urniku.'}</div>
   ${flows.map(f=>`<h3>${f}</h3><table class="tbl">${S.jobs.filter(j=>j.flow===f).map(j=>`<tr><td style="width:24px"><span class="dot ${!j.on?'neu':j.status==='ok'?'good':j.status==='run'?'info':'warn'}"></span></td><td><div class="nm">${esc(j.name)}</div><div class="muted">${j.schedule}${j.note?' · '+esc(j.note):''}</div></td><td class="muted" style="width:150px">${j.on?ago(j.last):'izklopljen'}</td><td style="width:170px;text-align:right"><button class="btn sm" onclick="runJob('${j.key}')">Zaženi</button> <button class="sw ${j.on?'on':''}" onclick="const j=S.jobs.find(x=>x.key==='${j.key}');j.on=!j.on;save();render()"></button></td></tr>`).join('')}</table>`).join('')}`;
  return frame({crumbs:['Sistem'],title:'Stanje sistema',lead:'Ali podatki prihajajo in odhajajo. Če kaj ne dela, je tu napisano, kaj in kdaj bo ponovno poskušeno.',body})}
function runJob(key){const j=S.jobs.find(x=>x.key===key);if(key==='WEB_CATALOG'){buildCatalog(true);return}if(key==='SAOP_OUTBOUND'){saopApproveAll(false);saopSend();return}
  j.status='run';render();setTimeout(()=>{j.status='ok';j.last=now();j.note=key==='VALIDATION'?`preverjenih ${S.products.length} artiklov`:key==='SUPPLIER_STOCK'?'Braytron spet odgovarja':'brez novih podatkov';S.runs.unshift({job:key,time:now(),by:ME().name,summary:j.note});save();render();toast(`${j.name}: ${j.note}`)},900)}
function pgRuns(){return frame({crumbs:['Sistem'],title:'Zadnji teki',body:`<table class="tbl"><tr><th>Kdaj</th><th>Posel</th><th>Sprožil</th><th>Rezultat</th></tr>${[...S.runs,...S.jobs.map(j=>({job:j.key,time:j.last,by:'urnik',summary:j.note||'uspešno'}))].map(r=>`<tr><td class="muted">${fmtD(r.time)}</td><td>${esc((S.jobs.find(j=>j.key===r.job)||{}).name||r.job)}</td><td>${esc(r.by)}</td><td>${esc(r.summary)}</td></tr>`).join('')}</table>`})}
function pgTrail(){const ev=S.products.flatMap(p=>p.history.map(h=>({p,h}))).sort((a,b)=>b.h.date.localeCompare(a.h.date)).slice(0,25);return frame({crumbs:['Sistem'],title:'Sled sprememb',lead:'Kdo je kaj spremenil, na enem mestu.',body:`<table class="tbl"><tr><th>Kdaj</th><th>Kdo</th><th>Artikel</th><th>Kaj</th></tr>${ev.map(({p,h})=>`<tr><td class="muted">${fmtD(h.date)}</td><td>${esc(h.user)}</td><td>${plink(p)}</td><td>${esc(h.title)}</td></tr>`).join('')}</table>`})}
function pgSources(){const src=[['SAOP – artikli','pred 15 min','ok'],['SAOP – cene','pred 1 h','ok'],['SAOP – zaloga','pred 10 min','ok'],['Nowodvorski – katalog (XML)','pred 6 h','ok'],['Braytron – katalog (XML)','pred 6 h','ok'],['Braytron – zaloga','pred 13 h','warn']];
  return frame({crumbs:['Sistem'],title:'Viri podatkov',lead:'Od kod PIM dobiva podatke in kdaj jih je dobil nazadnje.',body:`<table class="tbl">${src.map(([n,t,s])=>`<tr><td style="width:24px"><span class="dot ${s==='ok'?'good':'warn'}"></span></td><td class="nm">${n}</td><td class="muted">${t}</td><td>${s==='ok'?pill('good','Sveže'):pill('warn','Zamuja')}</td></tr>`).join('')}</table>${tech('<p class="muted">Tehnično: SAOP_PRODUCTS, SAOP_PRICES, SAOP_IQLIGHTING_STOCK, NW_XML, BT_XML, BT_STOCK · čakalna vrsta zajema, teki, težave in nepreslikana polja so v pravem PIM-u pod Nadzor sistema › Teki.</p>')}`})}
function pgUsers(){return frame({crumbs:['Sistem'],title:'Uporabniki',body:`<table class="tbl"><tr><th>Uporabnik</th><th>Vloga</th><th>Zadnja prijava</th></tr>${S.users.map(u=>`<tr><td><div style="display:flex;gap:10px;align-items:center"><span class="av">${esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><div><div class="nm">${esc(u.name)}</div><div class="muted">${esc(u.email)}</div></div></div></td><td>${u.roles.map(r=>pill('info',r)).join(' ')}</td><td class="muted">${ago(u.last)}</td></tr>`).join('')}</table>`,actions:`<button class="btn p" onclick="toast('Dodajanje uporabnika: domenski račun ali lokalni (demo)','info')">+ Dodaj uporabnika</button>`})}
function pgRoles(){return frame({crumbs:['Sistem'],title:'Vloge',body:`<table class="tbl"><tr><th>Področje</th>${S.roles.map(r=>`<th>${r.name}</th>`).join('')}</tr>${NAV.map(s=>`<tr><td class="nm">${s.l}</td>${S.roles.map(r=>r.code==='ADMIN'?'<td>✓</td>':`<td><input type="checkbox" ${(S.rolePerms[r.code]||[]).includes(s.k)?'checked':''} onchange="const a=S.rolePerms['${r.code}']=S.rolePerms['${r.code}']||[];this.checked?a.push('${s.k}'):a.splice(a.indexOf('${s.k}'),1);save()"></td>`).join('')}</tr>`).join('')}</table>`})}
function pgPaths(){return frame({crumbs:['Sistem'],title:'Mesta shranjevanja',lead:'Kam PIM zapisuje datoteke.',body:`<table class="tbl">${[['Datoteke za splet','C:\\inetpub\\wwwroot\\PIM_exports_csv'],['Slike izdelkov','\\\\fs01\\PIM_mediji'],['Uvozi iz Excela','\\\\fs01\\PIM_uvozi']].map(([n,p])=>`<tr><td class="nm">${n}</td><td><code>${p}</code></td><td>${pill('good','Dostopno')}</td></tr>`).join('')}</table>`})}
function pgAdminAct(){return frame({crumbs:['Sistem'],title:'Aktivnost skrbnikov',body:`<table class="tbl"><tr><td class="muted">${fmtD('2026-09-20T08:00:00')}</td><td>Administrator</td><td>Vloga »Komercialist« dobila dostop do Poslovanja</td></tr><tr><td class="muted">${fmtD('2026-09-17T12:30:00')}</td><td>Administrator</td><td>Dodan uporabnik Ana Horvat</td></tr></table>`})}

/* ================= zagon ================= */
load();
if(!location.hash)history.replaceState(null,'','#/domov');
render();
</script>
