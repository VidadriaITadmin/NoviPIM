<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIM – demo v slogu Akeneo</title>
<style>
:root{--brand:#9452ba;--brand-d:#763c98;--brand-l:#f5eef9;--brand-m:#dcc3ea;--ink:#11324d;--txt:#3b4b5c;--grey:#67768a;--grey-l:#a1a9b7;--line:#d6dae0;--line2:#eceef2;--bg:#fff;--bg2:#f6f7fb;--green:#2f7d43;--green-l:#e5f3e8;--red:#c0402f;--red-l:#fbe9e6;--yellow:#9a6700;--yellow-l:#fdf3dc;--blue:#2f6fae;--blue-l:#e7f0fa}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif;color:var(--txt);background:var(--bg)}
a{color:var(--brand);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--bg2);border:1px solid var(--line2);border-radius:3px;padding:0 4px;font-size:12px}
#app{display:flex;height:100vh;overflow:hidden}
#menu{width:88px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff;overflow-y:auto}
.logo{height:72px;display:grid;place-items:center;flex:none}
.logo span{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center;font-size:18px}
.mi{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;color:var(--grey);cursor:pointer;font-size:11px;border-left:3px solid transparent;text-align:center;user-select:none;position:relative}
.mi svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mi:hover{color:var(--brand)}
.mi.on{color:var(--brand);border-left-color:var(--brand);background:var(--brand-l)}
.mi .nb{position:absolute;top:6px;right:16px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;line-height:16px;padding:0 5px;font-weight:700}
.mspacer{flex:1}
main{flex:1;overflow:auto;min-width:0;background:#fff}
.pg{display:flex;min-height:100%}
.left{width:250px;flex:none;border-right:1px solid var(--line);background:var(--bg2);padding:22px 14px;overflow:auto}
.lh{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--grey);margin:4px 6px 10px;font-weight:600}
.lnav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:4px;color:var(--txt);margin-bottom:1px}
.lnav a:hover{background:#fff;text-decoration:none}
.lnav a.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.lnav .lh{margin-top:18px}
.content{flex:1;min-width:0;padding:22px 40px 110px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:26px;gap:12px;flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--brand);text-transform:uppercase;letter-spacing:.3px}
.topr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.user{display:flex;align-items:center;gap:8px;color:var(--grey);cursor:pointer;font-size:12px}
.av{width:28px;height:28px;border-radius:50%;background:var(--brand-m);color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.hdr{display:flex;align-items:flex-start;gap:16px;margin:4px 0 16px}
.ht{flex:1;min-width:0}
h1{font-size:28px;color:var(--brand);font-weight:400;margin:4px 0 2px;overflow-wrap:anywhere}
h2{font-size:19px;color:var(--ink);font-weight:400;margin:0 0 12px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--brand)}
.sub{color:var(--grey);font-size:13px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{height:32px;padding:0 16px;border-radius:16px;border:1px solid var(--brand);background:#fff;color:var(--brand);font:600 12px/30px inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand-l)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{border-color:var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--grey);background:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-l)}
.btn.sm{height:26px;line-height:24px;padding:0 11px;font-size:11px}
.btn:disabled{opacity:.45;cursor:default}
.inp,.sel,textarea.inp{height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font:inherit;color:var(--ink);background:#fff;width:100%;max-width:460px}
textarea.inp{height:auto;min-height:86px;padding:8px 10px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l)}
.inp:disabled,.sel:disabled,textarea.inp:disabled{background:var(--bg2);color:var(--grey)}
.inp.sm,.sel.sm{height:28px;max-width:180px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.help{border:1px solid var(--brand-m);border-left:4px solid var(--brand);background:var(--brand-l);padding:10px 14px;border-radius:4px;margin:0 0 18px;color:var(--ink);font-size:13px;max-width:1150px}
.help-h{font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between;color:var(--brand-d)}
.help .ak{margin-top:6px;color:var(--grey);font-size:12px}
.x{border:none;background:none;font-size:18px;line-height:1;color:var(--grey);cursor:pointer;padding:0 4px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:400;color:var(--grey);border-bottom:1px solid var(--brand);padding:8px 10px;white-space:nowrap;font-size:12px}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--brand)}
.tbl td{border-bottom:1px solid var(--line2);padding:8px 10px;vertical-align:middle}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:var(--bg2)}
.tbl tr.selr td{background:var(--brand-l)}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.thumb{width:44px;height:44px;border:1px solid var(--line2);border-radius:3px;object-fit:cover;background:var(--bg2);display:block}
.thumb.e{display:grid;place-items:center;color:var(--grey-l);font-size:10px;text-align:center}
.lbl{color:var(--ink);font-weight:600}
.muted{color:var(--grey);font-size:12px}
.bdg{display:inline-block;border:1px solid;border-radius:2px;padding:0 6px;font-size:11px;text-transform:uppercase;line-height:18px;white-space:nowrap}
.b-g{color:var(--green);border-color:var(--green);background:var(--green-l)}
.b-r{color:var(--red);border-color:var(--red);background:var(--red-l)}
.b-y{color:var(--yellow);border-color:#e3b24e;background:var(--yellow-l)}
.b-b{color:var(--blue);border-color:var(--blue);background:var(--blue-l)}
.b-n{color:var(--grey);border-color:var(--line);background:var(--bg2)}
.b-p{color:var(--brand);border-color:var(--brand);background:var(--brand-l)}
.own{font-size:10px;border-radius:2px;padding:0 5px;font-weight:700;letter-spacing:.3px}
.own.saop{background:#fff1d6;color:#8a5a00;border:1px solid #e8c47a}
.own.pim{background:var(--brand-l);color:var(--brand);border:1px solid var(--brand-m)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search input{padding-left:32px;max-width:none}
.search svg{position:absolute;left:9px;top:9px;width:16px;height:16px;stroke:var(--grey);fill:none;stroke-width:2}
.fchip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;padding:0 4px 0 12px;height:30px;color:var(--grey);font-size:12px;background:#fff}
.fchip.on{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.fchip select{border:none;background:transparent;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;height:28px;outline:none;max-width:190px}
.ctxs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctxs label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey)}
.ctxs select{height:30px;border:1px solid var(--line);border-radius:16px;padding:0 8px;font:inherit;font-weight:600;color:var(--ink);background:#fff}
.count{color:var(--grey);margin-left:auto;font-size:12px}
.tree{margin:10px 0}
.tn{display:flex;align-items:center;gap:2px;padding:2px 0;white-space:nowrap}
.tw{width:16px;flex:none;text-align:center;color:var(--grey);cursor:pointer;font-size:11px}
.tl{padding:3px 8px;border-radius:3px;cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tl:hover{background:#fff}
.tl.on{background:var(--brand);color:#fff}
.tl.on .cnt{color:#e8d8f2}
.cnt{color:var(--grey-l);font-size:11px;margin-left:auto}
.bulk{position:fixed;left:88px;right:0;bottom:0;background:#fff;border-top:1px solid var(--brand);padding:12px 40px;display:flex;gap:10px;align-items:center;box-shadow:0 -4px 14px rgba(17,50,77,.08);z-index:5;flex-wrap:wrap}
.bulk b{color:var(--brand);margin-right:10px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:10px 0 20px;overflow-x:auto}
.tab{padding:8px 0;color:var(--grey);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--brand)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.mdot{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px}
.mdot.y{background:#e3a72b}
.ehd{display:flex;gap:18px;align-items:flex-start;margin:6px 0 10px}
.bigimg{width:120px;height:120px;border:1px solid var(--line);border-radius:4px;object-fit:cover;background:var(--bg2);flex:none}
.bigimg.e{display:grid;place-items:center;color:var(--grey-l);font-size:12px}
.meta{color:var(--grey);font-size:12px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sw{width:36px;height:20px;border-radius:10px;border:none;background:var(--grey-l);position:relative;cursor:pointer;flex:none;vertical-align:middle}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}
.sw.on::after{left:19px}
.sw:disabled{opacity:.5;cursor:default}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.dirty{background:var(--yellow-l);border:1px solid #e3b24e;color:var(--yellow);padding:7px 12px;border-radius:4px;margin-bottom:12px;display:none;font-weight:600}
.dirty.on{display:block}
.edit-grid{display:flex;gap:30px;align-items:flex-start}
.gnav{width:220px;flex:none;position:sticky;top:0}
.gnav a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:3px;color:var(--txt)}
.gnav a.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.gnav a:hover{text-decoration:none;background:var(--bg2)}
.fields{flex:1;min-width:0;max-width:780px}
.fgh{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin:22px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--brand);display:flex;justify-content:space-between}
.fgh:first-child{margin-top:0}
.fld{margin-bottom:15px}
.fld>label{display:flex;align-items:center;gap:6px;color:var(--grey);font-size:12px;margin-bottom:5px;flex-wrap:wrap}
.fld>label b{color:var(--ink);font-weight:600;font-size:13px}
.req{color:var(--red);font-weight:700}
.ctx{font-size:10px;border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--grey);text-transform:uppercase}
.fld .errm{display:none;color:var(--red);font-size:12px;margin-top:4px}
.fld.miss .inp,.fld.miss .sel{border-color:var(--red)}
.fld.miss .errm{display:block}
.fld.warn .inp,.fld.warn .sel{border-color:#e3b24e}
.fld .note{font-size:12px;color:var(--yellow);margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cards.c3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat{font-size:26px;color:var(--ink);font-weight:300}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}
.bar.y i{background:#e3b24e}.bar.r i{background:var(--red)}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px}
.brow .bl{width:150px;color:var(--grey)}
.brow .bv{width:48px;text-align:right;font-weight:600;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:10px}
.tile{border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;background:#fff}
.tile:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(148,82,186,.12)}
.tile .tn2{color:var(--ink);font-weight:600;font-size:14px}
.tile .tc{color:var(--brand);font-size:24px;font-weight:300;margin-top:2px}
.tile .td{color:var(--grey);font-size:12px;margin-top:4px}
.tile.bad .tc{color:var(--red)}.tile.warn .tc{color:#c68a00}.tile.good .tc{color:var(--green)}
.form{max-width:780px}
.fr{display:grid;grid-template-columns:220px 1fr;gap:10px 18px;align-items:center;margin-bottom:12px}
.fr>label{color:var(--grey);font-size:12px}
.mtx td,.mtx th{text-align:center}
.mtx td:first-child,.mtx th:first-child{text-align:left}
.ghd td{background:var(--bg2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(17,50,77,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:6px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg.wide{width:min(920px,100%)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.opgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opc{border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.opc:hover{border-color:var(--brand)}
.opc.on{border-color:var(--brand);background:var(--brand-l)}
.opc b{display:block;color:var(--ink);margin-bottom:3px}
#toasts{position:fixed;top:16px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:440px}
.toast{background:#fff;border-left:4px solid var(--green);box-shadow:0 4px 16px rgba(0,0,0,.18);padding:12px 16px;border-radius:4px;color:var(--ink);animation:tin .2s}
.toast.err{border-left-color:var(--red)}.toast.info{border-left-color:var(--brand)}.toast.warn{border-left-color:#e3b24e}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.log{background:#0f2537;color:#cfe3f4;font:12px/1.6 Consolas,monospace;padding:12px 14px;border-radius:4px;max-height:280px;overflow:auto;white-space:pre-wrap}
pre.code{background:#0f2537;color:#cfe3f4;font:12px/1.5 Consolas,monospace;padding:14px;border-radius:4px;overflow:auto;max-height:420px;white-space:pre}
.empty{padding:36px;text-align:center;color:var(--grey)}
.two{display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:start}
.ok{color:var(--green)}.no{color:var(--grey-l)}
.try li{margin:6px 0}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.chan{border:1px solid var(--line);border-top:4px solid var(--grey-l);border-radius:6px;padding:12px 14px}
.chan.g{border-top-color:var(--green)}.chan.r{border-top-color:var(--red)}.chan.y{border-top-color:#e3b24e}
.chan b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.tl2{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl2 .ev{position:relative;margin-bottom:12px}
.tl2 .ev::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}
.flow span{border:1px solid var(--brand-m);background:var(--brand-l);color:var(--brand-d);border-radius:14px;padding:3px 12px;font-weight:600;font-size:12px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.imgt{border:1px solid var(--line);border-radius:4px;padding:6px;position:relative}
.imgt img{width:100%;height:110px;object-fit:cover;border-radius:3px;display:block}
.imgt .muted{margin-top:4px}
.pill{display:inline-flex;gap:0;border:1px solid var(--brand);border-radius:16px;overflow:hidden}
.pill button{border:none;background:#fff;color:var(--brand);padding:5px 14px;cursor:pointer;font:600 12px inherit;font-family:inherit}
.pill button.on{background:var(--brand);color:#fff}
@media print{#menu,.top,.acts,.help,.toolbar,.noprint{display:none!important}.content{padding:0}}
@media (max-width:900px){.content{padding:16px 16px 110px}.left{display:none}.edit-grid{flex-direction:column}.gnav{position:static;width:100%}.two{grid-template-columns:1fr}.fr{grid-template-columns:1fr}.bulk{padding:10px 16px}.opgrid,.strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><nav id="menu"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toasts"></div>
<script>
'use strict';
/* ================= orodja ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const now=()=>{const d=new Date();d.setMilliseconds(0);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,19)};
const fmtD=s=>{if(!s)return '';const d=new Date(s);return d.toLocaleDateString('sl-SI')+' '+d.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})};
const eur=n=>n==null||n===''||isNaN(n)?'':Number(n).toLocaleString('sl-SI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const opt=(v,l,c)=>`<option value="${esc(v)}" ${String(v)===String(c??'')?'selected':''}>${esc(l)}</option>`;
const go=h=>{location.hash=h};
const empty=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
const LS='pim-akeneo-stil-demo-v1';
const LANGS={sl:'Slovenščina',en:'Angleščina',de:'Nemščina',hr:'Hrvaščina',it:'Italijanščina'};
const ORGS={2:'IQLighting',3:'Vidadria',4:'Ediito'};
const DN=b=>b===true?'D':b===false?'N':'';
const fromDN=s=>{s=String(s).trim().toLowerCase();return ['d','da','1','true','y'].includes(s)?true:['n','ne','0','false'].includes(s)?false:null};

/* ================= slike (izmišljene) ================= */
function genImg(kind,color){const c=color||'#fff',s='#11324d';const sh={
  pendant:`<line x1="100" y1="12" x2="100" y2="72" stroke="#555" stroke-width="2"/><path d="M45 128 Q100 52 155 128 Z" fill="${c}" stroke="${s}" stroke-width="3"/><ellipse cx="100" cy="134" rx="20" ry="8" fill="#ffe59a"/>`,
  ceiling:`<rect x="30" y="70" width="140" height="18" rx="4" fill="#c1c7d0" stroke="${s}" stroke-width="3"/><path d="M36 88 Q100 150 164 88 Z" fill="${c}" stroke="${s}" stroke-width="3"/>`,
  wall:`<rect x="60" y="40" width="80" height="120" rx="6" fill="${c}" stroke="${s}" stroke-width="3"/><rect x="72" y="60" width="56" height="30" rx="3" fill="#ffe59a"/>`,

function load(){try{const t=localStorage.getItem(LS);if(t){S=JSON.parse(t);return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Brskalnik ne dovoli shranjevanja – spremembe veljajo do osvežitve.','err')}}
const UI={org:'2',site:'svetila',lang:'sl',cat:null,search:'',filters:{err:'',erp:'',web:'',man:'',comp:''},sel:new Set(),sort:{k:'updated',d:-1},closed:new Set(),tab:'pregled',group:null,draft:null,stab:{}};

/* ================= dostop ================= */
const prod=id=>S.products.find(p=>p.id===id);
const byCode=c=>S.products.find(p=>p.code===c);
const catOf=c=>S.categories.find(x=>x.code===c);
const site=c=>S.sites.find(s=>s.code===c);
const attrDef=c=>S.attributes.find(a=>a.code===c);
const ME=()=>S.users.find(u=>u.code===S.me)||S.users[0];
const orgOk=p=>!UI.org||String(p.org)===String(UI.org);
const activeSites=p=>S.sites.filter(s=>p.sites&&p.sites[s.code]).map(s=>s.code);
const childrenOf=(code)=>S.categories.filter(c=>c.parent===code);
const descendants=code=>[code,...childrenOf(code).flatMap(c=>descendants(c.code))];
const catPath=code=>{const out=[];let c=catOf(code);while(c&&c.parent){out.unshift(c.name);c=catOf(c.parent)}return out.join(' > ')};
const rootOf=tree=>S.categories.find(c=>c.tree===tree&&!c.parent);
function catSet(code,ctx){ctx=ctx||S;const chain=[];let c=ctx.categories.find(x=>x.code===code);while(c){chain.unshift(c);c=c.parent?ctx.categories.find(x=>x.code===c.parent):null}const out={};chain.forEach(c=>Object.assign(out,c.set||{}));return out}
function gv(p,k,lang){lang=lang||UI.lang;if(k==='code')return p.code;if(k==='ean')return p.ean;if(k.startsWith('price.'))return p.prices[k.slice(6)];
  if(k.startsWith('attr.')){const a=k.slice(5);const v=p.attrs[a];const ad=(S?S.attributes:[]).find(x=>x.code===a);return ad&&ad.tr?(v||{})[lang]:v}
  const [o,f]=k.split('.');const v=(p[o]||{})[f];return FD[k]&&FD[k].loc?(v||{})[lang]:v}
function svv(p,k,val,lang){lang=lang||UI.lang;if(k==='code')return;if(k==='ean'){p.ean=val;return}if(k.startsWith('price.')){p.prices[k.slice(6)]=val;return}
  if(k.startsWith('attr.')){const a=k.slice(5);const ad=attrDef(a);if(ad&&ad.tr){p.attrs[a]=Object.assign({},p.attrs[a]||{});p.attrs[a][lang]=val}else p.attrs[a]=val;return}
  const [o,f]=k.split('.');if(FD[k]&&FD[k].loc){p[o][f]=Object.assign({},p[o][f]||{});p[o][f][lang]=val}else p[o][f]=val}
const fLabel=k=>k.startsWith('price.')?'Cena '+k.slice(6)+' (neto)':k.startsWith('attr.')?(attrDef(k.slice(5))||{name:k}).name:(FD[k]||{l:k}).l;
function ownerOf(k){if(k.startsWith('price.'))return 'SAOP';if(FD[k])return FD[k].own;return 'PIM'}
/* ploske vrednosti – za primerjavo, uvoz in shranjevanje */
function flatKeys(p){const ks=[];FIELDS.forEach(f=>{if(f.t==='ro'||f.t==='roarea')return;if(f.loc)Object.keys(LANGS).forEach(l=>ks.push(f.k+':'+l));else ks.push(f.k)});
  PRICELISTS.forEach(pl=>ks.push('price.'+pl.code));S.attributes.forEach(a=>{if(a.tr)Object.keys(LANGS).forEach(l=>ks.push('attr.'+a.code+':'+l));else ks.push('attr.'+a.code)});
  S.sites.forEach(s=>{ks.push('site:'+s.code);ks.push('cat:'+s.code)});ks.push('pimPublished','tag:razstavni','hold','images');return ks}
function getFlat(p,key){if(key.startsWith('site:'))return !!p.sites[key.slice(5)];if(key.startsWith('cat:'))return p.cats[key.slice(4)]||'';if(key==='pimPublished')return p.pimPublished;if(key==='tag:razstavni')return !!p.tags.razstavni;if(key==='hold')return p.hold?p.hold.reason:'';if(key==='images')return p.images.length;
  const [k,l]=key.split(':');return gv(p,k,l)}
function setFlat(p,key,v){if(key.startsWith('site:')){p.sites[key.slice(5)]=!!v;return}if(key.startsWith('cat:')){p.cats[key.slice(4)]=v||'';return}if(key==='pimPublished'){p.pimPublished=!!v;return}if(key==='tag:razstavni'){p.tags.razstavni=!!v;return}if(key==='hold'){p.hold=v?{reason:v,user:ME().name,date:now()}:null;return}if(key==='images')return;
  const [k,l]=key.split(':');svv(p,k,v,l)}
function flatLabel(key){if(key.startsWith('site:'))return 'Spletišče '+site(key.slice(5)).name;if(key.startsWith('cat:'))return 'Kategorija ('+site(key.slice(4)).name+')';if(key==='pimPublished')return 'Objavljen v PIM';if(key==='tag:razstavni')return 'Razstavni eksponat';if(key==='hold')return 'Ročni zadržek';if(key==='images')return 'Slike';const [k,l]=key.split(':');return fLabel(k)+(l?` (${l})`:'')}
function flatOwner(key){const [k]=key.split(':');return ownerOf(k)}
function fmtFlat(key,v){if(v===true)return 'Da';if(v===false)return 'Ne';if(v==null||v==='')return '';if(key.startsWith('cat:'))return catPath(v)||v;if(key.startsWith('price.'))return eur(v);return String(v)}

/* ================= validacija in pripravljenost ================= */
function checksFor(p,ctx){ctx=ctx&&ctx.rules?ctx:S;const out=[];const sites=(ctx.sites||[{code:'svetila'},{code:'videlektro'}]).filter(s=>p.sites&&p.sites[s.code]).map(s=>s.code);
  ctx.rules.filter(r=>r.on).forEach(r=>{if(r.layer==='SPLET'&&!sites.length)return;
    if(r.f==='image'){out.push({layer:r.layer,sev:r.sev,key:'images',label:'Glavna slika',ok:p.images.length>0});return}
    if(r.f==='category'){sites.forEach(s=>out.push({layer:r.layer,sev:r.sev,key:'cat:'+s,label:'Kategorija spletišča '+s,ok:!!p.cats[s]}));return}
    const [k,l]=r.f.split(':');const v=k.startsWith('attr.')?null:gvRaw(p,k,l);out.push({layer:r.layer,sev:r.sev,key:r.f,label:fLabel(k)+(l?` (${l})`:''),ok:!empty(v)})});
  const req={};sites.forEach(s=>{if(p.cats[s])Object.entries(catSet(p.cats[s],ctx)).forEach(([a,lvl])=>{if(lvl==='izločen')return;if(!req[a]||lvl==='obvezen')req[a]=lvl})});
  Object.entries(req).forEach(([a,lvl])=>{const ad=ctx.attributes.find(x=>x.code===a);if(!ad)return;const v=ad.tr?(p.attrs[a]||{}).sl:p.attrs[a];out.push({layer:'SPLET',sev:lvl==='obvezen'?'ERROR':'WARNING',key:'attr.'+a+(ad.tr?':sl':''),label:ad.name+' ('+lvl+' v naboru)',ok:!empty(v)})});
  return out}
function gvRaw(p,k,l){if(k==='ean')return p.ean;if(k.startsWith('price.'))return p.prices[k.slice(6)];const [o,f]=k.split('.');const v=(p[o]||{})[f];return FD[k]&&FD[k].loc?(v||{})[l||'sl']:v}
const issues=(p,ctx)=>checksFor(p,ctx).filter(c=>!c.ok);
function completeness(p){const c=checksFor(p);return c.length?Math.round(100*c.filter(x=>x.ok).length/c.length):100}
function erpStatus(p){return issues(p).some(i=>i.layer==='ERP'&&i.sev==='ERROR')?'Blokiran':'Pripravljen'}
function webStatus(p){if(!activeSites(p).length)return 'Ni na spletu';return issues(p).some(i=>i.layer==='SPLET'&&i.sev==='ERROR')?'Blokiran':'Pripravljen'}
function catalogReasonRaw(p,ctx){if(p.org!==2)return 'Ni podjetje 2 – katalog.csv je samo za IQLighting';if(!p.erp.active)return 'Neaktiven';if(!p.pimPublished)return 'Ni objavljen v PIM';const sites=Object.keys(p.sites||{}).filter(s=>p.sites[s]);if(!sites.length)return 'Brez spletnega mesta';if(sites.every(s=>!p.cats[s]))return 'Brez kategorije spletišča';if(issues(p,ctx).some(i=>i.layer==='SPLET'&&i.sev==='ERROR'))return 'Blokirajoče napake za splet';if(p.hold)return 'Ročni zadržek';return null}
const catalogReason=p=>catalogReasonRaw(p,S);
const REASON_TXT={'Neaktiven':'Artikel je v SAOP neaktiven.','Ni objavljen v PIM':'Urednik ga še ni sprostil (stikalo »Objavljen v PIM«).','Brez spletnega mesta':'Ni kljukice pri nobenem spletišču.','Brez kategorije spletišča':'Ima kljukico, a nima kategorije na tem spletišču.','Blokirajoče napake za splet':'Manjka obvezen podatek za splet (naziv, opis, slika, atribut iz nabora …).','Ročni zadržek':'Nekdo ga je ročno zadržal z razlogom.','Ni podjetje 2 – katalog.csv je samo za IQLighting':'En katalog za splet – samo podjetje 2.'};
const bruto=(p,pl)=>{const n=p.prices[pl];return n==null||n===''?null:Math.round(n*(1+Number(p.erp.vat)/100)*100)/100};
function catalogRowRaw(p,ctx){const sites=Object.keys(p.sites||{}).filter(s=>p.sites[s]&&p.cats[s]);const a=p.attrs;const mpc=p.prices.MPC==null?null:Math.round(p.prices.MPC*(1+Number(p.erp.vat)/100)*100)/100;
  const cats=sites.map(s=>{const out=[];let c=ctx.categories.find(x=>x.code===p.cats[s]);while(c&&c.parent){out.unshift(c.name);c=ctx.categories.find(x=>x.code===c.parent)}return out.join('/')});
  return {sku:p.code,ime:(p.web.name||{}).sl||'',kratek_opis:(p.web.short||{}).sl||'',opis:(p.web.desc||{}).sl||'',cena_mpc:mpc==null?'':mpc.toFixed(2),cena_b2b:p.prices['B2B-A']==null?'':Number(p.prices['B2B-A']).toFixed(2),
    zaloga:(p.stock||[]).reduce((n,s)=>n+Math.max(0,s.qty),0),kategorije:cats.join('|'),'Spletne strani':sites.join('|'),proizvajalec:p.erp.manufacturer,ean:p.ean,'Moč [W]':a.power??'','IP zaščita':a.ip??'','Svetlobni tok [lm]':a.flux??'','Barva ohišja':(a.color||{}).sl||'',
    odprodaja_cena:p.clearance&&p.clearance.active&&mpc!=null?(mpc*(1-p.clearance.disc/100)).toFixed(2):'',slika:p.images.length?`slike/${p.code}/1.jpg`:''}}
const CATALOG_COLS=['sku','ime','kratek_opis','opis','cena_mpc','cena_b2b','zaloga','kategorije','Spletne strani','proizvajalec','ean','Moč [W]','IP zaščita','Svetlobni tok [lm]','Barva ohišja','odprodaja_cena','slika'];
function pendingFor(p,key){return S.saop.find(q=>q.code===p.code&&q.field===key&&['Čaka odobritev','V vrsti','Poslano, nepotrjeno'].includes(q.status))}

function pgDash(){const ps=S.products.filter(orgOk);const erpOk=ps.filter(p=>erpStatus(p)==='Pripravljen').length;const inCat=ps.filter(p=>!catalogReason(p)).length;const webBlk=ps.filter(p=>webStatus(p)==='Blokiran').length;
  const held=S.checks.reduce((a,c)=>a+c.items.filter(i=>i.state==='Čaka potrditev').length,0);const qWait=S.saop.filter(q=>q.status==='Čaka odobritev').length;const qErr=S.saop.filter(q=>q.status==='Napaka').length;const cand=S.candidates.filter(c=>c.state==='Čaka na ERP').length;
  const tiles=[['Artikli v katalogu',ps.length,'','#/izdelki',''],['Brez ERP blokad',erpOk,`${ps.length-erpOk} blokiranih`,'#/kakovost',erpOk===ps.length?'good':'warn'],['V katalog.csv',inCat,'gre na splet','#/splet/sestava','good'],['Blokirani za splet',webBlk,'manjka obvezen podatek','#/kakovost/napake',webBlk?'bad':'good'],['Čaka potrditev (varovalke)',held,'ne gre na splet','#/varovalke',held?'bad':'good'],['Čaka odobritev za SAOP',qWait,`${qErr} z napako`,'#/saop/vrsta',qWait||qErr?'warn':'good'],['Novi artikli dobaviteljev',cand,'čaka na ERP','#/izdelki/novi-artikli','']];
  const byOrg=Object.entries(ORGS).filter(([k])=>S.products.some(p=>p.org==k)).map(([k,v])=>{const pp=S.products.filter(p=>p.org==k);return `<tr><td class="lbl">${v}</td><td class="num">${pp.length}</td><td class="num">${pp.filter(p=>erpStatus(p)==='Pripravljen').length}</td><td class="num">${pp.filter(p=>p.pimPublished).length}</td><td class="num">${pp.filter(p=>webStatus(p)==='Blokiran').length}</td><td class="num">${pp.filter(p=>!catalogReason(p)).length}</td></tr>`}).join('');
  const lay=['ERP','KOM','SPLET'].map(l=>{const withL=ps.filter(p=>checksFor(p).some(c=>c.layer===l));const ok=withL.filter(p=>!issues(p).some(i=>i.layer===l)).length;const pc=withL.length?Math.round(100*ok/withL.length):100;return `<div class="brow"><span class="bl">${{ERP:'ERP (SAOP)',KOM:'Komerciala',SPLET:'Splet'}[l]}</span><div class="bar ${pc<50?'r':pc<100?'y':''}"><i style="width:${pc}%"></i></div><span class="bv">${pc} %</span><span class="muted">${ok}/${withL.length}</span></div>`}).join('');
  const jobs=S.jobs.map(j=>`<tr class="r" onclick="go('#/sistem')"><td>${esc(j.name)}</td><td class="muted">${fmtD(j.last)}</td><td><span class="bdg ${j.status==='Uspešno'?'b-g':j.status==='Teče'?'b-b':j.status==='Napaka'?'b-r':'b-y'}">${j.status}</span></td></tr>`).join('');
  const alerts=[];if(held)alerts.push(['bad',`${held} artikel čaka potrditev varovalke – na spletu ostaja stara vrednost.`,'#/varovalke']);if(qErr)alerts.push(['bad',`${qErr} zapis v SAOP je padel – preveri napako.`,'#/saop/zgodovina']);if(qWait)alerts.push(['warn',`${qWait} sprememb čaka odobritev za SAOP.`,'#/saop/vrsta']);if(webBlk)alerts.push(['warn',`${webBlk} artiklov s kljukico ne gre na splet zaradi manjkajočih podatkov.`,'#/kakovost/napake']);S.jobs.filter(j=>j.status!=='Uspešno'&&j.status!=='Teče').forEach(j=>alerts.push(['warn',`Posel »${j.name}«: ${j.note||j.status}`,'#/sistem']));
  const body=`<div class="tiles">${tiles.map(([l,n,d,h,t])=>`<div class="tile ${t}" onclick="go('${h}')"><div class="tn2">${l}</div><div class="tc">${n}</div>${d?`<div class="td">${d}</div>`:''}</div>`).join('')}</div>
   <div class="cards"><div class="card"><h2>Opozorila in prioritete</h2>${alerts.map(([t,m,h])=>`<div class="brow"><span class="bdg ${t==='bad'?'b-r':'b-y'}">${t==='bad'?'Nujno':'Pozor'}</span><a onclick="go('${h}')">${esc(m)}</a></div>`).join('')||'<p class="muted">Vse je v redu.</p>'}</div>
   <div class="card"><h2>Kakovost po nivojih</h2><p class="muted" style="margin-top:-8px">Delež artiklov brez odprte zahteve na nivoju.</p>${lay}</div>
   <div class="card" style="grid-column:1/-1"><h2>Po podjetjih</h2><table class="tbl"><tr><th>Podjetje</th><th class="num">Katalog</th><th class="num">Brez ERP blokad</th><th class="num">V PIM sloju</th><th class="num">Blokirani za splet</th><th class="num">V katalog.csv</th></tr>${byOrg}</table></div>
   <div class="card"><h2>Zadnji procesi</h2><table class="tbl">${jobs}</table></div>
   <div class="card"><h2>Kaj poskusiti (5 minut)</h2><ol class="try">
    <li>Odpri <a onclick="go('#/varovalke')">Varovalke</a> – artikel AZ.0059 ima ceno ×122 (napaka v SAOP). Poglej, zakaj ni šel na splet, in ga zavrni ali potrdi.</li>
    <li>Odpri <a onclick="go('#/izdelek/'+byCode('ACB.A3660001N').id)">Panau Black</a> – nima spletnega naziva. Klikni <b>AI predlog</b> ali ga vpiši, shrani, poglej kanal Splet.</li>
    <li>Na kartici spremeni <b>EAN</b> ali <b>neto težo</b> (SAOP polje) – shranitev ga pošlje v <a onclick="go('#/saop/vrsta')">čakalno vrsto SAOP</a>. Odobri in pošlji.</li>
    <li>V <a onclick="go('#/nastavitve/kategorije')">naboru kategorije</a> Notranja svetila označi »Svetlobni tok« kot obvezen in poglej, koliko artiklov pade.</li>
    <li><a onclick="go('#/izdelki/uvoz')">Uvoz iz Excela</a>: prenesi delovni list, popravi in naloži. Nato ga v <a onclick="go('#/uvozi')">Zgodovini uvozov</a> povrni.</li>
    <li>V <a onclick="go('#/splet')">Izhod na splet</a> zgradi katalog.csv in ga prenesi.</li></ol></div></div>`;
  return frame({crumbs:['Nadzor'],title:'Nadzorna plošča',sub:'Operativno stanje vseh podatkovnih tokov · izmišljeni podatki',body,left:L('nadzor','nadzorna-plosca'),helpKey:'dash',ctx:ctxBar({site:false,lang:false})})}
function pgGuards(){const waiting=[];S.checks.forEach(c=>c.items.forEach(i=>{if(i.state==='Čaka potrditev')waiting.push([c,i])}));
  const body=`<h3>Čaka potrditev</h3>${waiting.length?`<div class="cards c3">${[...new Set(waiting.map(w=>w[0]))].map(c=>`<div class="tile bad" onclick="go('#/varovalka/${c.id}')"><div class="tn2">${esc(c.area)} · IQLighting</div><div class="tc">${c.items.filter(i=>i.state==='Čaka potrditev').length}</div><div class="td">potrditev · preverjanje ${c.id}</div></div>`).join('')}</div>`:'<p class="muted">Nič ne čaka potrditve.</p>'}
   <h3>Zadnja preverjanja</h3><table class="tbl"><tr><th>Čas</th><th>Področje</th><th>Izid</th><th>Povzetek</th><th class="num">Na spletu</th><th class="num">Zadržanih</th></tr>${S.checks.map(c=>`<tr class="r" onclick="go('#/varovalka/${c.id}')"><td class="muted">${fmtD(c.time)}</td><td>${esc(c.area)}</td><td><span class="bdg ${c.outcome==='Brez ugotovitev'||c.outcome==='Rešeno'?'b-g':c.outcome.includes('čakajo')?'b-r':'b-y'}">${c.outcome}</span></td><td>${esc(c.summary)}</td><td class="num">${c.onWeb}</td><td class="num">${c.items.filter(i=>i.state==='Čaka potrditev').length}</td></tr>`).join('')}</table>
   <h3>Pravila</h3><table class="tbl"><tr><th>Pravilo</th><th>Kaj naredi</th><th>Prag</th><th>Stanje</th></tr>${S.guards.map((g,i)=>`<tr><td class="lbl">${g.name}</td><td>${g.what}</td><td><input class="inp sm" type="number" value="${g.threshold}" onchange="S.guards[${i}].threshold=Number(this.value);save();toast('Prag shranjen')" style="max-width:90px"></td><td><button class="sw ${g.on?'on':''}" onclick="S.guards[${i}].on=!S.guards[${i}].on;save();render()"></button></td></tr>`).join('')}</table>
   <p class="muted">Področja v pravem PIM-u: Katalog za splet (katalog.csv), Pošiljanje v SAOP, Cene in zaloga za splet, Zaloga virov. V demu deluje katalog za splet.</p>`;
  return frame({crumbs:['Nadzor','Varovalke'],title:'Varovalke',sub:'Kaj čaka potrditev pred objavo in zakaj',body,left:L('nadzor','varovalke'),helpKey:'guards',actions:`<button class="btn primary" onclick="buildCatalog(true)">Zgradi katalog.csv zdaj</button>`})}
function pgGuard(id){const c=S.checks.find(x=>String(x.id)===String(id));if(!c)return frame({title:'Ni najdeno'});const w=c.items.filter(i=>i.state==='Čaka potrditev');
  const body=`<div class="tiles"><div class="tile"><div class="tn2">Artiklov na seznamu</div><div class="tc">${c.items.length}</div></div><div class="tile ${w.length?'bad':'good'}"><div class="tn2">Čaka potrditev</div><div class="tc">${w.length}</div></div><div class="tile"><div class="tn2">Potrjeni</div><div class="tc">${c.items.filter(i=>i.state==='Potrjeno').length}</div></div><div class="tile"><div class="tn2">Na spletu po objavi</div><div class="tc">${c.onWeb}</div></div></div>
   <h3>Zadržani artikli</h3>${c.items.length?`<table class="tbl"><tr><th>Artikel</th><th>Polje</th><th>Zadnja objava</th><th>Zdaj</th><th>Sprememba</th><th>Stanje</th><th>Od kod</th><th></th></tr>${c.items.map((i,ix)=>{const p=byCode(i.code);return `<tr><td><a onclick="go('#/izdelek/${p?p.id:''}')"><b>${esc(i.code)}</b></a><div class="muted">${p?esc(pname(p)):''}</div></td><td>${esc(i.field)}</td><td>${esc(i.last)}</td><td><b>${esc(i.now)}</b></td><td><span class="bdg b-r">${esc(i.change)}</span></td><td><span class="bdg ${i.state==='Čaka potrditev'?'b-y':i.state==='Potrjeno'?'b-g':'b-n'}">${i.state}</span>${i.note?`<div class="muted">${esc(i.note)}</div>`:''}</td><td class="muted">${p&&p.history[0]?esc(p.history[0].source+' · '+p.history[0].user):''}</td><td>${i.state==='Čaka potrditev'?`<button class="btn sm" onclick="guardDecide(${c.id},${ix},true)">Potrdi</button> <button class="btn ghost sm" onclick="guardDecide(${c.id},${ix},false)">Pusti staro</button>`:''}</td></tr>`}).join('')}</table>
   ${w.length?`<div class="card" style="margin-top:16px"><div class="fr"><label>Opomba (neobvezno)</label><input class="inp" id="gnote" placeholder="npr. cena preverjena pri Luki"></div><button class="btn primary" onclick="confirmDlg('Potrdi vse zadržane','Potrjenih bo ${w.length} artiklov; nove vrednosti gredo na splet ob naslednji izdelavi (sprožim jo takoj).',()=>{S.checks.find(x=>x.id===${c.id}).items.forEach((i,ix)=>{if(i.state==='Čaka potrditev')guardDecide(${c.id},ix,true,true)});buildCatalog(false)},'Da, potrdi vse')">Potrdi vse zadržane (${w.length})</button></div>`:''}`:'<p class="muted">Pri tem preverjanju ni bilo zadržanih artiklov.</p>'}
   <p class="muted" style="margin-top:14px">Namig: pri AZ.0059 je napaka v izvoru (cena v SAOP ×100). Pravilna pot je »Pusti staro« in popravek cene v SAOP (Poslovanje › Cene) – ne potrditev.</p>`;
  return frame({crumbs:[['Varovalke','#/varovalke'],'Preverjanje '+c.id],title:`Varovalka · preverjanje ${c.id}`,sub:`${esc(c.area)} · ${fmtD(c.time)} · ${esc(c.outcome)}`,body,left:L('nadzor','varovalke'),helpKey:'guards'})}
function guardDecide(cid,ix,ok,silent){const c=S.checks.find(x=>x.id===cid);const i=c.items[ix];const note=($('#gnote')||{}).value||'';
  if(ok){const p=byCode(i.code);if(p){if(i.field.startsWith('Spletne'))delete S.published[i.code];else S.published[i.code]=catalogRowRaw(p,S)}i.state='Potrjeno';i.note=(ME().name+(note?': '+note:''));}
  else{i.state='Nadomeščeno';i.note=ME().name+': ostane zadnja objavljena vrednost'}
  if(!c.items.some(x=>x.state==='Čaka potrditev'))c.outcome='Rešeno';save();if(!silent){render();toast(ok?'Potrjeno – nova vrednost gre na splet ob naslednji izdelavi':'Na spletu ostaja zadnja objavljena vrednost')}}
function buildCatalog(interactive){const rows=[];const held=[];const g=Object.fromEntries(S.guards.map(x=>[x.code,x]));const newCodes=new Set();
  S.products.forEach(p=>{if(catalogReason(p))return;newCodes.add(p.code);const r=catalogRowRaw(p,S);const old=S.published[p.code];
    if(g.PRICE_JUMP.on&&old&&old.cena_mpc&&r.cena_mpc){const ratio=Number(r.cena_mpc)/Number(old.cena_mpc);if(ratio>=g.PRICE_JUMP.threshold||ratio<=1/g.PRICE_JUMP.threshold){held.push({code:p.code,field:'Cena MPC z DDV',last:eur(old.cena_mpc),now:eur(r.cena_mpc),change:ratio>=1?'×'+Math.round(ratio):'÷'+Math.round(1/ratio),state:'Čaka potrditev',note:''});rows.push(old);return}}
    rows.push(r)});
  const removed=Object.keys(S.published).filter(c=>!newCodes.has(c));
  if(g.MASS_REMOVAL.on&&removed.length>g.MASS_REMOVAL.threshold){removed.forEach(c=>{held.push({code:c,field:'Spletne strani (umik s spleta)',last:S.published[c]['Spletne strani'],now:'—',change:'umik',state:'Čaka potrditev',note:''});rows.push(S.published[c])})}
  if(g.MIN_ROWS.on&&rows.length<g.MIN_ROWS.threshold){S.checks.unshift({id:++S.seq,time:now(),area:'Katalog za splet (katalog.csv)',outcome:'Ni objavljeno',summary:`Samo ${rows.length} vrstic – pod pragom ${g.MIN_ROWS.threshold}. Datoteka ni zamenjana.`,onWeb:Object.keys(S.published).length,items:[]});save();render();toast('Katalog ni objavljen – premalo vrstic','err');return}
  const pub={};rows.forEach(r=>pub[r.sku]=r);const heldCodes=new Set(held.map(h=>h.code));Object.keys(pub).forEach(c=>{if(!heldCodes.has(c))S.published[c]=pub[c]});removed.forEach(c=>{if(!heldCodes.has(c))delete S.published[c]});

  S.checks.forEach(c=>{if(c.outcome==='Artikli čakajo potrditev'&&!c.items.some(i=>i.state==='Čaka potrditev'))c.outcome='Nadomeščeno'});

  S.checks.unshift({id:++S.seq,time:now(),area:'Katalog za splet (katalog.csv)',outcome:held.length?'Artikli čakajo potrditev':removed.length?'Objavljeno z opozorili':'Brez ugotovitev',summary:held.length?`${held.length} zadržanih, ostali objavljeni`:`Objavljeno ${rows.length} vrstic${removed.length?`, ${removed.length} umaknjenih s spleta`:''}`,onWeb:rows.length,items:held});
  buildCustomers(true);const j=S.jobs.find(x=>x.key==='WEB_CATALOG');j.last=now();j.status='Uspešno';j.note=held.length?`${held.length} zadržanih (varovalka)`:`${rows.length} vrstic`;
  S.runs.unshift({job:'WEB_CATALOG',time:now(),by:ME().name,summary:j.note});save();render();if(interactive!==null)toast(held.length?`katalog.csv zgrajen · ${held.length} artiklov čaka potrditev varovalke`:`katalog.csv zgrajen · ${rows.length} vrstic`,held.length?'warn':'ok')}

  S.files['stranke.csv']={content:toCSV([hd,...cs.map(c=>[c.code,c.name,c.email,c.city,c.vat,c.magento,c.pricelist,c.rabat,c.p2])]),time:now(),rows:cs.length,ok:true};if(!silent){save();render();toast(`stranke.csv zgrajen · ${cs.length} strank`)}}

function parseCSV(text,d){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function readWorkbook(){const f=$('#wbf').files[0];if(!f)return toast('Izberi datoteko.','err');const desc=$('#wbd').value;const r=new FileReader();r.onload=()=>{try{const t=String(r.result).replace(/^\uFEFF/,'');const d=t.split('\n')[0].includes(';')?';':',';const rows=parseCSV(t,d);const head=rows.shift().map(h=>{const m=h.match(/\[([^\]]+)\]\s*$/);return m?m[1]:h.trim()});
   if(!head.includes('code'))throw new Error('V glavi ni stolpca »Šifra artikla [code]«.');const changes=[],warn=[];
   rows.forEach((r,ix)=>{const o={};head.forEach((h,i)=>o[h]=(r[i]??'').trim());const p=byCode(o.code);if(!p){warn.push(`Vrstica ${ix+2}: artikla ${o.code} ni v PIM – preskočeno`);return}
     head.forEach(k=>{if(k==='code'||k==='Podjetje'||!WB_COLS.includes(k))return;let v=o[k];const old=getFlat(p,k);const isBool=typeof old==='boolean'||k.startsWith('site:')||k==='pimPublished';
       if(isBool){if(v===''){return}const b=fromDN(v);if(b===null){warn.push(`Vrstica ${ix+2}: ${flatLabel(k)} »${v}« ni D/N`);return}v=b}
       else if(k.startsWith('attr.power')||k.startsWith('attr.flux')||k==='erp.netWeight'){v=v===''?null:Number(v.replace(',','.'));if(v!==null&&isNaN(v)){warn.push(`Vrstica ${ix+2}: ${flatLabel(k)} ni število`);return}}
       else if(k.startsWith('cat:')&&v&&!catOf(v)){const byName=S.categories.find(c=>catPath(c.code)===v);if(byName)v=byName.code;else{warn.push(`Vrstica ${ix+2}: neznana kategorija »${v}«`);return}}
       if(JSON.stringify(old??'')===JSON.stringify(v??''))return;if((v===''||v==null)&&flatOwner(k)==='SAOP'){warn.push(`Vrstica ${ix+2}: prazna vrednost za SAOP polje ${flatLabel(k)} se ne pošlje`);return}
       changes.push({row:ix+2,code:p.code,key:k,label:flatLabel(k),old,new:v,target:flatOwner(k)})})});
   UI.preview={file:f.name,desc,rows:rows.length,changes,warn};render()}catch(e){toast('Napaka: '+e.message,'err')}};r.readAsText(f,'utf-8')}
function applyWorkbook(){const pv=UI.preview;const run={id:Math.max(0,...S.imports.map(i=>i.id))+1,time:now(),kind:'Izdelki (delovni list)',file:pv.file,desc:pv.desc||'',user:ME().name,rows:pv.rows,state:'uveljavljen',changes:[]};

function pgSystem(){const flows=[...new Set(S.jobs.map(j=>j.flow))];
  const body=`<div class="card" style="margin-bottom:14px"><span class="bdg b-g">Gostitelj avtomatike teče</span> <span class="muted">PIM.AutomationHost · zadnji utrip pred 12 s</span></div>
   ${flows.map(f=>`<h3>${f}</h3><table class="tbl"><tr><th>Posel</th><th>Stanje</th><th>Razlog</th><th>Urnik</th><th>Zadnji tek</th><th>Naslednji</th><th></th></tr>${S.jobs.filter(j=>j.flow===f).map(j=>`<tr><td class="lbl">${esc(j.name)}<div class="muted">${j.key}</div></td><td><span class="bdg ${!j.on?'b-n':j.status==='Uspešno'?'b-g':j.status==='Teče'?'b-b':j.status==='Napaka'?'b-r':'b-y'}">${j.on?j.status:'Izklopljen'}</span></td><td class="muted">${esc(j.note)}</td><td>${j.schedule}</td><td class="muted">${fmtD(j.last)}</td><td class="muted">${j.on?fmtD(j.next):'—'}</td><td><button class="btn sm" onclick="runJob('${j.key}')">Zaženi</button> <button class="btn ghost sm" onclick="const j=S.jobs.find(x=>x.key==='${j.key}');j.on=!j.on;save();render()">${j.on?'Izklopi':'Vklopi'}</button></td></tr>`).join('')}</table>`).join('')}
   <h3>Zadnji ročni teki</h3><table class="tbl"><tr><th>Čas</th><th>Posel</th><th>Sprožil</th><th>Povzetek</th></tr>${S.runs.slice(0,10).map(r=>`<tr><td class="muted">${fmtD(r.time)}</td><td>${esc((S.jobs.find(j=>j.key===r.job)||{}).name||r.job)}</td><td>${esc(r.by)}</td><td>${esc(r.summary)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Še ni ročnih tekov.</td></tr>'}</table>`;
  return frame({crumbs:['Sistem','Nadzor sistema'],title:'Nadzor sistema',sub:'Ali podatki prihajajo, kje je napaka in kaj narediti',body,left:L('sistem','sistem'),helpKey:'system'})}
function runJob(key){const j=S.jobs.find(x=>x.key===key);if(key==='WEB_CATALOG'){buildCatalog(true);return}if(key==='SAOP_OUTBOUND'){saopSend();return}
  j.status='Teče';render();setTimeout(()=>{j.status='Uspešno';j.last=now();let s='';if(key==='VALIDATION'){s=`Preverjenih ${S.products.length} artiklov, ${S.products.filter(p=>issues(p).some(i=>i.sev==='ERROR')).length} z blokirajočo napako`}else if(key==='SUPPLIER_STOCK'){s='NW_STOCK in BT_STOCK osveženi'}else if(key==='SUPPLIER_CATALOG_IMPORT'){S.candidates.forEach(c=>{if(c.state!=='V PIM'){c.last=now();c.count++}});s='Kandidati osveženi'}else s='Brez novih podatkov (demo)';j.note=s;S.runs.unshift({job:key,time:now(),by:ME().name,summary:s});save();render();toast(`${j.name}: ${s}`)},1000)}
function pgUsers(){const body=`<table class="tbl"><tr><th>Uporabnik</th><th>Kontakt in aktivnost</th><th>Račun</th><th>Vloge</th><th>Stanje</th></tr>${S.users.map(u=>`<tr><td class="lbl">${esc(u.name)}${u.code===S.me?' <span class="bdg b-p">vi</span>':''}<div class="muted">${u.code}</div></td><td>${esc(u.email)}<div class="muted">zadnja prijava ${fmtD(u.last)}</div></td><td>${u.auth}</td><td>${u.roles.map(r=>`<span class="bdg b-p">${r}</span>`).join(' ')}</td><td><span class="bdg ${u.active?'b-g':'b-n'}">${u.active?'Aktiven':'Onemogočen'}</span></td></tr>`).join('')}</table>`;
  return frame({crumbs:['Sistem','Uporabniki'],title:'Uporabniki',body,left:L('sistem','administracija'),helpKey:'admin'})}
function pgRoles(){const secs=SECTIONS.map(s=>s.k);const body=`<table class="tbl mtx"><tr><th>Področje</th>${S.roles.map(r=>`<th>${r.name}<div class="muted">${r.code}</div></th>`).join('')}</tr>${SECTIONS.map(s=>`<tr><td>${s.l}</td>${S.roles.map(r=>r.code==='ADMIN'?'<td><input type="checkbox" checked disabled></td>':`<td><input type="checkbox" ${(S.rolePerms[r.code]||[]).includes(s.k)?'checked':''} onchange="const a=S.rolePerms['${r.code}']=S.rolePerms['${r.code}']||[];this.checked?a.push('${s.k}'):a.splice(a.indexOf('${s.k}'),1);save()"></td>`).join('')}</tr>`).join('')}</table><p class="muted">Skrbnik ima vedno poln dostop. V demu se dostop prikazuje, ne uveljavlja.</p>`;
  return frame({crumbs:['Sistem','Vloge'],title:'Vloge in dostop',body,left:L('sistem','administracija/vloge'),helpKey:'admin'})}

/* ================= zagon ================= */
load();
if(!location.hash)history.replaceState(null,'','#/nadzorna-plosca');
render();
</script>
</body>
</html>
