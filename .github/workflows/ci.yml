name: CI
# Prevede dejanski sistem: .NET 8, Blazor Server, MS SQL.
#
# Prej je ta CI poganjal samo `npm test` nad scaffoldom, ki je preverjal
# `sestej(2, 3) === 5`. Zelen CI torej ni pomenil nicesar o .NET resitvi.
# Scaffold je odstranjen (AGENTS.md par. 2: ni Node, ni React, ni Vite).
#
# windows-latest in ne ubuntu: PIM.Intranet uporablja System.DirectoryServices
# za AD prijavo, ciljna namestitev pa je Windows/IIS. Prevajanje na Linuxu bi
# preverjalo nekaj drugega, kot se dejansko namesti.
#
# KAJ TA CI DOKAZE IN KAJ NE
#
#   Dokaze: vseh 53 projektov iz PIM.sln se prevede z 0 napakami in 0 opozorili.
#   Ne dokaze: da sistem dela. Testni paket tu ne tece.
#
# Zakaj testni paket tu ne tece: `scripts\run_tests.ps1` brez razvojne baze PIM
# vrne izhod 1. PIM.F3.Integration in xUnit se korektno preskocita, pet
# projektov (F2.Integration, F5.Integration, F8.HardeningTests, F8.Integration,
# F9.Integration) pa konca z izhodom 2 "MSSQL BLOCKED" in steje kot padec.
# Dokler se ti ne preskocijo enako kot F3, bi bil CI trajno rdec iz razloga, ki
# ni napaka v kodi. Naloga je zapisana v TASKBOARD.md.
#
# Merodajni testni zagon zato ostaja lokalen, proti bazi PIM:
#   scripts\run_tests.ps1   ->  44 uspeli, 0 preskocenih, 0 padlih

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PIM_Solution\PIM.sln

      # Brez --no-restore bi se restore izvedel dvakrat; brez -warnaserror bi
      # opozorila utonila. Resitev je trenutno na 0 opozoril in tam naj ostane.
      - name: Build
        run: dotnet build PIM_Solution\PIM.sln --no-restore --nologo -warnaserror

      - name: Preveri, da se Node scaffold ni vrnil
        shell: pwsh
        run: |
          $najdeno = @('package.json', 'package-lock.json', 'node_modules') |
            Where-Object { Test-Path $_ }
          if ($najdeno) {
            Write-Host "::error::Node scaffold je spet v repozitoriju: $($najdeno -join ', '). Glej AGENTS.md par. 2 - npm test ni dokaz nicesar."
            exit 1
          }
          Write-Host "Node scaffold odsoten."
