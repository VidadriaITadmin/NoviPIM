tomer*.cs, PIM_Solution/src/PIM.Intranet/Services/ImportHistoryService.cs]\r\nmigracije: [129, 140, 200, 202, 212, 250, 252, 253, 274, 279, 280]\r\n---\r\n\r\n# Stranke — seznam, kartica in delovni list strank\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** komerciala · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nKomerciala najde stranko (kupca, dobavitelja, proizvajalca) katerega koli podjetja, ji na kartici nastavi tip, B2B nastavitve, pragove, popuste, kontakte in zaznamke, ali pa vse to naenkrat uredi v Excelu in uvozi nazaj. Rezultat so podatki strank v PIM, ki za podjetje 2 gredo v `stranke.csv` (in posebni S v `katalog.csv`).\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Išče stranke, ureja kartico, izvozi in uvozi delovni list strank, piše zaznamke. |\r\n| Urednik kataloga | Enako kot komerciala. |\r\n| Skrbnik | Enako; poleg tega povratek uvoza na `/uvozi`. |\r\n| Avtomatika (PIM) | Ponoči zajame stranke in rabatne cenike iz SAOP, izračuna vlogo stranke, skupine popustov in stanje »v stranke.csv«; urni izvoz zapiše `stranke.csv`. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** komerciala na `/stranke`, kartici `/stranke/{Id}` ali z uvozom na `/stranke/uvoz`.\r\n- **Po urniku:** zajem strank (`GetCustomers`) in rabatov (`ComercialTerms`) iz SAOP v nočni uskladitvi `NIGHTLY_RECONCILIATION` (00:30); izvoz `stranke.csv` v poslu `WEB_CATALOG_EXPORT`.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Stranke, plačnik, cenik, rabatni cenik, aktivnost, referent, rabati po skupinah artiklov | SAOP (nočni zajem) |\r\n| **Vhod** | Delovni list strank (`.xlsx`, isti kot izvoz) | Excel |\r\n| **Izhod** | Ročni prepis splošnih podatkov, kontakti, tip, vrsta, B2B nastavitve, pragovi, skupinski popusti, posebni S, P2, skrbnik, e-pošte, zaznamki, enote | PIM (takoj) |\r\n| **Izhod** | Vrstica v `stranke.csv` (samo aktivne stranke podjetja 2 z B2B profilom) | Splet, ob naslednjem izvozu |\r\n| **Izhod** | Zapis uvoza s prejšnjimi vrednostmi | Zgodovina uvozov (`/uvozi`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph S[\"🏢 SAOP\"]\r\n    A[(Stranke in rabatni ceniki)]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    B([Seznam Stranke]) --\u003e C[Filtri in iskanje]\r\n    C --\u003e D[Kartica stranke: uredi in shrani]\r\n    C --\u003e E[Izvozi Excel]\r\n    E --\u003e F[Uredi v Excelu in naloži na Uvoz]\r\n    G[Pregleda predogled in klikne Uvozi]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    H[[Nočni zajem strank]]\r\n    I[[Zapis v PIM takoj, z revizijsko sledjo]]\r\n    J[[Zapis uvoza v zgodovino]]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    K[(stranke.csv)]\r\n  end\r\n  A --\u003e H --\u003e B\r\n  F --\u003e G --\u003e I\r\n  D --\u003e I\r\n  I --\u003e J\r\n  I -- ob naslednjem izvozu --\u003e K\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class B endp; class C,D,E,F,G user; class H,I,J auto; class A,K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/stranke` | Izbereš zavihek vloge (kupci, dobavitelji, proizvajalci), vpišeš iskanje (šifra, naziv, davčna, kraj), odpreš **Filtri** (podjetje, tip, aktivnost, vir vloge, popusti, »V stranke.csv«, Magento skupina). | Privzeto so vsa podjetja; filtri veljajo takoj. | Število rezultatov ob iskanju; čipi aktivnih filtrov. |\r\n| 2 | Komerciala | `/stranke` | Klikneš vrstico stranke. | Odpre se kartica `/stranke/{Id}`. | Naslov je naziv, podnaslov podjetje, šifra in vloga; čipi Aktivna, stranke.csv, Magento skupina. |\r\n| 3 | Komerciala | Kartica → **Splošni podatki** | Popraviš polje (naslov, davčna, plačnik, cenik, rabat, aktivnost …) in klikneš **Shrani splošne podatke**; **Počisti ročne prilagoditve** vrne vrednosti iz SAOP. | Ročna vrednost prevlada nad SAOP; v SAOP se nič ne pošlje. | Opomba »Ročno prilagojeno: ime, čas«. |\r\n| 4 | Komerciala | Kartica → **Kontakti** | Vpišeš e-pošto, telefon, mobitel, osebe (ločene z navpičnico) in **Shrani kontakte**. | Kontakti gredo v `stranke.csv`. | Pod poljem piše vir vrednosti. |\r\n| 5 | Komerciala | Kartica → **Komercialni podatki** | Nastaviš »Tip stranke«, »Vrsta stranke«, kljukice »Popust na polno pakiranje«, »Vrednostni rabat«, »B2B+ (brezplačna poštnina)« z datumi in klikneš **Shrani nastavitve**. Pragove vpišeš in **Shrani prag**. Posebni S: **Dodaj pravilo** / **Umakni**. | Tip določi Magento skupino; pragovi in kljukice gredo v `stranke.csv`, posebni S v `katalog.csv`. | Opomba »Gre v stranke.csv (aktivna, z B2B profilom)«; tabela »Skupine popustov« pokaže, kar gre v datoteko. |\r\n| 6 | Komerciala | Kartica → **Poslovne enote in tranziti** | Izbereš vrsto (PE / Tranzit), stranko iz šifranta ali vpišeš ročno in klikneš **Dodaj**. | PE podeduje skupinske popuste od plačnika, tranzit jih nima. | Nova vrstica v tabeli. |\r\n| 7 | Komerciala | Kartica → **Zaznamki** | Napišeš zaznamek in **Zapiši zaznamek**. | Zaznamek je viden vsem, ni ga mogoče spremeniti. | Zaznamek z imenom avtorja. |\r\n| 8 | Komerciala | `/stranke` | Klikneš **Izvozi Excel (N)**. | Prenese se delovni list z natanko vrsticami pogleda in drugim listom »S po tipih strank«. | Datoteka `.xlsx`. |\r\n| 9 | Komerciala | Excel | Urediš stolpce (vrsta, tip, B2B, pragovi, »Skupinski popusti stranke«, »Posebni S po izdelku«, »Dodatni popust po skupinah (P2)«, kontakti, skrbnik, e-pošte, »Dodaj opombo«). Prazna celica = ne spreminjaj, `-` = izprazni. | — | — |\r\n| 10 | Komerciala | `/stranke/uvoz` | Po potrebi izbereš podjetje za vrstice brez stolpca »Podjetje« in naložiš datoteko. | Predogled: prebrane stranke, spremembe prej → potem, napake, stolpci samo za branje, pravila S po tipih. | Razdelek »2. Kaj bo uvoz naredil«. |\r\n| 11 | Komerciala | `/stranke/uvoz` | Klikneš **Uvozi N sprememb pri M strankah …**. | Vse se zapiše takoj po istih poteh kot na kartici; uvoz se zapiše v zgodovino. | »3. Izid«: spremenjenih strank, število v `stranke.csv` in izdelkov s spremenjenim »Posebni popust za stranko«; povezava »uvoz #N«. |\r\n| 12 | Avtomatika | — | — | Ob naslednjem `WEB_CATALOG_EXPORT` gredo spremembe v `stranke.csv` (in `katalog.csv`). | `/splet` → Preglej vsebino → `stranke.csv`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- PIM strank **ne pošilja** v SAOP; ročni prepis velja samo v PIM in prevlada nad SAOP, dokler ga ne počistiš.\r\n- Vloga se izračuna znotraj podjetja stranke (dobavitelj izdelkov / SAOP vrsta D, proizvajalec izdelkov, kupec); ročna vrsta jo prepiše.\r\n- V `stranke.csv` gre vsaka aktivna stranka podjetja 2 z B2B profilom; tip ni pogoj (brez tipa prazna Magento skupina).\r\n- Skupine popustov v `stranke.csv`: ročni popust stranke → ročni popust tipa → SAOP rabatni cenik; PE deduje od plačnika, tranzit nima; samo danes veljavni in nad 0 %. P2 se obračuna za osnovnim: `100 − (100 − osnovni) × (100 − dodatni) / 100`.\r\n- V uvozu je celica s seznamom (ločilo navpičnica) cel seznam: kar manjka, se umakne.\r\n- Referent (SAOP) in opombe sta v delovnem listu samo za branje; skrbnik in e-pošte za dobavnice/obveščanje ne gredo v `stranke.csv`.\r\n- Dostop: ADMIN, CATALOG_EDITOR, COMMERCIAL.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Stolpci brez ustreznega polja (ne bodo uvoženi)« | Spremenjen naslov stolpca | Ne spreminjaj naslovov; izvozi znova. |\r\n| Vrstica v »napakah« uvoza | Neznan tip, neveljavna številka ali datum | Popravi celico; ostale vrstice se uvozijo. |\r\n| Stranka nima Magento skupine | Tip ni preslikan | `/pravila-popustov` → Skupine strank. |\r\n| Kontakti »iz ERP« so prazni | Zajem kontaktov iz SAOP ne obstaja | Vpiši ročno (kartica pove, kaj manjka). |\r\n| Uvoz pravi »v stranke.csv gre N«, datoteka se ne spremeni | Izvoz še ni tekel ali stranka ni iz podjetja 2 | Počakaj na `WEB_CATALOG_EXPORT` ali ga skrbnik zažene. |\r\n| Napačen uvoz | — | `/uvozi/{id}` → **Pripravi povratek**. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `Customers.razor`, `CustomerDetail.razor`, `CustomerPackagingPanel.razor`, `CustomerImport.razor`; izvoz `/izvoz/stranke.xlsx`.\r\n- **Storitve / delavci:** `CustomerListService`, `CustomerCardService`, `CustomerWorkbookService`, `PackagingDiscountService`, `ImportHistoryService`; zajem `PIM.KatalogWorker` (`Customers`, `CustomerItemGroupDiscounts`).\r\n- **Tabele in pogledi:** `b2b.Customer`, `pim.CustomerWebProfile`, `pim.CustomerContact`, `pim.CustomerExtra`, `pim.SalesClerk`, `b2b.CustomerValueDiscountTier`, `b2b.GroupDiscountOverride`, `b2b.CustomerExtraGroupDiscount`, `b2b.PackagingDiscountRule`, `b2b.CustomerGroupDiscounts`, `b2b.AuditLog`, `intranet.GetCustomerCard`, `intranet.GetCustomerList`, `intranet.GetCustomerListExtra`, `ops.ImportRun`.\r\n- **Migracije:** 129, 140, 200, 202, 212, 250, 252, 253, 274, 279, 280.\r\n- **Urniki:** `NIGHTLY_RECONCILIATION` (00:30), `WEB_CATALOG_EXPORT`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Oznaka »v stranke.csv« na seznamu in kartici ter filter »Gre v stranke.csv« upoštevata samo aktivnost in B2B profil, **ne podjetja**. Stranka Vidadrie je označena, kot da gre v `stranke.csv`, datoteka pa vsebuje samo stranke podjetja 2.\r\n- ⚠️ Dodatni popust P2, referent in e-pošte (279) so bili uvedeni za bazo kupcev ViD (podjetje 3); v `stranke.csv` pridejo samo za stranke podjetja 2. Predlog združitve IQ + VID je odprt.\r\n- ⚠️ Po uvozu stran napoti na »Pripravi izvoz« za ročno izdelavo; ta stran datoteke za Magento ne osveži (samo prenos).\r\n- ⚠️ Kartica nima polj P2, skrbnika in e-pošt za dobavnice/obveščanje (279) — urejajo se samo prek delovnega lista.\r\n- ⚠️ Zavihek »Dokumenti in finance« je prazen (vir ni odločen).\r\n- ⚠️ Zajem kontaktov iz SAOP ne obstaja; vsi kontakti v `stranke.csv` so ročni.\r\n\r\n## Povezani procesi\r\n\r\n- [Popusti](popusti.md): Magento skupina po tipu, pragovi, izjeme, S-popusti.\r\n- [Katalog in stranke za splet](../06-izhod-splet/katalog-in-stranke-csv.md): izvoz `stranke.csv`.\r\n- [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md): povratek uvoza strank.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): nočni zajem strank in rabatov.\r\n"},{"pot":"07-poslovanje/zaloge-in-rezervacija.md","vsebina":"---\r\nid: zaloge-in-rezervacija\r\nnaslov: Zaloge in izločitev iz rezervacije zaloge\r\npodrocje: 07-poslovanje\r\nstanje: deluje\r\nbere: [saop.zaloge, saop.artikli, dobavitelj.xml, pim.izdelek, pim.nastavitve]\r\npise: [pim.zaloge, pim.saop-vrsta, obvestila]\r\nstrani: [/zaloge, /nastavitve/rezervacija-zaloge]\r\nposli: [STOCK_IMPORT, SUPPLIER_STOCK_IMPORT, SAOP_DELIVERY_IMPORT, NIGHTLY_RECONCILIATION, STOCK_REPLENISHMENT_DIGEST, WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Stocks.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogReservationExclusions.razor, PIM_Solution/src/PIM.Intranet/Services/StockReadService.cs, PIM_Solution/src/PIM.StockMapping/*.cs, PIM_Solution/workers/PIM.SaopStockWorker/*.cs, PIM_Solution/workers/PIM.StockFileWorker/*.cs]\r\nmigracije: [103, 146, 187, 188, 189, 190, 191, 198, 204, 262, 263, 267]\r\n---\r\n\r\n# Zaloge in izločitev iz rezervacije zaloge\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** komerciala · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nKomerciala vidi, kaj je na zalogi pri nas (SAOP, vsa podjetja) in pri dobaviteljih (Nowodvorski, Braytron), kaj prihaja in kje so posebnosti, ter izvozi pogled v Excel. Na posebni strani pregleda artikle, ki jih je SAOP izločil iz rezervacije zaloge, in izločitev po potrebi prekliče (po odobritvi v SAOP). Zaloga v `katalog.csv` pride iz istih posnetkov.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda zalogo, filtrira, izvozi Excel; pregleda izločene iz rezervacije in predlaga preklic. |\r\n| Urednik kataloga | Enako; odobri preklic izločitve na Izhod v SAOP. |\r\n| Skrbnik | Nastavi, katera skladišča SAOP se berejo (`/nastavitve/skladisca`), in urnike zajema. |\r\n| Avtomatika (PIM) | Bere zalogo iz SAOP in datotek dobaviteljev, poveže pozicije z artikli, ob novi izločitvi prižge opozorilo in uvrsti potrditev v vrsto za SAOP. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** komerciala na `/zaloge` ali `/nastavitve/rezervacija-zaloge`.\r\n- **Po urniku:** `STOCK_IMPORT` (zaloga iz SAOP, vsakih 600 s), `SUPPLIER_STOCK_IMPORT` (Nowodvorski FTP, Braytron HTTPS, vsakih 1800 s, s spoštovanjem omejitev dobavitelja), datumi dobave v `NIGHTLY_RECONCILIATION` (`SAOP_DELIVERY_IMPORT` je za ročni zagon), dnevni mail »Zaloga pod MID« `STOCK_REPLENISHMENT_DIGEST` ob 5:30.\r\n- **Ob dogodku:** SAOP na novo izloči aktiven artikel iz rezervacije (prehod ne → da) ob zajemu planskih podatkov.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Količine, razpoložljivo, prihodi in datumi dobave po skladiščih | SAOP |\r\n| **Vhod** | Zaloga in prihodi dobavitelja | Datoteke dobaviteljev (NW, BT) |\r\n| **Vhod** | Zastavica »izloči iz rezervacije zaloge« (planski podatki) | SAOP |\r\n| **Izhod** | Posnetki zaloge po viru, povezani z artikli; izpeljane težave | PIM |\r\n| **Izhod** | Excel pogleda zaloge | Uporabnik |\r\n| **Izhod** | Preklic izločitve kot sprememba v vrsti (`UpdateItemsPlanningData`) | SAOP, po odobritvi |\r\n| **Izhod** | Lastna in dobaviteljeva zaloga, prihodi | `katalog.csv` |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph S[\"🏢 SAOP\"]\r\n    A[(Zaloga in planski podatki)]\r\n    L[(Artikel v ERP)]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    B[[Zajem zaloge na 10 min]]\r\n    C[[Datoteke dobaviteljev na 30 min]]\r\n    D[[Povezava pozicij z artikli]]\r\n    E{Nova izločitev iz rezervacije?}\r\n    F\u003eOpozorilo in potrditev v vrsti za SAOP]\r\n    J\u003ePreklic čaka odobritev]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    G[Pregled zaloge, filtri, Izvozi Excel]\r\n    H[Izločeni: izbere in Prekliči izločitev]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    K[(katalog.csv)]\r\n  end\r\n  A --\u003e B --\u003e D\r\n  C --\u003e D\r\n  D --\u003e G\r\n  D --\u003e K\r\n  A --\u003e E\r\n  E -- da --\u003e F --\u003e H --\u003e J --\u003e L\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class G,H user; class B,C,D,E auto; class F,J wait; class A,L,K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/zaloge` | Izbereš zavihek (Vsa zaloga, Na zalogi, Brez zaloge, Prihaja zaloga, Samo pri dobavitelju), vpišeš šifro ali EAN in pritisneš Enter. | Ena vrstica na artikel: naša zaloga (skladišče, količina, razpoložljivo, prihod), min/max, dobaviteljeva zaloga in prihod, podjetje, čas posnetkov. | Število zadetkov; stran po 50. |\r\n| 2 | Komerciala | `/zaloge` | **Filtri**: podjetje, skladišče (SAOP), dobavitelj, posebnosti (pod min, nad max, prihod zamuja, negativna zaloga, samo pri dobavitelju, brez artikla v PIM), svežina posnetka; razvrstitev. | Filtri veljajo takoj in so v naslovu strani. | Čipi aktivnih filtrov. |\r\n| 3 | Komerciala | `/zaloge` | Klikneš **Izvozi Excel (N)**. | Prenese se natanko ta pogled (brez uvoza — zaloga je samo za branje). | Datoteka `.xlsx`. |\r\n| 4 | Komerciala | `/zaloge` → »Svežina po viru« | Pogledaš starost posnetka vsakega vira in »brez artikla«. | Vir, starejši od 24 ur, je označen z opozorilom. | Čip »Svežina«. |\r\n| 5 | Komerciala | `/zaloge` → »Izpeljane težave« | Pogledaš zavrnjene pozicije po razlogu. | Težave nimajo gumba »reši« — izginejo, ko izgine vzrok. | — |\r\n| 6 | Avtomatika | — | — | Ko SAOP na novo izloči aktiven artikel iz rezervacije, PIM posodobi eno kritično opozorilo na podjetje (zvonec, rdeči pas na `/sistem`) in v vrsto za SAOP uvrsti potrditev za ta artikel. Arhiviran (neaktiven) artikel zastavico izgubi in ne sproži opozorila. | Zvonec; `/outbound`. |\r\n| 7 | Komerciala | `/nastavitve/rezervacija-zaloge` | Izbereš podjetje (privzeto vsa), obkljukaš artikle in klikneš **Prekliči izločitev** → **Da, prekliči izločitev**. | Za vsak artikel nastane sprememba »izloči iz rezervacije = ne« v vrsti za SAOP; artikli z že čakajočo spremembo nimajo kljukice (»Čaka na odobritev«). | Sporočilo o uvrščenih; vrstica kaže »Čaka na odobritev«. |\r\n| 8 | Urednik | `/outbound` (Izhod v SAOP) | Odobriš spremembo. | Kljukica gre v SAOP po `UpdateItemsPlanningData`. | Po naslednjem zajemu artikla ni več na seznamu. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Zaloga je samo za branje: PIM je nikoli ne piše v SAOP.\r\n- »Naša zaloga« je vsota čez skladišča, ki jih PIM bere iz SAOP (nastavitev na `/nastavitve/skladisca`).\r\n- Zaloga dobavitelja se zapiše samo za obstoječe artikle (262); nespremenjena datoteka dobavitelja se ne zapiše znova.\r\n- V `katalog.csv` je lastna zaloga IQ + VID skupaj, dobaviteljeva ločeno; stara ali manjkajoča zaloga ni dokaz, da je zaloga pošla.\r\n- Preklic izločitve nikoli ne gre naravnost v SAOP — vedno čaka odobritev.\r\n- Dostop do rezervacije: ADMIN, CATALOG_EDITOR, COMMERCIAL; `/zaloge` z dovoljenjem `page.stocks`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Vir ima opozorilo svežine | Zajem ne teče ali dobavitelj vrača isto datoteko | `/sistem/posel/STOCK_IMPORT` oz. `SUPPLIER_STOCK_IMPORT`. |\r\n| Vrstica »brez artikla« | Šifra ali EAN iz vira ni v PIM | Preveri šifro/EAN artikla; neujemanja v [Težave in neujemanja zajema](../02-vhodi/tezave-in-neujemanja-zajema.md). |\r\n| Prihod »datuma ni« | Vir je javil količino brez datuma | Datumi pridejo ponoči iz SAOP. |\r\n| Artikel ostaja na seznamu izločenih po odobritvi | Zajem še ni prebral planskih podatkov ali SAOP je zavrnil | `/izvozi/obvestila`, `/outbound`. |\r\n| »Izločenih izdelkov trenutno ni mogoče naložiti.« | Povezava z bazo | Osveži stran. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `Stocks.razor`, `CatalogReservationExclusions.razor`; izvoz Excel zaloge (migracija 190/191).\r\n- **Storitve / delavci:** `StockReadService`, `CatalogReadService.GetReservationExclusionsAsync`, `SaopWriteService.EnqueueAsync` (polje `Planning.ExcludeQtyReservation`); `PIM.SaopStockWorker`, `PIM.SourceFetchWorker`, `PIM.StockFileWorker`; knjižnica `PIM.StockMapping` (`StockLandingWriter`, `StockMatchCounts`).\r\n- **Tabele in pogledi:** `stock.Snapshot`, `stock.Position`, `stock.LandingRecord`, `stock.UnmatchedPosition`, `stock.ItemDeliveryDate`, `canon.ProductPlanning`, `out.ExportStockSource`, `out.CatalogStock`, `intranet.GetStockByItem`, `intranet.GetStockOverview`, `map.ProcessPlanningInbox`, sprožilec `canon.TR_Product_ClearReservationFlagOnArchive`, opozorilo `ReservationExcluded` v `ops.Alert`.\r\n- **Migracije:** 103, 146, 187, 188, 189, 190, 191, 198, 204, 262, 263, 267.\r\n- **Urniki:** `STOCK_IMPORT` (600 s), `SUPPLIER_STOCK_IMPORT` (1800 s), `NIGHTLY_RECONCILIATION` (00:30), `STOCK_REPLENISHMENT_DIGEST` (5:30).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Ob novi izločitvi PIM uvrsti v vrsto »potrditev« za SAOP — to je pošiljanje iste vrednosti, ki jo je SAOP že nastavil. Namen (zapis, da je PIM izločitev videl?) iz kode ni jasen; odobritev po nepotrebnem obremeni vrsto.\r\n- ⚠️ Za 616 izločitev pred migracijo 187 potrditve niso nastale (namenoma); stanje teh artiklov ni potrjeno.\r\n- ⚠️ Dnevni mail »Zaloga pod MID« in predlogi MIN/MID/MAX (198, 200) so v tem dokumentu samo omenjeni; nimajo lastne strani v tem področju.\r\n\r\n## Povezani procesi\r\n\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md) in [Dobaviteljski katalogi](../02-vhodi/dobaviteljski-katalogi-xml.md): viri zaloge.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odobritev preklica izločitve.\r\n- [Jeziki, kanali, skladišča, povezave](../08-upravljanje/jeziki-kanali-skladisca-povezave.md): skladišča po podjetjih.\r\n- [Nadzor kataloga](../06-izhod-splet/nadzor-kataloga.md): lastna zaloga in pregled oznake O.\r\n- [Preverbe cen in zaloge](preverbe-cen-in-zaloge.md): opozorila o zalogi.\r\n"},{"pot":"08-upravljanje/atributi-in-nabori.md","vsebina":"---\r\nid: atributi-in-nabori\r\nnaslov: Atributi in nabori atributov po kategorijah\r\npodrocje: 08-upravljanje\r\nstanje: deluje\r\nbere: [pim.nastavitve, pim.atributi, pim.kategorije, pim.kategorije-izdelka]\r\npise: [pim.nastavitve, pim.atributi, pim.prevodi, pim.pravila]\r\nstrani: [/nastavitve, /nastavitve/atributi, /nastavitve/atributi/ciscenje, /nastavitve/atributi/{Code}, /nastavitve/nabori-atributov, /nastavitve/kategorije]\r\nposli: [PRODUCT_VALIDATION, WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogAttributes.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/AttributeCleanup.razor, PIM_Solution/src/PIM.Intranet/Services/AttributeDuplicatePolicy.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogAttributeDetail.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CategoryAttributeSets.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogSettings.razor, PIM_Solution/src/PIM.Intranet/Services/AttributeMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/CategoryTreeService.cs, PIM_Solution/src/PIM.Intranet/Services/IntranetFeatureReadService.cs]\r\nmigracije: [147, 177, 184, 185, 238, 266, 268, 291, 294, 295, 299, 301, 307]\r\n---\r\n\r\n# Atributi in nabori atributov po kategorijah\r\n\r\n\u003e **Področje:** Upravljanje · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nUrednik vodi register atributov (stalna koda, slovensko ime, prevodi imena, tip, enota) in za vsako kategorijo določi nabor: kateri atributi so obvezni, priporočeni ali izločeni. Nabor odloča, kaj je na kartici izdelka, kaj zahteva spletna validacija in kateri atributi gredo v spletni izvoz.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Stran vidi (bralni dostop); gumbi za shranjevanje ji vrnejo napako »Dejanje zahteva eno od vlog: ADMIN, CATALOG_EDITOR«. |\r\n| Urednik kataloga | Ustvari, uredi, deaktivira ali izbriše atribut, vpiše prevode imen, sestavi nabore kategorij. |\r\n| Skrbnik | Enako kot urednik; odloča o trajnem brisanju atributa z vrednostmi. |\r\n| Avtomatika (PIM) | Ob naslednjem teku validacije upošteva nabore (obvezen = napaka za splet, priporočen = opozorilo); spletni izvoz vzame samo atribute iz nabora. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik ob novem atributu dobavitelja, novi kategoriji, pritožbi »na kartici manjka polje« ali »v izvozu je preveč stolpcev«.\r\n- **Po urniku:** sprememba se uporabi ob naslednjem `PRODUCT_VALIDATION` (vsako uro ali po zajemu iz SAOP) in `WEB_CATALOG_EXPORT` (po uspešni objavi).\r\n- **Ob dogodku:** atribut lahko nastane tudi ob uvozu delovnega lista ali iz okna vrzeli pri uvozu novih artiklov (glej povezane procese).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Ime atributa, koda, skupina, tip, enota, prevodi; seznam atributov za kategorijo (tudi prilepljen iz mastrov) | uporabnik |\r\n| **Izhod** | Register atributov in nabori po kategorijah | PIM (`canon.AttributeDefinition`, nabori kategorij) |\r\n| **Izhod** | Kategorijske zahteve validacije (obvezen/priporočen) | PIM, validacijski profil spleta |\r\n| **Izhod** | Izbor stolpcev atributov v katalog.csv | splet (prek izvoza) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[\"Nov atribut ali urejanje v registru atributov\"]\r\n    B --\u003e C[\"Odpre nabor kategorije in doda atribute\"]\r\n    C --\u003e D{\"Atribut v registru obstaja?\"}\r\n    D -- ne --\u003e E[\"Ustvari v registru in dodaj\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[(\"Register atributov\")]\r\n    G[(\"Nabor kategorije: obvezen, priporočen, izločen\")]\r\n    H[[\"Validacija ob naslednjem teku\"]]\r\n    I[[\"Kartica izdelka pokaže atribute nabora\"]]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    J[(\"katalog.csv: samo atributi iz nabora\")]\r\n  end\r\n  B --\u003e F\r\n  D -- da --\u003e G\r\n  E --\u003e F\r\n  E --\u003e G\r\n  G --\u003e H\r\n  G --\u003e I\r\n  H --\u003e J\r\n  J --\u003e K([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class B,C,E user; class D,H,I auto; class F,G,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/nastavitve/atributi` | Odpreš »+ Nov atribut«, vpišeš **Slovensko ime** (obvezno), po želji kodo, skupino, tip (TEXT, NUMBER, BOOL, ENUM), enoto, prevode imena; klikneš **Ustvari atribut**. | Če kode ne vpišeš, nastane iz imena. Če atribut z enakim slovenskim imenom že obstaja, gumb ostane onemogočen in stran pove kodo obstoječega. | Sporočilo »Atribut … je ustvarjen s kodo …«; atribut se odpre v desnem panelu. |\r\n| 2 | Urednik | `/nastavitve/atributi` | Izbereš atribut v seznamu, zavihek **Osnovno**: skupina, tip, enota, »Vrednost se prevaja po jezikih«, »Je enota drugega atributa« (+ izbira para), »Aktiven«, opomba → **Shrani lastnosti**. | Koda se nikoli ne spremeni. Neaktiven atribut izgine iz izbirnikov in ne gre v izvoz. | Sporočilo »Lastnosti atributa … so shranjene.« |\r\n| 3 | Urednik | `/nastavitve/atributi` | Zavihek **Prevodi**: vpišeš ime v vsakem jeziku → **Shrani prevode**. | Prazna polja se ne pošljejo (obstoječi prevod ostane). | Sporočilo »Shranjenih prevodov: N«; v seznamu jezikovna oznaka ni več rdeča. Hitri filter »Manjka EN/DE …« pokaže, kaj še manjka. |\r\n| 4 | Urednik | `/nastavitve/atributi/{Code}` | Iz zavihka **Vrednosti** klikneš »Odpri vrednosti in pogostost«. | Samo bralna stran: različne vrednosti, število izdelkov, prevod, vir, ali gre na splet. | — |\r\n| 5 | Urednik | `/nastavitve/nabori-atributov` | Izbereš drevo (svetila, videlektro), poiščeš kategorijo, klikneš **Uredi**. | Odpre se urejevalnik z nabori; podedovane vrstice so označene »podedovan: …«. | Stolpci Obvezni / Priporočeni / Izločeni se po shranjevanju osvežijo. |\r\n| 6 | Urednik | isto | Dodaš atribute: izbereš jih v seznamu, **Raven** in **Dodaj izbrane (N)**; ali **Prilepi seznam** (vrstica »ime;obvezen«) → **Uvozi seznam**; ali **Kopiraj nabor** iz druge kategorije. | Neznana imena ponudi: **Ustvari v registru in dodaj vse** ali **Dodaj samo znane**. Predlogi »Atributi, ki jih izdelki te kategorije že nosijo …« imajo gumbe *priporočen* / *obvezen* / *ustvari v registru in dodaj*. | Sporočilo »V nabor kategorije … je zapisanih N atributov. Validacija jih upošteva ob naslednjem teku.« |\r\n| 7 | Urednik | isto ali `/nastavitve/kategorije` (zavihek Atributi) | Spremeniš raven v izbirniku (obvezen/priporočen/izločen) ali klikneš **Odstrani** / **Izloči tu**. Na `/nastavitve/nabori-atributov` (2026-09-29) tudi več naenkrat: kljukice, »Označi vse«, »Označi brez vrednosti«, nato **Nastavi raven**, **Odstrani iz te kategorije** (lastno izbriše, podedovano ali tudi zgoraj določeno tu izloči) ali **Odstrani pri izvoru …** (izbriše vrstico v kategoriji, kjer je določena, torej za vse njene podkategorije; potrditev pove, koliko izdelkov pod izvorom ima vrednost, in ponudi »samo prazne«). | Podedovanega atributa ni mogoče izbrisati tu, samo izločiti ali odstraniti pri izvoru. | Sporočilo in gumb **Razveljavi** (vrne prejšnje ravni); vsaka vrstica gre v `b2b.AuditLog`. |\r\n| 8 | Avtomatika | — | — | `PRODUCT_VALIDATION` ustvari ali zapre napake: obvezen atribut = napaka v spletnem profilu drevesa, priporočen = opozorilo. | `/kakovost/napake`, `/pravila/validacija` (vrstice »iz nabora atributov«). |\r\n| 8a | Urednik ali komerciala | `/nastavitve/atributi/ciscenje` (gumb **Čiščenje atributov** na registru) | Zavihek **Podvojeni atributi**: pregledaš predloge »Isti podatek« (isti izdelki, ista vrednost), »Podobne vrednosti« (drugi izdelki, iste vrednosti — različni dobavitelji) in »Podobno ime«; filter, iskanje, razvrščanje, **Izvozi v Excel**. Zavihek **Lep zapis vrednosti**: predogled prej/potem predloga zapisa (enote, presledki, velike začetnice). | Samo branje (#15): nič se ne združi, izbriše ali prepiše. Predlog zapisa (`pim.PolishAttributeValue`, 307) ni vklopljen v zajem, validacijo ali katalog.csv. | Seznam parov s številom izdelkov po podjetju in tremi primeri vrednosti; predogled s številom zapisov in vrstic, ki bi se spremenile. |\r\n| 9 | Urednik ali skrbnik | `/nastavitve/atributi` | Brisanje: »Izbriši atribut …« → **Preveri uporabo** → po potrebi kljukica »Izbriši tudi vrednosti pri N izdelkih« → vpišeš `IZBRIŠI` → **Trajno izbriši atribut**. | Odstranijo se vrstice naborov, preslikave virov se deaktivirajo, pari enot razvežejo, zahteve validacije deaktivirajo, prevodi izbrišejo. | Sporočilo »Atribut … je trajno izbrisan …«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Prevedljiva lastnost je v PIM **en** atribut z jezikom sl/en (npr. »Prevladujoča barva«); »… SLO« in »… ANG« sta samo stolpca v katalog.csv. Zajem od 294 cilj preslikave »\u003cime\u003e SLO/ANG« zapiše kot jezik; neprevedena slovenska vrednost iz uvoza ne povozi obstoječega prevoda (295).\r\n- **Enota atributa (301):** atribut ima svojo enoto (polje »Enota«, npr. Dolžina = mm) — to je enota vrednosti v PIM in v glavi katalog.csv (»Dolžina [mm]«). Atribut enote (»Enota dolžine«) ostane samo za lažje preslikave XML: prenos v PIM (val.Promote) vrednost iz vira pretvori v enoto atributa (»5 m« ali 5 + atribut enote »m« -\u003e 5000; mm/cm/m, g/kg, cm3/dm3/l/m3; ista enota -\u003e samo število), vrednost, ki ni število (»do 30m«, »~220-230«), pusti, kot je. Kartica in uvoz pišeta v enoti atributa, atribut enote izdelka se sam poravna. Zapis s piko pred tremi števkami (»1.500 m«) se ne pretvori, ker je dvoumen.\r\n- Koda atributa je po ustvarjanju nespremenljiva — po njej se atribut veže na vire, nabore in izvoz.\r\n- Dvojnik po slovenskem imenu ni dovoljen (isto pravilo kot v bazi, `canon.ResolveAttributeNames`).\r\n- Trajni izbris zahteva vpis `IZBRIŠI`; atributa z vrednostmi ne izbrišeš brez dodatne kljukice. Priporočeno je deaktiviranje namesto brisanja.\r\n- Nabor se deduje na podkategorije; najbližja vrstica zmaga. Kategorija brez nabora: na kartici in v izvozu gredo **vsi** atributi izdelka. Od 291 v katalog.csv gredo vsi atributi tudi pri kategoriji z naborom — nabor izloči samo atribut z ravnijo EXCLUDED (prej je izpadlo vse, kar ni bilo v naboru).\r\n- Pisanje: samo ADMIN in CATALOG_EDITOR (politika `CatalogWrite`, preverjena v storitvi). COMMERCIAL stran vidi.\r\n- **Čiščenje atributov (#15, 2026-09-29):** podvojeni atributi se samo predlagajo; primerja se po imenu, kot je shranjeno pri vrednostih (153 od 164 imen je v registru, ostala so označena »ni v registru«). Spremljevalni atributi »Enota …« niso v primerjavi. Vrednosti 0, 1, 2, da, ne ne štejejo kot ujemanje. Pri »Podobnih vrednostih« čista števila (50, 100, 120) ne štejejo, ker mere pomenijo različno (Premer, Širina, Dolžina). Štejejo samo aktivna podjetja (DEMO ne). Predlog zapisa vrednosti: »50m« → »50 m«, »30 - 50 m« → »30-50 m«, »3CCT,IP65« → »3CCT, IP65«, »toplo bela« → »Toplo bela«; »do 30 m«, »IP44«, »LED«, šifre iz SAOP in povezave ostanejo. Ni vklopljen, ker bi samo za nove uvoze na spletu nastala dva zapisa iste vrednosti.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Ustvari atribut« je siv | Prazno slovensko ime ali ime že obstaja | Uporabi obstoječi atribut (koda je v opozorilu). |\r\n| »Dejanje zahteva eno od vlog …« | Prijavljen kot COMMERCIAL ali VIEWER | Prosi urednika ali skrbnika. |\r\n| Nov obvezen atribut ne ustvari napak | Validacija še ni tekla | Počakaj na `PRODUCT_VALIDATION` ali ga poženi na `/sistem/posel/PRODUCT_VALIDATION`. |\r\n| V katalog.csv manjka atribut | Kategorija ima nabor in atributa ni v njem, ali je atribut izločen/neaktiven | Dodaj ga v nabor kot priporočen. |\r\n| Atribut nima vrednosti pri izdelkih | Ni preslikave vira | Zavihek **Viri** → »Odpri preslikave virov« (`/zajem/atributi`). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `CatalogAttributes.razor`, `CatalogAttributeDetail.razor`, `CategoryAttributeSets.razor`, `CatalogCategories.razor` (zavihek Atributi), razdelilna `CatalogSettings.razor`.\r\n- **Storitve:** `AttributeMappingService` (`canon.CreateAttributeDefinition`, `canon.UpdateAttributeDefinition`, `canon.DeleteAttributeDefinition`, `canon.SaveAttributeTranslations`, `intranet.GetAttributeDefinitions`, `intranet.GetAttributeUsage`), `CategoryTreeService` (`canon.SaveCategoryAttributeSet`, `SaveAttributeSetBulkAsync`, `CopyAttributeSetAsync`, `EnsureAttributeDefinitionAsync`, `intranet.GetCategoryAttributeSetTrees`), `IntranetFeatureReadService.GetAttributeValuesAsync`.\r\n- **Tabele in pogledi:** `canon.AttributeDefinition`, `canon.ProductAttribute` (vrednosti po slovenskem imenu), `canon.CategoryAttributeEffective(...)`, `map.SourceAttribute`, `map.ValueLookup`, `map.MissingTranslation`, `out.ExportColumn`.\r\n- **Migracije:** 147 (nabori), 177 (ustvarjanje iz nabora), 184/185 (bralni model vrednosti), 238 (dodaj/uredi/izbriši), 266/268 (zahteve validacije po vrstici in naboru).\r\n- **Urniki:** `PRODUCT_VALIDATION` (3600 s, sproži ga zajem artiklov), `WEB_CATALOG_EXPORT`.\r\n- **Pravice:** `view.catalog.attributes`, `view.catalog.attribute-sets`; pisanje `PimPolicies.CatalogWrite`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Na `/nastavitve/atributi` je vrstica »Paketne akcije« (izbor več atributov), vendar za izbrane atribute ni nobenega dejanja — samo izbor in »Počisti izbor«. Napis obljublja »Paketni zapis zahteva predogled vpliva«, česar ni.\r\n- ⚠️ Stran za COMMERCIAL prikaže vse gumbe za urejanje in brisanje; zavrnitev pride šele ob kliku (napaka iz storitve).\r\n- ⚠️ Opomba atributa se prebere šele iz pregleda uporabe (`GetUsageAsync`); če ta pade, se polje Opomba prikaže prazno in shranjevanje lahko opombo izbriše (prazno polje pomeni »pobriši«).\r\n- ❓ Odločitev lastnika (#15): kateri predlagani pari podvojenih atributov se združijo, in ali se predlog lepega zapisa vklopi za vse naenkrat (zajem + katalog.csv + obstoječe vrednosti z dnevnikom `pim.AttributeValueNormalizationLog` in povratkom). Do takrat oboje samo predogled.\r\n- ⚠️ Učinek nabora na validacijo ni takojšen — sporočilo to pove, a urednik mora sam sprožiti validacijo, če želi takoj videti rezultat.\r\n\r\n## Povezani procesi\r\n\r\n- [Drevo kategorij](drevo-kategorij.md): nabor je vezan na vozlišče drevesa; isti nabor ureja zavihek Atributi pri kategoriji.\r\n- [Pravila validacije, slovar in preslikave](pravila-validacije-slovar-preslikave.md): kategorijske zahteve validacije nastanejo iz nabora.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): kje vidiš napake zaradi obveznih atributov.\r\n- [Prevodi](../04-kakovost/prevodi.md): manjkajoči prevodi vrednosti atributov.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): kartica prikaže atribute nabora.\r\n- [Uvoz delovnega lista](../03-izdelki/uvoz-delovnega-lista.md): uvoz lahko ustvari nove atribute.\r\n- [Težave in neujemanja zajema](../02-vhodi/tezave-in-neujemanja-zajema.md): preslikava atributov vira (`/zajem/atributi`).\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): izvoz vzame samo atribute iz nabora.\r\n"},{"pot":"08-upravljanje/drevo-kategorij.md","vsebina":"---\r\nid: drevo-kategorij\r\nnaslov: Drevo kategorij in prevodi kategorij\r\npodrocje: 08-upravljanje\r\nstanje: deluje\r\nbere: [pim.kategorije, pim.kategorije-izdelka, pim.nastavitve]\r\npise: [pim.kategorije, pim.prevodi, pim.kategorije-izdelka, pim.nastavitve, pim.pravila]\r\nstrani: [/nastavitve/kategorije, /nastavitve/kanali]\r\nposli: [PRODUCT_VALIDATION, WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogCategories.razor, PIM_Solution/src/PIM.Intranet/Services/CategoryTreeService.cs]\r\nmigracije: [147, 178, 223, 230, 231, 235, 237]\r\n---\r\n\r\n# Drevo kategorij in prevodi kategorij\r\n\r\n\u003e **Področje:** Upravljanje · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nUrednik vzdržuje drevesa kategorij, kakor jih vidi spletna trgovina (svetila, videlektro): doda korensko ali podkategorijo z imeni v vseh jezikih, prevede obstoječe, premakne ali izbriše veje. Rezultat je drevo, po katerem se izdelki uvrščajo in ki gre v spletni izvoz.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Drevo pregleduje (bralni dostop); shranjevanje ji storitev zavrne. |\r\n| Urednik kataloga | Dodaja, prevaja, premika in briše kategorije; ureja nabor atributov kategorije. |\r\n| Skrbnik | Enako kot urednik. |\r\n| Avtomatika (PIM) | Pri premiku posodobi poti in uvrstitve izdelkov; spremembe gredo v izvoz ob naslednjem `WEB_CATALOG_EXPORT`. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** nova skupina izdelkov, manjkajoč prevod kategorije (vrstica »Imena kategorij po jezikih«), preureditev trgovine.\r\n- **Po urniku:** ni lastnega posla; sprememba gre na splet ob naslednjem `WEB_CATALOG_EXPORT` (po uspešni objavi).\r\n- **Ob dogodku:** nepreslikana dobaviteljeva pot kategorije (`/kakovost/kategorije`) pogosto zahteva novo kategorijo tukaj.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Drevo, nadrejena kategorija, imena po jezikih (slovensko obvezno) | uporabnik |\r\n| **Izhod** | Vozlišča drevesa, prevodi imen, poti | PIM (`canon.Category`, prevodi) |\r\n| **Izhod** | Posodobljene uvrstitve izdelkov ob premiku; odstranjene uvrstitve ob brisanju | PIM |\r\n| **Izhod** | Kategorije v katalog.csv | splet (prek izvoza) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B{\"Kaj urejaš?\"}\r\n    B -- nova --\u003e C[\"Dodaj kategorijo: drevo, nadrejena, imena po jezikih\"]\r\n    B -- prevod --\u003e D[\"Klik na ime, vpis imen, Shrani imena\"]\r\n    B -- premik ali izbris --\u003e E[\"Premakni ali Izbriši\"]\r\n    E --\u003e F\u003e\"Predogled vpliva, pri izbrisu vpis IZBRIŠI\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    G{\"Isto ime pod istim staršem?\"}\r\n    H[(\"Drevo kategorij in prevodi\")]\r\n    I[[\"Poti in uvrstitve izdelkov se posodobijo\"]]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    J[(\"katalog.csv ob naslednjem izvozu\")]\r\n  end\r\n  C --\u003e G\r\n  G -- da --\u003e C\r\n  G -- ne --\u003e H\r\n  D --\u003e H\r\n  F --\u003e I\r\n  I --\u003e H\r\n  H --\u003e J\r\n  J --\u003e K([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class C,D,E user; class B,G,I auto; class F wait; class H,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/nastavitve/kategorije` | V filtrih izbereš **Drevo**, **Jezik v ospredju**, po želji podjetje, vejo, nivo; kljukica »Brez imena v …« ali klik na jezik v vrstici pokritosti. | Drevo se prebere v izbranem jeziku; števca pri vozlišču kažeta izdelke v kategoriji in v celi veji. | Vrstica »N od M zapisanih« pri pokritosti prevodov. |\r\n| 2 | Urednik | isto | Odpreš »+ Dodaj kategorijo (korensko ali podkategorijo)«: drevo, **Nadrejena kategorija** (prazno = koren), imena po jezikih (slovensko obvezno) → **Ustvari kategorijo**. Ali v desnem panelu **+ Dodaj podkategorijo**. | Iz slovenskega imena nastaneta koda in pot. Isto ime pod istim staršem ustavi (gumb onemogočen), podobno ime samo opozori. | Nova kategorija je v drevesu; sporočilo o uspehu. |\r\n| 3 | Urednik | isto | Klik na ime vozlišča → vpišeš imena v vseh jezikih → **Shrani imena** (ali v panelu zavihek **Prevodi** → **Shrani prevode**). | Shranijo se prevodi; slovensko ime lahko spremeni prikazano pot. | Števec pokritosti se zmanjša. |\r\n| 4 | Urednik | isto | Premik: v panelu **Premakni** (ali izbereš več vozlišč in **Premakni izbrane**) → izbereš novo nadrejeno ali **Postavi na koren drevesa** → **Potrdi premik**. | Predogled pokaže število vej, kategorij in uvrstitev. Premakne se celo poddrevo; kode, prevodi, nabori in preslikave ostanejo pripeti, poti in uvrstitve izdelkov se posodobijo. | Veja je na novem mestu; pot v panelu je nova. |\r\n| 5 | Urednik | isto | Izbris: **Izbriši** ali **Izbriši izbrane** → pregledaš vpliv → vpišeš `IZBRIŠI` → **Trajno izbriši N**. | Izbrišejo se kategorije s podkategorijami, uvrstitve izdelkov (izdelki ostanejo), preslikave, atributne nastavitve, validacijska in naslovna pravila teh kategorij. | Kategorije ni več; dejanje je v revizijski zgodovini. |\r\n| 6 | Urednik | isto, zavihek **Atributi** / **Uporaba** | Nabor atributov kategorije (glej Atributi in nabori); v zavihku Uporaba povezavi na uvrstitve izdelkov in preslikave kategorij. | — | — |\r\n| 7 | Avtomatika | — | — | Naslednji `WEB_CATALOG_EXPORT` zapiše nove poti in imena v katalog.csv. | Datoteka na `/splet`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Drevo je eno, imena so po jezikih; slovensko ime je obvezno, ker iz njega nastaneta koda in kanonična pot.\r\n- Isto ime pod istim staršem ni dovoljeno.\r\n- Premik in izbris vedno najprej pokažeta predogled vpliva; izbris zahteva vpis `IZBRIŠI` in ga ni mogoče razveljaviti s tega zaslona.\r\n- Skupni premik je dovoljen samo za kategorije istega drevesa.\r\n- Pisanje: ADMIN in CATALOG_EDITOR (politika `CatalogWrite`).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Ustvari kategorijo« je siv | Manjka slovensko ime ali dvojnik pod istim staršem | Vpiši slovensko ime ali uporabi obstoječo kategorijo. |\r\n| »Za skupni premik izberi kategorije istega drevesa« | Izbor iz več dreves | Premikaj po drevesih ločeno. |\r\n| Angleško ime je pristalo kot slovensko | Stara različica obrazca (pred 237) | Popravi imena v zavihku Prevodi. |\r\n| Na spletu je kategorija še stara | Izvoz še ni tekel ali objava je blokirana | `/sistem` → posel »Katalog in stranke za splet«. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `CatalogCategories.razor`; drevesa in kanonično polje po kanalu: `CatalogChannels.razor`.\r\n- **Storitve:** `CategoryTreeService` — `intranet.GetCategoryTree`, `intranet.GetCategoryTranslationCoverage`, `canon.SaveCategory`, `canon.SaveCategoryTranslations`, `canon.GetCategoryChangeImpact`, `canon.MoveCategories`, `canon.DeleteCategories`; izbirnik kategorij je predpomnjen in se po spremembi izprazni.\r\n- **Tabele:** `canon.Category` (+ prevodi po jeziku), uvrstitve izdelkov, `map.CategoryPathMap` (preslikave dobaviteljevih poti, po viru).\r\n- **Migracije:** 178 (dodajanje v intranetu), 223, 230/231 (premik), 235 (prevedena pot), 237 (imena v vseh jezikih ob ustvarjanju).\r\n- **Pravica:** `view.catalog.categories`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Kategorije VID (videlektro) po dogovoru zrcalijo svetila; stran tega ne vsiljuje — urednik mora sam paziti, da sta drevesi usklajeni.\r\n- ⚠️ Brisanje odstrani tudi validacijska in naslovna pravila kategorije brez možnosti povratka; revizija se piše, obnove pa ni.\r\n- ⚠️ Stran se ne osveži sama, ko nekdo drug spremeni drevo (npr. uvoz delovnega lista z novimi kategorijami).\r\n\r\n## Povezani procesi\r\n\r\n- [Atributi in nabori](atributi-in-nabori.md): nabor atributov je vezan na kategorijo.\r\n- [Jeziki, kanali, skladišča, povezave](jeziki-kanali-skladisca-povezave.md): kateri kanal uporablja katero drevo.\r\n- [Spletni nazivi](spletni-nazivi.md): pravila nazivov po kategorijah.\r\n- [Kategorije izdelka](../03-izdelki/kategorije-izdelka.md): uvrščanje izdelkov v drevo.\r\n- [Manjkajoče kategorije](../04-kakovost/manjkajoce-kategorije.md): dobaviteljeve poti brez naše kategorije.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): kategorije v izvozu.\r\n"},{"pot":"08-upravljanje/jeziki-kanali-skladisca-povezave.md","vsebina":"---\r\nid: jeziki-kanali-skladisca-povezave\r\nnaslov: Šifranti kataloga — jeziki, spletni kanali, skladišča in povezave izdelkov\r\npodrocje: 08-upravljanje\r\nstanje: delno\r\nbere: [pim.nastavitve, pim.zaloge, pim.kategorije, pim.atributi, saop.zaloge]\r\npise: []\r\nstrani: [/nastavitve, /nastavitve/jeziki, /nastavitve/kanali, /nastavitve/skladisca, /nastavitve/povezave-izdelkov]\r\nposli: [SAOP_PRODUCT_IMPORT, STOCK_IMPORT, NIGHTLY_RECONCILIATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogSettings.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogLanguages.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogChannels.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogWarehouses.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductLinks.razor, PIM_Solution/src/PIM.Intranet/Services/CatalogReadService.cs, PIM_Solution/src/PIM.Intranet/Services/StockReadService.cs, PIM_Solution/src/PIM.Intranet/Services/ProductLinkReadService.cs]\r\nmigracije: [072, 131, 267]\r\n---\r\n\r\n# Šifranti kataloga — jeziki, spletni kanali, skladišča in povezave izdelkov\r\n\r\n\u003e **Področje:** Upravljanje · **Lastnik:** skrbnik (šifranti), urednik kataloga (pregled) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nŠtiri **samo bralne** strani pod `/nastavitve`, na katerih uporabnik preveri, s čim katalog dela: kateri jeziki obstajajo (iz SAOP), kateri spletni kanal uporablja kateri jezik in drevo, katera skladišča ima podjetje in katera PIM bere v zalogo, ter katere povezave med izdelki (nadomestni, pribor …) je poslal dobavitelj.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda skladišča in zalogo po podjetju, izvozi zalogo skladišča v Excel. |\r\n| Urednik kataloga | Preveri jezike in kanale, preden prevaja ali ureja drevo; pregleda povezave izdelkov. |\r\n| Skrbnik | Ob neujemanju (manjka jezik, skladišče se ne bere) popravi vir: SAOP, profil vira zaloge ali migracijo. |\r\n| Avtomatika (PIM) | Šifranta jezikov in skladišč osvežuje zajem iz SAOP; posnetek zaloge `STOCK_IMPORT`. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** pregled pred prevajanjem, ob vprašanju »zakaj zaloga skladišča X ni v PIM«, ob iskanju pribora ali nadomestnega izdelka.\r\n- **Po urniku:** jeziki in skladišča pridejo iz SAOP ob zajemu (`SAOP_PRODUCT_IMPORT`, šifranti v `NIGHTLY_RECONCILIATION`); zaloga iz `STOCK_IMPORT` (vsakih 10 min).\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Jeziki po podjetju, šifrant skladišč | SAOP (prek zajema) |\r\n| **Vhod** | Register spletnih kanalov (jezik, drevo, kanonično polje) | PIM (`canon.WebSite`, vnese migracija) |\r\n| **Vhod** | Povezave izdelkov iz atributov dobavitelja | dobavitelj (prek zajema) |\r\n| **Izhod** | Pregled na zaslonu; Excel zaloge skladišča (`/izvoz/zaloge.xlsx`) | uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph S[\"🏢 SAOP\"]\r\n    A[(\"Jeziki in skladišča podjetij\")]\r\n    B[(\"Posnetek zaloge\")]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    C[[\"Zajem šifrantov in zaloge\"]]\r\n    D[(\"Register kanalov: jezik, drevo, polje\")]\r\n    E[(\"Povezave iz atributov dobavitelja\")]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    F([Začetek]) --\u003e G[\"Odpre Nastavitve kataloga\"]\r\n    G --\u003e H{\"Kaj preverja?\"}\r\n    H -- jeziki ali kanali --\u003e I[\"Pregled jezikov in kanalov\"]\r\n    H -- skladišča --\u003e J[\"Pregled skladišč, Odpri zalogo, Izvozi Excel\"]\r\n    H -- povezave --\u003e K[\"Filter po vrsti povezave in šifri\"]\r\n    I --\u003e L([Konec])\r\n    J --\u003e L\r\n    K --\u003e L\r\n  end\r\n  A --\u003e C\r\n  B --\u003e C\r\n  C --\u003e I\r\n  C --\u003e J\r\n  D --\u003e I\r\n  E --\u003e K\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class F,L endp; class G,I,J,K user; class C,H auto; class A,B,D,E data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Kdorkoli | `/nastavitve` | Izbereš kartico: Jeziki, Spletni kanali, Skladišča, Povezave izdelkov (ostale kartice: Atributi, Kategorije, Nabori, Rezervacija zaloge). | Kartice brez dovoljenja vloge so skrite ali zaprte. | — |\r\n| 2 | Urednik | `/nastavitve/jeziki` | Pregledaš jezike **izbranega podjetja**: ime, šifra SAOP, koda kataloga, stanje, posodobljeno. | Samo branje iz `canon.Language`. | Jezik, ki ga rabiš za prevod, je »Aktiven«. |\r\n| 3 | Urednik | `/nastavitve/kanali` | Pregledaš kanale: ime, jezik, drevo, kanonično polje, število kategorij, stanje. | Samo branje iz `canon.WebSite`. | Kanal kaže pravo drevo (svetila / videlektro). |\r\n| 4 | Komerciala | `/nastavitve/skladisca` | Iščeš po šifri ali imenu, filtriraš podjetje in prikaz (»Samo z zalogo v PIM«, aktivna, neaktivna). Pri podjetju **Odpri zalogo** ali **Izvozi Excel**. | Za vsako podjetje: katera skladišča PIM bere, povzetek zaloge (artiklov, na zalogi, skupna količina, razpoložljivo, prihaja, negativna, čas posnetka). | Oznaka »Bere se« pri skladišču; čas posnetka je svež. |\r\n| 5 | Urednik | `/nastavitve/povezave-izdelkov` | Izbereš podjetje, vrsto povezave (RELATED, SUBSTITUTE, ACCESSORY, SPARE, NADOMESTNI, SORODNI, DODATEK), vpišeš šifro → **Uporabi filtre**. | Vrstica pokaže izvorni izdelek, vrsto, cilj in ali je šifra cilja v katalogu (»ujeto z izdelkom« / »šifre ni v katalogu«). | Klik na šifro odpre kartico izdelka. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Vse štiri strani so samo bralne; ničesar ne zapišejo. Sprememba jezika ali skladišča gre v SAOP, sprememba kanala v migracijo.\r\n- Kadar podjetje bere več skladišč, SAOP vrne eno vsoto; stran količine **ne** razdeli po skladiščih, ampak napiše »v vsoti N skladišč«.\r\n- Dostop: ADMIN, CATALOG_EDITOR, COMMERCIAL (pravice `view.catalog.languages`, `view.catalog.channels`, `view.catalog.warehouses`, `view.catalog.product-links`).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Za organizacijo ni jezikov« | Izbrano podjetje nima šifranta jezikov ali zajem šifrantov še ni tekel | Preveri nočno uskladitev na `/sistem`. |\r\n| »PIM za to podjetje nima SAOP posnetka zaloge« | `STOCK_IMPORT` za podjetje ne teče ali je podjetje izključeno iz avtomatike | `/sistem` → »Zaloga iz SAOP«, »Podjetja v avtomatiki«. |\r\n| Skladišče »Ne bere se«, čeprav bi moralo | Skladišče ni v profilu vira zaloge (`warehouseIdList`) | Skrbnik popravi profil vira zaloge. |\r\n| Povezave izdelkov so prazne | Dobavitelj ne pošilja atributa vrste povezave | Pričakovano stanje (glej 10). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `CatalogSettings.razor`, `CatalogLanguages.razor`, `CatalogChannels.razor`, `CatalogWarehouses.razor`, `ProductLinks.razor`.\r\n- **Storitve:** `CatalogReadService.GetLanguagesAsync` (`canon.Language`), `GetWebSitesAsync` (`canon.WebSite`), `StockReadService.GetWarehouseStockAsync` (`intranet.GetWarehouseStock`, migracija 267), `ProductLinkReadService` (`intranet.GetProductLinks`, migracija 131).\r\n- **Tabele:** `canon.Language`, `canon.WebSite`, `canon.Warehouse`, zadnji aktivni SAOP posnetek zaloge.\r\n- **Izvoz:** `/izvoz/zaloge.xlsx?podjetje=…\u0026skladisce=…`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Povezave izdelkov: po meritvi 2026-08-28 v katalogu ni nobenega atributa vrste povezave, zato je stran praktično prazna. Variantne skupine, vodilni izdelek in smernost niso narejeni — potrebna je odločitev, ali povezave nastajajo iz dobavitelja, SAOP ali ročno v PIM.\r\n- ⚠️ Kanali in jeziki se ne urejajo v intranetu; nov kanal ali drevo zahteva migracijo (skrbnik/razvoj).\r\n- ⚠️ Zaloga po posameznem skladišču ni na voljo, kadar podjetje bere več skladišč (SAOP vrne vsoto).\r\n- ⚠️ Stran povezav privzeto izbere prvo aktivno podjetje, ne podjetja iz glave aplikacije.\r\n\r\n## Povezani procesi\r\n\r\n- [Drevo kategorij](drevo-kategorij.md): drevo, ki ga uporablja kanal.\r\n- [Zaloge in rezervacija](../07-poslovanje/zaloge-in-rezervacija.md): količine po artiklih in stran `/nastavitve/rezervacija-zaloge`.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): od tam pridejo jeziki, skladišča in zaloga.\r\n- [Prevodi](../04-kakovost/prevodi.md): jeziki, v katere se prevaja.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posli, ki osvežujejo šifrante in zalogo.\r\n"},{"pot":"08-upravljanje/pravila-validacije-slovar-preslikave.md","vsebina":"---\r\nid: pravila-validacije-slovar-preslikave\r\nnaslov: Pravila validacije, slovar vrednosti in preslikave polj\r\npodrocje: 08-upravljanje\r\nstanje: delno\r\nbere: [pim.pravila, pim.nastavitve, pim.validacija, pim.surovi-zajem]\r\npise: [pim.pravila, pim.validacija]\r\nstrani: [/pravila, /pravila/validacija, /pravila/slovar, /pravila/preslikave]\r\nposli: [PRODUCT_VALIDATION, PRODUCT_PUBLICATION, SUPPLIER_CATALOG_IMPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Rules.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ValidationRules.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ValueDictionary.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/FieldMappings.razor, PIM_Solution/src/PIM.Intranet/Services/RulesWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/GovernanceReadService.cs, PIM_Solution/src/PIM.Intranet/Services/QualityFieldPolicy.cs, PIM_Solution/src/PIM.Intranet/Services/ValidationLayer.cs, PIM_Solution/src/PIM.XmlMapping/SqlMappingPipeline.cs]\r\nmigracije: [049, 133, 236, 249, 266, 268, 291, 307]\r\n---\r\n\r\n# Pravila validacije, slovar vrednosti in preslikave polj\r\n\r\n\u003e **Področje:** Upravljanje · **Lastnik:** urednik kataloga (validacija, slovar), skrbnik (preslikave) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nNa `/pravila` uporabnik določi, kako podatek pride v PIM (preslikava elementa vira v polje), kako se poenoti (slovar vrednosti in prevodov) in kaj mora artikel imeti, da gre naprej (validacijski profili: napaka ustavi, opozorilo ne). Rezultat so pravila, po katerih tečeta zajem in validacija.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Sme dodajati in spreminjati zahteve validacije, vrstice slovarja in preslikave (politika `BusinessWrite`). |\r\n| Urednik kataloga | Glavni urednik zahtev validacije in slovarja. |\r\n| Skrbnik | Preslikave polj vira (tehnično najbolj občutljivo), vklop umaknjenih zahtev. |\r\n| Avtomatika (PIM) | Po shranjeni zahtevi takoj ponovno validira; slovar in preslikave uporabi ob naslednji obdelavi vira. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** artikel je neupravičeno blokiran ali gre skozi brez podatka; vrednost iz vira je napačna ali neprevedena; podatek pristane v napačnem polju.\r\n- **Po urniku:** zahteve upošteva vsak `PRODUCT_VALIDATION`; slovar in preslikave vsak zajem (npr. `SUPPLIER_CATALOG_IMPORT`, nočna uskladitev).\r\n- **Ob dogodku:** shranitev zahteve na `/pravila/validacija` sama sproži celotno validacijo.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Profil, polje, resnost (Napaka/Opozorilo) | uporabnik |\r\n| **Vhod** | Domena, izvorna vrednost, jezik, ciljna vrednost | uporabnik |\r\n| **Vhod** | Vir, vrsta podatka, element v viru, ciljno polje, »obvezno pri zajemu« | uporabnik |\r\n| **Izhod** | Zahteve validacije, odprte/zaprte napake artiklov | PIM (`val.*`) |\r\n| **Izhod** | Vrstice slovarja, preslikave polj | PIM (`map.ValueLookup`, `map.FieldMapping`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B{\"Kaj je narobe?\"}\r\n    B -- napačno polje --\u003e C[\"Preslikave: Dodaj preslikavo ali Uredi\"]\r\n    B -- napačna vrednost ali prevod --\u003e D[\"Slovar: Dodaj v slovar\"]\r\n    B -- blokada ali manjkajoč podatek --\u003e E[\"Validacija: Dodaj in preveri artikle, Napaka ali Opozorilo, Umakni\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[(\"Preslikave in slovar\")]\r\n    G[[\"Naslednji zajem vira\"]]\r\n    H[(\"Zahteve validacije\")]\r\n    I[[\"Takojšnja validacija vseh podjetij\"]]\r\n    J[(\"Napake artiklov in pripravljenost\")]\r\n  end\r\n  C --\u003e F\r\n  D --\u003e F\r\n  F --\u003e G\r\n  G --\u003e J\r\n  E --\u003e H\r\n  H --\u003e I\r\n  I --\u003e J\r\n  J --\u003e K([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class C,D,E user; class B,G,I auto; class F,H,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Kdorkoli | `/pravila` | Izbereš težavo (1–5): napačno polje, vrednost/prevod, blokada, spletni naziv, popust. | Stran te odpre na pravem registru. Vrstni red preverjanja: izvor → preslikava → slovar → validacija → izhod. | — |\r\n| 2 | Urednik | `/pravila/validacija` | V »Dodaj obvezno polje« izbereš **1. Profil**, **2. Polje** (neznano kodo sprejme z »Uporabi kodo«), **3. Ko polje manjka** (Napaka/Opozorilo) → **Dodaj in preveri artikle**. | Zahteva se shrani, nato teče celotna validacija (`val.RunValidation`). Neznano polje se shrani kot umaknjeno in ne ustavi ničesar. | Sporočilo »Dodano: … Artikli so ponovno preverjeni.«; števca veljavnih/neveljavnih pri profilu. |\r\n| 3 | Urednik | isto | Pri vrstici preklopiš **Napaka** / **Opozorilo** ali klikneš **Umakni**; umaknjeno zahtevo spet vključiš z **Vklopi** v razdelku »Zahteve, ki čakajo na polje ali so umaknjene«. | Po vsaki spremembi spet teče celotna validacija; umik zapre odprte težave te zahteve. Zahteva se nikoli ne briše. | Sporočilo o spremembi; število »Odprtih težav« v vrstici (klik vodi na seznam napak). |\r\n| 4 | Urednik | isto | Filtri po profilu, resnosti, obsegu (vsi artikli profila / po kategorijah) in iskanje; **Izvozi Excel** (list na nivo). | Kategorijske vrstice nastanejo iz nabora atributov; povezava »iz nabora atributov« vodi na nabor. | — |\r\n| 5 | Urednik | `/pravila/slovar` | »Dodaj vrednost ali prevod«: **Domena** (`*` ali koda lastnosti), **Vrednost iz vira**, **Jezik**, **Ciljna vrednost**, opomba → **Dodaj v slovar**. Obstoječo vrstico **Uredi** → **Shrani** (lahko tudi deaktiviraš). | Vrstica velja za vsa podjetja; ožja domena ima prednost pred `*`. Uporabi se pri naslednjem zajemu XML vira in pri prevodih v izvozu. Gumb ni odvisen od odziva strežnika: klik vedno sproži preverjanje, manjkajoče polje javi sporočilo (en klik shrani). Sporočilo po urejanju vrstice se pokaže ob tabeli. Iskanje, domena, stanje in stran so v URL-ju (`isci`, `domena`, `stanje`, `od`); jezikovni filter na `/kakovost/prevodi` je v `jezik`. Sporočilo po shranjevanju pove, kdaj vrstica učinkuje: prevod ob naslednjem zajemu ali ponovni obdelavi vira, ENOTNO tudi ob naslednji izdelavi katalog.csv; vrednosti, ki so že v PIM, se ne prepišejo takoj. | Povzetek »Vseh vnosov / Aktivnih«; `/kakovost/prevodi` pokaže manj manjkajočih prevodov po naslednji obdelavi. |\r\n| 6 | Skrbnik | `/pravila/preslikave` | »Dodaj novo preslikavo«: **Vir**, **Vrsta podatka**, **Element v viru**, **Ciljno polje v PIM**, kljukica »Brez elementa zavrni vhodni zapis« → **Dodaj preslikavo**. Obstoječo **Uredi** → **Shrani**. | Preslikava velja za izbrano podjetje in vir, pri naslednji obdelavi vira. Obvezna preslikava pošlje zapis brez elementa v karanteno. | Sporočilo »Preslikava … je dodana in velja pri naslednjem zajemu«; `/zajem/neujemanja`. |\r\n| 7 | Avtomatika | — | — | `PRODUCT_VALIDATION` in `PRODUCT_PUBLICATION` uporabita nove zahteve; zajem uporabi preslikave in slovar. | `/kakovost/napake`, `/sistem`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Napaka ustavi izhod samo, če profil ustavlja (ERP in/ali splet); opozorilo nikoli ne ustavi. Opis učinka je izpisan pri vsakem profilu.\r\n- Zahteve se ne brišejo (odprte napake kažejo nanje), samo umaknejo.\r\n- Kategorijske zahteve urejaš prek nabora atributov; sprememba resnosti tu popravi tudi nabor (266).\r\n- Slovar je skupen za vsa podjetja; revizija z `OrganizationId` 0.\r\n- Jezik **ENOTNO** (291) ni prevod, ampak poenotenje zapisa iste vrednosti (domena = slovensko ime lastnosti). Uporabi ga `pim.NormalizeAttributeValue` ob vsakem zajemu (`map.ApplyValueTransforms`) in v katalog.csv; napetost, frekvenca, presledki in decimalna vejica so poenoteni že v pravilu, v slovar gredo samo izjeme. Predlog lepšega zapisa (307, `pim.PolishAttributeValue`: enote, razpon, vejica, velika začetnica) uporablja isti slovar ENOTNO, a je zaenkrat samo predogled na `/nastavitve/atributi/ciscenje?pogled=zapis`.\r\n- Vse tri strani pišejo revizijo v `b2b.AuditLog`. Pisanje: ADMIN, CATALOG_EDITOR, COMMERCIAL (`BusinessWrite`).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Po »Dodaj in preveri artikle« dolgo čakanje, nato napaka | Celotna validacija traja predolgo (časovna meja 10 min) | Zahteva je najverjetneje že shranjena — osveži stran in preveri; validacija bo tekla ob naslednjem `PRODUCT_VALIDATION`. |\r\n| »Polje … PIM-u še ni znano« | Koda polja ne obstaja v `canon.FieldValue` | Preveri ime polja; zahteva ostane umaknjena, dokler podatki polja ne prinesejo. |\r\n| Slovar ne učinkuje | Vir še ni bil ponovno obdelan | Počakaj na naslednji zajem ali »Ponovno preslikaj vir« pri uvozu novih artiklov. |\r\n| Preslikava ne učinkuje | Napačno podjetje (stran je vezana na izbrano podjetje) ali vir še ni bil obdelan | Preveri izbiro podjetja v glavi; ponovno obdelaj vir. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `Rules.razor` (razdelilna), `ValidationRules.razor`, `ValueDictionary.razor`, `FieldMappings.razor`; zavihki `RulesTabs` vključujejo še `/pravila/nazivi` in `/pravila-popustov`.\r\n- **Storitve:** `RulesWriteService.SaveRequirementAsync` (`intranet.SaveFieldRequirement`, nato `val.RunValidation` brez podjetja, `CommandTimeout = 600`), `SaveMappingAsync` (`intranet.SaveFieldMapping`), `SaveValueLookupAsync` (neposreden SQL na `map.ValueLookup` + revizija); branje `GovernanceReadService`.\r\n- **Kje se slovar uporabi:** `PIM.XmlMapping/SqlMappingPipeline.cs` (pretvorbe `map.FieldTransform` in `map.ValueLookup` med izluščanjem XML), izvoz prevodov (216).\r\n- **Tabele:** `val.ValidationProfile`, `val.FieldRequirement`, `map.FieldMapping` (po `SourceConnectorId` = podjetje + vir), `map.ValueLookup`, `b2b.AuditLog`.\r\n- **Izvoz:** `/izvoz/validacijski-profili.xlsx`.\r\n- **Migracije:** 049 (slovar), 133 (urejanje pravil), 236 (pripravljenost zahteva svežo validacijo), 249 (pravila po Excelu, potrditev skrbnika), 266, 268.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Vsaka sprememba zahteve požene **celotno** validacijo vseh podjetij na isti povezavi s časovno mejo 600 s. Izmerjeno (2026-09-22) samo podjetje 2 traja ~11 min, zato lahko klic pade s časovno napako, čeprav je zahteva že shranjena; stran takrat pokaže »Zahteve ni bilo mogoče shraniti« — zavajajoče.\r\n- ⚠️ Komerciala sme spreminjati validacijske zahteve in preslikave polj (`BusinessWrite`), čeprav hub `/nastavitve` pravi, da ima komerciala bralni dostop. Preveriti, ali je to namen.\r\n- ⚠️ Preslikave polj so na strani vezane na izbrano podjetje (vir + podjetje), preslikave kategorij in atributov pa so po viru (244). Uporabnik lahko pričakuje isto obnašanje.\r\n- ⚠️ Stran preslikav pravi »Shrani in ponovno zajemi«, vendar na strani ni gumba za ponovno obdelavo vira.\r\n\r\n## Povezani procesi\r\n\r\n- [Atributi in nabori](atributi-in-nabori.md): kategorijske zahteve iz nabora.\r\n- [Spletni nazivi](spletni-nazivi.md): četrti zavihek pravil.\r\n- [Popusti](../07-poslovanje/popusti.md): peti zavihek (`/pravila-popustov`).\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): kje se vidijo napake.\r\n- [Karantena](../04-kakovost/karantena.md): zapisi, ki jih obvezna preslikava zavrne.\r\n- [Prevodi](../04-kakovost/prevodi.md): manjkajoči prevodi po slovarju.\r\n- [Težave in neujemanja zajema](../02-vhodi/tezave-in-neujemanja-zajema.md): neprepoznane vrednosti in elementi.\r\n- [Novi artikli dobaviteljev](../02-vhodi/novi-artikli-dobaviteljev.md): »Ponovno preslikaj vir« po popravku preslikave.\r\n"},{"pot":"08-upravljanje/spletni-nazivi.md","vsebina":"---\r\nid: spletni-nazivi\r\nnaslov: Pravila za spletne nazive izdelkov\r\npodrocje: 08-upravljanje\r\nstanje: deluje\r\nbere: [pim.izdelek, pim.atributi, pim.kategorije, pim.kategorije-izdelka, pim.pravila, pim.prevodi]\r\npise: [pim.pravila, pim.besedila, pim.validacija]\r\nstrani: [/pravila/nazivi]\r\nposli: [WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/TitleRules.razor, PIM_Solution/src/PIM.Intranet/Services/TitleRuleService.cs, PIM_Solution/src/PIM.Intranet/Services/TitleTemplateBuilder.cs]\r\nmigracije: [072, 149]\r\n---\r\n\r\n# Pravila za spletne nazive izdelkov\r\n\r\n\u003e **Področje:** Upravljanje · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nUrednik sestavi pravilo, iz česa nastane spletni naziv izdelka (ERP naziv, proizvajalec, šifra, kategorija, atributi z enoto), ga preveri na predogledu pravih izdelkov in nato nazive zapiše — privzeto samo tam, kjer spletnega naziva še ni. Rezultat so enotni spletni nazivi v vseh jezikih.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Nima dostopa (stran je samo za ADMIN in CATALOG_EDITOR). |\r\n| Urednik kataloga | Sestavi in shrani pravilo, pregleda predogled, zapiše nazive. |\r\n| Skrbnik | Enako kot urednik. |\r\n| Avtomatika (PIM) | Po zapisu ponovi validacijo podjetja; nazivi gredo v katalog.csv ob naslednjem izvozu. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** nova kategorija ali skupina izdelkov, novi izdelki brez spletnega naziva, sprememba sloga nazivov.\r\n- **Po urniku:** ni; zapis je vedno ročen. Nazivi gredo na splet ob naslednjem `WEB_CATALOG_EXPORT`.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Koda in ime pravila, drevo in kategorija (obseg), vrstni red, jezik, sestavni deli | uporabnik |\r\n| **Vhod** | ERP naziv, proizvajalec, šifra, kategorija, vrednosti atributov, slovar prevodov | PIM |\r\n| **Izhod** | Pravila nazivov | PIM (pravila) |\r\n| **Izhod** | Spletni nazivi izdelkov v izbranem jeziku (z zgodovino na kartici) | PIM → katalog.csv |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[\"Izbere pravilo ali Novo pravilo\"]\r\n    B --\u003e C[\"Obseg: drevo, kategorija, jezik, vrstni red\"]\r\n    C --\u003e D[\"Sestavni deli: ERP naziv, proizvajalec, kategorija, atributi\"]\r\n    D --\u003e E[\"Shrani pravilo\"]\r\n    E --\u003e F{\"Predogled je pravilen?\"}\r\n    F -- ne --\u003e D\r\n    F -- da --\u003e G[\"Shrani pravilo in zapiši nazive\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    H[[\"Sestava nazivov, samo manjkajoči ali tudi prepis\"]]\r\n    I[(\"Spletni nazivi izdelkov\")]\r\n    J[[\"Ponovna validacija podjetja\"]]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    K[(\"katalog.csv ob naslednjem izvozu\")]\r\n  end\r\n  G --\u003e H\r\n  H --\u003e I\r\n  I --\u003e J\r\n  I --\u003e K\r\n  K --\u003e L([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,L endp; class B,C,D,E,G user; class F,H,J auto; class I,K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/pravila/nazivi` | V »Pravilo za urejanje« izbereš obstoječe pravilo ali **Novo pravilo**. | Aktivno pravilo z najvišjo prednostjo se odpre samodejno. | V naslovu urejevalnika piše »Pravilo KODA«. |\r\n| 2 | Urednik | isto | Vpišeš **Kodo pravila** (po shranjevanju nespremenljiva), **Ime**, **Drevo**, **Kategorijo** (prazno = privzeto za drevo), **Vrstni red**; po potrebi v »Jezik …« omejiš jezik. | Brez omejitve jezika en izbor velja za vse jezike; vrednosti atributov in ime kategorije se prevedejo iz slovarja. | — |\r\n| 3 | Urednik | isto | »+ Dodaj sestavni del«: **ERP naziv**, **Trenutni spletni naziv**, **Šifra artikla**, **Proizvajalec**, **Kategorija**, atribut; ali hitra predloga **ERP naziv + kategorija** / **ERP naziv + proizvajalec**. Vrstni red z ▲ ▼, odstrani z ×. | Stran sama sestavi predlogo; surova predloga je vidna le v »Napredno«. | Predogled se osveži ob vsaki spremembi. |\r\n| 4 | Urednik | isto | **Shrani pravilo**. | Pravilo se shrani; nazivi se še ne spremenijo. | Sporočilo »Pravilo … je shranjeno. Nazivi se ne spremenijo, dokler jih ne zapišeš spodaj.« |\r\n| 5 | Urednik | isto, razdelek Predogled | Izbereš podjetje in jezik, kljukica »Samo izdelki brez spletnega naziva v tem jeziku«; **Osveži predogled**. | Vzorec 25 izdelkov: šifra, ERP naziv, trenutni naziv, sestavljeni naziv. | Sestavljeni nazivi so pravilni. |\r\n| 6 | Urednik | isto | **Shrani pravilo in zapiši nazive** (samo manjkajoče ali tudi prepis obstoječih). | Pravilo se najprej shrani (predogled in zapis sta enaka), nato se nazivi zapišejo v izbranem jeziku, sledi validacija podjetja. | Sporočilo »Zapisanih nazivov (jezik): N od M kandidatov …«; zgodovina na kartici izdelka. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Privzeto se dopolnijo samo manjkajoči nazivi; prepis obstoječih je izrecna izbira (odkljukaš kljukico).\r\n- Zapis je mogoč samo za shranjeno in aktivno pravilo z vsebino.\r\n- Zapis velja za en jezik naenkrat (jezik predogleda).\r\n- Dostop: stran ima `[Authorize(Roles = \"ADMIN,CATALOG_EDITOR\")]`; pravica `view.rules.titles`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Predogled je prazen« | Pravilo ne doseže nobenega izdelka ali vsi že imajo naziv | Razširi obseg ali odkljukaj »Samo izdelki brez spletnega naziva«. |\r\n| V nazivu je angleška vrednost | Ni prevoda v slovarju | Dodaj prevod na `/pravila/slovar`. |\r\n| Zapis traja dolgo ali pade | Validacija celega podjetja po zapisu (meja 10 min) | Počakaj; preveri število zapisanih na kartici izdelka ali ponovno. |\r\n| Gumb za zapis je siv | Pravilo ni shranjeno, ni aktivno ali je prazno | Shrani pravilo in preveri kljukico Aktivno. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Stran:** `TitleRules.razor`; sestava predloge `TitleTemplateBuilder.cs` (za `pim.ComposeTitle`).\r\n- **Storitev:** `TitleRuleService` — `intranet.GetTitleRules`, `pim.SaveTitleRule`, `pim.PreviewTitleRules`, `pim.ApplyTitleRules` (`CommandTimeout = 600`, vrne Written/Candidates).\r\n- **Migracije:** 072 (nazivi po jezikih), 149 (pravila nazivov).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ `TitleRuleService` ne preverja vloge na zapisovalni poti (ni `PimWriteGuard`); varuje samo `[Authorize]` na strani. Druge zapisovalne storitve vlogo preverjajo.\r\n- ⚠️ Zapis v vse jezike zahteva ponovitev koraka 6 za vsak jezik posebej.\r\n\r\n## Povezani procesi\r\n\r\n- [Pravila validacije, slovar in preslikave](pravila-validacije-slovar-preslikave.md): prevodi vrednosti v nazivu prihajajo iz slovarja.\r\n- [Atributi in nabori](atributi-in-nabori.md): atributi, ki jih lahko vstaviš v naziv.\r\n- [Drevo kategorij](drevo-kategorij.md): obseg pravila po drevesu in kategoriji.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): zgodovina naziva na kartici.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): nazivi v izvozu.\r\n"},{"pot":"09-administracija/avtomatika-in-urniki.md","vsebina":"---\r\nid: avtomatika-in-urniki\r\nnaslov: Avtomatika in urniki poslov (gostitelj avtomatike, Windows opravila)\r\npodrocje: 09-administracija\r\nstanje: delno\r\nbere: [pim.urniki, saop.artikli, saop.cene, saop.zaloge, dobavitelj.xml, pim.validacija]\r\npise: [pim.urniki, pim.surovi-zajem, pim.izdelek, pim.cene, pim.zaloge, pim.validacija, splet.katalog-csv, splet.stranke-csv, splet.magento, obvestila]\r\nstrani: [/sistem, /sistem/posel/{JobKey}]\r\nposli: [SAOP_PRODUCT_IMPORT, SUPPLIER_CATALOG_IMPORT, SAOP_ORDER_IMPORT, STOCK_IMPORT, PRICE_IMPORT, SAOP_DELIVERY_IMPORT, SUPPLIER_STOCK_IMPORT, PRODUCT_VALIDATION, PRODUCT_PUBLICATION, WEB_CATALOG_EXPORT, WEB_STOCK_EXPORT, ALERT_EVALUATION, ALERT_DELIVERY, NIGHTLY_RECONCILIATION, STOCK_REPLENISHMENT_DIGEST, SYSTEM_SELF_TEST, SAOP_OUTBOUND_DISPATCH]\r\nkoda: [PIM_Solution/src/PIM.Automation/*.cs, PIM_Solution/src/PIM.Automation/JobQueue.cs, PIM_Solution/workers/PIM.AutomationHost/*.cs, PIM_Solution/deploy/Install-AutomationHost.ps1, PIM_Solution/deploy/Configure-ScheduledTasks.ps1, PIM_Solution/deploy/Configure-WorkerScheduledTasks.ps1, scripts/Namesti-opravila.ps1, scripts/Namesti-nadzor-avtomatike.ps1, scripts/Katalog-cikel.ps1, scripts/Zaloga-cikel.ps1, scripts/Magento-cikel.ps1, scripts/Nadzor.ps1, scripts/Nocno-vse.ps1, scripts/Sql.ps1, scripts/Tiho.vbs, PIM_Solution/src/PIM.Intranet/Services/MonitorService.cs]\r\nmigracije: [118, 221, 237, 246, 247, 254, 255, 256, 259, 260, 261, 276]\r\n---\r\n\r\n# Avtomatika in urniki poslov\r\n\r\n\u003e **Področje:** Administracija · **Lastnik:** skrbnik (ADMIN) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-29, iz kode\r\n\r\n## 1. Namen\r\n\r\nAvtomatika po urniku prinaša podatke v PIM (SAOP, dobavitelji), validira in objavlja katalog ter pripravi datoteke za splet in obvestila. V kodi je en sam motor — **gostitelj avtomatike** (`PIM.AutomationHost`); v praksi pa lahko na istih podatkih še vedno tečejo stara Windows opravila. Ta dokument opiše oba in kako ugotoviš, kateri dejansko teče.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ni udeležena (vidi rezultat: sveže cene, zaloga, datoteke). |\r\n| Urednik kataloga | Ni udeležen (vidi rezultat: validacija, objava, katalog.csv). |\r\n| Skrbnik | Namesti in zažene gostitelja, spreminja urnike, vklaplja/izklaplja posle in podjetja, odstrani stara opravila. |\r\n| Avtomatika (PIM) | Gostitelj drži zakup v bazi, vsakih 15 s preveri, kaj je na vrsti, požene korake z workerji, zapiše teke, faze in alarme. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Po urniku (gostitelj, privzeto iz kode):**\r\n\r\n| Posel | Kaj naredi | Ritem | Privzeto |\r\n|---|---|---|---|\r\n| `SAOP_PRODUCT_IMPORT` | Artikli iz SAOP (8 točk, podjetje po podjetje) | vsako uro | vklopljen |\r\n| `SUPPLIER_CATALOG_IMPORT` | Katalog dobaviteljev NW/BT (XML); ne kliče SAOP, zato izven pasu SAOP | vsakih 6 h | vklopljen |\r\n| `SAOP_ORDER_IMPORT` | Naročila kupcev in dobaviteljem | vsako uro | vklopljen |\r\n| `STOCK_IMPORT` | Zaloga iz SAOP; uspeh sproži `WEB_STOCK_EXPORT` | vsakih 10 min | vklopljen |\r\n| `PRICE_IMPORT` | Cene iz SAOP (GetPrices) | vsakih 10 min | vklopljen |\r\n| `SAOP_DELIVERY_IMPORT` | Datumi dobave (en klic na artikel, ~50 min) | vsake 3 h | izklopljen (ročno) |\r\n| `SUPPLIER_STOCK_IMPORT` | Zaloga NW (FTP) in BT (HTTPS) | vsakih 30 min | vklopljen |\r\n| `PRODUCT_VALIDATION` | Validacija vseh podjetij + samodejni umik s spleta; sproži jo uspešen zajem artiklov | vsako uro | vklopljen |\r\n| `PRODUCT_PUBLICATION` | Objava veljavnih artiklov; samo po uspešni validaciji, mlajši od 2 h | vsako uro | vklopljen |\r\n| `WEB_CATALOG_EXPORT` | katalog.csv in stranke.csv (podjetje 2); samo po uspešni objavi, sproži ga objava | vsako uro | vklopljen |\r\n| `WEB_STOCK_EXPORT` | magento-stock-prices.csv po podjetjih | vsakih 30 min | izklopljen (272) |\r\n| `ALERT_EVALUATION` / `ALERT_DELIVERY` | Nadzornik zastalih obdelav / razpošiljanje alarmov | vsakih 5 min | vklopljen |\r\n| `NIGHTLY_RECONCILIATION` | Poln kontrolni pregled vseh vhodov, nato validacija in objava | vsak dan ob 00:30 | vklopljen |\r\n| `STOCK_REPLENISHMENT_DIGEST` | Dnevni mail »Zaloga pod MID« | vsak dan ob 05:30 | vklopljen |\r\n| `SYSTEM_SELF_TEST` | Nočni samotest | vsak dan ob 04:30 | izklopljen |\r\n| `SAOP_OUTBOUND_DISPATCH` | Pošiljanje odhodne vrste v SAOP | vsakih 5 min | izklopljen (ročna odločitev) |\r\n\r\n- **Po urniku (stara Windows opravila, če so registrirana):** »PIM nocni tok« 02:30, »PIM zaloga« 5 min, »PIM katalog« 1 h, »PIM magento« 15 min, »PIM nadzor« 5 min (`scripts/Namesti-opravila.ps1`) ter `PIM-SaopKatalog`, `PIM-SaopStockWorker`, `PIM-MagentoProducts` … (`deploy/Configure-WorkerScheduledTasks.ps1`). ⚠️\r\n- **Ročno:** skrbnik na `/sistem` ali `/sistem/posel/{JobKey}` klikne **Poženi zdaj**; ročna zahteva ima v pasu SAOP prednost pred rednimi posli.\r\n- **Ob dogodku:** uspeh predhodnika sproži naslednika (zajem artiklov → validacija → objava → katalog za splet; zaloga → cene in zaloga za splet).\r\n\r\n### Prednosti, teža poslov in ocena časa (naloga #12, 2026-09-29)\r\n\r\nKo je posel
