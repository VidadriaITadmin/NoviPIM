stolpec »Spletne strani« je izpolnjen (prazen = odjava). |\r\n| 9 | Komerciala | `/splet` | Klikneš **Prenesi izdelano datoteko** ali **Prenesi za Excel**. | Prenese se ista datoteka; različica za Excel ima pravilne šumnike in decimalke. | Datoteka se odpre v Excelu s pravilnimi stolpci. |\r\n| 10 | Urednik | `/splet` → »Kaj gre na splet« | Pogledaš tabelo po podjetjih iz `out.CatalogSource` (IQ Lighting, Vidadria): vrstica »V katalog.csv (zdaj)« in razlogi; klik na število odpre `/kakovost/artikli?podjetje=N\u0026stanje=…`. | Izračun `intranet.GetWebExportSummary` po podjetju, v ozadju, predpomnjen 3 minute (»Osveži« ga izračuna znova). | Vsota podjetij je večja od vrstic datoteke, ker je ista šifra v datoteki enkrat (29. 9.: IQ 2.682 + ViD 2.432, datoteka 2.894). |\r\n| 11 | Komerciala / urednik | `/varovalke` | Če je artikel zadržan, ga pregledaš in potrdiš (ali popraviš vzrok, npr. ceno v SAOP). | Potrditev velja 14 dni in zahteva nov zagon izvoza; popravljen artikel gre ven sam ob naslednjem izvozu. | Na `/splet` pasica ne kaže več čakanja; artikel je v datoteki. |\r\n| 12 | Skrbnik | `/splet` ali `/sistem/posel/WEB_CATALOG_EXPORT` | Po potrebi klikneš **Izdelaj zdaj** → **Da, izdelaj**. | Zahteva gre gostitelju avtomatike (`MonitorService.RequestRunAsync`, samo ADMIN); isti tek kot po urniku. Če posel že teče, stran to pove. | Sporočilo »Zahteva za izdelavo je oddana …«, stavek »Zahteva za izdelavo čaka od …«; po nekaj minutah nov zapis v zgodovini. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- En par datotek, samo za podjetje 2 (IQLighting); nikoli po podjetju. Vidadria prispeva samo ceno B2B in zalogo.\r\n- Artikel na splet samo, če je aktiven + kljukica spletišča + kategorija na tem spletišču + objavljen in veljaven za splet + brez zadržka + ni izključen. Kljukica sama ni dovolj.\r\n- »Spletne strani« vsebuje samo spletišča, kamor artikel res gre (`svetila`, `videlektro` ali `svetila|videlektro`). Prazno polje Magento razume kot umik.\r\n- Odjavna vrstica: artikel, ki je bil objavljen, ostane v datoteki s prazno »Spletne strani« še 14 dni (nastavljivo na `/splet/umaknjeni`); artikel, ki ni bil nikoli na spletu, v datoteko ne gre.\r\n- Atributi (291): gredo **vsi** atributi izdelka s stolpcem; nabor po kategoriji izloči samo atribut z ravnijo EXCLUDED. Vrednost gre skozi `pim.NormalizeAttributeValue` — Napetost vedno `~220-230` (izmenična) oz. `DC 24` (enosmerna), Frekvenca `50/60`, brez dvojnih presledkov, decimalna pika; izjeme v slovarju (`/pravila/slovar`, jezik ENOTNO).\r\n- Kategorije (291): v stolpce kategorij gre samo pot, ki obstaja v drevesu v jeziku spletišča (`canon.WebSiteCategoryPath`); ostanek stare preslikave ne pride v Magento.\r\n- Stranka gre v `stranke.csv`, če je aktivna in ima B2B profil; tip stranke ni pogoj (brez tipa gre s prazno Magento skupino).\r\n- Par se zamenja skupaj — nikoli nov katalog ob stari datoteki strank. Neuspešen tek pusti prejšnji veljavni par.\r\n- Varovalka (277) zadrži samo sumljive artikle; zadržan artikel ostane na spletu s prejšnjimi podatki, nov artikel ne pride na splet.\r\n- Posel ne validira; bere samo objavljeno stanje. Cene in zaloga se berejo sproti (ne čakajo objave).\r\n- **Pakirno naročanje (302):** stolpec 28 »Pakirno naročanje« (prej prazen »Omejitev pri naročanju«) = 1/0 iz oznake artikla `PAKIRNO_NAROCANJE` (303; prej DA/NE); brez oznake 0. 1 pomeni, da Magento prodaja samo po celih paketih po »Pakirni količini« (Pakiranje 2). Artikel z 1 brez objavljenega Pakiranja 2 (\u003e 1) v datoteko ne gre (zadržek »pravilo 302«, na kartici »samodejni (pravilo Pakirno naročanje)« z razlogom): dokler Pakiranje 2 ni vpisano ali dokler vpisano še ni objavljeno v PIM (306).\r\n- »Popust na artikel« pri oznakah X in O gre ven samo ob sveži (do 30 min) pozitivni lastni zalogi, sicer 0.\r\n- Stran `/splet` vidijo vloge z dovoljenjem `page.web`; potrditi na `/varovalke` smejo ADMIN, CATALOG_EDITOR in COMMERCIAL.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Izhodne mape ni mogoče določiti« ali »zapis … NI mogoč« | `EXPORT_ROOT` ni nastavljen ali račun nima pravic | Skrbnik: `scripts\\Nastavi-pravice-izvozne-mape.ps1` kot skrbnik ali drugo mapo na `/sistem/mape`. |\r\n| Zadnji poskus »Napaka« z besedilom »Izhodna mapa … ni zapisljiva za račun …« | Račun Windows naloge ali bazena IIS nima pravice spreminjanja | Isto kot zgoraj; prejšnji par ostane veljaven. |\r\n| Čip »Starejša od 30 minut — preveri urnik« | Posel teče na uro, zato je čip pogosto prižgan brez napake (⚠️) | Preveri `/sistem/posel/WEB_CATALOG_EXPORT`: ali zadnji tek uspel in ali objava teče. |\r\n| Čip »brez zadržanih artiklov: N« | Varovalka je zadržala artikle | `/varovalke` → potrdi ali popravi vzrok. |\r\n| »Stolpci podatkov se ne ujemajo z izvoznim profilom« | Register stolpcev je spremenjen, procedura ne | Skrbnik/razvoj; prejšnji par ostane. |\r\n| Artikla ni v datoteki | Manjka kategorija spletišča, validacija, objava ali je izključen | »Sestava kataloga«, kartica → »Preveri zdaj«, `/splet/umaknjeni` → »S kljukico, a ne gredo na splet«. |\r\n| Magento prebere vso vrstico kot en stolpec | Uvoznik Magento ni nastavljen na ločilo `;` | Nastavitev na strani Magento (ročni korak 277). |\r\n| Stranke ni v `stranke.csv` | Neaktivna, brez B2B profila ali ni iz podjetja 2 | Kartica stranke; `/stranke` filter »V stranke.csv«. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Web.razor`, komponenta `SafeguardBanner`; prenos `izvoz/magento-datoteka/{koda}` in `…/excel` (`ExportDownloadEndpoint.cs`).\r\n- **Storitve / delavci:** `PIM.B2bWorker` (`Program.cs`, `MagentoExportCommand.ExecuteAsync`, `CatalogSafeguard`, `RegistryCsvWriter`, `MagentoExportLock`), `PIM.B2b` (`CustomerCsvGenerator`, `MagentoCsvContract`, `ExportValueFormat`), `MagentoArtifactService`, `QualityReadService.GetWebExportSummaryAsync`. `MagentoExportRunner.cs` je star in se ne uporablja.\r\n- **Tabele in pogledi:** `out.ExportProfile` (`FieldDelimiter`, `IncludeWithdrawals`), `out.ExportColumn` (`DecimalSeparator`, `GuardKind`), `out.GetExportRows`, `out.ExportPriceList` (`PriceOrganizationId = 3` za B2B), `out.ExportStockSource`, `out.CatalogStock`, `out.WebPublication`, `out.CatalogPublishedValue`, `out.ExportRun`, `ops.SafeguardCheck/Finding/Approval`, `pim.WebPublicationPolicy`, `val.ProductChannelReadiness`, `intranet.GetWebExportSummary`, `b2b.CustomerGroupDiscounts`.\r\n- **Migracije:** 142, 146, 201, 202, 204, 208, 213, 216, 217, 234, 242, 251, 252, 253, 271, 274, 277, 279, 302 (Pakirno naročanje, `val.SyncPackageOrderHolds` pred sestavo datoteke), 306 (razlog zadržka: manjka / čaka objavo).\r\n- **Urniki:** `WEB_CATALOG_EXPORT` (3600 s, odvisen od `PRODUCT_PUBLICATION`), faza DATOTEKA pod `MAGENTO_PRODUCTS`.\r\n- **Pot:** `EXPORT_ROOT` iz argumenta, okolja `PIM_EXPORT_ROOT`, registra `ops.SystemPath` ali privzeto; na PRD `C:\\inetpub\\wwwroot\\PIM_exports_csv`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ✅ (#25) Meja »stara datoteka« na `/splet` je zdaj `SlaSeconds` posla `WEB_CATALOG_EXPORT` (ista kot na Nadzoru; privzeto 7200 s), stavek o urniku pa bere razmik in naslednji zagon iz `ops.JobDefinition`.\r\n- ⚠️ Od 277 sta ločilo `;` in cene z decimalno vejico. Ali je uvoznik Magento že preklopljen, iz kode ni mogoče preveriti.\r\n- ⚠️ Če varovalka pade (napaka v bazi), gre datoteka ven brez preverjanja; ostane samo opozorilo v zvoncu.\r\n- ⚠️ Stranke v `stranke.csv` so samo iz podjetja 2. Dodatni popust P2, referent in baza kupcev ViD (279) so vodeni za Vidadrio (podjetje 3), a do spleta ne pridejo. Predlog združitve IQ + VID po šifri z lastništvom spletišča je odprt (ni odločeno).\r\n- ⚠️ V katalogu sta dva ločena popusta za odprodajo: »Popust na artikel« / »Popust odprodaje %« (Nadzor kataloga, oznaka X/O) in »Odprodaja - popust %« (`/izdelki/odprodaja`). Katerega Magento upošteva, iz kode ni razvidno. Po migraciji 304 (naloga #8) to za artikle v odprodaji ne velja več — glej [Odprodaja](../03-izdelki/odprodaja.md).\r\n- ⚠️ Pravila poštnine (`/pravila-popustov`) v nobeni od datotek niso.\r\n- ⚠️ Stran `/stranke/uvoz` po uvozu napoti na »Pripravi izvoz« za ročno izdelavo — ta stran pa izdela samo prenos, ne osveži datoteke za Magento.\r\n\r\n## Povezani procesi\r\n\r\n- [Varovalke](../01-nadzor/varovalke.md): potrditev zadržanih artiklov.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): validacija in objava sta pogoj za vrstico v katalogu.\r\n- [Nadzor kataloga](nadzor-kataloga.md): izključitev in popust odprodaje X/O.\r\n- [Umaknjeni artikli](umaknjeni-s-spleta.md): odjavne vrstice in samodejni umik.\r\n- [Neskladja med podjetji](neskladja-med-podjetji.md): šifre, ki jih IQ in ViD vodita različno (manjkajoča kartica, različne kljukice).\r\n- [Izvoz po Magento profilih](izvoz-magento-profili.md): register stolpcev in predogled na zahtevo.\r\n- [Stranke](../07-poslovanje/stranke.md), [Popusti](../07-poslovanje/popusti.md), [Cene in ceniki](../07-poslovanje/cene-in-ceniki.md), [Zaloge](../07-poslovanje/zaloge-in-rezervacija.md): vsebina datotek.\r\n- [Kategorije izdelka](../03-izdelki/kategorije-izdelka.md), [Mediji](../03-izdelki/mediji.md), [Odprodaja](../03-izdelki/odprodaja.md).\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posel `WEB_CATALOG_EXPORT`.\r\n"},{"pot":"06-izhod-splet/nadzor-kataloga.md","vsebina":"---\r\nid: nadzor-kataloga\r\nnaslov: Nadzor kataloga (izključitev, popust X/O, pregled oznake O)\r\npodrocje: 06-izhod-splet\r\nstanje: deluje\r\nbere: [pim.izdelek, pim.zaloge, pim.validacija]\r\npise: [pim.odprodaja]\r\nstrani: [/splet/katalog]\r\nposli: [WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/CatalogControl.razor, PIM_Solution/src/PIM.Intranet/Services/CatalogControlService.cs]\r\nmigracije: [204, 205, 206, 207]\r\n---\r\n\r\n# Nadzor kataloga (izključitev, popust X/O, pregled oznake O)\r\n\r\n\u003e **Področje:** Izhod na splet · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-30, iz kode (#88)\r\n\r\n## 1. Namen\r\n\r\nUrednik na enem mestu izključi artikel iz spletnega kataloga, vpiše popust odprodaje za artikle z ABC oznako X ali O in zaključi pregled artiklov O, ki jim je pošla lastna zaloga. Rezultat so pravila, ki jih upošteva naslednji `katalog.csv`.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Nima dostopa (stran je samo za ADMIN in CATALOG_EDITOR). |\r\n| Urednik kataloga | Išče artikle, ureja izključitev in popust, zaključi pregled O. |\r\n| Skrbnik | Enako kot urednik. |\r\n| Avtomatika (PIM) | Ob vsakem izvozu (in na gumb) doda v čakalno vrsto pregleda artikle O z izčrpano svežo lastno zalogo. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik na `/splet/katalog`, ko želi artikel umakniti iz kataloga ali mu dati popust odprodaje.\r\n- **Po urniku:** osvežitev čakalne vrste teče na začetku vsakega izvoza `WEB_CATALOG_EXPORT`.\r\n- **Ob dogodku:** lastna zaloga artikla z oznako O pade na 0 (posnetek zaloge ne starejši od 30 minut).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifra ali EAN, ABC oznaka (Department), aktivnost, kljukice, validacija | PIM |\r\n| **Vhod** | Lastna zaloga (IQ + VID) in zaloga dobavitelja s časom posnetka | PIM (zajem zalog) |\r\n| **Izhod** | Izključitev iz kataloga, popust odprodaje %, zaključen pregled z opisom | PIM → naslednji `katalog.csv` |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Odpre Nadzor kataloga]) --\u003e B[Išče po šifri ali EAN: Enter ali Prikaži]\r\n    B --\u003e C[Uredi: izključitev in popust]\r\n    C --\u003e D[Shrani]\r\n    R[Na kartici spremeni oznako ali aktivnost] --\u003e Q[Zaključi pregled z opisom]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    E[[Pravilo zapisano z zgodovino]]\r\n    F{Oznaka O brez lastne zaloge?}\r\n    G\u003eČakalna vrsta pregleda O]\r\n    H([Upošteva naslednji izvoz])\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    K[(katalog.csv)]\r\n  end\r\n  D --\u003e E --\u003e H --\u003e K\r\n  F -- da --\u003e G --\u003e R\r\n  Q --\u003e H\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,H endp; class B,C,D,R,Q user; class E,F auto; class G wait; class K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/splet/katalog` | V polje »Šifra ali EAN« vpišeš začetek šifre ali cel EAN in pritisneš **Enter** (ali klikneš **Prikaži**); po želji odkljukaš »Samo čakalna vrsta O« (seznam se takoj osveži). | Prikaže se največ 100 artiklov podjetja 2 (ime podjetja je v podnaslovu) z izborom, aktivnostjo, validacijo, lastno in dobaviteljevo zalogo. Iskanje in kljukica sta v naslovu strani (`?iskanje=…\u0026vrsta=1|0`), zato povezavo lahko deliš, F5 in Nazaj pa ju ohranita. | Tabela s številom artiklov; brez zadetkov sporočilo »Ni artikla s šifro ali EAN …« s predlogom, kaj narediti. |\r\n| 2 | Urednik | `/splet/katalog` | Pri artiklu klikneš **Uredi**. | Odpre se razdelek z imenom artikla. | — |\r\n| 3 | Urednik | `/splet/katalog` | Obkljukaš »Izključen iz kataloga« in/ali vpišeš »Popust odprodaje %« (0–100) ter klikneš **Shrani**. | Pravilo se zapiše z zgodovino. Izključen artikel ne gre v `katalog.csv`, ne glede na kljukice. | Sporočilo »Pravilo je shranjeno. Upošteva ga naslednji izvoz.«; v tabeli »/ Izključen« oziroma nov odstotek. |\r\n| 4 | Avtomatika | — | — | Artikel z oznako O, aktiven, ne izključen, z lastno zalogo ≤ 0 v svežem posnetku, gre v čakalno vrsto pregleda. | Stolpec »Pregled«: »Potreben pregled«. |\r\n| 5 | Urednik | `/splet/katalog` | Klikneš **Osveži čakalno vrsto**, če ne želiš čakati na izvoz. | Čakalna vrsta se osveži takoj (samo, če je lastna zaloga sveža). | Sporočilo »Čakalna vrsta je osvežena. Na pregled čaka N artiklov.« (pri iskanju: koliko med prikazanimi). |\r\n| 6 | Urednik | Kartica artikla | Spremeniš ABC oznako ali aktivnost (ali artikel na `/splet/katalog` izključiš). | — | — |\r\n| 7 | Urednik | `/splet/katalog` | Pri artiklu **Uredi**, vpišeš »Opravljen pregled« in klikneš **Zaključi pregled**. | Pregled se zaključi. Če je artikel še vedno O, aktiven in ne izključen, sistem zavrne z »Najprej spremeni ABC oznako …«. | Sporočilo »Pregled je zaključen.« |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Izključitev vedno prepreči izvoz artikla, tudi s kljukico in veljavno validacijo.\r\n- Popust odprodaje pri oznakah X in O gre v `katalog.csv` samo, dokler je lastna zaloga pozitivna in posnetek ne starejši od 30 minut; sicer gre popust 0. Dobaviteljeva zaloga se ne šteje.\r\n- Manjkajoča ali stara zaloga ni dokaz, da je zaloga pošla — takrat se čakalna vrsta ne osveži.\r\n- Pregled O se ne da zaključiti, dokler artikel ostaja O, aktiven in ne izključen.\r\n- Dostop: samo ADMIN in CATALOG_EDITOR.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Artikel ne pripada izbranemu podjetju.« | Artikel ni iz podjetja 2 (IQ Lighting) | Stran dela samo s podjetjem 2; ime je v podnaslovu strani. |\r\n| »Vnesi popust med 0 in 100 …« | Neveljaven odstotek | Popravi vrednost. |\r\n| »Najprej spremeni ABC oznako …« | Pregled O zaključuješ, a artikel je še O in aktiven | Na kartici spremeni oznako/aktivnost ali ga izključi. |\r\n| »Osveži čakalno vrsto« ne doda ničesar | Lastna zaloga ni sveža (starejša od 30 min) | Preveri zajem zalog na `/zaloge` (Svežina po viru). |\r\n| Popust v CSV je 0, čeprav je vpisan | Ni sveže pozitivne lastne zaloge ali oznaka ni X/O | Preveri zalogo in oznako. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/CatalogControl.razor`\r\n- **Storitve / delavci:** `CatalogControlService` (`ReadAsync`, `UnmappedAsync`, `SaveAsync`, `RefreshAsync`, `ResolveAsync`); `PIM.B2bWorker` kliče `pim.RefreshCatalogReview` pred izvozom.\r\n- **Tabele in pogledi:** `pim.CatalogPolicy`, `pim.CatalogPolicyHistory`, `pim.CatalogReview`, `out.CatalogStock`, `out.CatalogOwnStockFresh`, procedure `pim.SaveCatalogPolicy`, `pim.RefreshCatalogReview`, `pim.ResolveCatalogReview`; blok `/* CatalogLifecycle204 */` v `out.GetExportRows`.\r\n- **Migracije:** 204–207.\r\n- **Urniki:** osvežitev ob `WEB_CATALOG_EXPORT`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Popust odprodaje tu (oznaka X/O, stolpca »Popust na artikel« in »Popust odprodaje %«) je ločen od odprodaje na `/izdelki/odprodaja` (stolpec »Odprodaja - popust %«). Uporabnik lahko ima dva različna odstotka za isti artikel.\r\n- ⚠️ Stran pokaže samo prvih 100 zadetkov in nima izvoza; večjih seznamov (npr. vse O) ni mogoče pregledati naenkrat.\r\n- ⚠️ Razdelek »Stolpci brez nastavljenega vira« našteje stolpce, ki ostanejo v CSV prazni; kdo jih mora napolniti, stran ne pove.\r\n\r\n## Povezani procesi\r\n\r\n- [Katalog in stranke za splet](katalog-in-stranke-csv.md): pravila se upoštevajo ob naslednjem izvozu.\r\n- [Odprodaja](../03-izdelki/odprodaja.md): drugi, ločen sistem popusta odprodaje.\r\n- [Zaloge](../07-poslovanje/zaloge-in-rezervacija.md): lastna zaloga, ki odloča o popustu in pregledu O.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): sprememba ABC oznake in aktivnosti.\r\n"},{"pot":"06-izhod-splet/neskladja-med-podjetji.md","vsebina":"---\r\nid: neskladja-med-podjetji\r\nnaslov: Neskladja med podjetji (ista šifra v IQ in ViD)\r\npodrocje: 06-izhod-splet\r\nstanje: deluje\r\nbere: [pim.izdelek, splet.katalog-csv]\r\npise: []\r\nstrani: [/splet/neskladja]\r\nposli: [WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/OrganizationMismatches.razor, PIM_Solution/src/PIM.Intranet/Services/OrganizationMismatchService.cs, PIM_Solution/workers/PIM.B2bWorker/CatalogMerge.cs]\r\nmigracije: [285, 290]\r\n---\r\n\r\n# Neskladja med podjetji (ista šifra v IQ in ViD)\r\n\r\n\u003e **Področje:** Izhod na splet · **Lastnik:** urednik kataloga, komerciala · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-28, upodobitev strani in izvoz na razvojni bazi\r\n\r\n## 1. Namen\r\n\r\nIsta šifra je lahko v več podjetjih (IQLighting, Vidadria). `katalog.csv` jo pošlje enkrat: vsebina iz glavnega podjetja (IQ), spletišča iz kljukic vseh kartic, pri čemer ViD prispeva samo videlektro. Stran pokaže šifre, kjer kartica v enem podjetju manjka ali se kljukice razlikujejo — da je ERP obeh podjetij pod nadzorom in je jasno, zakaj artikel ne gre na spletišče, ki ga kljukica zahteva.\r\n\r\nDogovor s komercialo (2026-09-28): svetila vodi IQ; ViD kartica je za videlektro; artikel na obeh spletiščih ima ERP urejen v obeh podjetjih; NW artikli so v obeh podjetjih in na obeh spletiščih.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Urednik kataloga | Pregleda neskladja, popravi kljukice na kartici. |\r\n| Komerciala | Odpre manjkajoči artikel v ERP drugega podjetja. |\r\n| Vsi (tudi pregledovalec) | Pregled in izvoz v Excel (samo branje). |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik odpre `/splet/neskladja` (povezava na `/splet` in `/splet/umaknjeni`).\r\n- Stanje je vedno trenutno (bere kartice in kljukice ob odprtju), brez lastnega urnika.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Kartice (aktivnost) in kljukice spletišč po podjetjih, viri kataloga | PIM (`canon.Product`, `pim.ProductWebShop`, `out.CatalogSource`) |\r\n| **Izhod** | Seznam neskladij, izvoz v Excel | Zaslon, datoteka `.xlsx` |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A[(Kartice in kljukice IQ in ViD)] --\u003e B[[Primerjava po šifri]]\r\n    B --\u003e C\u003eSeznam neskladij po vrsti]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    D[Pregled in izvoz v Excel]\r\n    E[Popravek kljukic na kartici]\r\n    F[Odpri artikel v ERP drugega podjetja]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    G[(katalog.csv ob naslednjem izvozu)]\r\n  end\r\n  C --\u003e D --\u003e E --\u003e G\r\n  D --\u003e F --\u003e G\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  class D,E,F user; class B auto; class C wait; class A,G data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/splet/neskladja` | Izbereš vrsto (**Manjka v IQLighting**, **Manjka v Vidadria**, **Različne kljukice**), po želji predpono (NW., BA.) ali iščeš po šifri/nazivu. | Seznam iz baze, 50 na stran; filtri so v naslovu strani. | Število na gumbu vrste in »N neskladij«. |\r\n| 2 | Urednik | `/splet/neskladja` | **Izvozi Excel** (ves filter) ali označiš vrstice in **Izvozi izbrane v Excel**. | Datoteka s posledico in navodilom za vsako vrstico. | Datoteka `PIM_neskladja_med_podjetji_….xlsx`. |\r\n| 3 | Urednik / komerciala | kartica artikla / ERP | Klik na naziv ali kljukice odpre kartico (razdelek Splet); popraviš kljukice ali artikel odpreš v ERP drugega podjetja. | Ob naslednjem zajemu iz SAOP se kartica pojavi v PIM. | Vrstica izgine s seznama. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Manjka v IQLighting:** ViD kartica ima kljukico spletišča, ki ga ViD ne sme prispevati (svetila), IQ artikla nima ali je neaktiven → artikel na to spletišče ne gre.\r\n- **Manjka v Vidadria:** IQ ima kljukico spletišča, ki bi ga lahko prispeval tudi ViD (videlektro), ViD artikla nima ali je neaktiven → splet dela (prispeva IQ), ERP v ViD ni urejen.\r\n- **Različne kljukice:** obe kartici aktivni, kljukice različne → v katalogu je unija; stolpec »ne gre na« pokaže, kaj se izgubi.\r\n- »V katalogu po kljukicah« upošteva samo kljukice in pravilo virov kataloga (285); kategorija in validacija lahko artikel še zadržita — to kaže `/splet/umaknjeni` → kljukice brez objave.\r\n- Stran samo bere; nič ne pošlje v SAOP in ne spreminja kljukic.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Neskladij ni bilo mogoče naložiti …« | Migracija 290 ni uveljavljena ali baza je preobremenjena | Skrbnik: uveljavi 290; poskusi znova čez minuto. |\r\n| Artikel je v ERP odprt, na seznamu pa še je | Zajem iz SAOP še ni tekel | Počakaj na naslednji zajem artiklov. |\r\n| »ni prevzeta v PIM« pri kartici | Artikel je v SAOP, v PIM še ni prevzet | Prevzem artikla v PIM. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/OrganizationMismatches.razor` (`?vrsta=\u0026predpona=\u0026isci=\u0026razvrsti=\u0026smer=\u0026stran=`).\r\n- **Storitve:** `OrganizationMismatchService` (stran in izvoz `/izvoz/neskladja-med-podjetji.xlsx`, pravica `view.web.mismatches`).\r\n- **Tabele in postopki:** `intranet.GetOrganizationMismatches` (bere `out.CatalogSource`, `canon.Product`, `pim.Product`, `pim.ProductWebShop`, `canon.WebSite`).\r\n- **Migracije:** 285, 290.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ ViD artikli s samo kljukico svetila (npr. BA.) po dogovoru ne gredo na svetila, dokler niso odprti v IQ; ali jih odpreti v IQ ali jim odstraniti kljukico, odloči komerciala.\r\n- ⚠️ Ediito (podjetje 4) še ni vir kataloga; ko bo, se prikaže kot dodatno podjetje.\r\n\r\n## Povezani procesi\r\n\r\n- [Katalog in stranke za splet](katalog-in-stranke-csv.md): združevanje IQ in ViD v en katalog (285).\r\n- [Umaknjeni s spleta](umaknjeni-s-spleta.md): zakaj kljukica ne pripelje artikla na splet (kategorija, validacija).\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): kljukice spletišč na kartici.\r\n"},{"pot":"06-izhod-splet/umaknjeni-s-spleta.md","vsebina":"---\r\nid: umaknjeni-s-spleta\r\nnaslov: Umaknjeni s spleta, kljukice brez objave in samodejni umik\r\npodrocje: 06-izhod-splet\r\nstanje: deluje\r\nbere: [pim.izdelek, pim.kategorije-izdelka, pim.validacija, splet.katalog-csv]\r\npise: [pim.izdelek, obvestila]\r\nstrani: [/splet/umaknjeni]\r\nposli: [WEB_CATALOG_EXPORT, PRODUCT_VALIDATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/WebWithdrawals.razor, PIM_Solution/src/PIM.Intranet/Services/WebWithdrawalService.cs, PIM_Solution/src/PIM.Intranet/Services/SafeguardService.cs, PIM_Solution/workers/PIM.B2bWorker/MagentoExportCommand.cs]\r\nmigracije: [248, 251, 277]\r\n---\r\n\r\n# Umaknjeni s spleta, kljukice brez objave in samodejni umik\r\n\r\n\u003e **Področje:** Izhod na splet · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nUporabnik vidi, kateri artikli so šli s spleta in zakaj, katere kljukice svetila/videlektro ne pripeljejo artikla na splet in zakaj, ter v enem koraku vrne kljukice tam, kjer je vzrok odpravljen. Skrbnik nastavi, ali PIM sam odkljuka artikle, ki na splet ne smejo več, in koliko dni gre odjavna vrstica v `katalog.csv`.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleduje umike in razloge (samo branje). |\r\n| Urednik kataloga | Vrne kljukice izbranim, označi samodejne umike kot pregledane, popravi vzrok na kartici. |\r\n| Skrbnik | Vklopi ali izklopi samodejni umik, nastavi dni odjavne vrstice, pripravi predogled in umakne ročno (»Umakni zdaj …«). |\r\n| Avtomatika (PIM) | Ob shranjevanju kartice, urni validaciji in pred izvozom odkljuka neveljavne kljukice (če je vklopljeno), zapiše razlog, prižge opozorilo v zvoncu; `katalog.csv` pošlje odjavno vrstico. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik odpre `/splet/umaknjeni` (tudi iz zvonca, opozorilo »umaknjeni s spleta«, ali z zavihka **Umaknjeni s spleta** na straneh izhoda na splet).\r\n- **Po urniku:** samodejni umik pred vsakim izvozom `WEB_CATALOG_EXPORT` in ob urni validaciji — samo pri podjetju z vklopljenim samodejnim umikom (privzeto izklopljen).\r\n- **Ob dogodku:** artikel izgubi pogoj za splet (neaktiven, brez kategorije spletišča, blokirajoča napaka, npr. uvoz pobriše sliko).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Zadnja objava na splet, kljukice spletišč, kategorije, validacija | PIM |\r\n| **Izhod** | Odkljukane ali vrnjene kljukice z razlogom in zgodovino | PIM |\r\n| **Izhod** | Odjavna vrstica (prazne »Spletne strani«) še N dni | `katalog.csv` → Magento umakne artikel |\r\n| **Izhod** | Opozorilo v zvoncu, dokler umiki niso pregledani | Obvestila |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Artikel izgubi pogoj za splet]) --\u003e B{Samodejni umik vklopljen?}\r\n    B -- da --\u003e C[[Ponovna validacija in odkljukanje z razlogom]]\r\n    B -- ne --\u003e D[[Artikel samo ne gre v CSV]]\r\n    C --\u003e E\u003eOpozorilo v zvoncu, čaka pregled]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    F[Pregled razlogov na zavihkih]\r\n    G[Popravek na kartici artikla]\r\n    H[Vrni kljukice izbranim]\r\n    I[Označi kot pregledano]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    J[(Odjavna vrstica v katalog.csv)]\r\n    K([Artikel spet na spletu])\r\n  end\r\n  C --\u003e J\r\n  D --\u003e J\r\n  E --\u003e F\r\n  F --\u003e G --\u003e H --\u003e K\r\n  F --\u003e I\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class F,G,H,I user; class B,C,D auto; class E wait; class J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/splet/umaknjeni` | Izbereš »Podjetje« (privzeto 2) in zavihek **Umaknjeni s spleta**; izbereš »Obdobje« (7, 30, 90 dni, leto), po želji šifro ali naziv in **Prikaži**. | Pokaže umike po razlogu (stolpci s števili) in seznam (največ 500) z razlogom, kakršen je zdaj. Klik na razlog filtrira. | Števec na zavihku. |\r\n| 2 | Urednik | `/splet/umaknjeni` | Popraviš vzrok na kartici artikla (povezava na šifro odpre kartico na razdelku Splet). | Kartica ponovno validira artikel. | Razlog v seznamu se spremeni. |\r\n| 3 | Urednik | `/splet/umaknjeni` | Označiš vrstice ali klikneš **Izberi vse, ki jim lahko vrnem kljukico**, nato **Vrni kljukice izbranim (N) …** in **Da, vrni**. | Kljukica se vrne samo, če artikel na spletišče sme; ostale so naštete pod »Teh kljukic ni bilo mogoče vrniti …« z razlogom. | Sporočilo »Vrnjenih kljukic: N. Artikli gredo na splet ob naslednjem izvozu katalog.csv.« |\r\n| 4 | Urednik | `/splet/umaknjeni` | Zavihek **S kljukico, a ne gredo na splet**: izbereš »Spletišče«, razlog, **Prikaži**. | Seznam artiklov s kljukico, ki jih `katalog.csv` ne pošlje, z razlogom (brez kategorije spletišča, ni veljaven za splet, še ni validiran …). | Po popravku na kartici artikel izgine s seznama. |\r\n| 5 | Skrbnik | `/splet/umaknjeni` → **Samodejni umik** | Obkljukaš »Samodejno odkljukaj artikle, ki niso več veljavni za splet«, nastaviš »Odjavna vrstica v katalog.csv (dni)« in klikneš **Shrani nastavitev**. | Nastavitev velja za izbrano podjetje. | Sporočilo »Samodejni umik je vklopljen …«; kartica »Samodejni umik: vklopljen«. |\r\n| 6 | Skrbnik | `/splet/umaknjeni` → **Samodejni umik** | Ko je umik izklopljen, klikneš **Pripravi predogled**, pregledaš seznam in po želji **Umakni zdaj …** → **Da, umakni**. | Kandidati se ponovno validirajo in odkljukajo z razlogom. | Sporočilo »Umaknjeno: N kljukic …«. |\r\n| 7 | Urednik | `/splet/umaknjeni` → **Samodejni umik** | Pri vrstici klikneš **Pregledano** ali zgoraj **Označi vse kot pregledane**. | Umik je pregledan; ko ni nepregledanih, se opozorilo v zvoncu zapre. | Stanje »Pregledano«; »Ni nepregledanih umikov.« |\r\n| 8 | Avtomatika | — | — | Naslednji `katalog.csv` pošlje odjavno vrstico (odkljukani) ali vrnjeno spletišče (vrnjeni). | `/splet` → Preglej vsebino → stolpec »Spletne strani«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Artikel gre na spletišče samo, če je aktiven, ima kategorijo na tem spletišču in je veljaven za splet — kljukica sama ni dovolj.\r\n- Samodejni umik je privzeto **izklopljen**; vklopi ga samo ADMIN (dovoljenje nastavitev objave). Izklopljen umik ne pomeni, da neveljaven artikel gre na splet — samo kljukica ostane.\r\n- Ročni zadržek in izključitev iz kataloga nista razlog za odkljukanje (artikel samo ne gre ven). Manjkajoča validacija tudi ni razlog.\r\n- Razlog se zapiše **pred** odkljukanjem, ker ga spletna validacija po odkljukanju ne kaže več.\r\n- Odjavna vrstica gre samo za artikel, ki je bil na spletu; privzeto 14 dni (1–365).\r\n- Vrniti kljukice in označiti pregled smeta ADMIN in CATALOG_EDITOR.\r\n- Varovalka `katalog.csv` zadrži množičen umik s spleta (od 10 artiklov naprej) do potrditve na `/varovalke`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Umikov ni mogoče prebrati (migracija 251 …)« / »(migracija 277 …)« | Baza nima migracije | Skrbnik: uveljavi migracije. |\r\n| Kljukica se ne vrne, razlog »Brez kategorije spletišča« | Artikel nima kategorije na drevesu tega spletišča | Na kartici dodaj kategorijo, nato vrni. |\r\n| »Tvoja vloga tega ne dovoljuje.« | Vloga brez pravice | Prosi urednika ali skrbnika. |\r\n| Artikel je vrnjen, a ga na spletu še ni | Izvoz še ni tekel ali ga je zadržala varovalka | `/splet` → zadnja izdelava; `/varovalke`. |\r\n| Zvonec stalno kaže umike | Nepregledani samodejni umiki | **Označi vse kot pregledane** po pregledu. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/WebWithdrawals.razor` (zavihki `?pogled=umaknjeni|kljukice|samodejni`).\r\n- **Storitve / delavci:** `WebWithdrawalService`, `SafeguardText.ReasonShort`; `PIM.B2bWorker` kliče `pim.WithdrawIneligibleWebShops` (`@Mode = AUTO`, `@TriggerSource = IZVOZ`) in `out.RecordWebPublication`.\r\n- **Tabele in pogledi:** `pim.WebShopWithdrawal`, `pim.WebPublicationPolicy`, `pim.WebShopEligibility`, `pim.WebShopReason`, `out.WebPublication`, procedure `pim.WithdrawIneligibleWebShops` (AUTO/PREVIEW/FORCE), `pim.ReviewWebShopWithdrawals`, `pim.SaveProductWebShops`, `intranet.GetWebWithdrawnItems`, `intranet.GetWebShopBlocked`, `intranet.GetWebShopWithdrawals`; opozorilo `WebShopWithdrawn` v `ops.Alert`.\r\n- **Migracije:** 248, 251, 277.\r\n- **Urniki:** pred `WEB_CATALOG_EXPORT`, ob `PRODUCT_VALIDATION`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Zavihek »Umaknjeni s spleta« kaže razlog, kakršen je **zdaj**, ne ob umiku; za artikel, ki je bil umaknjen in je vzrok že odpravljen, piše »Spet gre na splet«.\r\n- ⚠️ Ali je na PRD samodejni umik vklopljen, iz kode ni mogoče ugotoviti (nastavitev je v bazi).\r\n\r\n## Povezani procesi\r\n\r\n- [Katalog in stranke za splet](katalog-in-stranke-csv.md): odjavne vrstice in samodejni umik pred izvozom.\r\n- [Neskladja med podjetji](neskladja-med-podjetji.md): ista šifra v IQ in ViD z manjkajočo kartico ali različnimi kljukicami.\r\n- [Varovalke](../01-nadzor/varovalke.md): množičen umik čaka potrditev.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): razlogi »ni veljaven za splet«.\r\n- [Kategorije izdelka](../03-izdelki/kategorije-izdelka.md): manjkajoča kategorija spletišča.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): kljukice spletišč in »Preveri zdaj«.\r\n- [Nadzorna plošča](../01-nadzor/nadzorna-plosca.md): opozorilo v zvoncu.\r\n"},{"pot":"07-poslovanje/analitika-prodaje-in-zalog.md","vsebina":"---\r\nid: analitika-prodaje-in-zalog\r\nnaslov: Analitika prodaje, zalog in nabave\r\npodrocje: 07-poslovanje\r\nstanje: delno\r\nbere: [saop.narocila, saop.zaloge, saop.cene, saop.stranke, pim.izdelek, pim.zaloge, pim.cene, pim.narocila, pim.analitika]\r\npise: [pim.analitika, pim.narocila]\r\nstrani: [/analitika, /analitika/artikli, /analitika/artikli/{ProductId}, /analitika/dobavitelji, /analitika/nastavitve]\r\nposli: [SAOP_ANALYTICS_IMPORT, SAOP_ORDER_IMPORT]\r\nkoda: [PIM_Solution/workers/PIM.SaopAnalyticsWorker/*.cs, PIM_Solution/workers/PIM.SaopOrdersWorker/OrderSweep.cs, PIM_Solution/src/PIM.Intranet/Services/AnalyticsService.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/Analytics*.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/PimTrendChart.razor]\r\nmigracije: [199, 284]\r\n---\r\n\r\n# Analitika prodaje, zalog in nabave\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** komerciala · **Stanje:** ⚠️ delno (strani in izračun delujejo; prodajni podatki pridejo ob prvem zagonu v omrežju podjetja) · **Preverjeno:** 2026-09-25, iz kode in testov F12\r\n\r\n## 1. Namen\r\n\r\nPokaže, koliko se proda po mesecih (po artiklih in dobaviteljih), predlaga, koliko česa naročiti, in pokaže zalogo, ki stoji (zaležano) ali je je preveč. Rezultat so strani pod `/analitika` in izvoz v Excel. V SAOP se nič ne pošlje.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda trend, predloge naročil in zaležano zalogo; izvozi seznam za naročilo ali odprodajo; nastavi parametre izračuna. |\r\n| Skrbnik | Enako kot komerciala; drugim vlogam lahko dodeli dostop (Sistemske zadeve → Vloge, pravica »Analitika«). |\r\n| Avtomatika (PIM) | Vsako noč prebere podatke iz SAOP (samo branje) in preračuna kazalnike. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Po urniku:** `SAOP_ANALYTICS_IMPORT` vsak dan ob 4:00 (računi, Barkawi naročila in nabavni podatki, nato preračun); `SAOP_ORDER_IMPORT` vsako uro (naročila kupcev VNK in dobaviteljem VND po številkah).\r\n- **Ročno:** zavihek *Nastavitve izračuna* → »Preračunaj zdaj« (samo baza, brez SAOP); enkratni zajem zgodovine naročil `PIM.SaopOrdersWorker --zgodovina-od 2023`.\r\n- **Ob dogodku:** Ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Naročila kupcev (VNK) in dobaviteljem (VND) po številkah | SAOP `GetOrder`, `GetPurchaseOrder` |\r\n| **Vhod** | Izdani računi z vrsticami, Barkawi naročila (CO/PO) z datumi prevzema, povprečne in zadnje nabavne cene | SAOP `Invoice/GetInvoices`, `Barkawi/GetCO/GetPO/GetSKU` |\r\n| **Vhod** | Lastna zaloga (vir BASE), SAOP MIN/MAX, nabavni cenik | PIM (zajem zaloge in artiklov) |\r\n| **Izhod** | Kazalniki po artiklu in dobavitelju, prodaja po mesecih, dnevni posnetek zaloge | PIM (shema `ana`) |\r\n| **Izhod** | Excel: artikli (tudi izbrani) in dobavitelji | uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Odpre /analitika]) --\u003e B[Filtrira, izbere, izvozi]\r\n    N[Nastavi parametre] --\u003e R[Preračunaj zdaj]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    C[[Zajem naročil po številkah]] --\u003e D[[Zajem računov in Barkawi]]\r\n    D --\u003e E[[Posnetek zaloge in preračun]]\r\n    E --\u003e F[(Kazalniki ana.*)]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    G[(Naročila, računi, prevzemi)]\r\n  end\r\n  G --\u003e C\r\n  G --\u003e D\r\n  F --\u003e A\r\n  R --\u003e E\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A endp; class B,N,R user; class C,D,E auto; class F,G data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Avtomatika | — | — | Vsako uro prebere nova naročila VNK/VND od zadnje znane številke naprej; enkrat na dan osveži odprta. | `/sistem` → posel »Naročila iz SAOP«, faza PRENOS |\r\n| 2 | Avtomatika | — | — | Ob 4:00 prebere račune in Barkawi podatke, zapiše posnetek zaloge in preračuna kazalnike. | `/analitika` → »Od kod so podatki«: zadnji uspeh vsakega vira |\r\n| 3 | Komerciala | `/analitika` | Pregleda promet, trend po mesecih (letos proti lani), vrh dobaviteljev, artiklov in kupcev; filtrira po dobavitelju. | — | Datum »Preračunano« v glavi |\r\n| 4 | Komerciala | `/analitika/artikli?signal=NAROCI` | Pregleda predloge, označi vrstice, izvozi izbrane v Excel in naroči v SAOP. | — | Izvoz ima stolpca »Predlog količine« in »Razlog« |\r\n| 5 | Komerciala | `/analitika/artikli?signal=ZALEZANO` | Izvozi zaležano zalogo za odprodajo. | — | Stolpec »Presežek vrednost« |\r\n| 6 | Komerciala | `/analitika/dobavitelji` | Primerja dobavitelje po prometu, zalogi, dobavnem času in zamudah. | — | — |\r\n| 7 | Komerciala / skrbnik | `/analitika/nastavitve` | Spremeni servisno raven, razmik naročil, meje; »Preračunaj zdaj«. | Zapis v `ana.Setting` z zgodovino, preračun. | Sporočilo s številom artiklov za naročilo; tabela zgodovine |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- V SAOP se nič ne pošilja: vsi klici so GET; predlog je samo izračun.\r\n- Predlog: točka naročila = dnevna prodaja × dobavni čas + varnostna zaloga; naroči se do ciljne ravni (dobavni čas + razmik med naročili), zaokroženo na večkratnik. SAOP MIN ima prednost (pod MIN predlog dvigne do MAX).\r\n- Dobavni čas: izmerjen iz prevzemov artikla (vsaj 2), sicer povprečje dobavitelja (vsaj 3), sicer nabavni čas iz SAOP, sicer privzeta vrednost.\r\n- Zaležano: zaloga brez prodaje in brez prevzema v nastavljenem številu dni — samo, če zgodovina prodaje sega vsaj toliko nazaj (sicer se ne razglasi).\r\n- Brez podatkov o prodaji (vir »ni podatkov«) ni predlogov po prodaji, trendov in zaležane zaloge.\r\n- Zaloga dobaviteljev (NW, BT) se v analitiko ne šteje; samo lastna zaloga (vir BASE).\r\n- Dostop: privzeto ADMIN in COMMERCIAL; nastavitve spreminjata samo ti dve vlogi (politika `AnalyticsSettings`, preverjeno v servisu).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Podatkov o prodaji še ni« | Worker še ni tekel v omrežju podjetja ali SAOP ni dosegljiv. | Poženi `PIM.SaopAnalyticsWorker --preizkus` v omrežju, nato redni tek. |\r\n| Vir »Napaka« z besedilom »SAOP ni dosegljiv« | Ni povezave do SAOP (192.168.178.12:81). | Preveri omrežje/VPN; naslednji tek poskusi znova, preračun iz baze teče vseeno. |\r\n| Veliko artiklov »brez nabavne cene« | Ni povprečne cene iz Barkawi in ni nabavnega cenika. | Preveri cenik v Nastavitvah izračuna (privzeto NAB). |\r\n| Predlog se zdi previsok | Kratka zgodovina ali visoka servisna raven. | Odpri kartico artikla — vse številke formule so izpisane; prilagodi nastavitve. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `AnalyticsHome.razor` (/analitika), `AnalyticsItems.razor`, `AnalyticsItemCard.razor`, `AnalyticsSuppliers.razor`, `AnalyticsSettingsPage.razor`; graf `Shared/PimTrendChart.razor`.\r\n- **Storitve / delavci:** `AnalyticsService`; `PIM.SaopAnalyticsWorker` (`--preizkus`, `--samo-izracun`, `--razcleni-znova`, `--full`, `--tokovi`); `PIM.SaopOrdersWorker` (`OrderSweep`, `--zgodovina-od`).\r\n- **Tabele:** `ana.SalesInvoiceLine`, `ana.CustomerOrderLine`, `ana.PurchaseOrderLine`, `ana.ItemPurchaseInfo`, `ana.StockDaily`, `ana.ItemMonthly`, `ana.ItemMetric`, `ana.SupplierMetric`, `ana.Setting(+History)`, `ana.StreamState`, `ana.SourcePage`; vhod tudi `sales.Order*`, `purch.PurchaseOrder*`, `stock.*`, `canon.ProductPrice/ProductPlanning/ProductStockPolicy`.\r\n- **Migracije:** `284_AnalitikaProdajeZalogInNabave.sql`.\r\n- **Urniki:** `SAOP_ANALYTICS_IMPORT` (dnevno 4:00, razpored `SAOP_ANALYTICS`), `SAOP_ORDER_IMPORT` (vsako uro).\r\n- **Nastavitve (appsettings.Local.json):** sekcija `Analitika` (TimeoutSeconds, PageSize, InitialBackfillMonths, BarkawiBackfillPeriod, BarkawiDeltaPeriod …); v sekciji `Saop` za naročila `OrderSweepTailGap`, `OrderSweepHistoryGap`, `OrderSweepTailMaxCalls`, `OrderOpenRefreshHours`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Nobena SAOP točka za analitiko še ni bila poklicana v živo (razvojni računalnik ni v omrežju SAOP). Pomen parametra `period` pri Barkawi GetCO/GetPO ni dokumentiran — `--preizkus` ga pokaže iz datumov v odgovoru.\r\n- ⚠️ `GetOrderStatus` za VNK vrne 0 zapisov; zato zajem po številkah. Preslikava VNK (`map.ProcessSalesOrderInbox`) še ni videla živega dokumenta.\r\n- ⚠️ Nova zaloga brez podatka o prevzemu je lahko napačno označena kot zaležana, dokler ni Barkawi PO podatkov.\r\n- ⚠️ Obstoječi dnevni mail »zaloga pod MID« (`stock.GetBelowMidReplenishment`) šteje tudi zalogo dobaviteljev (NW, BT) kot lastno.\r\n\r\n## Povezani procesi\r\n\r\n- [Zaloge in rezervacija](zaloge-in-rezervacija.md): vir lastne zaloge in SAOP MIN/MAX.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): naročila VNK/VND.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posla SAOP_ANALYTICS_IMPORT in SAOP_ORDER_IMPORT.\r\n"},{"pot":"07-poslovanje/cene-in-ceniki.md","vsebina":"---\r\nid: cene-in-ceniki\r\nnaslov: Cene in ceniki — pregled, sprememba, uvoz in pošiljanje v SAOP\r\npodrocje: 07-poslovanje\r\nstanje: deluje\r\nbere: [saop.cene, pim.cene, pim.izdelek, excel.cenik]\r\npise: [pim.saop-vrsta, saop.cene, pim.zgodovina-uvozov]\r\nstrani: [/cene, /cene/uvoz]\r\nposli: [PRICE_IMPORT, NIGHTLY_RECONCILIATION, WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Prices.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/PriceImport.razor, PIM_Solution/src/PIM.Intranet/Services/PriceService.cs, PIM_Solution/src/PIM.Intranet/Services/PriceWorkbookService.cs, PIM_Solution/src/PIM.Intranet/Services/PriceSendJobs.cs, PIM_Solution/src/PIM.Intranet/Services/ImportHistoryService.cs]\r\nmigracije: [83, 208, 210, 213, 265, 280]\r\n---\r\n\r\n# Cene in ceniki — pregled, sprememba, uvoz in pošiljanje v SAOP\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** urednik kataloga (zapis v SAOP), komerciala (pregled) · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-29, iz kode (paketna sprememba #31)\r\n\r\n## 1. Namen\r\n\r\nPregled cen vseh podjetij po cenikih, kot jih vodi SAOP, in pot za spremembo: sprememba, nova cena ali nov cenik gre iz PIM v vrsto za SAOP, po odobritvi v SAOP, v PIM pa se pokaže šele, ko jo zajem cen prinese nazaj. SAOP ostane vir resnice, zato `katalog.csv` nikoli ne odide s ceno, ki je SAOP ne pozna.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleduje cene in cenike, izvozi Excel; uvrstiti v vrsto ali odobriti **ne more**. |\r\n| Urednik kataloga | Spremeni ceno (eno ali paketno), doda ceno ali cenik, uvozi Excel, odobri in pošlje v SAOP. |\r\n| Skrbnik | Enako kot urednik; povratek uvoza na `/uvozi`. |\r\n| Avtomatika (PIM) | Zajem cen iz SAOP vsakih 10 minut; pošiljanje odobrenih serij v ozadju (najprej ceniki, nato cene). |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik na `/cene` (gumbi **Spremeni**, **V vrsto za SAOP**, **Spremeni ceno …** za izbrane, **Nov cenik**) ali `/cene/uvoz`; odobritev na zavihku »V SAOP«.\r\n- **Po urniku:** `PRICE_IMPORT` (spremembe cen `GetPrices`, vsakih 600 s po podjetjih); šifrant cenikov v nočni uskladitvi.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Cene po cenikih (neto, DDV, velja od, aktivna), šifrant cenikov | SAOP (zajem) |\r\n| **Vhod** | Delovni list cen (ključ: Podjetje + Cenik + Šifra artikla) | Excel |\r\n| **Izhod** | Serija v vrsti za SAOP (čaka odobritev) | PIM |\r\n| **Izhod** | `AddPrices`, `ModifyPricesV2`, `AddPriceLists` | SAOP (po odobritvi) |\r\n| **Izhod** | Cene B2C (IQ) in B2B (VID cenik) v `katalog.csv` | Splet, po zajemu nazaj |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Cene in ceniki]) --\u003e B[Spremeni ceno ali uvozi Excel]\r\n    B --\u003e C[Klikne V vrsto za SAOP]\r\n    D[Zavihek V SAOP: Odobri in pošlji]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    E\u003eSerija čaka odobritev]\r\n    F[[Pošiljanje v ozadju: ceniki, nato cene]]\r\n    G{SAOP sprejel?}\r\n    H[[Zajem cen vsakih 10 min]]\r\n    I([Nova cena vidna v PIM])\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    J[(Ceniki in cene)]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    K[(katalog.csv)]\r\n  end\r\n  C --\u003e E --\u003e D --\u003e F --\u003e G\r\n  G -- da --\u003e J\r\n  G -- ne, razlog ostane --\u003e D\r\n  J --\u003e H --\u003e I --\u003e K\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,I endp; class B,C,D user; class F,G,H auto; class E wait; class J,K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala / urednik | `/cene` → **Cene po izdelkih** | Iščeš po šifri ali EAN, v **Filtri** izbereš podjetje, cenik, število cenikov, »Vrsta za SAOP«. | Ena vrstica na izdelek s ceniki, min/max neto in stanjem vrste. | Število zadetkov. |\r\n| 2 | Urednik | `/cene` | Klikneš vrstico izdelka, pri ceniku **Spremeni**, popraviš neto, DDV, »velja od«, aktivna in klikneš **V vrsto za SAOP**. Novo ceno dodaš v »Dodaj ceno v cenik« → **V vrsto za SAOP**. | Nastane serija »ročno na strani«, ki čaka odobritev. Stara cena ostane prikazana z oznako stanja vrste. | Oznaka »čaka odobritev« ob ceni; značka na zavihku »V SAOP«. |\r\n| 2a | Urednik | `/cene` | **Paketno:** označiš izdelke (kljukica v vrstici, »Označi vse na strani« ali »Označi vse, ki ustrezajo filtru (N)«), klikneš **Spremeni ceno …**, izbereš cenik, »za odstotek« (npr. +5) ali »na novo neto vrednost«, datum »velja od« (privzeto danes) in **Pokaži predogled**. | Predogled prej/potem (prvih 50), število sprememb, enakih in preskočenih (brez cene v ceniku, neaktivne), opozorilo za spremembe nad 25 %. Pri »vse po filtru« nabor prebere strežnik po filtru strani (največ 20.000 cen). | Povzetek »N cen se spremeni« in tabela prej/potem. |\r\n| 2b | Urednik | `/cene` | **Uvrsti N cen v vrsto za SAOP …** → potrditev »Uvrstiti N cen v ceniku X (podjetja) v vrsto za SAOP?« → **Da**. | Ena serija »paketno« na podjetje, ki čaka odobritev; zapis v zgodovino uvozov (vrsta CENE) s cenami prej/potem. V PIM se ne spremeni nič, dokler zajem ne prinese cene iz SAOP. | Sporočilo s številko serije in povezavo »uvoz #N«; serija na zavihku »V SAOP«. |\r\n| 3 | Urednik | `/cene` → **Ceniki** | **Nov cenik**: podjetje, šifra, naziv, valuta (978 = EUR), po želji »Napolni s cenami iz cenika« s faktorjem; **Uvrsti v vrsto za SAOP**. | Cenik in cene gredo v isto serijo; cene počakajo, da odide cenik. | Cenik v seznamu z oznako »cenik: čaka odobritev«. |\r\n| 4 | Urednik | `/cene` | **Izvozi Excel (N)** → urediš neto, DDV, datum ali aktivnost. | Ena vrstica = cenik × izdelek. | Datoteka `.xlsx`. |\r\n| 5 | Urednik | `/cene/uvoz` | Naložiš datoteko (po želji podjetje za vrstice brez stolpca »Podjetje«). | Predogled: spremenjene, nove, brez sprememb, sprememba v %, opozorila. | Razdelek »2. Kaj bo šlo v SAOP«. |\r\n| 6 | Urednik | `/cene/uvoz` | Pregledaš opozorila in klikneš **Uvrsti N cen v vrsto za SAOP (…)**. | Po podjetju nastane serija »uvoz iz Excela«; uvoz se zapiše v zgodovino. | »3. Izid«: v vrsto, že čakalo, enakih kot v SAOP, zavrnjenih; povezava »uvoz #N«. |\r\n| 7 | Urednik | `/cene` → **V SAOP** | Pri seriji **Podrobnosti** (vsebina), nato **Odobri in pošlji** ali **Prekliči**. Zastalo pošlješ z **Pošlji čakajoče**. | Pošiljanje teče v ozadju (tudi, če zapustiš stran), en tek na podjetje; najprej ceniki, nato cene. **Ustavi pošiljanje** ga prekine. | Okvir »Poslanih N, zavrnjenih M« in »Zadnji odgovori SAOP«. |\r\n| 8 | Avtomatika | — | — | Zajem cen v 10 minutah prinese novo ceno v PIM; oznaka vrste izgine. | Na `/cene` nova vrednost brez oznake »poslano, čaka zajem iz SAOP«. |\r\n| 9 | Avtomatika | — | — | Naslednji `WEB_CATALOG_EXPORT` vzame novo ceno (B2C iz cenika podjetja 2, B2B iz cenika B2B Vidadrie). Varovalka zadrži sumljivo spremembo. | `/splet` → Preglej vsebino; `/varovalke`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Nič ne odide v SAOP brez odobritve. PIM spremembe ne zapiše v svoje cene — prikaže jo šele zajem.\r\n- Zapis v SAOP (uvrstitev in odobritev) smeta samo ADMIN in CATALOG_EDITOR (dovoljenje zapisa v SAOP); komerciala lahko samo gleda in predogleda uvoz.\r\n- SAOP za cene nima PATCH: nova cena `AddPrices`, sprememba `ModifyPricesV2`, nov cenik `AddPriceLists`. Cena za cenik, ki ga SAOP še ne pozna, počaka.\r\n- Nov cenik se doda na zavihku »Ceniki«, ne z uvozom.\r\n- Paketna sprememba (#31, privzeto za noč, odločitev #38): spremeni samo neto v enem ceniku, DDV in aktivnost ostaneta, zaokroži na cent (AwayFromZero), osnova za odstotek je cena iz SAOP (ne tista v vrsti). Novih cen ne dodaja; neaktivne cene preskoči. Izbira se nikoli ne pomeša med podjetji — serija nastane za vsako podjetje posebej.\r\n- DDV (odgovor lastnika na #38): uporabnik mora vedeti, ali je DDV vključen. Paketna sprememba zato povsod piše »neto — brez DDV« in v predogledu pokaže tudi »Z DDV potem«. Kako spletna trgovina ve, ali je cena z DDV (NW artikli z DDV, ostali brez), je ločena naloga.\r\n- Cene v SAOP ni mogoče izbrisati; povratek uvoza jo izklopi (Aktivna = N). Povrne se samo cena, ki jo je zajem že prinesel; sicer je pravi povratek preklic čakajoče serije.\r\n- Na splet: B2B cena IQ artiklov je VID-ova cena B2B po isti šifri; artikel brez nje je brez B2B cene.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Oznaka »SAOP je zavrnil« z razlogom | SAOP ni sprejel dokumenta | Preberi razlog v podrobnostih serije, popravi in uvrsti znova. |\r\n| »poslano, čaka zajem iz SAOP« ostaja dlje kot 10 min | Zajem cen ne teče ali je padel | `/sistem/posel/PRICE_IMPORT`. |\r\n| Gumba **V vrsto za SAOP** ni | Vloga brez dovoljenja zapisa v SAOP | Prosi urednika kataloga. |\r\n| »čaka, da odide cenik« | Cenik iz iste serije še ni v SAOP | Odobri serijo s cenikom. |\r\n| Cena na spletu se ne spremeni | Izvoz še ni tekel ali je varovalka zadržala artikel | `/splet`, `/varovalke`. |\r\n| Napačen uvoz cen ali paketna sprememba | — | `/uvozi/{id}` → **Prekliči, kar še čaka v SAOP** ali **Pripravi povratek**. |\r\n| »Filter zajame … cen — največ 20.000 naenkrat« | Paketna sprememba po filtru je prevelika | Zoži filter (podjetje, iskanje) ali uporabi izvoz in uvoz Excela. |\r\n| »Zgodovina spremembe ni bila zapisana« | Zapis v `ops.ImportRun` ni uspel | Serija v vrsti ostane; če je napačna, jo prekliči na zavihku »V SAOP«. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `Prices.razor` (zavihki `cene`, `ceniki`, `saop`), `PriceImport.razor`; izvoz `/izvoz/cene.xlsx`.\r\n- **Paketna sprememba (#31):** `PriceWorkbookService.PlanBulkAsync` (predogled kot uvoz, `PriceImportPreview`) → `ApplyAsync(source: \"BULK\")` → `ImportHistoryService.RecordAsync(CENE)`. Izbira na strani je začasno lokalna; zamenja jo skupni `PimBulkBar` (naloga #39).\r\n- **Storitve / delavci:** `PriceService`, `PriceWorkbookService`, `PriceSendJobs` (pošiljanje v ozadju iz intraneta), `ImportHistoryService`; zajem `PIM.KatalogWorker --endpoints GetPrices`.\r\n- **Tabele in pogledi:** `canon.ProductPrice`, `out.OutboundBatch`, `out.OutboxMessage`, `out.EnqueueSaopPriceChanges`, `out.EnqueueSaopPriceList`, `out.ApproveOutboundBatch`, `out.CancelOutboundBatch`, `out.ClaimSaopDocument`, `out.ExportPriceList` (B2B iz podjetja 3), `ops.ImportRun`.\r\n- **Migracije:** 083, 208, 210, 213, 265, 280.\r\n- **Urniki:** `PRICE_IMPORT` (600 s), `NIGHTLY_RECONCILIATION` (šifrant cenikov).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Cene se pošiljajo iz procesa intraneta (`PriceSendJobs`), ne prek odhodnega dispečerja `SAOP_OUTBOUND_DISPATCH`. Če se intranet (IIS) med pošiljanjem ponovno zažene, tek prekine; preostanek ostane v vrsti za **Pošlji čakajoče**.\r\n- ⚠️ Varovalka cen (×10/×100, skok) deluje šele na `katalog.csv`; ob uvozu cen so le opozorila v predogledu, ne zadržanje.\r\n- ⚠️ Ali SAOP res vrne spremenjeno ceno v 10 minutah (okno `Saop:LookbackDays`), je odvisno od nastavitev strežnika.\r\n\r\n## Povezani procesi\r\n\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odobritev in pošiljanje v SAOP.\r\n- [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md): povratek uvoza cen.\r\n- [Varovalke](../01-nadzor/varovalke.md): zadržanje sumljive cene v `katalog.csv`.\r\n- [Katalog in stranke za splet](../06-izhod-splet/katalog-in-stranke-csv.md): cene B2B/B2C v katalogu.\r\n- [Cenik za tisk](cenik-za-tisk.md), [Preverbe cen in zaloge](preverbe-cen-in-zaloge.md), [Popusti](popusti.md).\r\n"},{"pot":"07-poslovanje/cenik-za-tisk.md","vsebina":"---\r\nid: cenik-za-tisk\r\nnaslov: Cenik za tisk (PDF iz kategorije ali izbranih artiklov)\r\npodrocje: 07-poslovanje\r\nstanje: deluje\r\nbere: [pim.cene, pim.izdelek, pim.besedila, pim.prevodi, pim.kategorije-izdelka, pim.mediji, pim.zaloge]\r\npise: []\r\nstrani: [/cene/tisk]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/PriceSheet.razor, PIM_Solution/src/PIM.Intranet/Services/PriceSheetService.cs]\r\nmigracije: [150]\r\n---\r\n\r\n# Cenik za tisk (PDF iz kategorije ali izbranih artiklov)\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** komerciala · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nKomerciala pripravi digitalni cenik za kupca (kategorija ali seznam šifer, B2C ali B2B, v izbranem jeziku) in ga natisne ali shrani kot PDF z ukazom brskalnika.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Izbere podjetje, cenik, jezik, kategorijo ali šifre in natisne. |\r\n| Urednik kataloga | Enako. |\r\n| Skrbnik | Ni vloge. |\r\n| Avtomatika (PIM) | Sestavi cenik iz trenutnih cen, nazivov, slik in zaloge. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** na `/cene/tisk` (gumb **Cenik za tisk** na `/cene`), ko komerciala potrebuje cenik za kupca.\r\n- **Po urniku:** ni.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Podjetje, cenik B2C/B2B, jezik (sl, en, de, hr, it), spletno mesto, kategorija ali šifre, »samo objavljeni«, »s slikami« | Uporabnik |\r\n| **Vhod** | Cene, nazivi, proizvajalec, slike, zaloga | PIM |\r\n| **Izhod** | Tiskan cenik ali PDF, razvrščen po kategorijah | Tiskalnik / datoteka |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Cenik za tisk]) --\u003e B[Izbere podjetje, cenik, jezik in obseg]\r\n    B --\u003e C[Klikne Pripravi cenik]\r\n    D[Klikne Natisni ali PDF]\r\n    E([PDF ali tiskan cenik])\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[[Sestava cenika po kategorijah]]\r\n    G[(Cene, nazivi, slike, zaloga)]\r\n  end\r\n  C --\u003e F\r\n  G --\u003e F\r\n  F --\u003e D --\u003e E\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,E endp; class B,C,D user; class F auto; class G data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/cene/tisk` | Izbereš podjetje, cenik (B2C maloprodaja / B2B veleprodaja), jezik in spletno mesto. | — | — |\r\n| 2 | Komerciala | `/cene/tisk` | Vpišeš pot kategorije (npr. »Notranja svetila \u003e Viseča svetila«) **ali** šifre, ločene z vejico ali novo vrstico; po želji »samo objavljeni« in »s slikami«. | — | — |\r\n| 3 | Komerciala | `/cene/tisk` | Klikneš **Pripravi cenik**. | Cenik se sestavi po kategorijah: šifra, EAN, naziv, proizvajalec, cena brez DDV, DDV %, cena z DDV, zaloga. | Glava »… — cenik B2C/B2B«, datum in število artiklov. |\r\n| 4 | Komerciala | `/cene/tisk` | Klikneš **Natisni / PDF** (ali Ctrl+P → Shrani kot PDF). | Brskalnik natisne samo cenik (orodna vrstica je skrita). | PDF v mapi Prenosi. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Cenik samo bere; nič ne zapiše.\r\n- Glava pravi »z DDV« za B2C in »brez DDV« za B2B.\r\n- Artikli brez cene v izbranem ceniku se ne pokažejo.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Za to izbiro ni artiklov s ceno.« | Napačna pot kategorije, cenik ali »samo objavljeni« | Preveri pot (natančno kot v drevesu) ali odkljukaj »samo objavljeni«. |\r\n| Manjkajo slike | Artikel nima slike ali povezava ne deluje | `/izdelki` → Mediji. |\r\n| Naziv ni v izbranem jeziku | Prevod manjka | [Prevodi](../04-kakovost/prevodi.md). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/PriceSheet.razor`\r\n- **Storitve / delavci:** `PriceSheetService`, `CatalogReadService.GetWebSitesAsync`.\r\n- **Tabele in pogledi:** `intranet.GetPriceListSheet`.\r\n- **Migracije:** 150.\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Izbira cenika je omejena na B2C in B2B; drugih cenikov SAOP (npr. akcijskih) ni mogoče natisniti.\r\n- ⚠️ Cenik za tisk bere cenik **izbranega** podjetja. IQLighting v SAOP nima cenika B2B (migracija 208), na spletu pa se B2B cena IQ artiklov bere iz cenika Vidadrie (213). Cenik za tisk »IQLighting — B2B« je zato verjetno prazen ali drugačen od spletnega.\r\n\r\n## Povezani procesi\r\n\r\n- [Cene in ceniki](cene-in-ceniki.md): vir cen.\r\n- [Kategorije izdelka](../03-izdelki/kategorije-izdelka.md): pot kategorije.\r\n- [Mediji](../03-izdelki/mediji.md): slike v ceniku.\r\n"},{"pot":"07-poslovanje/popusti.md","vsebina":"---\r\nid: popusti\r\nnaslov: Komercialna pravila — Magento skupine, vrednostni pragovi, poštnina, izjeme in S-popusti\r\npodrocje: 07-poslovanje\r\nstanje: delno\r\nbere: [pim.stranke, pim.izdelek, saop.popusti]\r\npise: [pim.popusti, pim.stranke]\r\nstrani: [/pravila-popustov, /izdelki]\r\nposli: [WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/DiscountRules.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/Products.razor, PIM_Solution/src/PIM.Intranet/Services/PackagingDiscountService.cs, PIM_Solution/src/PIM.Intranet/Services/IntranetDataService.cs, PIM_Solution/src/PIM.B2b/DiscountCalculator.cs]\r\nmigracije: [20, 98, 205, 214, 216, 252, 253, 274, 279, 317]\r\n---\r\n\r\n# Komercialna pravila — Magento skupine, vrednostni pragovi, poštnina, izjeme in S-popusti\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** komerciala · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nKomerciala na enem mestu nastavi pravila, ki določajo ceno in popust kupca na spletu: katera Magento skupina pripada tipu stranke, splošno lestvico vrednostnega rabata, poštnino, izjeme skupinskih popustov in posebne S-popuste na polno pakiranje. Rezultat so pravila v PIM, ki jih berejo `stranke.csv`, `katalog.csv` in kartice strank.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ureja vse razdelke strani. |\r\n| Urednik kataloga | Enako kot komerciala. |\r\n| Skrbnik | Enako. |\r\n| Avtomatika (PIM) | Pravila zapiše z revizijsko sledjo; ob izvozu izračuna skupine popustov in posebne S po strankah in tipih. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** komerciala na `/pravila-popustov` (Pravila → zavihek »Komercialna pravila«), ob spremembi prodajne politike.\r\n- **Ročno, za več izdelkov naenkrat:** na `/izdelki` → **S-popust …** (izbrani izdelki ali cel pogled po filtru).\r\n- **Po urniku:** ni; pravila se upoštevajo ob naslednjem `WEB_CATALOG_EXPORT`.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Tipi strank, stranke, rabatne skupine artiklov, S kode izdelkov | PIM |\r\n| **Vhod** | SAOP rabatni ceniki (osnova, ki jo izjeme preglasijo) | SAOP (nočni zajem) |\r\n| **Izhod** | Magento skupina tipa, vrednostni pragovi | `stranke.csv` (»Skupina (Magento)«, »Rabat prag/% 1–3«) |\r\n| **Izhod** | Izjeme skupinskih popustov | `stranke.csv` (»Skupine popustov«, »Popust NW«) |\r\n| **Izhod** | Šifrant S kod, posebni S po tipu in stranki | `katalog.csv` (»S popust %«, »Posebni S za skupino strank«, »Posebni popust za stranko«) |\r\n| **Izhod** | Pravila poštnine | samo PIM (⚠️ v nobeni datoteki) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Odpre Komercialna pravila]) --\u003e B{Katero področje?}\r\n    B --\u003e C[Skupine strank: Shrani preslikavo]\r\n    B --\u003e D[Vrednostni pragovi: Shrani stopnjo]\r\n    B --\u003e E[Poštnina: Shrani]\r\n    B --\u003e F[Posebne izjeme: Dodaj izjemo]\r\n    B --\u003e G[S-popusti: Shrani kodo ali pravilo]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    H[[Zapis pravila z revizijsko sledjo]]\r\n    I([Velja ob naslednjem izvozu])\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    J[(stranke.csv)]\r\n    K[(katalog.csv)]\r\n  end\r\n  C --\u003e H\r\n  D --\u003e H\r\n  E --\u003e H\r\n  F --\u003e H\r\n  G --\u003e H\r\n  H --\u003e I\r\n  I --\u003e J\r\n  I --\u003e K\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,I endp; class B,C,D,E,F,G user; class H auto; class J,K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/pravila-popustov` | Klikneš **Skupine strank**, izbereš »Tip stranke«, vpišeš »Ključ skupine Magento« (prazno = odstrani) in **Shrani preslikavo**. | Vse stranke tega tipa dobijo to Magento skupino v `stranke.csv`. | Tabela tipov: »Preslikano«; povzetek »Preslikane skupine strank N / M«. |\r\n| 2 | Komerciala | `/pravila-popustov` | **Vrednostni pragovi** → **Uredi** pri stopnji, vpišeš »Prag bruto brez DDV« in »Popust %«, **Shrani stopnjo**. | Splošna lestvica velja za stranke brez lastnih pragov (lastne urejaš na kartici stranke). | Nova vrednost v tabeli pragov. |\r\n| 3 | Komerciala | `/pravila-popustov` | **Poštnina** → spremeniš prag naročila, dolžino paketa, neto poštnino, »Brezplačno«, prednost in pri vrstici **Shrani**. | Pravilo se zapiše v PIM. | Sporočilo o uspehu. |\r\n| 4 | Komerciala | `/pravila-popustov` | **Posebne izjeme** → »Izjema velja za« (tip ali posamezna stranka — vpišeš **interni ID** stranke), »Skupina artiklov«, »Popust %«, »Velja od/do« in **Dodaj izjemo**. | Izjema ima prednost pred SAOP popustom (stranka \u003e tip \u003e SAOP). | Vrstica v tabeli izjem s stanjem veljavnosti. |\r\n| 5 | Komerciala | `/pravila-popustov` | **S-popusti** → v šifrantu S kod **Uredi** ali vpišeš novo kodo in »Popust %« ter **Shrani kodo**. | Odstotek velja za vse izdelke s to kodo. | Tabela »Šifrant S kod«. |\r\n| 6 | Komerciala | `/pravila-popustov` | **S-popusti** → »Dodaj pravilo posebnega S«: »Komu« (tip ali stranka), »Za artikle« (rabatna skupina, vsi z S kodo, vsi, en artikel), »Nova S koda«, datumi, **Shrani pravilo**. | Obstoječe pravilo za isti cilj in obseg se posodobi. Zmaga najbolj specifično (artikel \u003e S koda \u003e skupina \u003e vsi), stranka pred tipom. | V tabeli pravil štetje »izdelkov« in »strank«; v `katalog.csv` stolpca »Posebni S …«. |\r\n| 7 | Komerciala | `/pravila-popustov` | Pri pravilu S klikneš **Umakni**. | Pravilo preneha veljati. | Vrstica izgine. |\r\n| 7a | Komerciala | `/izdelki` | Filtriraš ali označiš izdelke, klikneš **S-popust …**, izbereš »Posebni S za tip stranke« ali »… za stranko«, S kodo (prazno = odstrani) in **Uporabi za izbrane** / **Uporabi za cel pogled**, nato **Potrdi in zapiši**. | En zapis na podjetje (ena transakcija, en paket): pravilo na izdelek se ustvari, posodobi ali umakne; vsak spremenjen izdelek gre v `b2b.AuditLog` (prej/potem, številka paketa). Neobjavljeni izdelki se izpustijo z razlogom. | Sporočilo »spremenjenih N, že enakih N, …« in paket v seznamu »Moji zadnji paketi posebnega S«. |\r\n| 7b | Komerciala | `/izdelki` | V seznamu »Moji zadnji paketi posebnega S« klikneš **Razveljavi**. | Vsak izdelek paketa se vrne v prejšnje stanje (prej brez pravila = umik, prej druga koda = stara koda in veljavnost, prej umaknjeno = spet velja). Izdelka, ki ga je kdo medtem spet spremenil, ne povozi. | Sporočilo »vrnjenih N«; paket označen »razveljavljeno«. |\r\n| 8 | Avtomatika | — | — | Naslednji `WEB_CATALOG_EXPORT` zapiše nova pravila v `stranke.csv` in `katalog.csv`. | `/splet` → Preglej vsebino. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Skupina Magento je nosilna vez: nanjo so vezane cene in popusti, ne na posamezno stranko.\r\n- Skupinski popust: ročni popust stranke → ročni popust tipa → SAOP rabatni cenik; poslovna enota deduje od plačnika, tranzit nima; ročni 0 % zavestno preglasi SAOP.\r\n- Dodatni popust P2 (samo prek delovnega lista strank) se obračuna za osnovnim.\r\n- S-popust velja pri količini ≥ PAK2 in samo za stranke s kljukico »Popust polno pakiranje«.\r\n- Datum »velja do« ne sme biti pred »velja od«.\r\n- Vse spremembe gredo v revizijsko sled (`b2b.AuditLog`); v SAOP se nič ne pošlje.\r\n- Množični posebni S z `/izdelki` (317): en paket na podjetje (`b2b.PackagingDiscountRuleBatch` + vrstice prej/potem), razveljavitev celega paketa; pravico (BusinessWrite) preveri storitev, ne samo gumb. Nova koda na izdelku pobriše omejitev veljavnosti od/do (enako kot pravilo po vrstici).\r\n- Dostop: ADMIN, CATALOG_EDITOR, COMMERCIAL.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Gumb **Dodaj izjemo** je siv | Manjka skupina, odstotek ali cilj; datumi obrnjeni | Izpolni vsa polja. |\r\n| Stranka po izjemi nima popusta v `stranke.csv` | Izjema še ne velja (datum), stranka ni iz podjetja 2, izvoz še ni tekel | Preveri veljavnost in `/splet`. |\r\n| »Aktivna organizacija ni na voljo.« | Ni izbrane organizacije | Izberi podjetje v zgornji vrstici. |\r\n| Pravilo S ne vpliva na izdelke (0 izdelkov) | Rabatna skupina ali S koda ne obstaja pri izdelkih | Preveri šifro skupine na seznamu izdelkov (filter Rabatna skupina). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/DiscountRules.razor` (razdelki `types`, `tiers`, `shipping`, `overrides`, `spopusti`).\r\n- **Storitve / delavci:** `IntranetDataService` (`SaveCustomerTypeMappingAsync`, `SaveValueTierAsync`, `SaveShippingRuleAsync`, `SaveGroupOverrideAsync`), `PackagingDiscountService` (`SaveRulesBulkAsync`, `UndoRulesBatchAsync`, `GetRuleBatchesAsync` — 317); `PIM.B2b.DiscountCalculator`.\r\n- **Tabele in pogledi:** `pim.CustomerTypeMagentoGroup`, `pim.ValueDiscountTier`, `pim.ShippingRuleCatalog`, `b2b.GroupDiscountOverride`, `pim.PackagingDiscountCatalog`, `b2b.PackagingDiscountRule`, `b2b.PackagingDiscountSpecials`, `b2b.CustomerGroupDiscounts`, `b2b.AuditLog`, `b2b.PackagingDiscountRuleBatch`, `b2b.PackagingDiscountRuleBatchItem`; `intranet.GetDiscountRules`, `intranet.GetPackagingDiscountRules`, `b2b.SavePackagingDiscountRulesBulk`, `b2b.UndoPackagingDiscountRuleBatch`, `intranet.GetPackagingDiscountRuleBatches`.\r\n- **Migracije:** 020, 098, 205, 214, 216, 252, 253, 274, 279, 317.\r\n- **Urniki:** ni lastnega; bere `WEB_CATALOG_EXPORT`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Pravila poštnine se shranijo, a jih ne bere noben izvoz (`katalog.csv`, `stranke.csv`); Magento jih iz PIM ne dobi. Ali jih Magento vodi sam, ni razvidno.\r\n- ⚠️ Izjeme skupinskega popusta ni mogoče izbrisati ali urediti (ni gumba); ustaviš jo lahko samo z novo izjemo za isto skupino.\r\n- ⚠️ Izjema za posamezno stranko zahteva **interni ID** stranke (ne šifre), ki ga uporabnik ne vidi; pravilo S pa zahteva šifro stranke.\r\n- ⚠️ Stran dela v izbrani organizaciji; izjeme in pravila S za Vidadrio se v `stranke.csv` ne pokažejo (datoteka je samo za podjetje 2).\r\n- ⚠️ Privzeti popusti po tipu iz baze kupcev ViD (TRGOVINE, INŠTALATERJI) in list »Dodatna pravila za artikle« niso preneseni (279, namenoma).\r\n\r\n## Povezani procesi\r\n\r\n- [Stranke](stranke.md): tip, lastni pragovi, posebni S in P2 po stranki.\r\n- [Cene in ceniki](cene-in-ceniki.md): osnovne cene, na katere se popusti obračunajo.\r\n- [Katalog in stranke za splet](../06-izhod-splet/katalog-in-stranke-csv.md): stolpci popustov v datotekah.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): privzeti S izdelka in S-popust na seznamu izdelkov.\r\n"},{"pot":"07-poslovanje/preverbe-cen-in-zaloge.md","vsebina":"---\r\nid: preverbe-cen-in-zaloge\r\nnaslov: Preverbe cen in zaloge (opozorila, prag faktorja marže)\r\npodrocje: 07-poslovanje\r\nstanje: delno\r\nbere: [pim.cene, pim.zaloge, pim.izdelek]\r\npise: [pim.pravila, obvestila]\r\nstrani: [/preverbe]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Checks.razor, PIM_Solution/src/PIM.Intranet/Services/IntranetFeatureReadService.cs, PIM_Solution/src/PIM.Intranet/Services/RulesWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/PimCheckCode.cs]\r\nmigracije: [131, 132, 150, 191, 218]\r\n---\r\n\r\n# Preverbe cen in zaloge (opozorila, prag faktorja marže)\r\n\r\n\u003e **Področje:** Poslovanje · **Lastnik:** komerciala · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nSeznam opozoril o cenah in zalogi (manjka cena, nizek faktor marže, podvojena cena, brez zaloge in prihoda, pod minimumom, zastarel posnetek). Opozorila **ne ustavijo** izvoza — povedo, kje je vredno pogledati. Komerciala nastavi prag faktorja marže.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda preverbe, nastavi prag faktorja marže, potrdi ali reši alarme. |\r\n| Urednik kataloga | Pregleda preverbe in popravi ceno ali podatek na kartici (praga ne more urejati). |\r\n| Skrbnik | Enako kot komerciala. |\r\n| Avtomatika (PIM) | Preverbe izračuna ob branju strani iz trenutnih cen in zalog. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** komerciala na `/preverbe` (tudi s kartic številk; filtri so v naslovu strani).\r\n- **Po urniku:** ni — preverbe se izračunajo ob odprtju strani.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Cene po cenikih (tudi nabavni cenik NAB), zaloge, min/max, posnetki | PIM |\r\n| **Vhod** | Prag faktorja marže (privzeti in po podjetju) | Uporabnik |\r\n| **Izhod** | Seznam opozoril z vzrokom, prodajno in prevzemno ceno, faktorjem | Zaslon |\r\n| **Izhod** | Shranjen prag; potrjeni/rešeni alarmi | PIM |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Preverbe cen in zaloge]) --\u003e B[Klikne kartico ali izbere vrste preverb]\r\n    B --\u003e C[Klikne Uporabi filtre]\r\n    D[Odpre izdelek in popravi]\r\n    E[Nastavi prag in Shrani prag]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[[Izračun preverb ob branju]]\r\n    G[(Prag faktorja marže)]\r\n    H([Opozorilo izgine ob naslednjem branju])\r\n  end\r\n  C --\u003e F --\u003e D --\u003e H\r\n  E --\u003e G --\u003e F\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,H endp; class B,C,D,E user; class F auto; class G data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/preverbe` | Pogledaš kartice: Brez B2C cene, Brez B2B cene, Faktor marže pod pragom, Brez zaloge in brez prihoda, Podvojen zapis cene, Zaloga pod minimumom, Zastarel posnetek. Klik odpre filtriran seznam. | Števila za trenutno izbrano organizacijo. | Seznam pod karticami. |\r\n| 2 | Komerciala | `/preverbe` | Vpišeš šifro/EAN/naziv, »Cenik ali skladišče«, obkljukaš vrste preverb in klikneš **Uporabi filtre**. | Seznam z vzrokom, prodajno, prevzemno ceno, faktorjem, osnovo in svežino. | »N preverb«. |\r\n| 3 | Komerciala / urednik | Kartica izdelka | Klikneš šifro (odpre razdelek cen ali zaloge na kartici) in popraviš vzrok (cena gre v SAOP po odobritvi). | — | Ob naslednjem nalaganju preverba izgine. |\r\n| 4 | Komerciala | `/preverbe` → »Faktor marže — prag« | Vpišeš prag (npr. 2,00) za privzeto ali svoje podjetje in klikneš **Shrani prag**. | Izdelek, katerega prodajna cena / nabavna cena je pod pragom, pride v preverbo FAKTOR_MARZE; predlagana cena = nabavna × prag. | Sporočilo »Prag je shranjen (N) …«. |\r\n| 5 | Komerciala | `/preverbe` → »Obvestila« | Pri alarmu klikneš **Potrdi** ali **Reši**. | Alarm je potrjen/rešen. | Sporočilo; alarm izgine. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Preverbe so opozorila; nobena ne blokira izvoza v SAOP ali na splet.\r\n- Prag faktorja marže in alarme ureja samo ADMIN ali COMMERCIAL.\r\n- Faktor marže = prodajna cena / nabavna cena (cenik NAB).\r\n- Prag po podjetju prevlada nad privzetim.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Okvir »manjka …« namesto seznama | Bralni model preverb v bazi manjka | Skrbnik: migracije 131/132/150. |\r\n| Kartice kažejo »—« | Preverba ni na voljo | Kot zgoraj. |\r\n| »Vpiši številko, npr. 2,00.« | Prag ni številka | Popravi vnos. |\r\n| Gumbi alarmov manjkajo (»samo za ADMIN in COMMERCIAL«) | Vloga urednika | Prosi komercialo. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Checks.razor`\r\n- **Storitve / delavci:** `IntranetFeatureReadService` (`intranet.GetPriceChecks`, `intranet.GetStockChecks`), `RulesWriteService` (`GetCheckThresholdsAsync`, `SaveCheckThresholdAsync`), `GovernanceReadService.GetAlertsAsync`, `PimCheckCode`.\r\n- **Tabele in pogledi:** `pim.CheckThreshold`, `canon.ProductPrice`, `stock.Snapshot`, `ops.Alert` (vrste `PRICE_CHECK`, `STOCK_CHECK`).\r\n- **Migracije:** 131, 132, 150, 191, 218.\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Razdelek »Obvestila« pričakuje alarme `PRICE_CHECK`/`STOCK_CHECK`, ki jih po besedilu strani **nihče ne ustvarja** (ni workerja). Razdelek je zato vedno prazen z opombo »manjka«.\r\n- ⚠️ Preverbe veljajo za trenutno izbrano organizacijo; pregleda čez vsa podjetja ni.\r\n- ⚠️ Filter vrst preverb kaže tehnične kode (npr. `CENA_MANJKA_B2B`), ne slovenskih imen.\r\n- ⚠️ »Brez B2B cene« za IQLighting: na spletu se B2B cena bere iz cenika Vidadrie, preverba pa (verjetno) iz cenika istega podjetja — iz kode strani ni razvidno.\r\n\r\n## Povezani procesi\r\n\r\n- [Cene in ceniki](cene-in-ceniki.md): popravek cene.\r\n- [Zaloge in rezervacija](zaloge-in-rezervacija.md): vir zaloge in min/max.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): blokirajoče napake (za razliko od teh opozoril).\r\n"},{"pot":"07-poslovanje/stranke.md","vsebina":"---\r\nid: stranke\r\nnaslov: Stranke — seznam, kartica in delovni list strank\r\npodrocje: 07-poslovanje\r\nstanje: deluje\r\nbere: [saop.stranke, saop.popusti, excel.stranke, pim.izdelek, pim.popusti]\r\npise: [pim.stranke, pim.popusti, pim.zgodovina-uvozov]\r\nstrani: [/stranke, /stranke/{Id}, /stranke/uvoz]\r\nposli: [NIGHTLY_RECONCILIATION, WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Customers.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CustomerDetail.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CustomerImport.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CustomerPackagingPanel.razor, PIM_Solution/src/PIM.Intranet/Services/Cus
