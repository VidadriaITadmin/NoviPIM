na vrsti (termin je minil ali je zahtevan), ga gostitelj ta tik začne samo, če ga ne zadrži nobeno od teh pravil (po vrsti; `JobQueue.Gate`):\r\n\r\n1. **Predhodnik teče** — po celi verigi (validacija med objavo, objava med izvozom kataloga).\r\n2. **Pas SAOP** — ročna zahteva ima prednost pred rednimi SAOP posli; posel, ki kliče SAOP, nikoli ne teče hkrati z drugim takim in začne šele po **2 min tišine** od konca zadnjega (ekipa SAOP 22. 9.).\r\n3. **En težak posel naenkrat** — težki so validacija, objava, katalog za splet, cene in zaloga za splet, datumi dobave, analitika in nočna uskladitev. Drugi težak posel počaka, a **največ 15 min**, nato gre vseeno (da zadrževanje ne postane zamuda in alarm).\r\n4. **Največ 3 posli hkrati** — nadzornik in razpošiljanje alarmov sta lahka in gresta mimo te meje, zato ju ročni zagon nikoli ne izrine.\r\n\r\nVrstni red pregleda v tiku: **ročne zahteve najprej**, nato redni posli po vrstnem redu kataloga.\r\n\r\n**Ocena časa:** trajanje posla je povprečje uspešnih tekov zadnjih **14 dni** (`ops.JobRun`, ena poizvedba za vse posle; najmanj 3 teki, sicer stran napiše »ocene še ni«). Stran Nadzor ista pravila simulira naprej po tikih (`JobQueue.Forecast`) in pove: kdaj bo zagon (takoj / za poslom X, ki se konča čez ~N min / po tišini SAOP), koliko bo trajal in kdaj je naslednji redni zagon. Kadar je naenkrat na vrsti več poslov (npr. po izpadu gostitelja), »zdaj« dobi samo posel, ki ga gostitelj res spusti ob naslednjem tiku; drugi imajo »v vrsti · ~HH:MM« in razlog iz simulacije (npr. za poslom X v pasu SAOP). Izklopljen posel ima »—« tudi, ko gostitelj ne teče. Posel, ki ga razporejevalnik namenoma zadrži, je na Nadzoru siv (»Čaka v vrsti«, »V vrsti«), ne rdeč. Odločitve lastnika o prednostih so na nalogi #17 (do takrat velja zgornji privzeti predlog).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Urniki, vklopi poslov in podjetij, zahteve za zagon | PIM (`ops.JobDefinition`, `ops.OrganizationAutomationPolicy`) |\r\n| **Vhod** | Podatki SAOP in dobaviteljev | SAOP, dobavitelj |\r\n| **Izhod** | Teki, koraki, faze, alarmi, zakup | PIM (`ops.JobRun`, `ops.JobStepRun`, `ops.JobPhaseRun`, `ops.Alert`, `ops.SchedulerLease`) |\r\n| **Izhod** | Posodobljen katalog, cene, zaloge, validacija | PIM |\r\n| **Izhod** | katalog.csv, stranke.csv, e-pošta | `EXPORT_ROOT`, prejemniki |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Tik gostitelja vsakih 15 s]) --\u003e B{\"Drži gostitelj zakup?\"}\r\n    B -- ne --\u003e C[[\"Čaka, drug gostitelj teče\"]]\r\n    B -- da --\u003e D{\"Posel na vrsti ali ročna zahteva?\"}\r\n    D -- kliče SAOP --\u003e E{\"Pas SAOP prost in 2 min tišine?\"}\r\n    E -- ne --\u003e A\r\n    E -- da --\u003e F[[\"Koraki po podjetjih z workerji\"]]\r\n    D -- ne kliče SAOP --\u003e F\r\n    F --\u003e G[(\"Tek, faze, alarmi, naslednji termin od konca\")]\r\n    G --\u003e H[[\"Uspeh sproži naslednika\"]]\r\n    W{\"Windows opravilo: živ zakup?\"}\r\n    W -- da --\u003e X([Preskoči])\r\n    W -- ne --\u003e Y[[\"Stari cikel PowerShell\"]]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    I[(iCenter API)]\r\n  end\r\n  subgraph WW[\"🌐 Splet\"]\r\n    J[(\"katalog.csv in stranke.csv\")]\r\n  end\r\n  F --\u003e I\r\n  H --\u003e J\r\n  Y --\u003e I\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,X endp; class B,C,D,E,F,H,W,Y auto; class G,I,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | strežnik | Namestiš gostitelja kot Windows storitev (`deploy/Install-AutomationHost.ps1 … -ZunanjiNadzor`, začetka pišeta v razdelku **Vrsta poslov** in v vrstici posla; odpri predhodnika. |\r\n| Ocena začetka se ne ujema z dejanskim | Gostitelj teče s starim binarjem (pred nalogo #12 ne pozna teže poslov) ali je malo tekov za oceno | Ponovno zaženi gostitelja; ocena se izboljša s teki. |\r\n| Ekipa SAOP se pritožuje zaradi obremenitve | Poleg gostitelja tečejo še stara Windows opravila ali drug računalnik (DEV) kliče isti SAOP | Odstrani stara opravila; ugasni gostitelja na DEV. |\r\n| Rdeče »prestari podatki«, čeprav posel uspe | Vir ne prinaša novih podatkov (npr. dobavitelj vrača isto datoteko) | Stran posla → »1. Viri podatkov«; po potrebi meja svežine. |\r\n| Tek visi »brez utripa« | Worker zamrznil (npr. premalo pomnilnika na SQL) | **Ustavi**; gostitelj viseče teke po 10 min zapre kot opuščene. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Knjižnica:** `PIM_Solution/src/PIM.Automation` — `JobCatalog.cs` (seznam poslov, privzeti urniki, odvisnosti, načrt korakov, pas SAOP `UsesSaop`, `SaopQuietSeconds = 120`, `NextAfterEnd`, `MaxBackoffSeconds = 4 h`), `JobQueue.cs` (pravila čakanja `Gate`, napoved `Forecast`/`Explain`, meje `MaxConcurrentJobs = 3`, `HeavyMaxWaitSeconds = 900`, ocena iz 14 dni), `AutomationEngine.cs` (tik 15 s, zakup 90 s, vrata iz `JobQueue.Gate`), `AutomationStore.cs` (`ops.EnsureJobDefinition` ne prepiše urnika), `JobRunner.cs`, `ChildProcessJob.cs`, `MonitorPolicy.cs`.\r\n- **Gostitelj:** `PIM_Solution/workers/PIM.AutomationHost` — stikala `--enkrat \u003cPOSEL\u003e`, `--posli A,B`, `--samo-nadzor`, `--preveri`, `--pomoc`.\r\n- **Namestitev:** `deploy/Install-AutomationHost.ps1` (storitev, ne LocalSystem), `scripts/Namesti-nadzor-avtomatike.ps1` (zunanji nadzor, alarm `AutomationHostDown` po 10 min molka).\r\n- **Stara opravila:** `scripts/Namesti-opravila.ps1` (5 nalog prek `Tiho.vbs` → PowerShell cikli), `deploy/Configure-ScheduledTasks.ps1` (Watchdog, AlertDispatcher), `deploy/Configure-WorkerScheduledTasks.ps1` (SAOP katalog, zaloga, dobave, Magento).\r\n- **Tabele:** `ops.JobDefinition`, `ops.JobDependency`, `ops.JobRun`, `ops.JobStepRun`, `ops.JobPhaseRun`, `ops.JobSource`, `ops.SchedulerLease`, `ops.OrganizationAutomationPolicy`, `ops.ScheduleProfile` (postopki, ki jih posel sme odpreti).\r\n- **Migracije:** 237 (enotni model opravil), 246 (en motor, DEMO izključen), 247 (alarmi po novem ritmu), 254 (odstranjeni stari cikli in razporejevalnik v IIS), 255 (faze korakov), 256 (viri in svežina), 259 (nadzor poslov), 260/261 (zamuda in premor SAOP), 276 (meja svežine na strani).\r\n- **Dokumentacija:** `Navodila/05_AutomationHost.md`, `docs/AVTOMATIZACIJA.md`, `docs/NACRT_RAZPOREJEVALNIK.md`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ **Trije razporejevalniki.** Po kodi je od migracije 254 edini motor `PIM.AutomationHost`; razporejevalnik v IIS intranetu je iz kode odstranjen. V praksi pa obstajajo trije načini zagona:\r\n  1. **Windows opravila** (Task Scheduler) s PowerShell cikli — skripte so še v `scripts/` in `deploy/`; po stanju 2026-09-22 je PRD (`PIM_test_app`, baza `PIM_prd`) poganjal **samo** njih, storitev gostitelja tam ni bila nameščena.\r\n  2. **Razporejevalnik v IIS intranetu** — v kodi ga ni več, a vsak intranet, objavljen pred 254, ga še vsebuje (privzeto vklopljen do 2026-09-22) in lahko zgrabi zakup; katera različica je na PRD, iz kode ni razvidno.\r\n  3. **PIM.AutomationHost** — na DEV nameščen v `C:\\Users\\David\\PIM-avtomatika` kot konzola z opravilom ob prijavi (»PIM avtomatika«), ne kot storitev; pas SAOP, naslednji zagon od konca, Job Object.\r\n  Uporabnik želi **en preprost pogon**: na PRD namestiti storitev, odstraniti stara opravila (ostane le »PIM nadzor avtomatike«) in izbrisati skripte starih ciklov iz repozitorija.\r\n- ⚠️ Stara opravila se umaknejo ob **katerem koli** živem zakupu — tudi zakupu gostitelja z razvojnega računalnika, priklopljenega na produkcijsko bazo. Obratno: ko gostitelj pade, stara opravila spet začnejo klicati SAOP.\r\n- ⚠️ DEV in PRD kličeta **isti živi SAOP** (`iCenterAPI`); gostitelj na DEV podvaja obremenitev SAOP.\r\n- ⚠️ Znano dejstvo »magento-csv vsakih 15 min« velja za staro opravilo »PIM magento«; v gostitelju `WEB_CATALOG_EXPORT` teče po uspešni objavi, sicer vsako uro.\r\n- ⚠️ `Navodila/05_AutomationHost.md` navaja ključe poslov (`SAOP_STOCK`, `NW_STOCK`, `BT_XML` …), ki niso ključi v `JobCatalog` (npr. `STOCK_IMPORT`, `SUPPLIER_STOCK_IMPORT`, `SUPPLIER_CATALOG_IMPORT`); `--enkrat SAOP_STOCK` zato ne bo deloval.\r\n- ⚠️ `SUPPLIER_CATALOG_IMPORT` na PRD potrebuje nastavitev `Fetch:NW_XML` (in verjetno `Fetch:BT_XML`) v `appsettings.Local.json`; brez nje prevzem pade in branje se preskoči.\r\n- ⚠️ Dnevniki gostitelja: čiščenje (`PruneLogs`) obstaja, obseg hrambe ni viden na strani.\r\n- ⚠️ Zahtevo za zagon `WEB_CATALOG_EXPORT` lahko odda tudi odobritev na varovalkah katalog.csv (`ops.RequestJobRun` iz migracije 277, `SafeguardService`); zapora testnega intraneta (#57) te poti ne pokrije.\r\n\r\n## Povezani procesi\r\n\r\n- [Nadzor sistema](nadzor-sistema.md): kje vidiš stanje poslov, teke in sled.\r\n- [Namestitev in migracije](namestitev-in-migracije.md): ustavitev in zagon gostitelja ob objavi.\r\n- [Mesta shranjevanja](mesta-shranjevanja.md): mape, v katere pišejo posli.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): posli `SAOP_PRODUCT_IMPORT`, `PRICE_IMPORT`, `STOCK_IMPORT`.\r\n- [Dobaviteljski katalogi XML](../02-vhodi/dobaviteljski-katalogi-xml.md): `SUPPLIER_CATALOG_IMPORT`.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): `PRODUCT_VALIDATION`.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): `WEB_CATALOG_EXPORT`.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): `SAOP_OUTBOUND_DISPATCH` (privzeto izklopljen).\r\n- [Nadzorna plošča](../01-nadzor/nadzorna-plosca.md): povzetek stanja tokov.\r\n"},{"pot":"09-administracija/bralni-api-za-ai.md","vsebina":"---\r\nid: bralni-api-za-ai\r\nnaslov: Bralni API za AI in analize (PIM.Api, MCP)\r\npodrocje: 09-administracija\r\nstanje: delno\r\nbere: [pim.izdelek, pim.atributi, pim.besedila, pim.kategorije-izdelka, pim.mediji, pim.cene, pim.zaloge, pim.stranke, pim.popusti, pim.narocila, pim.analitika, pim.validacija, pim.urniki, pim.uporabniki]\r\npise: [pim.uporabniki]\r\nstrani: []\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Api/*.cs, PIM_Solution/deploy/Publish-Api.ps1, PIM_Solution/deploy/Install-PimApi.ps1, PIM_Solution/tests/PIM.F12.ApiContractTests/Program.cs]\r\nmigracije: [287]\r\n---\r\n\r\n# Bralni API za AI in analize\r\n\r\n\u003e **Področje:** Administracija · **Lastnik:** skrbnik (ADMIN) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-29, iz kode in na razvojni bazi\r\n\r\n## 1. Namen\r\n\r\nAI orodja (Claude Code, Claude Desktop, ChatGPT z akcijami), Excel in skripte **berejo** podatke PIM: izdelke, cene, zalogo, stranke, naročila dobaviteljem, analitiko in stanje validacije. API je ločena spletna aplikacija ob intranetu (`PIM.Api`, IIS, vrata 5095). **Pisati ne more nič** — ne v katalog, ne v SAOP, ne v nastavitve. Rezultat: vodja ali komercialist vpraša AI po domače (»Koliko je vredna zaloga IQ Lightinga po dobaviteljih?«), AI pa odgovori s številkami iz PIM.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Uporablja AI s svojim ključem (vprašanja o cenah, zalogi, strankah — če ima ključ to področje). |\r\n| Urednik kataloga | Uporablja AI za pregled izdelkov in kakovosti (kartica izdelka z naborom validacije). |\r\n| Skrbnik | Namesti API, ustvari, spremeni in prekliče ključe (`PIM.Api.exe odjemalec ...`), pregleduje dnevnik klicev. |\r\n| Avtomatika (PIM) | Ob vsakem klicu preveri ključ, omrežje, podjetje, področje in hitrost; zapiše klic v dnevnik; enkrat na dan pobriše dnevnik, starejši od 90 dni. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** vsakič, ko AI ali skripta pokliče API (REST `GET /api/v1/...` ali MCP `POST /mcp`).\r\n- **Po urniku:** čiščenje dnevnika klicev enkrat na dan (znotraj `PIM.Api`, ne v gostitelju avtomatike).\r\n- **Ob dogodku:** ni. API ne sproži nobenega posla; bere, kar so pripravili drugi procesi (zajem iz SAOP, validacija, cene, zaloga).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Vprašanje AI (orodje MCP z argumenti) ali klic REST s ključem `X-Api-Key: pim_...` | AI, skripta, Excel |\r\n| **Vhod** | Podatki PIM: izdelki, atributi, besedila, kategorije, slike, cene, zaloga, stranke, popusti, naročila, analitika, validacija, svežina | PIM (samo postopki sheme `api`) |\r\n| **Izhod** | JSON (ali CSV za Excel) z odgovorom; pri MCP besedilo za AI | AI, skripta, Excel |\r\n| **Izhod** | Dnevnik klicev (kdo, kdaj, kaj, koliko vrstic), čas zadnje uporabe ključa | PIM (`api.RequestLog`, `api.Client`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Vprašanje AI]) --\u003e B[\"AI izbere orodje MCP ali klic REST\"]\r\n    S[\"Skrbnik: odjemalec dodaj / spremeni / preklici\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM.Api\"]\r\n    C{\"Omrežje dovoljeno?\"}\r\n    D{\"Ključ veljaven?\"}\r\n    E{\"Podjetje in področje ključa?\"}\r\n    F[\"Postopek api.* bere podatke\"]\r\n    G([Odgovor AI])\r\n    H([401 / 403 / 429 z razlogom])\r\n    L[(\"Ključi in dnevnik klicev\")]\r\n    X[(\"Podatki PIM: izdelki, cene, zaloga, stranke, validacija\")]\r\n  end\r\n  B --\u003e C\r\n  C -- da --\u003e D\r\n  C -- ne --\u003e H\r\n  D -- da --\u003e E\r\n  D -- ne --\u003e H\r\n  E -- da --\u003e F\r\n  E -- ne --\u003e H\r\n  X --\u003e F\r\n  F --\u003e G\r\n  F --\u003e L\r\n  S --\u003e L\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,G,H endp; class B,S user; class C,D,E,F auto; class L,X data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | strežnik | Objavi in namesti API (`deploy/Publish-Api.ps1`, `deploy/Install-PimApi.ps1`), vpiše povezavo do baze z uporabnikom v vlogi `pim_api_reader`. | Nastane IIS spletno mesto PIM-API na vratih 5095. | `http://STREZNIK:5095/health` vrne `\"status\":\"ok\"`. |\r\n| 2 | Skrbnik | ukazna vrstica ob `PIM.Api.exe` | `odjemalec dodaj --ime \"...\" --podjetja 2,3 --podrocja izdelki,cene,zaloga --velja-do ...` | Nastane ključ `pim_...` (izpiše se enkrat; v bazi samo odtis SHA-256), zapis v `api.ClientHistory`. | `odjemalec seznam` pokaže ključ kot aktiven. |\r\n| 3 | Uporabnik | Claude Code / Claude Desktop | Doda strežnik MCP z naslovom `.../mcp` in glavo `X-Api-Key` (Navodila/08). | AI ob zagonu pokliče `initialize` (dobi navodila za AI) in `tools/list` (vidi samo orodja področij ključa). | AI našteje orodja `pim-api`. |\r\n| 4 | Uporabnik | AI | Vpraša po domače, npr. »Pokaži kartico izdelka X in povej, zakaj ni pripravljen za splet.« | AI pokliče orodja (`tools/call`), API izvede postopek `api.*` v izbranem podjetju, klic zapiše v dnevnik. | Odgovor s številkami iz PIM; v `api.RequestLog` je vrstica. |\r\n| 5 | Skrbnik | ukazna vrstica | `odjemalec preklici --id N` ob odhodu sodelavca ali izgubi ključa. | Ključ ne velja najkasneje po 60 s; zapis v `api.ClientHistory`. | Klic s starim ključem vrne 401. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Samo branje.** Uporabnik baze v vlogi `pim_api_reader` ima samo `EXECUTE` na shemi `api`; brez pravic na tabele, `api.Admin_*` je prepovedan. Vsa orodja MCP so označena `readOnlyHint`. API ne more ničesar poslati v SAOP ali v `katalog.csv`.\r\n- **Podjetja ločena.** Vsak klic je v enem podjetju (`organizationId`); ključ vidi samo svoja podjetja.\r\n- **Področja.** `stranke` so osebni podatki — to področje dodeli premišljeno. Kartica izdelka izpusti nabore področij, ki jih ključ nima.\r\n- **Omrežje.** `Api:AllowedRemoteIps`; privzeto samo notranje omrežje. Objava na internet (HTTPS, OAuth) samo po odločitvi lastnika.\r\n- **Sled.** Vsak klic v `api.RequestLog` (90 dni), vsaka sprememba ključa v `api.ClientHistory`.\r\n- **Kakovost podatkov.** `validationStatus` v iskanju je shranjeno stanje zadnje validacije (lahko zastarelo, PENDING = še ni preverjeno); merodajen je nabor `validation` na kartici izdelka. To piše tudi v navodilih za AI.\r\n- **Test F12** (`PIM.F12.ApiContractTests`) ob vsakih vratih preveri, da se katalog ujema s postopki v 287, da vloga ostane samo za branje in da MCP odgovarja po protokolu. `PIM.Api` je v `PIM.sln`, zato ga vrata vedno prevedejo.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| `/health` vrne 503 | Napačna povezava do baze ali prijava IIS nima dostopa | Preveri `appsettings.Local.json` ob `PIM.Api.exe` (Navodila/08, 1.3). |\r\n| 401 »Ključ ni veljaven« | Tipkarska napaka, preklican ali potekel ključ | `odjemalec seznam`, po potrebi nov ključ. |\r\n| AI odgovori »Ključ nima področja …« | Ključ nima področja (npr. stranke) | `odjemalec spremeni --id N --podrocja ...` (premišljeno pri strankah). |\r\n| AI trdi, da so podatki stari | Avtomatika ne teče ali je posel v napaki | `/api/v1/freshness`, nato `/sistem` v intranetu. |\r\n| Claude.ai v brskalniku ali ChatGPT se ne poveže | Povezovalniki v oblaku zahtevajo javni HTTPS in pogosto OAuth, glave `X-Api-Key` ne podpirajo | Uporabi Claude Code ali Claude Desktop v notranjem omrežju. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Koda:** `Catalog.cs` (en vir za poti, parametre, OpenAPI, navodila in orodja MCP), `QueryRunner.cs` (preverjanje parametrov, izvedba postopkov), `ClientAccess.cs` (ključi, dnevnik), `McpProtocol.cs` (MCP brez baze), `ApiDocs.cs` (`/openapi.json`, `/api/v1/guide`), `ClientCli.cs` (`odjemalec ...`), `Program.cs` (varnost, poti).\r\n- **Baza:** shema `api` (23 postopkov), tabele `api.Client`, `api.ClientHistory`, `api.RequestLog`, vloga `pim_api_reader` — migracija 287 (`287_BralniApiZaAnalizeInAi.sql`).\r\n- **Tehnični opis:** `docs/API.md`; navodila za lastnika: `Navodila/08_API_za_AI.md`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Ni posebne točke ali filtra »izdelki z napakami / niso pripravljeni za splet« (AI mora kartico brati izdelek po izdelek). Potrebuje novo migracijo — ločena naloga.\r\n- ⚠️ Na razvojni bazi ni veljavnega ključa (oba preklicana); ključ ustvari lastnik. Ali je API nameščen na produkciji, ni preverjeno.\r\n- ⚠️ `READ_COMMITTED_SNAPSHOT` na bazi ni vklopljen: dolga bralna poizvedba med nočnim uvozom lahko čaka na zaklep.\r\n- ⚠️ Ključi so zapisani pod oznako `pim.uporabniki` (dostop); lastne oznake za dnevnik klicev v slovarju podatkov ni.\r\n\r\n## Povezani procesi\r\n\r\n- [Uporabniki in vloge](uporabniki-in-vloge.md): dostop do intraneta (ključi API so ločeni od računov intraneta).\r\n- [Namestitev in migracije](namestitev-in-migracije.md): migracija 287 in objava.\r\n- [Avtomatika in urniki](avtomatika-in-urniki.md): svežina podatkov, ki jih API bere.\r\n"},{"pot":"09-administracija/mesta-shranjevanja.md","vsebina":"---\r\nid: mesta-shranjevanja\r\nnaslov: Mesta shranjevanja datotek (prevzem, izvoz, dnevniki, delovni zvezki)\r\npodrocje: 09-administracija\r\nstanje: deluje\r\nbere: [pim.urniki]\r\npise: [pim.urniki]\r\nstrani: [/administracija/mape]\r\nposli: [WEB_CATALOG_EXPORT, SUPPLIER_CATALOG_IMPORT, SUPPLIER_STOCK_IMPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/AdminPaths.razor, PIM_Solution/src/PIM.Intranet/Services/AdminConsoleService.cs, PIM_Solution/src/PIM.Operations/SystemPaths.cs, scripts/Nastavi-izvozno-pot.ps1, scripts/Nastavi-pravice-izvozne-mape.ps1]\r\nmigracije: []\r\n---\r\n\r\n# Mesta shranjevanja datotek\r\n\r\n\u003e **Področje:** Administracija · **Lastnik:** skrbnik (ADMIN) · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nSkrbnik nastavi, v katere mape PIM zapisuje datoteke: prevzete datoteke dobaviteljev (`LANDING_ROOT`), izvozne datoteke za splet — katalog.csv in stranke.csv (`EXPORT_ROOT`), dnevnike (`LOG_ROOT`) in delovne zvezke Excel (`WORKBOOK_ROOT`). Pot se shrani šele, ko PIM vanjo dejansko zapiše in pobriše testno datoteko.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ni udeležena. |\r\n| Urednik kataloga | Ni udeležen. |\r\n| Skrbnik | Nastavi in preizkusi poti; na strežniku dodeli pravice mapam. |\r\n| Avtomatika (PIM) | Workerji in gostitelj avtomatike berejo poti iz registra ob vsakem teku. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** prva namestitev na strežnik, selitev mape, napaka »mapa ni zapisljiva« v izpisu posla.\r\n- **Po urniku:** ni; poti uporabljajo posli `WEB_CATALOG_EXPORT`, `SUPPLIER_CATALOG_IMPORT`, `SUPPLIER_STOCK_IMPORT` in drugi.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Absolutna pot ali omrežna lokacija | skrbnik |\r\n| **Izhod** | Vrstica v registru poti z zadnjo preverbo | PIM (`ops.SystemPath`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[\"Vpiše pot pri izbranem mestu\"]\r\n    B --\u003e C[\"Preizkusi dostop ali Preizkusi in shrani\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    D[[\"Zapis in brisanje testne datoteke pod računom intraneta\"]]\r\n    E{\"Zapis uspel?\"}\r\n    F[(\"Register poti\")]\r\n    G[[\"Workerji uporabijo pot ob naslednjem teku\"]]\r\n  end\r\n  C --\u003e D\r\n  D --\u003e E\r\n  E -- ne --\u003e B\r\n  E -- da --\u003e F\r\n  F --\u003e G\r\n  G --\u003e H([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,H endp; class B,C user; class D,E,G auto; class F data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | `/administracija/mape` | Pri mestu (Prevzete datoteke, Izvozne datoteke za splet, Dnevniki, Delovni zvezki) vpišeš pot. | — | — |\r\n| 2 | Skrbnik | isto | **Preizkusi dostop** (samo preizkus) ali **Preizkusi in shrani**. | PIM pod računom intraneta (izpisan na vrhu strani) zapiše in pobriše testno datoteko; pot se shrani samo ob uspehu. Sprememba se zapiše v sled (`PATH_UPDATE`). | Zeleno sporočilo; oznaka »Nastavljeno«, kdo in kdaj. |\r\n| 3 | Skrbnik | isto | **Vrni na privzeto**. | Vrstica se odstrani; velja vgrajeni privzetek (izpisan pod naslovom). Sled `PATH_CLEAR`. | Oznaka »Privzeta pot«. |\r\n| 4 | Skrbnik | strežnik | Računu gostitelja avtomatike (in identiteti IIS bazena) dodeli pravico pisanja v iste mape (npr. `icacls`). | Workerji tečejo pod drugim računom kot intranet. | Naslednji tek posla na `/sistem` je zelen. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Pot se ne shrani, če preizkus zapisa ne uspe — obstoj mape ne pove ničesar o pravicah.\r\n- Na strežniku pot ne sme biti v objavljeni mapi spletnega mesta (naslednja objava jo prepiše).\r\n- Samo ADMIN.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Preizkus uspe, posel pa pade z »ni zapisljivo« | Worker teče pod drugim računom brez pravic | Dodeli pravice računu storitve `PIM.AutomationHost`. |\r\n| katalog.csv ni na pričakovanem mestu | `EXPORT_ROOT` ni nastavljen ali kaže drugam | Preveri vrstico Izvozne datoteke; primer PRD: `C:\\inetpub\\wwwroot\\PIM_exports_csv`. |\r\n| Po objavi izginejo datoteke | Pot je bila v mapi spletnega mesta | Premakni na mapo zunaj objave. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Stran:** `AdminPaths.razor`; zavihki `SistemskeZadeveTabs`.\r\n- **Storitve:** `AdminConsoleService.GetSystemPathsAsync`, `SaveSystemPathAsync`, `ClearSystemPathAsync`, `LogActivityAsync`; ključi in opisi v `PIM.Operations/SystemPaths.cs` (`LANDING_ROOT`, `EXPORT_ROOT`, `LOG_ROOT`, `WORKBOOK_ROOT`).\r\n- **Tabela:** `ops.SystemPath` (vrstice po podjetju so možne; stran ureja samo splošne).\r\n- **Skripte:** `scripts/Nastavi-izvozno-pot.ps1`, `scripts/Nastavi-pravice-izvozne-mape.ps1`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Preizkus velja samo za račun intraneta; za račun gostitelja avtomatike ga stran ne more narediti.\r\n- ⚠️ Znano (2026-09-21/23): na DEV izvozna mapa pod `inetpub` ni zapisljiva, na PRD je bila pravica popravljena ročno z `icacls` za bazen `PIM_prd_pool`. Ob menjavi računa ali strežnika se napaka ponovi.\r\n\r\n## Povezani procesi\r\n\r\n- [Avtomatika in urniki](avtomatika-in-urniki.md): posli, ki pišejo v te mape.\r\n- [Namestitev in migracije](namestitev-in-migracije.md): nastavitev poti ob prvi namestitvi.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): izvoz v `EXPORT_ROOT`.\r\n- [Dobaviteljski katalogi XML](../02-vhodi/dobaviteljski-katalogi-xml.md): prevzem v `LANDING_ROOT`.\r\n"},{"pot":"09-administracija/nadzor-sistema.md","vsebina":"---\r\nid: nadzor-sistema\r\nnaslov: Nadzor sistema — posli, teki, alarmi, sled sprememb in nočni samotest\r\npodrocje: 09-administracija\r\nstanje: deluje\r\nbere: [pim.urniki, pim.surovi-zajem, pim.uporabniki]\r\npise: [pim.urniki, obvestila]\r\nstrani: [/sistem, /sistem/posel/{JobKey}, /sistem/teki, /sistem/teki/{RunId}, /sistem/sled]\r\nposli: [ALERT_EVALUATION, ALERT_DELIVERY, SYSTEM_SELF_TEST]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Monitor.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/MonitorJob.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestRuns.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestRunDetail.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/AdminActivity.razor, PIM_Solution/src/PIM.Intranet/Services/MonitorService.cs, PIM_Solution/src/PIM.Intranet/Services/AdminConsoleService.cs, PIM_Solution/src/PIM.Intranet/Services/PipelineReadService.cs, PIM_Solution/src/PIM.Automation/MonitorPolicy.cs, PIM_Solution/src/PIM.Automation/AutomationOverview.cs, PIM_Solution/src/PIM.Intranet/Components/Shared/PimTab.cs]\r\nmigracije: [247, 254, 255, 256, 259, 260, 261, 276]\r\n---\r\n\r\n# Nadzor sistema — posli, teki, alarmi, sled sprememb in nočni samotest\r\n\r\n\u003e **Področje:** Administracija · **Lastnik:** skrbnik (ADMIN) · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nSkrbnik na eni strani vidi, ali gostitelj avtomatike teče, ali so podatki vsakega posla sveži (zeleno/sivo/rdeče), zakaj je kaj rdeče in kateri en korak težavo reši; od tam gre v podrobnosti posla (koraki, faze, izpis, zgodovina, nastavitve), v teke vhodnih podatkov in v sled, kdo je kaj spremenil.\r\n\r\n**Nočni samotest** (`SYSTEM_SELF_TEST`, ob 04:30, privzeto izklopljen) vsako noč prehodi celo verigo (baza, urniki, utripi, katalog, svežina zaloge po virih, karantena, kakovost, spletni CSV, odhodna vrsta, odmev iz ERP, svežina izvozov) in vsakemu koraku izmeri čas. Samo bere: ne kliče SAOP-a, ne pošilja ničesar in ne spreminja podatkov; edini zapis je njegov lastni rezultat (`ops.SelfTestRun`, `ops.SelfTestStep`). Ločene strani za zgodovino samotestov ni več (odstranjena 2026-09-29, odločitev lastnika): padel samotest se šteje v zvonec, zgodovina ostane v `ops.SelfTestRun` in dnevniku `samotest_*.log`. Podrobnosti: `docs/NADZOR_SKRBNIKA.md` §3.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Nima dostopa do `/sistem` (samo ADMIN); alarme lahko prejema po e-pošti, če je naročena. |\r\n| Urednik kataloga | Nima dostopa; prejema alarme po e-pošti, če je naročen. |\r\n| Skrbnik | Pregleda stanje, požene ali ustavi posel, vklopi postopek, potrdi ali razreši obvestilo, pregleda teke in sled. |\r\n| Avtomatika (PIM) | Nadzornik (`ALERT_EVALUATION`) odpira alarme, razpošiljanje (`ALERT_DELIVERY`) jih pošlje; stran se sama osveži vsakih 15 s. Nočni samotest (`SYSTEM_SELF_TEST`) zapiše svoj rezultat; padel samotest se šteje v zvonec. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** dnevni pregled; ko nekdo javi, da cene, zaloga ali katalog niso sveži; po objavi nove različice.\r\n- **Po urniku:** `ALERT_EVALUATION` in `ALERT_DELIVERY` vsakih 5 min; `SYSTEM_SELF_TEST` ob 04:30 (privzeto izklopljen, vklopi ga skrbnik); zunanja naloga »PIM nadzor avtomatike« vsakih 5 min preveri utrip gostitelja.\r\n- **Ob dogodku:** e-poštni alarm (naročnine na `/administracija`) ali rdeč zvonec v glavi aplikacije.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Zakup gostitelja, posli, teki, koraki, faze, viri s svežino, alarmi | PIM (`ops.*`) |\r\n| **Vhod** | Teki vhodnih podatkov (strani, zavrnjeni zapisi) | PIM (`ops.PipelineRun`, `raw.Inbox`) |\r\n| **Vhod** | Sledi sprememb iz več tabel | PIM (`intranet.GetUserActivityTrail`) |\r\n| **Vhod** | Zadnji zagon nočnega samotesta (za zvonec) | PIM (`ops.SelfTestRun`, `ops.SelfTestStep` prek `intranet.GetAdminPulse`) |\r\n| **Izhod** | Zahteve za zagon/ustavitev, vklopi poslov in postopkov, spremembe urnika in meje svežine, potrjeni/razrešeni alarmi | PIM (`ops.*`, sled `ops.LogUserActivity`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[\"Odpre Nadzor\"]\r\n    B --\u003e C{\"Gostitelj teče?\"}\r\n    C -- ne --\u003e D[\"Zažene storitev na strežniku\"]\r\n    C -- da --\u003e E{\"Rdeča vrstica?\"}\r\n    E -- ne --\u003e F([Vse teče])\r\n    E -- da --\u003e G[\"Klikne predlagano dejanje: Poženi zdaj, Vklopi, Odpri posel, Odpri izpis\"]\r\n    G --\u003e H[\"Stran posla: koraki, faze, izpis, zgodovina\"]\r\n    H --\u003e I[\"Popravi vzrok, Poženi zdaj ali spremeni urnik\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    J[(\"Posli, teki, faze, viri, alarmi\")]\r\n    K[[\"Gostitelj prevzame zahtevo v 15 s\"]]\r\n    L[[\"Nadzornik odpre ali zapre alarme\"]]\r\n  end\r\n  D --\u003e J\r\n  J --\u003e B\r\n  I --\u003e K\r\n  K --\u003e J\r\n  L --\u003e J\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,F endp; class B,D,G,H,I user; class C,E,K,L auto; class J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | `/sistem` (zavihek Nadzor) | Pogledaš prvi okvir: »Gostitelj avtomatike teče« (vrsta, računalnik, utrip) ali »… ne teče — posli ne tečejo«. | Odprtje strani označi obvestila kot videna (zvonec). | Utrip nekaj sekund star. |\r\n| 2 | Skrbnik | isto | Preberi povzetek: »Vse teče« ali »N poslov potrebuje pozornost: …«. Posli so razvrščeni po tokovih: Spletni katalog, Cene in zaloga, Naročila, Vhodni viri, Sistem. | Barva pomeni svežino **podatkov**, ne izhodno kodo procesa: zelena = sveži, siva = izklopljeno ali brez dela, rdeča = napaka ali prestari podatki. | — |\r\n| 3 | Skrbnik | isto | V rdeči vrstici klikneš ponujeno dejanje: **Poženi zdaj** (+ **Potrdi zagon** za zunanje klice), **Vklopi** (+ **Potrdi vklop**), **Vklopi postopek**, **Odpri posel**, **Odpri izpis**, **Kako zagnati gostitelja**. | Zahteva se zapiše; gostitelj jo prevzame ob naslednjem tiku. | »zahteva za zagon oddana«, nato »teče: …«. |\r\n| 4 | Skrbnik | isto, »Druga obvestila« | **Potrdi** (videl sem) ali **Razreši** (rešeno). | Alarm se označi; razrešen izgine s seznama. | Vrstica izgine ali je potrjena. |\r\n| 5 | Skrbnik | `/sistem/posel/{JobKey}` | Stran posla: **Stanje zdaj** (Kdaj teče, Zadnji rezultat, Kaj kliče), **1. Viri podatkov**, **2. Zadnji tek** (koraki in faze; `?tek=\u003cid\u003e` za starejši tek), **3. Izpis dnevnika** (**Pokaži cel izpis**), **4. Zgodovina tekov**, **5. Nastavitve** (Urnik, Meja svežine virov, Postopki, Odvisnosti, Datoteke). Krmila: **Poženi zdaj**, **Ustavi**, **Izklopi**, **Vklopi**. | Sprememba urnika ali meje svežine velja od naslednjega tika gostitelja; **Nazaj na kodo** vrne mejo svežine na privzeto. | Sporočilo o uspehu; vrednost v razdelku Nastavitve. |\r\n| 6 | Skrbnik | `/sistem/teki` | Filtriraš podjetje, vir, postopek, status → **Uporabi filtre**; klik na čas odpre tek. | Seznam izvedb vhodov (katalog, XML, zaloga …) s prebranimi, uspešnimi in zavrnjenimi zapisi. | — |\r\n| 7 | Skrbnik | `/sistem/teki/{RunId}` | Pregledaš identiteto teka, rezultat, korake in strani; klik na stran odpre težavo zajema. | Samo branje. | — |\r\n| 8 | Skrbnik | `/sistem/sled` | Izbereš obdobje (dan … leto), iščeš po uporabniku, šifri ali opisu → **Poišči**. | Kronološka sled iz vseh tabel s stolpcem Vir (iz katere tabele). | Vrstica z dejanjem, ki ga iščeš. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Rumene barve ni: vsaka rdeča vrstica ima razlog in natanko en predlagan korak.\r\n- Zagon ali vklop posla, ki kliče SAOP ali dobavitelja ali pošilja e-pošto, zahteva drugi klik.\r\n- Dejanja se zapišejo v sled; če zapis sledi pade, stran pove, da je bilo dejanje izvedeno (da ga ne ponoviš).\r\n- Vse strani `/sistem*` razen tekov so `[Authorize(Roles = \"ADMIN\")]`; pravice `tab.system.overview`, `tab.ingest.runs`, `view.system.activity`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Stanja poslov ni mogoče prebrati« | Baza nedosegljiva ali preobremenjena | Prikazano je zadnje prebrano stanje; poskusi **Osveži** čez minuto. |\r\n| Posel rdeč »blokiran« | Predhodnik ni uspel ali je njegov uspeh prestar | **Odpri posel** predhodnika. |\r\n| Postopek izklopljen (napaka 51100) | Postopek v `ops.ScheduleProfile` je izklopljen za podjetje | **Vklopi postopek**. |\r\n| Tek visi brez utripa | Worker zamrznil | **Ustavi** na strani posla; izpis dnevnika. |\r\n| Alarm se vedno znova odpira | Vzrok ni odpravljen (npr. mapa ni zapisljiva) | Preberi izpis, popravi vzrok (npr. `/administracija/mape`). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `Monitor.razor` (`/sistem`), `MonitorJob.razor` (`/sistem/posel/{JobKey}`), `IngestRuns.razor` in `IngestRunDetail.razor` (`/sistem/teki`, tudi stari naslov `/zajem/teki`), `AdminActivity.razor` (`/sistem/sled`); zavihki `NadzorTabs` (Nadzor, Teki, Sled sprememb).\r\n- **Storitve:** `MonitorService` (`RequestRunAsync`, `RequestCancelAsync`, `SetJobEnabledAsync`, `EnablePipelineAsync`, `SetOrganizationAutomationAsync`, `SaveJobScheduleAsync`, `SaveSourceMaxAgeAsync`, `AcknowledgeAlertAsync`, `ResolveAlertAsync`), `AdminConsoleService` (`MarkAlertsSeenAsync`, `intranet.GetUserActivityTrail`), `PipelineReadService`.\r\n- **Presoja barve:** `PIM.Automation/MonitorPolicy.cs`, pregled `AutomationOverview.cs`.\r\n- **Tabele:** `ops.SchedulerLease`, `ops.JobDefinition`, `ops.JobRun`, `ops.JobStepRun`, `ops.JobPhaseRun`, `ops.JobSource`, `ops.Alert`, `ops.PipelineRun`, `ops.ScheduleProfile`, `ops.SelfTestRun`, `ops.SelfTestStep`.\r\n- **Samotest:** `PIM_Solution/tests/PIM.SelfTest.Nightly`, posel `SYSTEM_SELF_TEST` v `PIM.Automation/JobCatalog.cs` (opis poslov v [Avtomatika in urniki](avtomatika-in-urniki.md)).\r\n- **Migracije:** 247, 254, 255 (faze), 256 (viri in svežina), 259 (nadzor poslov), 260/261, 276 (meja svežine na strani).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ `/sistem/teki` in `/sistem/teki/{RunId}` imata samo `[Authorize]` (vsak prijavljen), dostop pa zapira dovoljenje `tab.ingest.runs`; podrobnosti teka kažejo še stare zavihke zajema (`IngestTabs`: Vhodi, Teki, Težave), čeprav je meni »Zajem podatkov« odstranjen.\r\n- ⚠️ Stran »Nadzor« prikazuje samo posle gostitelja; kar poženejo stara Windows opravila, se tu vidi le posredno (faze, teki), ne kot posel. Če na PRD še tečejo opravila, je slika na `/sistem` nepopolna.\r\n- ⚠️ Stran posla se sklicuje na odstranjene strani (`/sistem/opravila` v besedilu alarmov iz 254); preveriti besedila alarmov.\r\n- ⚠️ Stran v brskalniku ni bila preverjena s prijavljenim skrbnikom (znano iz sej 2026-09-21/22).\r\n\r\n## Povezani procesi\r\n\r\n- [Avtomatika in urniki](avtomatika-in-urniki.md): kaj posli počnejo in kdo jih poganja.\r\n- [Uporabniki in vloge](uporabniki-in-vloge.md): naročnine na alarme po e-pošti.\r\n- [Mesta shranjevanja](mesta-shranjevanja.md): pogost vzrok ponavljajočih alarmov.\r\n- [Nadzorna plošča](../01-nadzor/nadzorna-plosca.md): poslovni povzetek za vse vloge.\r\n- [Čakalna vrsta zajema](../02-vhodi/cakalna-vrsta-zajema.md) in [Težave in neujemanja zajema](../02-vhodi/tezave-in-neujemanja-zajema.md): nadaljevanje iz podrobnosti teka.\r\n"},{"pot":"09-administracija/namestitev-in-migracije.md","vsebina":"---\r\nid: namestitev-in-migracije\r\nnaslov: Namestitev nove različice in migracij baze\r\npodrocje: 09-administracija\r\nstanje: delno\r\nbere: [pim.urniki]\r\npise: []\r\nstrani: [/sistem, /health]\r\nposli: []\r\nkoda: [PIM_Solution/deploy/*.ps1, PIM_Solution/deploy/Backup-PIM.sql, PIM_Solution/deploy/portable/*, PIM_Solution/sql/migrations/Invoke-PendingMigrations.ps1, PIM_Solution/src/PIM.Migrator/Program.cs, PIM_Solution/src/PIM.Intranet/PIM.Intranet.csproj, PIM_Solution/src/PIM.Intranet/Program.cs, Navodila/*.md]\r\nmigracije: []\r\n---\r\n\r\n# Namestitev nove različice in migracij baze\r\n\r\n\u003e **Področje:** Administracija · **Lastnik:** skrbnik (ADMIN) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nNova različica PIM pride na strežnik v dveh delih: najprej **migracije baze** (oštevilčene `.sql` datoteke, ki jih uveljavi migrator ločeno od aplikacije), nato **objava aplikacije** (intranet + workerji + skripte v eni mapi, brez izvorne kode). Rezultat: baza in aplikacija na strežniku sta usklajeni, avtomatika spet teče.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Med vzdrževanjem ne dela v intranetu (stran kaže »Vzdrževanje PIM«). |\r\n| Urednik kataloga | Enako; po objavi preveri svoje strani. |\r\n| Skrbnik | Pripravi objavo, naredi varnostno kopijo, uveljavi migracije, prekopira objavo, preveri delovanje. |\r\n| Avtomatika (PIM) | Gostitelj avtomatike mora biti med kopiranjem ustavljen; po zagonu nadaljuje po urniku. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** ko je na razvojnem računalniku nova, preizkušena različica (commit na GitHub).\r\n- **Po urniku:** ni.\r\n- **Ob dogodku:** nujni popravek; samo sprememba baze (nova migracija) se lahko namesti brez objave aplikacije.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Mapa `PIM_Solution/sql/migrations` (NNN_Opis.sql) | razvojni računalnik / GitHub |\r\n| **Vhod** | Objava (`PIM.Intranet.exe`, `Workerji\\…`, `scripts\\…`) | `Publish-All.ps1` na razvojnem računalniku |\r\n| **Vhod** | `appsettings.Local.json` na strežniku (povezava, SAOP, `Fetch:*`) | ostane na strežniku, nikoli v objavi |\r\n| **Izhod** | Posodobljena baza + vrstice v `dbo.SchemaMigration` | SQL strežnik |\r\n| **Izhod** | Posodobljena mapa spletnega mesta IIS, zagnana storitev `PIM.AutomationHost` | strežnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[\"Razvoj: commit, migracije lokalno, Publish-All\"]\r\n    B --\u003e C[\"Strežnik: varnostna kopija baze COPY_ONLY\"]\r\n    C --\u003e D[\"Migracije: Status, nato uveljavi\"]\r\n    D --\u003e E{\"Pending je 0?\"}\r\n    E -- ne --\u003e D\r\n    E -- da --\u003e F[\"Ustavi gostitelja in nadzor, app_offline\"]\r\n    F --\u003e G[\"robocopy objave brez appsettings.Local.json\"]\r\n    G --\u003e H[\"Odstrani app_offline, zaženi gostitelja\"]\r\n    H --\u003e I{\"health 200 in Nadzor zelen?\"}\r\n    I -- ne --\u003e J[\"Povrni prejšnjo objavo\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    K[(\"dbo.SchemaMigration\")]\r\n    L[[\"Gostitelj prevzame zakup, posli po urniku\"]]\r\n  end\r\n  D --\u003e K\r\n  I -- da --\u003e L\r\n  L --\u003e M([Konec])\r\n  J --\u003e M\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,M endp; class B,C,D,F,G,H,J user; class E,I,L auto; class K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | razvojni računalnik | Commit in push; nove migracije uveljaviš lokalno: `Invoke-PendingMigrations.ps1 -MigrationsPath \u003cmapa\u003e -ConnectionString \u003crazvojna\u003e -Status`, nato brez `-Status`. | Uveljavijo se samo datoteke, ki jih v `dbo.SchemaMigration` še ni (vsaka v svoji `sqlcmd -I` seji). | Drugi `-Status`: Pending = 0; aplikacija lokalno dela. |\r\n| 2 | Skrbnik | razvojni računalnik | Zapreš Visual Studio, poženeš `deploy\\Publish-All.ps1 -Destination C:\\PIM_publish\\PIM_app` (najprej `-DryRun`; `-BrezWorkerjev` za samo intranet). | Samostojna objava (self-contained) intraneta, vseh workerjev v `Workerji\\` in skript v `scripts\\`; `appsettings.Local.json` se izloči. | Obstaja `Workerji\\PIM.AutomationHost\\PIM.AutomationHost.exe`. |\r\n| 3 | Skrbnik | strežnik, SSMS | Odpreš `deploy\\Backup-PIM.sql`, popraviš `@BackupFile`, poženeš. | `COPY_ONLY` varnostna kopija + `RESTORE VERIFYONLY`. | Sporočilo o uspešni preverbi. |\r\n| 4 | Skrbnik | strežnik | Migracije: `Invoke-PendingMigrations.ps1 … -Status`, nato brez `-Status` (potreben `sqlcmd`); brez `sqlcmd` prenosljiv paket (`New-PortableRelease.ps1`: `PIM.Migrator.exe` + `Apply-PimDatabase.ps1`). | Baza se posodobi **pred** aplikacijo (stara koda na novi bazi praviloma dela, obratno ne). | `-Status` še enkrat: Pending = 0; `CHANGED` pomeni spremenjeno že uveljavljeno datoteko. |\r\n| 5 | Skrbnik | strežnik, PowerShell kot administrator | `Stop-Service PIM.AutomationHost`; `Disable-ScheduledTask \u0027PIM nadzor avtomatike\u0027`; ustvariš `app_offline.htm` v mapi spletnega mesta. | Avtomatika in intranet se ustavita; uporabniki vidijo stran vzdrževanja. | `Get-Service` = Stopped. |\r\n| 6 | Skrbnik | strežnik | `robocopy \u003cobjava\u003e \u003cmapa spletnega mesta\u003e /MIR /XF appsettings.Local.json app_offline.htm /XD logs izvoz`. | Mapa spletnega mesta postane točna kopija objave; nastavitve, dnevniki in izvozi ostanejo. | Izhodna koda robocopy 0–7. |\r\n| 7 | Skrbnik | strežnik | Odstraniš `app_offline.htm`; `Start-Service PIM.AutomationHost`; `Enable-ScheduledTask \u0027PIM nadzor avtomatike\u0027`. | Intranet se zažene; gostitelj prevzame zakup. | `Invoke-WebRequest …/health` = 200; `/sistem` kaže `service · \u003cstrežnik\u003e` in svež utrip. |\r\n| 8 | Skrbnik | intranet | Prijava, `/sistem`: prvi posli po urniku se končajo zeleno. | — | Brez rdečih vrstic. |\r\n| 9 | Skrbnik | strežnik | Če nova različica ne dela: ponovi koraka 6–7 s prejšnjo objavo (hrani npr. `C:\\PIM_publish\\PIM_app_prejsnja`). Bazo vračaš samo iz varnostne kopije. | — | `/health` in `/sistem`. |\r\n\r\n**Prva namestitev** (enkrat): .NET 10 Hosting Bundle, IIS bazen (*No Managed Code*, `AlwaysRunning`, brez `idleTimeout`), `appsettings.Local.json` v mapi spletnega mesta, mape `EXPORT_ROOT`/`LANDING_ROOT` izven mape spletnega mesta (`/administracija/mape`), storitev gostitelja (`Install-AutomationHost.ps1 -ZunanjiNadzor`), odstranitev starih Windows opravil (`scripts\\Namesti-opravila.ps1 -Odstrani`), prvi skrbnik (`PIM.Migrator --ustvari-admina \u003cime\u003e`).\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Baza vedno **pred** aplikacijo; pred migracijami na strežniku vedno varnostna kopija.\r\n- Že uveljavljene migracije se ne spreminja (hash v `dbo.SchemaMigration`) — popravek je nova datoteka z naslednjo številko.\r\n- `appsettings.Local.json` nikoli ne gre na GitHub ali v objavo; na vsakem stroju ostane svoj. Pred migracijo preveri `Server=` in `Database=` v povezavi (PIM vs PIM_test).\r\n- Na eni bazi sme teči en gostitelj avtomatike.\r\n- Dolge migracije poganjaj izven delovnega časa in z ustavljenim gostiteljem.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Migracija pade z napako 1934 | Pognana brez `QUOTED_IDENTIFIER` (`sqlcmd -I`) | Uporabi `Invoke-PendingMigrations.ps1` (sam doda `-I`). |\r\n| »empty string« ob zagonu skripte | Manjka `-MigrationsPath` pri `powershell -File` | Dodaj `-MigrationsPath $PWD`. |\r\n| Stanje `CHANGED` | Uveljavljena datoteka je bila pozneje spremenjena | Ne poganjaj na silo; naredi novo migracijo (glej `Navodila/07_Tezave.md`). |\r\n| Migracija pade na polovici | Napaka v eni datoteki | Prejšnje iz istega zagona ostanejo uveljavljene; popravi vzrok in poženi znova. |\r\n| robocopy ne more prepisati `.exe` | Gostitelj ali worker še teče | `Stop-Service PIM.AutomationHost`, počakaj na konec workerjev. |\r\n| Po objavi `/sistem` kaže `console` | Na bazo je priklopljen razvojni gostitelj | Ugasni ga. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Objava:** `deploy/Publish-All.ps1` (ovojnica okoli `dotnet publish … -c Release -r win-x64 --self-contained true`; cilj `PimPublishWorkersAndScripts` v `PIM.Intranet.csproj` doda `Workerji\\` in `scripts\\`), `deploy/Publish-Intranet.ps1` (z izvorno kodo na strežniku, z rollbackom), `deploy/New-PortableRelease.ps1` (+ `deploy/portable/*`).\r\n- **Migracije:** `sql/migrations/Invoke-PendingMigrations.ps1` (vsaka datoteka v svoji seji, brez `--verify`), `src/PIM.Migrator` (vse čakajoče v eni transakciji z zaklepom, `--verify` F0–F10, `--show-migrations`, `--create-database`, `--ustvari-admina`), `deploy/Apply-Migrations.ps1` (`dotnet run` migratorja). Obe orodji pišeta v isto `dbo.SchemaMigration` z istim hashem.\r\n- **Zdravje:** `/health` (anonimno, `{\"stanje\":\"zdravo\"}`).\r\n- **Navodila:** `Navodila/README.md` (hitri vrstni red), `02_Migracije.md`, `03_Publish.md`, `04_Prenos_na_streznik.md`, `05_AutomationHost.md`, `07_Tezave.md`; `docs/PUBLISH.md`, `deploy/README-Windows.md`, `deploy/PORTABLE_RELEASE.md`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ V mapi migracij so **podvojene številke** (npr. 230, 236, 237, 249, 256, 276 imajo po dve datoteki). Ledger jih loči po imenu, vrstni red med dvema z isto številko pa je abecedni — pri odvisnostih med njima lahko pride do napake.\r\n- ⚠️ Po zapiskih iz sej na razvojni bazi nekatere migracije (npr. 246/247, 275, 279) niso bile uveljavljene po običajni poti ali niso v ledgerju; `-Status` na DEV zato ne odraža nujno stanja PRD.\r\n- ⚠️ `Navodila/*.md` navajajo poti `C:\\Users\\david\\Desktop\\PIM\\NoviPIM`, repozitorij pa je v `Documents\\GitHub\\PIM`; primeri ukazov se ne ujemajo z dejanskim računalnikom.\r\n- ⚠️ Objava s seboj nese tudi skripte starih ciklov (`scripts\\Namesti-opravila.ps1` …), ki lahko na strežniku znova registrirajo stara Windows opravila.\r\n- ⚠️ V repozitoriju sta zabeleženi mapi objave `publish_2026-09-23` in `publish_2026-09-23_sc` (več tisoč datotek) — objava ne sodi v git.\r\n- ⚠️ Navodila predpostavljajo, da je gostitelj na PRD nameščen kot storitev; po stanju 2026-09-22 ni bil (glej [Avtomatika in urniki](avtomatika-in-urniki.md)). Koraka 5 in 7 zato na PRD morda še ne veljata.\r\n- ⚠️ Strežnik je publish-only (brez git in `PIM.sln`); `Publish-Intranet.ps1` z rollbackom predpostavlja izvorno kodo na strežniku in tam ni uporaben.\r\n\r\n## Povezani procesi\r\n\r\n- [Avtomatika in urniki](avtomatika-in-urniki.md): ustavitev in zagon gostitelja, stara opravila.\r\n- [Nadzor sistema](nadzor-sistema.md): preverjanje po objavi.\r\n- [Mesta shranjevanja](mesta-shranjevanja.md): nastavitev map ob prvi namestitvi.\r\n- [Uporabniki in vloge](uporabniki-in-vloge.md): prvi skrbnik na novi bazi.\r\n"},{"pot":"09-administracija/uporabniki-in-vloge.md","vsebina":"---\r\nid: uporabniki-in-vloge\r\nnaslov: Uporabniki, vloge in dostop do strani\r\npodrocje: 09-administracija\r\nstanje: delno\r\nbere: [pim.uporabniki]\r\npise: [pim.uporabniki, obvestila]\r\nstrani: [/administracija, /administracija/vloge, /prijava, /ni-najdeno]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/SystemUsers.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/SystemRoles.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/Login.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/NotFound.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/PimAccessRouteView.razor, PIM_Solution/src/PIM.Intranet/Services/IntranetUserAdministrationService.cs, PIM_Solution/src/PIM.Intranet/Services/RoleAdministrationService.cs, PIM_Solution/src/PIM.Intranet/Services/LocalUserAuthenticationService.cs, PIM_Solution/src/PIM.Intranet/Services/ActiveDirectoryService.cs, PIM_Solution/src/PIM.Intranet/Services/PimAccessCatalog.cs, PIM_Solution/src/PIM.Intranet/Services/PimAuthorization.cs, PIM_Solution/src/PIM.Intranet/Services/PimNavigation.cs, PIM_Solution/src/PIM.Intranet/Services/PimSessionSecurity.cs, PIM_Solution/src/PIM.Migrator/Program.cs, PIM_Solution/tools/PIM.UserProvisioning/Program.cs]\r\nmigracije: [224, 225, 250, 259]\r\n---\r\n\r\n# Uporabniki, vloge in dostop do strani\r\n\r\n\u003e **Področje:** Administracija · **Lastnik:** skrbnik (ADMIN) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nSkrbnik doda domenski (Active Directory) ali lokalni račun, mu dodeli vloge, po potrebi nastavi geslo lokalnemu računu, ga onemogoči ali prisilno odjavi, in določi, katere strani in zavihke vidi posamezna vloga. Rezultat: vsak sodelavec vidi in ureja samo tisto, kar mu vloga dovoli.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Se prijavi; nič ne ureja. |\r\n| Urednik kataloga | Se prijavi; nič ne ureja. |\r\n| Skrbnik | Edini upravlja račune, vloge, dovoljenja in naročnine na obvestila. |\r\n| Avtomatika (PIM) | Ob vsaki zahtevi preveri dovoljenje poti; ob drugi prijavi istega računa ponudi prevzem seje. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** nov sodelavec, odhod sodelavca, sprememba dela, pozabljeno lokalno geslo, nova vloga.\r\n- **Po urniku:** ni.\r\n- **Ob dogodku:** prvi skrbnik na novi bazi se ustvari z orodjem (`PIM.Migrator --ustvari-admina \u003cime\u003e` ali `tools/PIM.UserProvisioning`).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Domenski uporabnik `DOMENA\\uporabnik` ali lokalno ime, ime in priimek, e-pošta, začetno geslo, začetna vloga | skrbnik, Active Directory |\r\n| **Vhod** | Izbor strani, zavihkov in podstrani za vlogo | skrbnik |\r\n| **Izhod** | Računi, vloge, dovoljenja vlog, naročnine na alarme in dnevni mail »Zaloga pod MID« | PIM (`sec.*`, `intranet.UserAlertSubscription`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B{\"Domenski ali lokalni račun?\"}\r\n    B -- domenski --\u003e C[\"Vpiše DOMENA uporabnik, Najdi v AD, Dodaj račun\"]\r\n    B -- lokalni --\u003e D[\"Ime, e-pošta, začetno geslo, vloga, Ustvari račun\"]\r\n    C --\u003e E[\"Uredi račun: vloge, obvestila, Shrani vloge\"]\r\n    D --\u003e E\r\n    F[\"Vloge: Dodaj vlogo, izbor strani in zavihkov, Shrani dostop\"]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    G[(\"Računi, vloge, dovoljenja\")]\r\n    H{\"Ob prijavi: geslo AD ali lokalno pravilno?\"}\r\n    I{\"Ob vsaki strani: dovoljenje vloge?\"}\r\n    J([Stran odprta])\r\n    K([Ta stran ni vključena v tvojo vlogo])\r\n  end\r\n  E --\u003e G\r\n  F --\u003e G\r\n  G --\u003e H\r\n  H -- da --\u003e I\r\n  I -- da --\u003e J\r\n  I -- ne --\u003e K\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,J,K endp; class C,D,E,F user; class B,H,I auto; class G data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | `/administracija` | **Dodaj uporabnika** → **Domenski račun** → vpišeš `DOMENA\\uporabnik`, izbereš začetno vlogo → **Najdi v AD** → **Dodaj račun**. | Račun se najprej preveri v AD; nastane vrstica z virom AD. Geslo ostane v AD. | Račun je v seznamu z oznako »Active Directory«, »Aktiven«. |\r\n| 2 | Skrbnik | isto | **Lokalni račun** → uporabniško ime, ime in priimek, e-pošta, začetno geslo, vloga → **Ustvari račun**. | Geslo se shrani samo zgoščeno. Zavrne se le prazno geslo; krajše od 10 znakov samo opozori. | Sporočilo o uspehu (morebitno priporočilo za geslo). |\r\n| 3 | Skrbnik | isto, »Uredi račun« | Ime, e-pošta → **Shrani profil**; lokalnemu računu novo geslo → **Nastavi geslo**; vloge (kljukice) → **Shrani vloge**; naročnine na vrste alarmov in »Zaloga pod MID«. | Spremembe so takoj v bazi; nova dovoljenja veljajo ob naslednji zahtevi uporabnika. | Oznake vlog v vrstici uporabnika. |\r\n| 4 | Skrbnik | isto | **Onemogoči** / **Omogoči**; **Prisilno odjavi** (pri računu, ki je bil že viden). | Onemogočen račun se ne more prijaviti (»Ta račun je onemogočen«). Prisilna odjava razveljavi sejo. | Oznaka »Onemogočen«. |\r\n| 5 | Skrbnik | `/administracija/vloge` | **Dodaj vlogo** → ime, koda (VELIKE_ČRKE), opis → **Ustvari in nastavi dostop**. | Nova lastna vloga brez dovoljenj. | Vloga je v seznamu levo. |\r\n| 6 | Skrbnik | isto | Izbereš vlogo, označiš strani in njihove zavihke/podstrani (**Izberi vse**, **Počisti**) → **Shrani dostop**. Ime in opis → **Shrani podatke**. | Podstran brez glavne strani ni dovoljena; glavna stran z zavihki potrebuje vsaj enega. Vloge ADMIN ni mogoče omejiti (vedno vse). | »N sprememb« izgine; uporabnik z vlogo vidi nove postavke menija. |\r\n| 7 | Skrbnik | isto | Lastno vlogo brez uporabnikov izbrišeš: **Izbriši vlogo** → **Da, izbriši**. | Sistemskih vlog in vlog z uporabniki ni mogoče izbrisati. | Vloge ni več. |\r\n| 8 | Uporabnik | `/prijava` | Uporabniško ime in geslo → **Prijava** (po želji »Zapomni si me« do 14 dni). | Domenski račun se preveri v AD, lokalni z zgoščenim geslom. Če je račun prijavljen drugje, ponudi **Da, prevzemi sejo** (potrditev velja 2 min). | Odpre se nadzorna plošča; meni kaže samo dovoljene strani. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Strani `/administracija*` in `/sistem*` so samo za vlogo ADMIN (`[Authorize(Roles = \"ADMIN\")]`).\r\n- Dostop do vsake strani preverja `PimAccessRouteView` po ključih iz `PimAccessCatalog` in `sec.RolePermission`; neznana nova stran je zaprta, dokler je ne dodamo v katalog. ADMIN ima vedno vse ključe.\r\n- Neznan ali odstranjen naslov (npr. star zaznamek) prijavljen uporabnik vidi kot stran »Strani ni (več)« (`/ni-najdeno`, #65) v postavitvi intraneta s povezavama na nadzorno ploščo in iskanje izdelkov; strežnik vrne kodo 404, preusmeritev ni. Neprijavljen gre najprej na `/prijava`. Izvozi, prenosi (`/izvoz/...`), prijava in datoteke ohranijo kratek 404 brez strani (`PimNotFoundScope`). Levi meni je na strani 404 enak kot drugod po vlogi uporabnika: dovoljenja iz `sec.RolePermission` se naložijo pred izrisom (`PimNotFoundScope.NavPermissionsItem`), ker Blazor pri ponovni izvedbi ne počaka asinhronega menija.\r\n- Zapisovalne pravice (urejanje kataloga, SAOP, komerciala, alarmi, varovalke) so vezane na **sistemske vloge** ADMIN, CATALOG_EDITOR, COMMERCIAL (politike v `PimAuthorization.cs`), ne na dovoljenja strani.\r\n- En račun = ena aktivna seja (prevzem seje ob drugi prijavi).\r\n- **Gesel obstoječih uporabnikov nikoli ne spreminjaj brez njihove zahteve** (tudi ne avtomatizirano ali z orodji za razvoj); za dodatnega skrbnika ustvari nov račun.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Ta stran ni vključena v tvojo vlogo« | Vlogi manjka dovoljenje strani ali zavihka | `/administracija/vloge` → dodaj dovoljenje. |\r\n| Lastna vloga ima dovoljenje, stran pa še vedno zavrne | Stran ima fiksno `[Authorize(Roles = …)]` s sistemskimi vlogami | Uporabniku dodaj še ustrezno sistemsko vlogo (glej 10). |\r\n| Gumb shrani vrne »Dejanje zahteva eno od vlog …« | Zapisovalna politika zahteva sistemsko vlogo | Dodeli CATALOG_EDITOR ali COMMERCIAL. |\r\n| »Najdi v AD« ne najde uporabnika | Napačen zapis ali intranet ne doseže domene | Preveri `DOMENA\\uporabnik` in nastavitev `ActiveDirectory:Domain`. |\r\n| Domenski uporabnik ne more spremeniti gesla v PIM | Domenskih gesel PIM ne hrani | Geslo spremeni v AD. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `SystemUsers.razor` (`/administracija`), `SystemRoles.razor` (`/administracija/vloge`), `Login.razor`; zavihki `SistemskeZadeveTabs`.\r\n- **Storitve:** `IntranetUserAdministrationService` (`sec.CreateDomainUser`, `CreateLocalUserAsync`, `ResetPasswordAsync`, `SetRolesAsync`, `SetEnabledAsync`, `ForceSignOutAsync`, naročnine `intranet.GetUserAlertSubscriptions`), `RoleAdministrationService` (`sec.Role`, `sec.RolePermission`), `RoleAccessService.CanAccessAsync`, `LocalUserAuthenticationService`, `ActiveDirectoryService`.\r\n- **Tabele:** `sec.LocalUser` (tudi domenski računi z `AuthSource = DOMAIN`), `sec.LocalUserRole`, `sec.Role`, `sec.RolePermission`, `intranet.UserAlertSubscription`.\r\n- **Prvi skrbnik:** `PIM.Migrator --ustvari-admina \u003cime\u003e` ali `tools/PIM.UserProvisioning --user \u003cime\u003e` (oba kličeta `sec.CreateLocalUser`, ne prepišeta obstoječega računa).\r\n- **Migracije:** 224 (zadnjič viden), 225 (naročnine na alarme), 250 (vloge strank po podjetju), 259 (čiščenje dovoljenj nadzora).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Lastne vloge (ustvarjene na `/administracija/vloge`) dobijo dovoljenja strani, vendar večina strani ima še fiksno `[Authorize(Roles = \"ADMIN,CATALOG_EDITOR,COMMERCIAL\")]` ali `ADMIN`, zapisovalne politike pa so vezane na sistemske vloge. Lastna vloga sama zato praktično ne odpre ničesar — potrebna je še sistemska vloga. Stran tega ne pove.\r\n- ⚠️ `IntranetUserAdministrationService` in `RoleAdministrationService` na zapisovalni poti ne kličeta `PimWriteGuard`; varuje samo `[Authorize(Roles = \"ADMIN\")]` na strani.\r\n- ⚠️ Ni varovala, ki bi preprečilo, da skrbnik onemogoči sam sebe ali odvzame vlogo ADMIN zadnjemu skrbniku.\r\n- ⚠️ Menijska vidnost (`PimNavigation`) ima poleg dovoljenj še lastne sezname vlog pri nekaterih postavkah; oboje je treba vzdrževati usklajeno.\r\n- ⚠️ V bazi ni revizije sprememb gesel (znano iz incidenta 2026-09-17); sled je samo v `/sistem/sled`, kolikor jo storitev zapiše.\r\n\r\n## Povezani procesi\r\n\r\n- [Nadzor sistema](nadzor-sistema.md): naročnine na alarme in sled sprememb.\r\n- [Mesta shranjevanja](mesta-shranjevanja.md): tretji zavihek Sistemskih zadev.\r\n- [Nadzorna plošča](../01-nadzor/nadzorna-plosca.md): prva stran po prijavi.\r\n- [Varovalke](../01-nadzor/varovalke.md): kdo sme potrditi zadržano objavo.\r\n- [Zaloge in rezervacija](../07-poslovanje/zaloge-in-rezervacija.md): dnevni mail »Zaloga pod MID« za naročene uporabnike.\r\n"}]};</script>

    if (Math.abs(a.x - b.x) < 30) { // isti stolpec: lok ob desnem robu
      x1 = a.x + a.w; x2 = b.x + b.w; const c = 40 + Math.abs(y2 - y1) / 4;
      return `M${x1},${y1} C${x1 + c},${y1} ${x2 + c},${y2} ${x2 + 2},${y2}`;
    }
    if (b.x < a.x) { x1 = a.x; x2 = b.x + b.w; const c = Math.max(60, (x1 - x2) / 2); return `M${x1},${y1} C${x1 - c},${y1} ${x2 + c},${y2} ${x2},${y2}`; }
    const c = Math.max(50, (x2 - x1) / 2);
    return `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
  }
  const api = {
    N, W, H,
    fit,
    setEdges(list) {
      robovi = list.filter(e => N[e.a] && N[e.b]);
      gE.innerHTML = robovi.map((e, i) => `<path data-i="${i}" class="pl-e ${e.cls || 'plain'}${e.anim ? ' anim' : ''}" d="${pot(N[e.a], N[e.b])}" marker-end="url(#m${uid}-${e.cls || 'plain'})"/>`).join('');
    },
    oznaci(st) {
      for (const n of Object.values(N)) {
        if (n.pasiven) continue;
        const c = n.el.classList;
        c.toggle('me', !!st && st.me.has(n.id));
        c.toggle('up', !!st && st.up.has(n.id));
        c.toggle('down', !!st && st.down.has(n.id));
        c.toggle('dim', !!st && !st.me.has(n.id) && !st.up.has(n.id) && !st.down.has(n.id));
      }
    },
    // poudari samo povezave enega vozlišča (ostale zbledijo)
    poudari(id) {
      const sos = new Set([id]);
      gE.querySelectorAll('path').forEach(p => {
        const e = robovi[+p.dataset.i], vez = !id || e.a === id || e.b === id;
        p.classList.toggle('faint', !vez);
        if (id && vez) { sos.add(e.a); sos.add(e.b); }
      });
      for (const n of Object.values(N)) if (!n.pasiven) n.el.classList.toggle('dim', !!id && !sos.has(n.id));
    },
    panel(html) { panel.hidden = !html; panel.innerHTML = html || ''; return panel; }
  };
  requestAnimationFrame(fit);
  setTimeout(() => host.querySelector('.pl-hint')?.classList.add('skrij'), 6000);
  return api;
}

function postavitevSistema() {
  const CW = 232, XW = 170, CG = 58, KW = 210, KH = 56, RAZ = 8, GH = 42, GP = 11;
  const kolone = [ // Viri | tok | Cilji
    { t: 'Viri', ext: ['X_SAOP', 'X_DOB', 'X_XLS'], sfx: '_i' },
    ...Jedro.TOK.map((a, i) => ({ t: Jedro.TOK_NASLOVI[i], areas: a })),
    { t: 'Cilji', ext: ['X_SAOP', 'X_WEB', 'X_MAIL'], sfx: '_o' }
  ];
  const voz = [], sk = [];
  let dno = 0;
  const skupina = (pd, x, y) => {
    const pp = vsi().filter(p => p.podrocje === pd);
    const y0 = y; y += GH;
    for (const p of pp) {
      voz.push({ id: p.id, x: x + GP, y, w: KW, h: KH, cls: 'pl-p st-' + p.razred + (p.odprto.length ? ' has-q' : ''), html: kartaP(p), aria: p.naslov });
      y += KH + RAZ;
    }
    y += GP - RAZ;
    const slabih = pp.filter(p => p.razred !== 'deluje').length;
    sk.push({ x, y: y0, w: CW, h: y - y0, naslov: `<span>${esc(Jedro.podrocjeNaziv(pd))}</span><span class="pl-gc">${pp.length} procesov</span>`, klik: () => pojdi('podrocje/' + pd) });
    return y;
  };
  kolone.forEach((k, i) => {
    const x = i === 0 ? 0 : XW + CG + (i - 1) * (CW + CG), cw = k.ext ? XW : CW; let y = 0;
    voz.push({ id: 'T' + i, x, y, w: cw, h: 22, pasiven: true, cls: 'pl-t', html: esc(k.t) });
    y = 32;
    if (k.ext) for (const zid of k.ext) {
      const z = ZUN(zid);
      voz.push({ id: zid + k.sfx, x, y, w: cw, h: 64, cls: 'pl-x', html: `<b>${esc(z.naziv)}</b><span>${esc(z.opis)}</span>`, aria: z.naziv });
      y += 76;
    }
    else for (const pd of k.areas) y = skupina(pd, x, y) + 22;
    dno = Math.max(dno, y);
  });
  const y0 = dno + 30;
  voz.push({ id: 'Tp', x: XW + CG, y: y0, w: 3 * CW + 2 * CG, h: 22, pasiven: true, cls: 'pl-t', html: 'Podpora: sodeluje z vsemi področji' });
  Jedro.PODPORNA.forEach((pd, i) => skupina(pd, XW + CG + i * (CW + CG), y0 + 32));
  return { voz, sk };
}

/* ===== fokus: sredina + kdo ji daje (levo) + komu daje (desno) ===== */
function fokusGraf(host, { levo, sredina, desno, robovi, naslovi, odpri, omejitev = 12 }) {
  const CW = [252, 268, 252], GX = 120, OH = 74, SH = 64, RAZ = 12;
  let vse = false;
  const risi = () => {
    const kos = arr => (vse || arr.length <= omejitev) ? arr : [...arr.slice(0, omejitev), { id: '__vec', html: `<span class="pl-nm">+ še ${arr.length - omejitev}</span><span class="pl-meta">Prikaži vse</span>`, cls: 'pl-more' }];
    const L = kos(levo), R = kos(desno);
    const vis = (arr, h) => arr.length ? arr.reduce((a, it) => a + (it.h || h) + RAZ, 0) - RAZ : 40;
    const hMax = Math.max(vis(L, OH), vis(sredina, SH), vis(R, OH));
    const voz = [];
    const stolpec = (arr, xi, h, prazno) => {
      const x = xi === 0 ? 0 : xi === 1 ? CW[0] + GX : CW[0] + CW[1] + 2 * GX;
      voz.push({ id: 'T' + xi, x, y: 0, w: CW[xi], h: 22, pasiven: true, cls: 'pl-t', html: naslovi[xi] });
      let y = 34 + (hMax - vis(arr, h)) / 2;
      if (!arr.length) voz.push({ id: 'E' + xi, x, y, w: CW[xi], h: 40, pasiven: true, cls: 'pl-empty', html: prazno });
      for (const it of arr) { const hh = it.h || h; voz.push({ ...it, x, y, w: CW[xi], h: hh }); y += hh + RAZ; }
    };
    stolpec(L, 0, OH, 'Nič'); stolpec(sredina, 1, SH, ''); stolpec(R, 2, OH, 'Nič');
    const pl = Platno(host, {
      vozlisca: voz, maks: 1.05,
      onNode: id => { if (id === '__vec') { vse = true; risi(); } else odpri(id); },
      onHover: id => pl.poudari(id)
    });
    pl.setEdges(robovi);
    const sc = Math.min(1.05, (host.clientWidth - 40) / pl.W);
    host.style.height = Math.round(Math.min(720, Math.max(260, pl.H * sc + 70))) + 'px';
  };
  risi();
}
const zunKarta = (z, sfx, podatki) => ({ id: z.id + sfx, cls: 'pl-x', html: `<b>${esc(z.naziv)}</b>${via(podatki)}`, aria: z.naziv });
const procKarta = (id, podatki, cls = '') => { const p = M.procesi[id]; return { id, cls: `pl-p st-${p.razred}${p.odprto.length ? ' has-q' : ''} ${cls}`, html: kartaP(p, `<span class="pl-meta">${esc(Jedro.podrocjeNaziv(p.podrocje))}</span>${podatki ? via(podatki) : ''}`), aria: p.naslov }; };
const zunSkupine = (arr) => { const g = {}; for (const o of arr) { const z = Jedro.zunanji(o); if (z) (g[z.id] = g[z.id] || []).push(o); } return g; };
const odpriVozlisce = id => { const a = id.match(/^A_(.+)_[lr]$/); if (a) return pojdi('podrocje/' + a[1]); if (M.procesi[id]) pojdi('proces/' + id); else { const z = id.replace(/_[io]$/, ''); if (ZUN(z)) pojdi('sistem/' + z); } };

const grupa = (vnosi, sfx) => {
  const po = {};
  for (const [id, d] of Object.entries(vnosi)) { const pd = M.procesi[id].podrocje; (po[pd] = po[pd] || { ids: [], d: new Set() }); po[pd].ids.push(id); d.forEach(x => po[pd].d.add(x)); }
  return Object.keys(Jedro.PODROCJA).filter(pd => po[pd]).map(pd => {
    const g = po[pd], n = g.ids.length, vrstic = Math.min(3, n) + (n > 3 ? 1 : 0);
    return { id: `A_${pd}${sfx}`, cls: 'pl-a', h: 60 + vrstic * 17, aria: Jedro.podrocjeNaziv(pd),
      html: `<span class="pl-nm">${esc(Jedro.podrocjeNaziv(pd))}<span class="pl-cnt">${n}</span></span><span class="pl-list">${g.ids.slice(0, 3).map(i => `<span><i class="dot ${M.procesi[i].razred}"></i>${esc(kratko(M.procesi[i].naslov))}</span>`).join('')}${n > 3 ? `<span class="muted">in še ${n - 3}</span>` : ''}</span>${via([...g.d])}` };
  });
};
const gid = (id, sfx) => `A_${M.procesi[id].podrocje}${sfx}`;

function grafProcesa(host, id) {
  const p = M.procesi[id], pred = Jedro.predhodniki(M, id), nasl = Jedro.nasledniki(M, id);
  const zi = zunSkupine(p.bere), zo = zunSkupine(p.pise);
  const VEC = 8, gL = Object.keys(pred).length > VEC, gR = Object.keys(nasl).length > VEC;
  const levo = [...Object.entries(zi).map(([z, d]) => zunKarta(ZUN(z), '_i', d)), ...(gL ? grupa(pred, '_l') : Object.entries(pred).map(([w, d]) => procKarta(w, [...d])))];
  const desno = [...(gR ? grupa(nasl, '_r') : Object.entries(nasl).map(([b, d]) => procKarta(b, [...d]))), ...Object.entries(zo).map(([z, d]) => zunKarta(ZUN(z), '_o', d))];
  const sredina = [{ id, cls: 'pl-me', html: `<span class="pl-nm">${esc(kratko(p.naslov))}</span><span class="pl-meta">${STANJE[p.razred]}</span>` }];
  const robovi = [...levo.map(l => ({ a: l.id, b: id, cls: l.id.endsWith('_i') ? 'ext' : 'up', anim: !l.id.endsWith('_i') })),
    ...desno.map(r => ({ a: id, b: r.id, cls: r.id.endsWith('_o') ? 'ext' : 'down', anim: !r.id.endsWith('_o') }))];
  const nL = Object.keys(pred).length, nR = Object.keys(nasl).length;
  fokusGraf(host, { levo, sredina, desno, robovi, naslovi: [`Odvisen od: ${nL} procesov${gL ? ', po področjih' : ''}`, 'Proces', `Vpliva na: ${nR} procesov${gR ? ', po področjih' : ''}`], odpri: x => x === id ? null : odpriVozlisce(x) });
}

function grafPodrocja(host, pd) {
  const pp = vsi().filter(p => p.podrocje === pd), ids = new Set(pp.map(p => p.id));
  const L = {}, R = {}, robovi = [], zi = {}, zo = {};
  for (const p of pp) {
    for (const [w, d] of Object.entries(Jedro.predhodniki(M, p.id))) if (!ids.has(w)) { (L[w] = L[w] || new Set()); d.forEach(x => L[w].add(x)); robovi.push({ a: gid(w, '_l'), b: p.id, cls: 'up' }); }
    for (const [b, d] of Object.entries(Jedro.nasledniki(M, p.id))) if (!ids.has(b)) { (R[b] = R[b] || new Set()); d.forEach(x => R[b].add(x)); robovi.push({ a: p.id, b: gid(b, '_r'), cls: 'down' }); }
    for (const [z, d] of Object.entries(zunSkupine(p.bere))) { (zi[z] = zi[z] || new Set()); d.forEach(x => zi[z].add(x)); robovi.push({ a: z + '_i', b: p.id, cls: 'ext' }); }
    for (const [z, d] of Object.entries(zunSkupine(p.pise))) { (zo[z] = zo[z] || new Set()); d.forEach(x => zo[z].add(x)); robovi.push({ a: p.id, b: z + '_o', cls: 'ext' }); }
  }
  const levo = [...Object.entries(zi).map(([z, d]) => zunKarta(ZUN(z), '_i', [...d])), ...grupa(L, '_l')];
  const desno = [...grupa(R, '_r'), ...Object.entries(zo).map(([z, d]) => zunKarta(ZUN(z), '_o', [...d]))];
  const uniq = new Set(); for (let i = robovi.length - 1; i >= 0; i--) { const k = robovi[i].a + '>' + robovi[i].b; if (uniq.has(k)) robovi.splice(i, 1); else uniq.add(k); }
  const sredina = pp.map(p => ({ id: p.id, cls: `pl-p pl-mid st-${p.razred}${p.odprto.length ? ' has-q' : ''}`, html: kartaP(p, `<span class="pl-meta">${STANJE[p.razred]}</span>`), aria: p.naslov }));
  fokusGraf(host, { levo, sredina, desno, robovi, naslovi: ['Dobi podatke od', esc(Jedro.podrocjeNaziv(pd)), 'Daje podatke'], odpri: odpriVozlisce, omejitev: 14 });
}

function grafPodatka(host, o) {

const ZAVIHKI = [['pregled', 'Pregled'], ['diagram', 'Diagram'], ['koraki', 'Koraki'], ['pravila', 'Pravila'], ['tezave', 'Ko gre narobe'], ['odprto', 'Odprto'], ['tehnika', 'Tehnika'], ['vse', 'Vse']];

async function izrisiMd(el, besedilo) {
  el.innerHTML = md(besedilo);
  el.querySelectorAll('a[href$=".md"]').forEach(a => {
    const ime = a.getAttribute('href').split('/').pop().replace(/\.md$/, '');
    if (M.procesi[ime]) a.setAttribute('href', '#/proces/' + ime);
  });
  for (const b of [...el.querySelectorAll('pre > code.language-mermaid')]) {
    const box = document.createElement('div'); box.className = 'dia'; box.style.marginBottom = '14px';
    b.parentElement.replaceWith(box);
    await narisi(box, b.textContent);
  }
}

/* ===== iskanje (Ctrl+K) ===== */
function odpriIskanje() {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal palette"><input placeholder="Išči proces, stran intraneta, podatek, posel …" autofocus><div class="res"></div></div>`;
  document.body.appendChild(ov);
  const inp = ov.querySelector('input'), res = ov.querySelector('.res'); let sel = 0, items = [];
  const zapri = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) zapri(); };
  const risi = () => {
    const q = inp.value.trim().toLowerCase();
    const P = vsi().map(p => ({ t: p.naslov, s: Jedro.podrocjeNaziv(p.podrocje), pot: 'proces/' + p.id, d: p.razred, k: [p.naslov, p.id, ...p.strani, ...p.posli].join(' ').toLowerCase(), b: p.telo.toLowerCase() }));
    const D = [...new Set([...Object.keys(M.slovar), ...Object.keys(M.pisci)])].map(o => ({ t: o, s: M.slovar[o] || 'podatek', pot: 'podatek/' + encodeURIComponent(o), k: (o + ' ' + (M.slovar[o] || '')).toLowerCase(), b: '' }));
    const najdi = arr => arr.filter(x => !q || x.k.includes(q)).concat(q ? arr.filter(x => !x.k.includes(q) && x.b.includes(q)) : []);
    const r1 = najdi(P).slice(0, 12), r2 = najdi(D).slice(0, 6);
    items = [...r1, ...r2]; sel = Math.min(sel, Math.max(0, items.length - 1));
    let i = 0;
    res.innerHTML = (r1.length ? `<div class="grp">Procesi</div>` + r1.map(x => `<div class="it ${i === sel ? 'sel' : ''}" data-i="${i++}"><span class="dot ${x.d}"></span>${esc(x.t)}<small>${esc(x.s)}</small></div>`).join('') : '')
      + (r2.length ? `<div class="grp">Podatki</div>` + r2.map(x => `<div class="it ${i === sel ? 'sel' : ''}" data-i="${i++}"><span style="color:var(--data)">◆</span>${esc(x.t)}<small>${esc(x.s)}</small></div>`).join('') : '')
      || '<div class="it muted">Ni zadetkov.</div>';
    res.querySelectorAll('[data-i]').forEach(e => e.onclick = () => { pojdi(items[+e.dataset.i].pot); zapri(); });
  };
  inp.oninput = () => { sel = 0; risi(); };
  inp.onkeydown = e => {
    if (e.key === 'Escape') zapri();
    else if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); risi(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); risi(); e.preventDefault(); }
    else if (e.key === 'Enter' && items[sel]) { pojdi(items[sel].pot); zapri(); }
  };
  risi(); inp.focus();
}
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!document.querySelector('.palette')) odpriIskanje(); } });

window.urediProces = id => {
  const p = M.procesi[id];
  if (Vir.nacin !== 'mapa') { obvestilo('Za urejanje klikni »📂 Poveži z mapo« spodaj levo in izberi mapo docs\\procesi. Urejanje deluje v brskalnikih Edge in Chrome.'); return; }
  odpriUrejevalnik(`Urejanje: ${p.naslov}`, p.pot, id, p.vsebina, p.vsebina);
};
window.novProces = pd => {
  const naslov = prompt('Ime novega procesa:'); if (!naslov) return;
  const id = naslov.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  if (M.procesi[id]) { obvestilo('Proces s tem imenom že obstaja.'); return; }
  let v = Vir.kopito || `---\nid: ${id}\nnaslov: ${naslov}\npodrocje: ${pd}\nstanje: delno\nbere: []\npise: []\n---\n\n# ${naslov}\n`;
  v = v.replace(/^id:.*$/m, `id: ${id}`).replace(/^naslov:.*$/m, `naslov: ${naslov}`).replace(/^podrocje:.*$/m, `podrocje: ${pd}`)
    .replace(/^(bere|pise|strani|posli|koda|migracije):.*$/gm, '$1: []').replace(/^# \[Ime procesa\]/m, `# ${naslov}`).replace(/<!--[\s\S]*?-->\n*/, '');
  odpriUrejevalnik(`Nov proces: ${naslov}`, `${pd}/${id}.md`, id, null, v);
};
function odpriUrejevalnik(naslov, pot, id, stara, vsebina) {
  urejanje = true;
  $('#view').innerHTML = `<div class="head"><div class="t"><h2 class="title">${esc(naslov)}</h2><div class="meta"><code>${esc(pot)}</code></div></div>
    <div style="display:flex;gap:8px"><button class="btn primary" id="bSave">Preveri vpliv in shrani</button><button class="btn" id="bCancel">Prekliči</button></div></div>
  <div class="notice info">Glava med <code>---</code> določa povezave: <b>bere</b> in <b>pise</b> uporabljata oznake iz <a href="#/podatki">seznama podatkov</a>. Pred shranjevanjem se pokaže, na kaj sprememba vpliva.</div>
  <textarea class="editor" id="ed" spellcheck="false"></textarea>`;
  $('#ed').value = vsebina;
  $('#bCancel').onclick = () => { urejanje = false; prikazi(); };
  $('#bSave').onclick = () => shraniZVplivom(pot, id, stara, $('#ed').value);
}
