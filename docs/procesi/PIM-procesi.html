<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procesi PIM</title>
<!-- PREDLOGA. PIM-procesi.html se ustvari iz te datoteke z ukazom: scripts\Procesi.ps1 -Ukaz Graf (vgradi podatke). Urejaj to datoteko, ne PIM-procesi.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f9fafc; --text: #1b2130; --muted: #5f6b7d; --line: #e1e6ed; --line-2: #eef1f5;
  --accent: #4f46e5; --accent-soft: #eef2ff; --accent-text: #4338ca;
  --ok: #2e7d32; --ok-soft: #e7f5e8; --warn: #b26a00; --warn-soft: #fff3de; --bad: #c0392b; --bad-soft: #fde8e6;
  --data: #0f766e; --data-soft: #e3f4f1; --up: #4f46e5; --down: #d97706;
  --canvas: #f7f8fb; --grid: #dfe4ec; --edge: #cbd5e1;
  --shadow: 0 1px 2px rgba(20,30,50,.05), 0 4px 14px rgba(20,30,50,.05);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --panel: #1b1f26; --panel-2: #20252d; --text: #e6e9ee; --muted: #9aa5b5; --line: #2c323c; --line-2: #252a33;
    --accent: #8b85ff; --accent-soft: #26244d; --accent-text: #b9b5ff;
    --ok: #6cc070; --ok-soft: #1c2e1e; --warn: #f0b34a; --warn-soft: #33291a; --bad: #ff8a7a; --bad-soft: #3a1f1d;
    --data: #5eead4; --data-soft: #16322f; --up: #8b85ff; --down: #f59e0b;
    --canvas: #161a20; --grid: #2a303a; --edge: #3b4452;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --panel: #1b1f26; --panel-2: #20252d; --text: #e6e9ee; --muted: #9aa5b5; --line: #2c323c; --line-2: #252a33;
  --accent: #8b85ff; --accent-soft: #26244d; --accent-text: #b9b5ff;
  --ok: #6cc070; --ok-soft: #1c2e1e; --warn: #f0b34a; --warn-soft: #33291a; --bad: #ff8a7a; --bad-soft: #3a1f1d;
  --data: #5eead4; --data-soft: #16322f; --up: #8b85ff; --down: #f59e0b;
    --canvas: #161a20; --grid: #2a303a; --edge: #3b4452;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 Inter, "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; color: inherit; }
kbd { font: 11px Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--panel); }

/* ogrodje */
.app { display: grid; grid-template-columns: 264px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 16px 12px; display: flex; gap: 10px; align-items: center; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
.brand h1 { font-size: 16px; margin: 0; line-height: 1.2; }
.brand .sub { color: var(--muted); font-size: 12px; }
.searchbtn { margin: 0 12px 10px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--muted); text-align: left; }
.searchbtn span { flex: 1; }
nav { overflow: auto; padding: 0 8px 16px; flex: 1; }
.nav-sec { margin: 14px 8px 4px; font-weight: 600; font-size: 11px; color: var(--muted); }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; color: var(--text); cursor: pointer; }
.nav-item:hover { background: var(--line-2); text-decoration: none; }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-item .cnt { margin-left: auto; font-size: 11px; color: var(--muted); }
.nav-item .cnt.warn { color: var(--warn); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.deluje { background: var(--ok); } .dot.delno { background: var(--warn); } .dot.nedeluje { background: var(--bad); }
.source { border-top: 1px solid var(--line); padding: 10px 12px; font-size: 12px; color: var(--muted); }
.source .row { display: flex; gap: 6px; margin-top: 8px; }

main { overflow: auto; min-width: 0; scroll-behavior: smooth; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 28px 70px; }
.wrap.siroko { max-width: none; }
.wrap.siroko .head, .wrap.siroko .strip { max-width: 1240px; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.crumbs a { color: var(--muted); }
.head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
.head .t { flex: 1; min-width: 260px; }
h2.title { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 0; max-width: 860px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card h3 { margin: 0 0 10px; font-size: 14px; }
.card h3 .muted { font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.btn:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.deluje { background: var(--ok-soft); color: var(--ok); } .badge.delno { background: var(--warn-soft); color: var(--warn); } .badge.nedeluje { background: var(--bad-soft); color: var(--bad); }
.badge.neutral { background: var(--line-2); color: var(--muted); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; margin: 3px 4px 3px 0; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); font-size: 12.5px; cursor: pointer; max-width: 100%; }
.chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.chip.data { background: var(--data-soft); border-color: transparent; color: var(--data); }
.chip.page { font-family: Consolas, monospace; font-size: 12px; }
.chip small { color: var(--muted); }
.muted { color: var(--muted); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line-2); margin-top: 8px; }
.bar i { display: block; }

/* platno (interaktivni graf) */
.strip { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.strip b { color: var(--text); font-size: 15px; margin-right: 2px; }
.strip .bar { width: 160px; margin: 0; }
.strip .s-ok b { color: var(--ok); } .strip .s-warn b { color: var(--warn); } .strip .s-bad b { color: var(--bad); }
.strip a b { color: var(--warn); }
.strip-leg { margin-left: auto; display: inline-flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; }
.lg { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.lg.up { background: var(--up); } .lg.down { background: var(--down); } .lg.ext { background: var(--data); }

.pl { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background-color: var(--canvas); background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 22px 22px; touch-action: none; cursor: grab; user-select: none; }
.pl.drag { cursor: grabbing; }
.pl-home { height: calc(100vh - 210px); min-height: 520px; }
.pl-fokus { height: 560px; margin-bottom: 16px; }
.pl-scena { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.pl-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.pl-plast { position: absolute; left: 0; top: 0; }

.pl-g { position: absolute; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.05); }
.pl-gh { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px 0; font-weight: 700; font-size: 13.5px; color: var(--text); cursor: pointer; border-radius: 16px 16px 0 0; }
.pl-gh:hover, .pl-gh:focus-visible { color: var(--accent); outline: none; }
.pl-gc { font-weight: 500; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

.pl-n { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 3px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); padding: 7px 10px 7px 15px; font-size: 12.5px; line-height: 1.3; color: var(--text); cursor: pointer; overflow: hidden; transition: opacity .18s, box-shadow .18s, border-color .18s, background-color .18s; }
.pl-n::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--st, var(--line)); }
.pl-n.st-deluje { --st: var(--ok); } .pl-n.st-delno { --st: var(--warn); } .pl-n.st-nedeluje { --st: var(--bad); }
.pl-n:hover, .pl-n:focus-visible { border-color: var(--accent); box-shadow: 0 6px 20px rgba(15,23,42,.12); outline: none; }
.pl-nm { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pl-n.has-q .pl-nm { padding-right: 24px; }
.pl-home .pl-p { font-size: 13.5px; }
.pl-home .pl-gh { font-size: 15px; }
.pl-home .pl-t { font-size: 14px; }
.pl-q { position: absolute; right: 7px; top: 7px; min-width: 20px; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 1px 6px; }
.pl-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-via { display: flex; flex-wrap: nowrap; gap: 4px; overflow: hidden; }
.pl-d { font-size: 10.5px; font-weight: 500; background: var(--data-soft); color: var(--data); border-radius: 99px; padding: 1px 7px; white-space: nowrap; }
.pl-x { background: var(--data-soft); border-color: transparent; padding-left: 12px; }
.pl-x::before { display: none; }
.pl-x b { color: var(--data); font-size: 13px; }
.pl-x > span:not(.pl-via) { font-size: 11.5px; color: var(--muted); }
.pl-x .pl-d { background: var(--panel); }
.pl-t { background: none; border: 0; padding: 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: default; justify-content: flex-end; }
.pl-t::before, .pl-empty::before { display: none; }
.pl-empty { background: none; border: 1px dashed var(--line); color: var(--muted); cursor: default; align-items: center; }
.pl-me { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 14px; padding-left: 16px; box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 35%, transparent); }
.pl-me::before { display: none; }
.pl-me .pl-meta { color: rgba(255,255,255,.85); }
.pl-mid { background: var(--panel); }
.pl-data { background: var(--data); border-color: var(--data); color: #fff; }
.pl-data::before { display: none; }
.pl-data .pl-meta { color: rgba(255,255,255,.85); white-space: normal; }
.pl-a { background: var(--panel); }
.pl-a::before { background: var(--line); }
.pl-cnt { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--line-2); border-radius: 99px; padding: 0 7px; vertical-align: 1px; }
.pl-list { display: flex; flex-direction: column; font-size: 11.5px; color: var(--muted); gap: 1px; }
.pl-list > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.pl-list .dot { width: 6px; height: 6px; }
.pl-more { border-style: dashed; background: var(--panel-2); }
.pl-more::before { display: none; }

.pl-n.dim { opacity: .2; }
.pl-n.me:not(.pl-me) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.pl-n.up { border-color: var(--up); box-shadow: 0 0 0 2px color-mix(in srgb, var(--up) 22%, transparent); }
.pl-n.down { border-color: var(--down); box-shadow: 0 0 0 2px color-mix(in srgb, var(--down) 25%, transparent); }
.pl-n.up.down { box-shadow: 0 0 0 2px color-mix(in srgb, var(--up) 22%, transparent), 0 0 0 5px color-mix(in srgb, var(--down) 22%, transparent); }

.pl-e { fill: none; stroke: var(--edge); stroke-width: 1.7; transition: opacity .18s; }
.pl-e.up { stroke: var(--up); } .pl-e.down { stroke: var(--down); }
.pl-e.ext { stroke: var(--data); stroke-dasharray: 3 5; }
.pl-e.anim { stroke-dasharray: 8 7; animation: tok 1.1s linear infinite; stroke-width: 2; }
.pl-e.faint { opacity: .07; }
.mk-up { fill: var(--up); } .mk-down { fill: var(--down); } .mk-ext { fill: var(--data); } .mk-plain { fill: var(--edge); }
@keyframes tok { to { stroke-dashoffset: -30; } }
@media (prefers-reduced-motion: reduce) { .pl-e.anim { animation: none; } .pl-n { transition: none; } }

.pl-kontrole { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.pl-kontrole button { width: 34px; height: 34px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); }
.pl-kontrole button + button { border-top: 1px solid var(--line-2); }
.pl-kontrole button:hover, .pl-kontrole button:focus-visible { color: var(--accent); background: var(--accent-soft); outline: none; }
.pl-kontrole svg, .pp-x svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pl-hint { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; pointer-events: none; transition: opacity .6s; }
.pl-hint.skrij { opacity: 0; }

.pl-panel[hidden] { display: none; }
.pl-panel { position: absolute; right: 14px; top: 14px; width: 330px; max-width: calc(100% - 28px); max-height: calc(100% - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 48px rgba(15,23,42,.18); padding: 16px 18px; cursor: default; animation: panelIn .18s ease-out; }
@keyframes panelIn { from { opacity: 0; transform: translateX(12px); } }
.pl-panel h3 { margin: 10px 0 6px; font-size: 17px; line-height: 1.3; }
.pp-top { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
.pp-x { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); }
.pp-x:hover { background: var(--line-2); color: var(--text); }
.pp-namen { color: var(--muted); font-size: 13px; }
.pp-sec { margin-top: 14px; }
.pp-sec h4 { margin: 0 0 6px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; }
.pp-li { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: 7px; font-size: 13px; }
.pp-li:hover, .pp-li:focus-visible { background: var(--accent-soft); color: var(--accent-text); outline: none; }
.pp-warn { color: var(--warn); font-weight: 600; font-size: 13px; }
.pp-act { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* proces */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.side { position: sticky; top: 12px; }
.side .card { padding: 14px; }
.side h4 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); }
.side h4:first-child { margin-top: 0; }
.namen { font-size: 15.5px; line-height: 1.6; background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 14px; border: 0; background: none; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: var(--line-2); font-size: 11px; color: var(--muted); }
.tab .n.warn { background: var(--warn-soft); color: var(--warn); }
.overview { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.overview .card { margin: 0; }
.steps { position: relative; }
.step { display: grid; grid-template-columns: 38px 1fr; gap: 14px; margin-bottom: 12px; }
.step .num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; position: relative; z-index: 1; }
.step:not(:last-child) .num::after { content: ""; position: absolute; top: 34px; left: 16px; width: 2px; height: calc(100% + 60px); background: var(--line); z-index: -1; }
.step .body { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); }
.step .who { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.step .who .role { font-weight: 700; }
.step .who .where { font-size: 12.5px; color: var(--muted); }
.step .do { font-size: 14px; margin-bottom: 8px; }
.step .res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
.step .res > div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.step .res .lbl { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 2px; }
.step.auto .num { background: var(--ok); }

.md h2 { font-size: 16px; margin: 22px 0 8px; }
.md h2:first-child { margin-top: 0; }
.md h3 { font-size: 14.5px; }
.md blockquote { margin: 0 0 12px; padding: 8px 12px; background: var(--accent-soft); border-radius: 8px; }
.md blockquote p { margin: 0; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--panel-2); font-weight: 600; }
.md code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }
.md pre { background: var(--panel-2); padding: 10px; border-radius: 8px; overflow: auto; }
.md pre code { border: 0; padding: 0; }
.md details { background: var(--panel-2); border-radius: 8px; padding: 8px 12px; }
.md ul { padding-left: 20px; }
.md li { margin: 4px 0; }
.dia { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow: auto; text-align: center; }
.dia svg { max-width: 100%; height: auto; }
.dia .zoom { position: absolute; top: 8px; right: 8px; }
.dia svg .node rect, .dia svg .cluster rect { rx: 10px; ry: 10px; }
.dia svg .edgeLabel, .dia svg .edgeLabel p { font-size: 12px; border-radius: 6px; }
.dia svg .cluster-label { font-weight: 600; }

/* seznami */
.qlist { list-style: none; margin: 0; padding: 0; }
.qlist li { padding: 9px 0; border-bottom: 1px solid var(--line-2); display: grid; grid-template-columns: 20px 1fr; gap: 6px; }
.qlist li:last-child { border-bottom: 0; }
.filter { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter input, .filter select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
.filter input { min-width: 260px; flex: 1; max-width: 420px; }
table.plain { width: 100%; border-collapse: collapse; font-size: 13px; }
table.plain th, table.plain td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.plain th { font-size: 11.5px; color: var(--muted); font-weight: 600; }
table.plain tr:hover td { background: var(--panel-2); }
.impact-lvl { border-left: 3px solid var(--down); padding-left: 12px; margin-bottom: 12px; }
.sole { color: var(--bad); font-weight: 600; font-size: 12px; }

<script>window.PROCESI_PODATKI = {"ustvarjeno":"2026-09-30 14:20","slovar":"# Slovar podatkov procesov\r\n\r\nProcesi so v glavnem grafu povezani **prek podatkov**: proces A zapiše podatek, proces B ga bere, torej je B odvisen od A.\r\nZato morata oba uporabiti **isto oznako** iz tega seznama (polji `bere:` in `pise:` v glavi procesa).\r\n\r\nNova oznaka je dovoljena, vendar jo najprej dodaj sem. Skripta `scripts/Procesi-Graf.ps1` opozori na vsako oznako, ki je tu ni, in na podatek, ki ga nihče ne zapiše ali ga nihče ne bere.\r\n\r\n| Oznaka | Kaj je | Kje živi |\r\n|---|---|---|\r\n| `saop.artikli` | Šifrant artiklov v SAOP (osnovna polja, aktivnost) | SAOP |\r\n| `saop.cene` | Ceniki in cene v SAOP | SAOP |\r\n| `saop.zaloge` | Zaloge po skladiščih v SAOP | SAOP |\r\n| `saop.stranke` | Kupci, dobavitelji, proizvajalci v SAOP | SAOP |\r\n| `saop.popusti` | Popusti in pogoji kupcev v SAOP | SAOP |\r\n| `saop.narocila` | Naročila kupcev (VNK) in dobaviteljem (VND), računi, prevzemi, Barkawi izvozi v SAOP | SAOP |\r\n| `pim.narocila` | Naročila kupcev in dobaviteljem v PIM (`sales.*`, `purch.*`) | PIM |\r\n| `pim.analitika` | Kazalniki analitike: prodaja po mesecih, predlogi naročil, zaležano, dobavitelji (`ana.*`) | PIM |\r\n| `dobavitelj.xml` | Katalogi dobaviteljev (NW, BT …) po HTTP/FTP | dobavitelj |\r\n| `excel.izdelki` | Delovni list izdelkov (uvoz/izvoz Excel) | uporabnik |\r\n| `excel.odprodaja` | Seznam za odprodajo (Excel) | uporabnik |\r\n| `excel.stranke` | Delovni list kupcev (Excel) | uporabnik |\r\n| `excel.cenik` | Uvoz cenika (Excel) | uporabnik |\r\n| `pim.izdelek` | Osnovni podatki artikla v PIM (šifra, naziv, EAN, aktivnost, ERP polja) | PIM |\r\n| `pim.atributi` | Vrednosti atributov artikla | PIM |\r\n| `pim.besedila` | Opisi in spletna besedila (tudi AI) | PIM |\r\n| `pim.prevodi` | Prevodi nazivov, opisov, kategorij | PIM |\r\n| `pim.kategorije` | Drevo kategorij | PIM |\r\n| `pim.kategorije-izdelka` | Uvrstitev artikla v kategorije | PIM |\r\n| `pim.mediji` | Slike in dokumenti artikla | PIM |\r\n| `pim.kandidati` | Novi artikli dobaviteljev (kandidati po EAN) | PIM |\r\n| `pim.surovi-zajem` | Surovi podatki zajema (staging, teki, težave, neujemanja) | PIM |\r\n| `pim.cene` | Cene in ceniki v PIM (tudi B2B) | PIM |\r\n| `pim.zaloge` | Zaloge in rezervacije v PIM | PIM |\r\n| `pim.stranke` | Kupci v PIM (tipi, referent, e-maili, opombe) | PIM |\r\n| `pim.popusti` | Pravila popustov (S-popusti, P2) | PIM |\r\n| `pim.odprodaja` | Artikli v odprodaji, razstavni eksponati | PIM |\r\n| `pim.validacija` | Rezultati validacije, karantena, pripravljenost za izhod | PIM |\r\n| `pim.pravila` | Pravila validacije, slovar, preslikave, nazivi | PIM |\r\n| `pim.nastavitve` | Definicije atributov, nabori, jeziki, kanali, skladišča, povezave | PIM |\r\n| `pim.saop-vrsta` | Čakalna vrsta sprememb za SAOP (čaka odobritev / poslano / zavrnjeno) | PIM |\r\n| `pim.varovalke` | Zadržane objave in potrditve | PIM |\r\n| `pim.zgodovina-uvozov` | Zapisi uvozov in sprememb (povratek) | PIM |\r\n| `pim.uporabniki` | Uporabniki, vloge, dovoljenja | PIM |\r\n| `pim.urniki` | Posli, urniki, teki, zakupi | PIM |\r\n| `splet.katalog-csv` | katalog.csv za splet | EXPORT_ROOT |\r\n| `splet.stranke-csv` | stranke.csv za splet | EXPORT_ROOT |\r\n| `splet.magento` | Izvozi po Magento profilih | EXPORT_ROOT |\r\n| `obvestila` | E-mail obvestila in alarmi | e-pošta |\r\n","kopito":"---\r\nid: ime-procesa\r\nnaslov: Ime procesa\r\npodrocje: 03-izdelki\r\nstanje: deluje            # deluje | delno | ne-deluje\r\nbere: [pim.izdelek, saop.cene]          # oznake iz _PODATKI.md\r\npise: [pim.odprodaja, pim.saop-vrsta]   # oznake iz _PODATKI.md\r\nstrani: [/izdelki/odprodaja]\r\nposli: []                 # ključi poslov v urniku, npr. MAGENTO_CSV\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Clearance*.razor, PIM_Solution/src/PIM.Intranet/Services/Clearance*.cs]\r\nmigracije: [275]\r\n---\r\n\r\n# [Ime procesa]\r\n\r\n\u003e **Področje:** [mapa, npr. Poslovanje] · **Lastnik:** [vloga ali oseba] · **Stanje:** ✅ deluje / ⚠️ delno / ❌ ne deluje · **Preverjeno:** [LLLL-MM-DD, iz kode / z uporabnikom]\r\n\r\n\u003c!--\r\nKOPITO ZA VSE PROCESE PIM\r\n- Vsak proces je ena datoteka v mapi svojega področja (docs/procesi/NN-podrocje/ime-procesa.md).\r\n- Glava med --- je STROJNO BRANA: iz nje se sestavi glavni graf (00-GLAVNI-PROCES.md) in opozorila o vplivu sprememb.\r\n  Vsak ključ v eni vrstici, seznami v [ ] ločeni z vejico. bere/pise samo z oznakami iz _PODATKI.md.\r\n  koda: poti od korena repozitorija, dovoljen * ; to so datoteke, katerih sprememba pomeni spremembo tega procesa.\r\n- Razdelkov ne izpuščaj in ne preimenuj. Če razdelek nima vsebine, napiši »Ni.«\r\n- Piši za uporabnika (komerciala, urednik kataloga), ne za programerja. Tehnika gre samo v razdelek 9.\r\n- Strani intraneta piši kot pot v poševnih narekovajih: `/izdelki/odprodaja`.\r\n- Kar v kodi ni tako, kot bi uporabnik pričakoval, ali česar ni mogoče preveriti, označi z ⚠️ in zapiši v razdelek 10.\r\n--\u003e\r\n\r\n## 1. Namen\r\n\r\nEn do dva stavka: čemu proces služi in kaj je rezultat.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | … |\r\n| Urednik kataloga | … |\r\n| Skrbnik | … |\r\n| Avtomatika (PIM) | … |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** kdo in ob kakšni priložnosti.\r\n- **Po urniku:** ime posla in pogostost (npr. `SUPPLIER_CATALOG_IMPORT`, vsakih 6 ur).\r\n- **Ob dogodku:** kaj ga sproži.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | … | SAOP / dobavitelj / Excel / uporabnik |\r\n| **Izhod** | … | PIM / SAOP / katalog.csv / Magento |\r\n\r\n## 5. Diagram\r\n\r\nVedno pasovni diagram z istimi štirimi pasovi (pas, ki ga proces ne uporablja, izpusti).\r\nOblike: `([ ])` začetek/konec · `[ ]` korak uporabnika · `[[ ]]` samodejni korak · `{ }` odločitev · `[( )]` podatki · `\u003e` čaka potrditev.\r\nBarve so vedno enake (classDef spodaj kopiraj nespremenjene).\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Korak uporabnika]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    C[[Samodejni korak]] --\u003e D{Odločitev?}\r\n    D -- da --\u003e E\u003eČaka potrditev]\r\n    D -- ne --\u003e F([Konec])\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    G[(ERP podatek)]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    H[(katalog.csv)]\r\n  end\r\n  B --\u003e C\r\n  E --\u003e G\r\n  E --\u003e H\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,F endp; class B user; class C,D auto; class E wait; class G,H data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/…` | … | … | … |\r\n| 2 | Avtomatika | — | — | … | … |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Kaj sistem ne dovoli ali zadrži in zakaj (npr. »v SAOP nič samodejno — vedno po odobritvi«).\r\n- Kdo lahko kaj (vloge in dovoljenja).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| … | … | … |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/….razor`\r\n- **Storitve / delavci:** …\r\n- **Tabele in pogledi:** `schema.Tabela`\r\n- **Migracije:** `NNN_Ime.sql`\r\n- **Urniki:** ime posla, pogostost\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Kar v kodi ni jasno, ni dokončano ali se verjetno razlikuje od dejanskega dela.\r\n\r\n## Povezani procesi\r\n\r\n- [Ime](../NN-podrocje/proces.md): kako sta povezana.\r\n","datoteke":[{"pot":"01-nadzor/nadzorna-plosca.md","vsebina":"---\r\nid: nadzorna-plosca\r\nnaslov: Nadzorna plošča\r\npodrocje: 01-nadzor\r\nstanje: deluje\r\nbere: [pim.izdelek, pim.validacija, pim.surovi-zajem, pim.urniki, obvestila]\r\npise: []\r\nstrani: [/nadzorna-plosca]\r\nposli: [PRODUCT_VALIDATION, PRODUCT_PUBLICATION, ALERT_EVALUATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Dashboard.razor, PIM_Solution/src/PIM.Intranet/Services/IntranetDataService.cs]\r\nmigracije: [218]\r\n---\r\n\r\n# Nadzorna plošča\r\n\r\n\u003e **Področje:** Nadzor · **Lastnik:** skrbnik PIM · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nEna stran, ki na začetku dneva pokaže stanje vseh podjetij skupaj: koliko artiklov je v katalogu, koliko jih je brez ERP blokad, koliko je blokiranih za splet, koliko zajemov čaka v karanteni, zadnje procese in odprta opozorila integracij. Stran samo bere — nič ne spreminja.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pogleda, ali je število blokiranih za splet normalno; klikne na kartico za seznam. |\r\n| Urednik kataloga | Iz kartic »Blokirani za splet« in »Kakovost po profilih« gre na delo v `/kakovost/napake`. |\r\n| Skrbnik | Spremlja »Zadnji procesi« in »Opozorila in prioritete«; ob rdečem stanju gre na `/sistem`. |\r\n| Avtomatika (PIM) | Validacija (urno) in objava sproti spreminjata števce; nadzornik odpira alarme, ki jih plošča pokaže. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** vsak prijavljen uporabnik odpre `/nadzorna-plosca` (prva postavka v meniju).\r\n- **Po urniku:** ni lastnega posla. Števci sledijo poslom `PRODUCT_VALIDATION` (vsako uro ali po zajemu iz SAOP), `PRODUCT_PUBLICATION` in `ALERT_EVALUATION` (nadzornik, vsakih 5 min).\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Števci kataloga, validacije, karantene; zadnji teki; opozorila in stanje integracij; profili kakovosti | PIM (vsa aktivna podjetja) |\r\n| **Izhod** | Samo prikaz na zaslonu, s povezavami na podrobne strani | uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Odpre nadzorno ploščo]) --\u003e B[Pregleda kartice in panele]\r\n    B --\u003e C{Kaj je rdeče?}\r\n    C -- \"blokirani za splet\" --\u003e D[Odpre kakovost napake]\r\n    C -- \"karantena\" --\u003e E[Odpre karanteno]\r\n    C -- \"opozorila ali procesi\" --\u003e F[Odpre nadzor sistema]\r\n    C -- \"nič\" --\u003e G([Konec])\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    H[[Validacija in objava vsako uro]] --\u003e I[(Števci po podjetjih)]\r\n    J[[Nadzornik vsakih 5 min]] --\u003e K[(Opozorila in teki)]\r\n    I --\u003e L[[Predpomnilnik 60 s]]\r\n    K --\u003e L\r\n  end\r\n  L --\u003e B\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,G endp; class B,D,E,F user; class C,H,J,L auto; class I,K data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Kdorkoli | `/nadzorna-plosca` | Odpreš stran. | Za vsako aktivno podjetje se vzporedno preberejo števci; rezultat se hrani 60 s, zato drugi uporabniki v isti minuti vidijo iste številke. | Zgoraj je pet kartic, spodaj tabela »Po podjetjih« z vrstico »Skupaj«. |\r\n| 2 | Kdorkoli | `/nadzorna-plosca` | Prebereš pet kartic: »Artikli v katalogu«, »Brez ERP blokad« (z % od kataloga), »V PIM sloju«, »Blokirani za splet«, »Zajemi v karanteni«. | — | Števci niso deli iste celote (piše v podnaslovu strani); vsak meri drugo množico. |\r\n| 3 | Kdorkoli | `/nadzorna-plosca` | Klikneš vrstico podjetja v »Po podjetjih«. | Odpre se `/izdelki?podjetje=N`. | Seznam izdelkov je filtriran na to podjetje. |\r\n| 4 | Urednik kataloga | `/nadzorna-plosca` → `/kakovost/napake` | Klikneš »Blokirani za splet« ali »Poglej vse« pri »Kakovost po profilih«. | — | Odpre se seznam napak validacije. |\r\n| 5 | Skrbnik | `/nadzorna-plosca` → `/sistem` ali `/sistem/teki` | Pri »Zadnji procesi / Status integracij« (5 najnovejših tekov) ali »Opozorila in prioritete« (5 odprtih) klikneš »Poglej vse« oziroma »Vsa opozorila«. | — | Na `/sistem` vidiš isti alarm in lahko ga potrdiš ali razrešiš. |\r\n| 6 | Kdorkoli | `/nadzorna-plosca` → `/kakovost/karantena` | Klikneš »Zajemi v karanteni«. | — | Vidiš vhodne zapise, ki jih obdelava ni prevzela (to niso artikli). |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Stran ničesar ne zapiše in ne sproži — je samo pregled.\r\n- Prikaže **vsa aktivna podjetja skupaj** in razčlenitev po podjetjih (uporabnik 2026-08-28: »morajo kazati celotno tabelo«).\r\n- Če eno podjetje ne odgovori, ostali paneli ostanejo; panel dobi besedilo »… ni na voljo«.\r\n- Številke so lahko stare do 60 sekund (predpomnilnik, uveden 218 zaradi obremenitve baze).\r\n- Dostop: vsak prijavljen uporabnik z dovoljenjem za nadzorno ploščo (postavka menija `PimAccessCatalog.Dashboard`).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Nadzorne plošče trenutno ni mogoče naložiti.« | Baza ne odgovori ali poizvedba preseže čas (30 s). | Počakaj minuto in osveži; če se ponavlja, javi skrbniku (`/sistem`). |\r\n| »Nobeno podjetje ni aktivno.« | V `dbo.OrganizationConfig` ni aktivnega podjetja. | Skrbnik preveri nastavitve podjetij. |\r\n| Števci se po popravku ne spremenijo. | Predpomnilnik 60 s ali validacija še ni tekla (teče vsako uro ali po zajemu). | Počakaj na naslednjo validacijo; stanje posla vidiš na `/sistem`. |\r\n| »Kakovost po profilih« je prazna. | Profili kakovosti še niso izračunani. | Počakaj na validacijo; če ostane prazno, javi skrbniku. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Dashboard.razor`\r\n- **Storitve / delavci:** `IntranetDataService.GetOrganizationsAsync`, `GetDashboardAsync`, `GetValidationIssuesAsync(take: 0)` (samo profili), `GetPipelineRunsAsync`, `GetSystemIntegrationsAsync`; `IMemoryCache` 60 s na podjetje (`dashboard:metrics:{id}`, `dashboard:panels:{id}`).\r\n- **Tabele in pogledi:** kanonični katalog (`canon.Product`), `pim.Product`, rezultati validacije, `raw.Inbox` (karantena), `ops.PipelineRun`, alarmi in integracije.\r\n- **Migracije:** 218 (meritve zmogljivosti, vzporedno branje in predpomnilnik).\r\n- **Urniki:** posredno `PRODUCT_VALIDATION`, `PRODUCT_PUBLICATION`, `ALERT_EVALUATION`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Kartica »V PIM sloju« šteje zgodovinsko promovirane artikle (`pim.Product`), ne trenutne spletne objave — ime lahko zavaja.\r\n- ⚠️ »Zadnji procesi« kažejo samo stare teke (`ops.PipelineRun`), ne novih poslov avtomatike po fazah (`/sistem`); stanje posla je zanesljivejše na `/sistem`.\r\n- ⚠️ Plošča ne kaže varovalk (zadržanih artiklov) — zadržani artikli so vidni samo na `/varovalke` in v zvoncu.\r\n- ⚠️ Vse povezave »Poglej vse« pri procesih in opozorilih vodijo na `/sistem`, ki je v meniju samo za skrbnika; drugim vlogam lahko vrne zavrnitev.\r\n\r\n## Povezani procesi\r\n\r\n- [Varovalke](varovalke.md): zadržane objave, ki jih plošča ne prikaže.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): izvor števcev »Brez ERP blokad« in »Blokirani za splet«.\r\n- [Karantena](../04-kakovost/karantena.md): kam vodi kartica »Zajemi v karanteni«.\r\n- [Nadzor sistema](../09-administracija/nadzor-sistema.md): podrobnosti procesov in alarmov.\r\n- [Pregled vhodov in virov](../02-vhodi/pregled-vhodov-in-virov.md): stanje zajema po virih.\r\n"},{"pot":"01-nadzor/varovalke.md","vsebina":"---\r\nid: varovalke\r\nnaslov: Varovalke pred objavo in pred SAOP\r\npodrocje: 01-nadzor\r\nstanje: delno\r\nbere: [pim.izdelek, pim.cene, pim.kategorije-izdelka, pim.validacija, pim.saop-vrsta]\r\npise: [pim.varovalke, pim.saop-vrsta, pim.urniki, obvestila]\r\nstrani: [/varovalke, /varovalke/{Id}]\r\nposli: [WEB_CATALOG_EXPORT, SAOP_OUTBOUND_DISPATCH]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/SafeguardOverview.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/SafeguardReview.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/SaopSafeguardBanner.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/SaopDeactivationConfirm.razor, PIM_Solution/src/PIM.Intranet/Services/SafeguardService.cs, PIM_Solution/src/PIM.Intranet/Services/PimAuthorization.cs, PIM_Solution/workers/PIM.B2bWorker/CatalogSafeguard.cs]\r\nmigracije: [277, 281, 309, 311]\r\n---\r\n\r\n# Varovalke pred objavo in pred SAOP\r\n\r\n\u003e **Področje:** Nadzor · **Lastnik:** urednik kataloga in komerciala (potrditev), skrbnik (pravila) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nPreden gre kaj iz PIM-a (katalog.csv za splet ali deaktivacija artikla v SAOP), PIM primerja novo stanje z zadnjo objavo. Sumljiv artikel je **zadržan**, vsi ostali gredo ven normalno. Rezultat: napačna cena ali množičen umik ne pride na splet, neaktiven artikel ne gre v SAOP, dokler ga nekdo ne potrdi na `/varovalke`.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda zadržane cene in potrdi (»Potrdi izbrane«, »Potrdi vse zadržane«) ali popravi ceno v SAOP. |\r\n| Urednik kataloga | Pregleda umike s spleta in deaktivacije za SAOP; potrdi ali popravi (kategorija, kljukica, aktivnost na kartici). |\r\n| Skrbnik | Ureja pravila, prag, »Najmanj artiklov« in vklop na `/varovalke` (razdelek »Pravila«); lahko tudi potrjuje. |\r\n| Avtomatika (PIM) | Izvoz katalog.csv pred objavo pokliče varovalko in zadržane artikle izpusti iz datoteke; ob potrditvi sproži nov izvoz oziroma pošiljanje v SAOP; odpre obvestilo v zvoncu. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik odpre `/varovalke` — ob tem se osveži seznam deaktivacij za SAOP (`ops.EvaluateSaopSafeguards`).\r\n- **Po urniku:** ob vsakem izvozu kataloga (`WEB_CATALOG_EXPORT`, po uspešni objavi, najmanj vsako uro) teče varovalka katalog.csv.\r\n- **Ob dogodku:** deaktivacija artikla v odhodni vrsti za SAOP (s kartice, iz Excela, množičnega urejanja) vedno ostane »čaka odobritev«, dokler je ne potrdi varovalka; potrditev sproži `WEB_CATALOG_EXPORT` (katalog) ali `SAOP_OUTBOUND_DISPATCH` (SAOP).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Pripravljene vrstice katalog.csv (cene B2B/B2C, spletišča), zadnja objavljena datoteka, deaktivacije v odhodni vrsti za SAOP | PIM (izvoz, odhodna vrsta) |\r\n| **Izhod** | Preverjanje z ugotovitvami, zadržani artikli, potrditve (veljajo 14 dni), zahteva za nov izvoz ali odobritev sporočila za SAOP, obvestilo v zvoncu | PIM → katalog.csv / SAOP |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Izvoz katalog.csv]) --\u003e B[[Primerjava z zadnjo objavo]]\r\n    B --\u003e C{Sumljiv artikel?}\r\n    C -- ne --\u003e D[[Artikel gre v datoteko]]\r\n    C -- da --\u003e E\u003eZadržan, čaka potrditev]\r\n    F([Deaktivacija v vrsti SAOP]) --\u003e G\u003eČaka potrditev na varovalkah]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    H[Pregleda na varovalkah] --\u003e I{Pravilno?}\r\n    I -- da --\u003e J[Potrdi izbrane ali vse]\r\n    I -- ne --\u003e K[Popravi v SAOP ali na kartici]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    L[(katalog.csv)]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    M[(Artikel neaktiven)]\r\n  end\r\n  D --\u003e L\r\n  E --\u003e H\r\n  G --\u003e H\r\n  J -- \"katalog: nov izvoz\" --\u003e L\r\n  J -- \"SAOP: odobreno za pošiljanje\" --\u003e M\r\n  K -- \"naslednji izvoz ga ne zadrži\" --\u003e A\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,F endp; class H,J,K user; class B,C,D,I auto; class E,G wait; class L,M data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n**A. Katalog.csv (področje »Katalog za splet«)**\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Avtomatika | — | — | Izvoz sestavi katalog.csv, nato ga primerja z zadnjo objavo: oblika cene, faktor ×10/×100/×1000, cena 0, prazna cena, skok nad prag (privzeto 25 %), padec števila vrstic (10 %), umik s spleta (od 10 artiklov naprej), nove kljukice brez objave, novi na spletu. Zadržani artikli **niso v datoteki**; ostali so objavljeni. | Na `/varovalke` je v »Zadnja preverjanja« nova vrstica; pri čakajočem je kartica v »Čaka potrditev«. V zvoncu je opozorilo. |\r\n| 2 | Komerciala / urednik | `/varovalke` | V »Čaka potrditev« klikneš »Preglej in potrdi«. | Odpre se `/varovalke/{Id}`: števci (na spletu, zadržani, gre s spleta, novi, s kljukico a ne gre), nato skupine po pravilu s tabelo prej → zdaj. | Vidiš seznam zadržanih artiklov z razlogom. |\r\n| 3 | Komerciala / urednik | `/varovalke/{Id}` | Pri umikih klikneš razlog v vrstici s števili, da vidiš samo te artikle; po potrebi »Prenesi ugotovitve v Excel«. | Filter po razlogu (odkljukan, brez kategorije, neveljaven, neaktiven …). | Tabela kaže samo izbrani razlog. |\r\n| 4a | Komerciala / urednik | `/varovalke/{Id}` | Če je sprememba pravilna: označiš kljukice (ali »Izberi vse zadržane v tej skupini«), neobvezno vpišeš »Opomba«, klikneš »Potrdi izbrane« ali »Potrdi vse zadržane« → »Da, potrdi vse«. | Potrditev se zapiše (kdo, kdaj, opomba) in velja 14 dni za enako spremembo; odda se zahteva za takojšen izvoz (`WEB_CATALOG_EXPORT`). Artikel gre ven, ko so potrjene vse njegove zadržane ugotovitve. | Sporočilo »Potrjenih N ugotovitev. Izvoz je sprožen …«; stanje preverjanja postane »potrjeno«, v nekaj minutah je artikel v katalog.csv. |\r\n| 4b | Komerciala / urednik | SAOP ali kartica artikla | Če sprememba ni pravilna: popraviš vzrok (ceno v SAOP, kategorijo ali kljukico na kartici; umike na `/splet/umaknjeni`). | Naslednji izvoz ugotovitve ne najde več in artikel objavi sam; staro preverjanje postane »nadomeščeno«. | Na `/varovalke` je novo preverjanje brez tega artikla. |\r\n| 5 | Skrbnik | `/varovalke` (»Pravila«) | Spremeniš »zadrži artikel«, »Prag«, »Najmanj artiklov« ali »vklopljeno« in klikneš »Shrani«. | Pravilo se shrani s tvojim imenom; velja od naslednjega izvoza. | Sporočilo »Pravilo … je shranjeno. Velja od naslednjega izvoza.« |\r\n\r\n**B. Deaktivacija v SAOP (področje »SAOP«, 281)**\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | kartica, Excel, množično urejanje | Artikel označiš kot neaktiven. | V PIM se aktivnost zapiše takoj; sporočilo za SAOP gre v vrsto kot »čaka odobritev«. Odobritev skupine ali artikla ga **preskoči** (ostale spremembe gredo). | Na strani odobritve se pokaže okvir »V SAOP N artiklov bo neaktivnih« s seznamom. |\r\n| 2a | Urednik | stran odobritve (odhodna vrsta, množično urejanje, artikli SAOP) | V okvirju pregledaš seznam in klikneš »Da, namenoma — pošlji v SAOP« (ali »Pošlji samo aktivne« / »Ne zdaj«). | Deaktivacije so potrjene in odobrene za pošiljanje; pošlje jih odhodna vrsta. | Sporočilo »Potrjeno: N neaktivnih artiklov gre v SAOP.« |\r\n| 2b | Urednik / komerciala | `/varovalke` → `/varovalke/{Id}` | Odpreš kartico »SAOP · podjetje: v SAOP N artiklov bo neaktivnih«, izbereš in klikneš »Potrdi izbrane in pošlji v SAOP«. | Isto kot 2a; odda se zahteva za `SAOP_OUTBOUND_DISPATCH`. | Števec »Potrjeni« se poveča; preverjanje se zapre, ko nič več ne čaka. |\r\n| 3 | Urednik | odhodna vrsta ali kartica | Če deaktivacija ni namerna: prekličeš sporočilo ali artikel spet označiš kot aktiven. | Ob naslednjem odprtju `/varovalke` preverjanje postane nadomeščeno. | Kartica izgine iz »Čaka potrditev«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Varovalka **nikoli ne ustavi posla**: izvoz vedno objavi datoteko brez zadržanih artiklov. Če varovalka pade, gre datoteka ven kot pred 277, v zvoncu pa ostane opozorilo, da ni bila preverjena.\r\n- Zadržan artikel, ki je že na spletu, tam ostane s **prejšnjimi podatki** (Magento se artiklov, ki jih ni v datoteki, ne dotakne); nov artikel na splet ne pride.\r\n- Potrditev velja 14 dni za **isto** spremembo (artikel, polje, spletišče, prej → zdaj); nova sprememba spet vpraša.\r\n- Pravila »o celoti« (padec vrstic, novi na spletu, kljukica brez objave) artikla ne morejo zadržati — so opozorilo ali informacija.\r\n- Prvi izvoz po uvedbi nima primerjave: artikli s prazno ceno ali ceno 0 so enkrat zadržani.\r\n- V SAOP nič ne gre samodejno; **vsaka** deaktivacija čaka potrditev, tudi če bi bil profil kdaj nastavljen na samodejno odobritev. Posamična odobritev deaktivacije v vrsti vrne napako z napotkom na `/varovalke`.\r\n- Kdo sme: potrditev (`SafeguardConfirm`) — skrbnik, urednik kataloga, komercialist. Pravila (`SafeguardSettings`) — samo skrbnik. Potrditev deaktivacij na strani odobritve (`SaopWrite`) — skrbnik in urednik kataloga.\r\n- Čiščenje: nadomeščena preverjanja po 2 dneh, podrobnosti objavljenih po 30 dneh, vse po 120 dneh (čakajoča ostanejo).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Artikla ni na spletu ali ima staro ceno. | Zadržan na varovalki. | `/varovalke` → »Preglej in potrdi«; potrdi ali popravi vzrok. |\r\n| »To preverjanje ne čaka več potrditve …« | Potrdil je nekdo drug ali je nastal novejši izvoz. | Klikni »Odpri najnovejše preverjanje« in nadaljuj tam. |\r\n| »Potrjeni artikli gredo na splet z naslednjim izvozom (izvoz ta hip teče ali ni vklopljen).« | Izvoz že teče ali je posel izklopljen. | Počakaj na naslednji izvoz; če je izklopljen, javi skrbniku (`/sistem`). |\r\n| »Tvoja vloga potrditve ne dovoljuje.« / »Potrdi lahko skrbnik, urednik kataloga ali komercialist.« | Bralna vloga. | Prosi uporabnika s pravo vlogo. |\r\n| »Varovalk ni mogoče prebrati (migracija 277 …)« | Migracija 277 ali 281 ni nameščena v tej bazi. | Skrbnik namesti migracije (`PIM.Migrator`). |\r\n| Isto preverjanje ima »isti izid N× zapored«. | Vzrok ni odpravljen, izvoz vsako uro najde isto. | Odloči: potrdi ali popravi. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/SafeguardOverview.razor` (`/varovalke`), `SafeguardReview.razor` (`/varovalke/{Id}`), Excel `GET /varovalke/{id}/excel` (`Program.cs`); okvir `Components/Shared/SaopSafeguardBanner.razor` in `SaopDeactivationConfirm.razor` na straneh odobritve SAOP (`/outbound`, `/cene`, `/saop/artikli`, `/izvozi/mnozicno`). Okvir seznam prebere šele po prvem izrisu strani (46): stran se pokaže takoj, pasica nekaj trenutkov pozneje; nov `Version` (po odobritvi) ali drugo podjetje ga prebere znova. Branje ima mejo 15 s — ob izteku pasica ostane prazna, pošiljanje pa je vseeno varno, ker odobritev zadržanih sprememb ne spusti (`ops.SaopHeldForApproval`).\r\n- **Storitve / delavci:** `SafeguardService` (`GetChecksAsync`, `GetCheckAsync`, `ApproveAsync`, `SaveRuleAsync`, `EvaluateSaopAsync`, `GetSaopHeldAsync` → `intranet.GetSaopHeldMessages`, `ConfirmSaopHeldAsync` → `ops.ConfirmSaopHeldMessages`); `PIM.B2bWorker/CatalogSafeguard.cs` kliče `ops.EvaluateCatalogSafeguards` pred zamenjavo datotek in `out.RecordCatalogPublication` po objavi.\r\n- **Tabele in pogledi:** `ops.SafeguardRule`, `ops.SafeguardCheck` (CLEAN, WARNED, WAITING, CONFIRMED, SUPERSEDED), `ops.SafeguardFinding`, `ops.SafeguardApproval`, `out.CatalogPublishedValue`, `pim.WebShopReason()`, pogleda `ops.SaopHeldMessage` (zadržana sporočilo × pravilo; 311: pravilo SAOP_KLJUCNO išče prejšnjo vrednost v `pim.ProductFieldHistory` po podjetju in izdelku — prej ~60 s, zdaj pod 1 s) in `ops.SaopHeldForApproval` (bere ga odobritev skupine `out.ApproveOutboundBatch` enkrat v `@Held`; meritev 30. 9. po 311 (51): skupina s 716 sporočili 0,13 s, prej do ~285 s, zato je gumb »Odobri in pošlji« na `/cene` spet takojšen); procedure `ops.ApproveSafeguardFindings` → `ops.OnSafeguardApproved` → `ops.RequestJobRun`.\r\n- **Migracije:** `277_VarovalkeKatalogCsv.sql` (tudi ločilo `;` in decimalna vejica v katalog.csv), `281_VarovalkeSaop.sql`, `309_HitraPasicaSaop.sql` (naziv artikla v seznamu po šifri, nato po EAN — po indeksu), `311_HitriPogledZadrzanihSaop.sql` (hitrejši pogled zadržanih).\r\n- **Urniki:** `WEB_CATALOG_EXPORT` (varovalka teče v njem), `SAOP_OUTBOUND_DISPATCH` (po potrditvi SAOP).\r\n- **Pravila (seme):** `KAT_CENA_OBLIKA`, `KAT_CENA_VEJICA`, `KAT_CENA_NIC`, `KAT_CENA_PRAZNA`, `KAT_CENA_SKOK` (25 %), `KAT_VRSTICE` (10 %), `KAT_SPLET_UMIK` (najmanj 10), `KAT_KLJUKICA_NE_GRE`, `KAT_SPLET_NOVI`, `SAOP_NEAKTIVEN`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Seznam deaktivacij za SAOP se osveži **samo ob odprtju** `/varovalke` (ali okvirja na strani odobritve); ni posla, ki bi ga osveževal sam. Opozorilo v zvoncu za SAOP zato nastane šele, ko nekdo odpre stran.\r\n- ⚠️ Pravici se ne ujemata: na `/varovalke/{Id}` lahko deaktivacije za SAOP potrdi tudi **komercialist** (`SafeguardConfirm`), na strani odobritve pa samo skrbnik in urednik (`SaopWrite`). Komercialist lahko torej prek varovalke odobri pošiljanje v SAOP, ki ga sicer ne sme.\r\n- ⚠️ Del SAOP varovalke (281, okvir na straneh odobritve) je ob pregledu v **neuveljavljenih spremembah** v repozitoriju (`SaopSafeguardBanner.razor`, `SaopDeactivationConfirm.razor`, `281_…sql`); ni zanesljivo, da je na strežniku.\r\n- ⚠️ Varovalka katalog.csv velja samo za **podjetje 2** (edini katalog); zaloga in viri kot področji varovalk še ne obstajajo, čeprav jih stran omenja kot prihodnje.\r\n- ⚠️ Ročni korak pred uvedbo: uvoz katalog.csv in stranke.csv v Magento mora biti preklopljen na ločilo `;`, sicer splet datoteke ne prebere.\r\n\r\n## Povezani procesi\r\n\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): izvoz, v katerem teče varovalka katalog.csv.\r\n- [Umaknjeni artikli in obvestila](../06-izhod-splet/umaknjeni-s-spleta.md): popravek umikov in kljukic brez objave.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odhodna vrsta, kjer čakajo deaktivacije.\r\n- [Množični izhod](../05-izhod-saop/mnozicni-izhod.md): odobritev skupin z okvirjem deaktivacij.\r\n- [Zgodovina in popravki SAOP](../05-izhod-saop/zgodovina-in-popravki-saop.md): popravek že poslanih vrednosti.\r\n- [Cene in ceniki](../07-poslovanje/cene-in-ceniki.md): kje popraviti napačno ceno.\r\n- [Uporabniki in vloge](../09-administracija/uporabniki-in-vloge.md): kdo sme potrjevati.\r\n"},{"pot":"01-nadzor/zgodovina-uvozov-in-povratek.md","vsebina":"---\r\nid: zgodovina-uvozov-in-povratek\r\nnaslov: Zgodovina uvozov in povratek\r\npodrocje: 01-nadzor\r\nstanje: delno\r\nbere: [pim.zgodovina-uvozov, pim.saop-vrsta, pim.izdelek, pim.atributi, pim.cene, pim.stranke]\r\npise: [pim.zgodovina-uvozov, pim.izdelek, pim.atributi, pim.stranke, pim.saop-vrsta]\r\nstrani: [/uvozi, /uvozi/{Id}, /izdelki/uvoz, /cene/uvoz, /stranke/uvoz]\r\nposli: [SAOP_OUTBOUND_DISPATCH]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/ImportHistory.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ImportRunView.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/ImportUndoBanner.razor, PIM_Solution/src/PIM.Intranet/Services/ImportHistoryService.cs, PIM_Solution/src/PIM.Intranet/Services/ImportRunStatus.cs, PIM_Solution/src/PIM.Intranet/Services/ProductWorkbookService.cs, PIM_Solution/src/PIM.Intranet/Services/PriceWorkbookService.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductImport.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/PriceImport.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/CustomerImport.razor]\r\nmigracije: [280]\r\n---\r\n\r\n# Zgodovina uvozov in povratek\r\n\r\n\u003e **Področje:** Nadzor · **Lastnik:** urednik kataloga (izdelki), komerciala (cene, stranke) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nVsak uveljavljen uvoz izdelkov, cen ali strank iz Excela se zapiše kot ena vrstica z vsemi spremenjenimi celicami (prej → potem). Uvoz, ki je naredil narobe, se **povrne v celoti**: iz »prej« nastane nov uvoz, ki gre skozi isti predogled in isti zapis kot vsak uvoz.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda uvoz cen ali strank, pripravi in potrdi povratek. |\r\n| Urednik kataloga | Pregleda uvoz delovnega lista izdelkov; prekliče, kar še čaka v SAOP; pripravi povratek. |\r\n| Skrbnik | Enako kot urednik; pomaga pri sporih, ki jih povratek ne vrne. |\r\n| Avtomatika (PIM) | Ob vsakem uvozu zapiše zgodovino; pri povratku preveri spore; odhodna vrsta pošlje v SAOP šele po odobritvi. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** zapis nastane samodejno ob potrditvi uvoza na `/izdelki/uvoz`, `/cene/uvoz` ali `/stranke/uvoz`. Povratek sproži uporabnik z gumbom »Pripravi povratek (predogled)« na `/uvozi/{Id}`.\r\n- **Po urniku:** ni. Po odobritvi pošlje sporočila v SAOP posel `SAOP_OUTBOUND_DISPATCH`.\r\n- **Ob dogodku:** vsak uveljavljen uvoz z vsaj eno spremembo.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Predogled uvoza (prej → potem po celicah), skupine v vrsti za SAOP, pri strankah posnetek seznama pred uvozom | Excel / uporabnik |\r\n| **Izhod** | Zapis uvoza s spremembami; povratni uvoz (nov zapis, povezan s prvotnim); preklic čakajočih sporočil za SAOP | PIM / vrsta za SAOP |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Uvoz potrjen]) --\u003e B[Odpre zgodovino uvozov]\r\n    B --\u003e C{Kaj je narobe?}\r\n    C -- \"SAOP še čaka\" --\u003e D[Prekliči kar še čaka v SAOP]\r\n    C -- \"vrednosti v PIM\" --\u003e E[Pripravi povratek]\r\n    E --\u003e F[Pregleda predogled in potrdi]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    G[(Zapis uvoza prej potem)] --\u003e H[[Predogled s prejšnjimi vrednostmi]]\r\n    H --\u003e I{Kdo drug spremenil?}\r\n    I -- da --\u003e J[[Spor, ne povrne]]\r\n    I -- ne --\u003e K[[Zapiše kot nov uvoz]]\r\n    K --\u003e L\u003eČaka odobritev v vrsti SAOP]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    M[(Prejšnje vrednosti)]\r\n  end\r\n  A --\u003e G\r\n  E --\u003e H\r\n  H --\u003e F\r\n  F --\u003e K\r\n  D --\u003e N([Nič ne gre v SAOP])\r\n  L --\u003e M\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,N endp; class B,D,E,F user; class C,H,I,J,K auto; class L wait; class G,M data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala / urednik | `/uvozi` | Odpreš »Zgodovina uvozov« v meniju; po potrebi izbereš »Izdelki«, »Cene« ali »Stranke«. | Prebere se največ 200 zadnjih uvozov. | Tabela: številka, čas, vrsta, datoteka, kdo, vrstic, sprememb, v SAOP, stanje (»uveljavljen«, »preklican«, »delno preklican«, »povrnjen z uvozom #N«, »povratek uvoza #N«). Stanje vrste za SAOP se za vse vrstice prebere z eno poizvedbo. |\r\n| 2 | Komerciala / urednik | `/uvozi/{Id}` | Klikneš številko uvoza. Iščeš po polju »Išči« (šifra, polje, vrednost). | Pokaže do 500 spremenjenih celic: vrstica, polje, prej, potem, kam (»PIM«, »PIM + vrsta za SAOP« pri izdelkih ali »vrsta za SAOP« pri cenah, ki v PIM ne pišejo); števec v vrsti šteje **cene / artikle**, ne sporočil po polju (čaka / v SAOP / preklicanih). | Vidiš točno, kaj je uvoz spremenil. |\r\n| 3 | Urednik / skrbnik | `/uvozi/{Id}` | Če sporočila za SAOP še čakajo: »Prekliči, kar še čaka v SAOP (N)« → »Da, prekliči«. | Skupine uvoza v vrsti za SAOP se prekličejo; v SAOP ne gre nič od tega. | Sporočilo »Preklicano: N cen. V SAOP ne gre nič od tega.«; števec »čaka« je 0. Uvoz cen, ki je s tem v celoti preklican, dobi stanje »preklican« in namesto povratka stavek »Povratek ni potreben«. |\r\n| 4 | Komerciala / urednik | `/uvozi/{Id}` | Klikneš »Pripravi povratek (predogled)«. | Odpre se stran uvoza (`/izdelki/uvoz?povrni=N`, `/cene/uvoz?povrni=N` ali `/stranke/uvoz?povrni=N`) z okvirjem »Povratek uvoza #N« in običajnim predogledom s prejšnjimi vrednostmi. Nič se še ne zapiše. | Okvir pove, kaj se ne povrne (»Ne povrnem (N)«) in zakaj. |\r\n| 5 | Komerciala / urednik | stran uvoza | Pregledaš predogled in potrdiš uvoz kot vsak drug. | Zapiše se kot nov uvoz z opombo »Povratek uvoza #N« (zgodovina, validacija, sled). Vrednosti za SAOP gredo v vrsto in čakajo odobritev. Prvotni uvoz dobi oznako »povrnjen«. | Na `/uvozi` je nova vrstica »povratek #N«, prvotna ima »povrnjen (#M)«. |\r\n| 6 | Urednik | Izhod v SAOP | Odobriš povratne spremembe v vrsti za SAOP. | Posel `SAOP_OUTBOUND_DISPATCH` jih pošlje. | V zgodovini SAOP so poslane prejšnje vrednosti. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Povratek vrne vrednost **samo tam, kjer je še vedno vrednost uvoza**. Kar je po uvozu spremenil kdo drug, ostane in se pokaže kot spor (»po uvozu spremenjeno … preveri ročno«).\r\n- V SAOP nič ne gre samodejno: povratne vrednosti čakajo odobritev v vrsti.\r\n- SAOP ne dobi praznih vrednosti: če je bilo polje pred uvozom prazno, ga povratek ne izprazni v SAOP (»polje izprazni v SAOP ročno«).\r\n- Stanje uvoza se izračuna iz vrste za SAOP (nič se ne zapiše): uvoz **cen**, katerega zapisi so v vrsti vsi preklicani, je »preklican« in nima povratka (v SAOP in v PIM se ni nič spremenilo). Uvoz izdelkov ali strank ostane »uveljavljen« s povratkom, tudi če je bil del za SAOP preklican (PIM je spremenjen). Del v SAOP in del preklican = »delno preklican«, povratek ostane. Dokončno neuspelo sporočilo (Dead) ni preklic. *Privzeto za noč (naloga #66), odločitev lastnika: naloga #85.*\r\n- Cene: povratek je mogoč šele, ko je nova cena že prišla iz SAOP (zajem cen). Dokler serija čaka v vrsti, je pravi povratek **preklic**.\r\n- Stranke: zaznamkov in pravil S po tipih ter novo ustvarjenih B2B profilov povratek ne vzame nazaj (samo nastavitve).\r\n- Uvoz, ki je že povrnjen, se ne more povrniti drugič (»Uvoz #N je že povrnjen«).\r\n- Zapis zgodovine ne sme podreti uvoza: če zgodovine ni mogoče zapisati, uvoz ostane uveljavljen, zapisa pa ni.\r\n- Zapisi se hranijo 180 dni.\r\n- Kdo sme: pregled — vsak z dovoljenjem za »Zgodovina uvozov«; preklic čakajočih — `SaopWrite` (skrbnik, urednik kataloga); povratek — ista pravica kot uvoz na izvorni strani.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Uvoza ni v zgodovini. | Uvoz ni imel sprememb, je starejši od 180 dni, je bil pred migracijo 280 ali zapis zgodovine ni uspel. | Uvoza ni mogoče povrniti s to potjo; popravi ročno ali z novim delovnim listom. |\r\n| »Ničesar ni za povrniti …« | Vse je že kot pred uvozom ali je bilo medtem spremenjeno. | Preglej razdelek »Ne povrnem«. |\r\n| Pri cenah »v PIM je še cena pred uvozom — uvoz v SAOP še ni prišel«. | Serija še čaka ali zajem cen še ni tekel. | Na `/uvozi/{Id}` prekliči, kar še čaka v SAOP. |\r\n| »Tvoja vloga preklica v vrsti za SAOP ne dovoljuje.« | Komercialist nima `SaopWrite`. | Prosi urednika ali skrbnika. |\r\n| »Zgodovine uvozov ni mogoče prebrati (migracija 280 …)« | Migracija 280 ni nameščena. | Skrbnik namesti migracijo. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/ImportHistory.razor` (`/uvozi`), `ImportRunView.razor` (`/uvozi/{Id}`), `Components/Shared/ImportUndoBanner.razor`; povratek na `ProductImport.razor`, `PriceImport.razor`, `CustomerImport.razor` (parameter `?povrni=N`).\r\n- **Storitve / delavci:** `ImportHistoryService` (`RecordAsync`, `GetRunsAsync`, `GetRunAsync`, `GetQueueStateAsync`, `CancelWaitingAsync` → `out.CancelOutboundBatch`, `PlanCustomerUndoAsync`), `ProductWorkbookService.PlanUndoAsync`, `PriceWorkbookService.PlanUndoAsync`.\r\n- **Tabele in pogledi:** `ops.ImportRun` (vrste `IZDELKI`, `CENE`, `STRANKE`; `UndoOfImportRunId`, `UndoneByImportRunId`, `Snapshot`), `ops.ImportRunChange`; procedure `ops.RecordImportRun`, `intranet.GetImportRuns`, `intranet.GetImportRun`; pravica `page.imports.history`.\r\n- **Migracije:** `280_ZgodovinaInPovratekUvozov.sql`.\r\n- **Urniki:** `SAOP_OUTBOUND_DISPATCH` (pošiljanje po odobritvi).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Zgodovina zajema samo **tri** vrste uvozov (izdelki, cene, stranke). Uporabnik je omenil tudi »SAOP«; uvoz odprodaje, S-popustov, množično urejanje in urejanje na kartici se sem ne zapisujejo in jih ni mogoče povrniti na ta način.\r\n- ⚠️ Kar je že poslano v SAOP, povratek pošlje kot **novo** spremembo; če je SAOP medtem kaj spremenil, PIM tega pri sporu ne vidi (primerja samo s PIM).\r\n- ⚠️ Povratek cen je odvisen od zajema cen iz SAOP (`PRICE_IMPORT`); dokler ta ne teče, povratek ne najde ničesar.\r\n- ⚠️ Stran uvoza ob povratku uporabi pravico izvorne strani; ni posebne pravice »povratek«.\r\n\r\n## Povezani procesi\r\n\r\n- [Uvoz delovnega lista](../03-izdelki/uvoz-delovnega-lista.md): uvoz izdelkov, ki se zapiše in povrne tu.\r\n- [Cene in ceniki](../07-poslovanje/cene-in-ceniki.md): uvoz cen.\r\n- [Stranke](../07-poslovanje/stranke.md): uvoz delovnega lista kupcev.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odobritev povratnih sprememb.\r\n- [Zgodovina in popravki SAOP](../05-izhod-saop/zgodovina-in-popravki-saop.md): popravek posameznih že poslanih vrednosti.\r\n- [Varovalke](varovalke.md): povratek, ki deaktivira artikle, čaka potrditev.\r\n"},{"pot":"02-vhodi/cakalna-vrsta-zajema.md","vsebina":"---\r\nid: cakalna-vrsta-zajema\r\nnaslov: Čakalna vrsta zajema\r\npodrocje: 02-vhodi\r\nstanje: delno\r\nbere: [pim.surovi-zajem]\r\npise: []\r\nstrani: [/zajem/cakalna-vrsta]\r\nposli: [SAOP_PRODUCT_IMPORT, SUPPLIER_CATALOG_IMPORT, NIGHTLY_RECONCILIATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/IngestQueue.razor, PIM_Solution/src/PIM.Intranet/Services/PipelineReadService.cs, PIM_Solution/workers/PIM.KatalogWorker/Program.cs, PIM_Solution/workers/PIM.XmlFileWorker/Program.cs]\r\nmigracije: [094, 240, 244]\r\n---\r\n\r\n# Čakalna vrsta zajema\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** skrbnik PIM · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nVsak zajem (SAOP, XML, delovni zvezek) najprej shrani surove »strani« podatkov, nato jih preslikava prenese v katalog. Čakalna vrsta pokaže, koliko strani je po viru, vrsti podatkov (entiteti) in stanju: »Pending« (čaka preslikavo), »Processed« (obdelano), »Quarantined« ali »Failed« (ni prevzeto). »Pending« ni napaka — stran je shranjena in čaka.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ni. |\r\n| Urednik kataloga | Po potrebi preveri, ali je zajem dobavitelja obdelan. |\r\n| Skrbnik | Išče zastale strani (stare »Pending«) in razloge za karanteno; sproži ponovno preslikavo. |\r\n| Avtomatika (PIM) | Preslikava obdela strani; nočna uskladitev pobere zaostanek (`--preslikaj-zaostanek`). |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** odpreš `/zajem/cakalna-vrsta` (kartica »Čaka« na `/zajem`).\r\n- **Po urniku:** strani nastajajo z vsakim zajemom; zaostanek pobere nočna uskladitev (00:30, skupina »Preslikava zaostanka v raw.Inbox«).\r\n- **Ob dogodku:** ko se preslikava dopolni, stari zajemi ostanejo »Pending« pod svojim tekom, dokler jih nekdo ne preslika znova.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Surove strani zajema izbranega podjetja | PIM |\r\n| **Izhod** | Prikaz skupin in posameznih strani z razlogom | uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Zajem shrani stran]) --\u003e B[(Stran Pending)]\r\n    B --\u003e C[[Preslikava]]\r\n    C --\u003e D{Uspelo?}\r\n    D -- da --\u003e E[(Processed)]\r\n    D -- \"ni preslikave\" --\u003e B\r\n    D -- \"napaka v podatkih\" --\u003e F[(Quarantined)]\r\n    G[[Nočni zaostanek ali ponovna preslikava]] --\u003e C\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    H[Pregleda čakalno vrsto] --\u003e I{Stare Pending?}\r\n    I -- da --\u003e J[Javi skrbniku ali ponovno preslikaj vir]\r\n    I -- ne --\u003e K([Konec])\r\n  end\r\n  B --\u003e H\r\n  F --\u003e H\r\n  J --\u003e G\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class H,J user; class C,D,G,I auto; class B,E,F data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | `/zajem/cakalna-vrsta` | Odpreš stran (podjetje je izbrano podjetje v glavi strani). | Prebere se povzetek po viru, entiteti in stanju (število strani, najstarejša, najnovejša). | Tabela skupin. |\r\n| 2 | Skrbnik | isto | Klikneš ime entitete v skupini. | Spodaj se naložijo posamezne strani tega stanja (50 na stran, listanje). | Vidiš številko strani, vir, prejeto, obdelano in razlog. |\r\n| 3 | Skrbnik | isto | Pri »Quarantined« ali »Failed« prebereš »Razlog«. | — | Razlog pove, ali gre za pokvarjen vhod ali manjkajočo preslikavo. |\r\n| 4 | Skrbnik / urednik | `/izdelki/novi-artikli` → »Vrzeli in ponovna preslikava …« | Za XML vire zapreš vrzeli in klikneš »Ponovno preslikaj vir«. | Strani vira gredo še enkrat skozi preslikavo. | Število »Pending« in »Quarantined« pade. |\r\n| 5 | Skrbnik | strežnik | Za SAOP vir po dopolnjeni preslikavi zaženeš `PIM.KatalogWorker --znova-preslikaj \u003cRunId\u003e` ali počakaš nočni zaostanek. | Strani teka se vrnejo na »Pending« in se preslikajo znova. | Skupina »Processed« zraste. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Stran samo bere.\r\n- Ista vsebina se ne zajame dvakrat (strani so enolične po viru, entiteti in vsebini) — zato se po dopolnitvi preslikave ne zajema znova, ampak **preslika znova**.\r\n- Mejnik zajema SAOP se premakne šele, ko so strani preslikane; nepreslikane strani pomenijo, da bo isto obdobje zajeto znova.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Veliko starih »Pending« za eno entiteto. | Entiteta nima aktivne preslikave. | Na `/zajem/viri/{SourceCode}` preveri »Preslikava: Manjka«; skrbnik doda preslikavo. |\r\n| »Quarantined« z razlogom. | Pokvarjen ali nepričakovan vhod. | Odpri težavo na `/zajem/tezave?vrsta=INBOX`. |\r\n| »Za to organizacijo ni zajetih strani.« | Izbrano je podjetje brez zajema. | Zamenjaj podjetje v glavi strani. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/IngestQueue.razor`.\r\n- **Storitve / delavci:** `PipelineReadService.GetInboxGroupsAsync`, `GetInboxPagesAsync`; worker stikala `--map-run`, `--znova-preslikaj`, `--preslikaj-zaostanek` (`PIM.KatalogWorker`, `PIM.XmlFileWorker`).\r\n- **Tabele in pogledi:** `raw.Inbox` (Status Pending, Processed, Quarantined, Failed), `map.ExtractedValue`.\r\n- **Migracije:** 240 (jedro preslikave), 244 (ponovna preslikava vira), 094 (vrnitev na Pending z vrednostmi v surovi obliki).\r\n- **Urniki:** `NIGHTLY_RECONCILIATION` (zaostanek).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Stran kaže samo **izbrano podjetje** (piškotek izbire podjetja; brez izbire prvo aktivno po šifri), medtem ko `/zajem` privzeto kaže vsa.\r\n- ⚠️ Na strani ni gumba za ponovno preslikavo; za SAOP vire je potreben ukaz na strežniku ali nočni zaostanek, za XML vire pot prek strani Novi artikli.\r\n- ⚠️ Stanja so prikazana v angleščini (Pending, Processed, Quarantined).\r\n\r\n## Povezani procesi\r\n\r\n- [Pregled vhodov in virov](pregled-vhodov-in-virov.md): kartica »Čaka«.\r\n- [Preslikava virov in ponovna obdelava](preslikava-virov-in-ponovna-obdelava.md): kako se zastale strani spet obdelajo.\r\n- [Težave in neujemanja zajema](tezave-in-neujemanja-zajema.md): karantena in napake.\r\n- [Karantena](../04-kakovost/karantena.md): pregled zapisov v karanteni.\r\n"},{"pot":"02-vhodi/dobaviteljski-katalogi-xml.md","vsebina":"---\r\nid: dobaviteljski-katalogi-xml\r\nnaslov: Dobaviteljski katalogi XML in zaloga dobaviteljev\r\npodrocje: 02-vhodi\r\nstanje: delno\r\nbere: [dobavitelj.xml, pim.izdelek, pim.pravila, pim.nastavitve, pim.zgodovina-uvozov]\r\npise: [pim.surovi-zajem, pim.atributi, pim.besedila, pim.mediji, pim.kategorije-izdelka, pim.kandidati, pim.zaloge, pim.urniki]\r\nstrani: [/zajem, /zajem/viri/{SourceCode}, /sistem, /izdelki/novi-artikli]\r\nposli: [SUPPLIER_CATALOG_IMPORT, SUPPLIER_STOCK_IMPORT, NIGHTLY_RECONCILIATION]\r\nkoda: [PIM_Solution/workers/PIM.SourceFetchWorker/*.cs, PIM_Solution/workers/PIM.XmlFileWorker/*.cs, PIM_Solution/workers/PIM.StockFileWorker/*.cs, PIM_Solution/src/PIM.XmlMapping/*.cs, PIM_Solution/src/PIM.StockMapping/*.cs, PIM_Solution/src/PIM.Automation/JobCatalog.cs, PIM_Solution/src/PIM.Automation/WorkerSchedulerPolicy.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/SupplierXmlChanges.razor, PIM_Solution/src/PIM.Intranet/Services/SupplierCandidateReadService.cs]\r\nmigracije: [240, 256, 257, 262, 270, 273]\r\n---\r\n\r\n# Dobaviteljski katalogi XML in zaloga dobaviteljev\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** urednik kataloga (vsebina), skrbnik (prevzem) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-29, iz kode in razvojne baze (#7)\r\n\r\n## 1. Namen\r\n\r\nPIM sam prenese kataloge dobaviteljev Nowodvorski (`NW_XML`) in Braytron (`BT_XML`) ter njihove datoteke zaloge (`NW_STOCK`, `BT_STOCK`). Katalog **obogati obstoječe artikle** (atributi, opisi, slike, dokumenti, kategorija dobavitelja), za šifre in EAN, ki jih v PIM ni, pa ustvari **kandidate** na strani Novi artikli. Zaloga dobavitelja se zapiše samo artiklom, ki jih podjetje že ima.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Uporablja zalogo dobavitelja pri artiklih. |\r\n| Urednik kataloga | Pregleda, kaj je XML prinesel (kartica artikla, Novi artikli); zapre vrzeli preslikave. |\r\n| Skrbnik | Nastavi naslove prevzema v `appsettings.Local.json` (`Fetch:NW_XML`, `Fetch:BT_XML` …), spremlja posle na `/sistem`. |\r\n| Avtomatika (PIM) | Prevzame datoteke, jih prebere v surove strani, preslika v katalog ali kandidate, zapiše zalogo. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** skrbnik na `/sistem` pri »Katalog dobaviteljev (XML)« ali »Zaloga dobaviteljev« klikne »Poženi zdaj«.\r\n- **Po urniku:**\r\n  - `SUPPLIER_CATALOG_IMPORT` — vsakih 6 ur; ne kliče SAOP, zato ne čaka v pasu SAOP, a ne teče hkrati z zajemom artiklov iz SAOP (nova šifra mora obstajati, preden jo XML obogati).\r\n  - `SUPPLIER_STOCK_IMPORT` — vsakih 30 min; prevzemnik spoštuje omejitve dobaviteljev (Nowodvorski na 2 h, Braytron en prenos na 3 h).\r\n  - `NIGHTLY_RECONCILIATION` ob 00:30 ponovi prevzem in branje kot kontrolo.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | `products_en_US.xml` (Nowodvorski, ~19 MB, HTTP), Braytron XML (HTTP), zaloga NW (FTP, CSV), zaloga BT (HTTPS, XML) | dobavitelj |\r\n| **Izhod** | Surove strani zajema, atributi, besedila, slike in dokumenti, kategorija dobavitelja, kandidati za nove artikle, pozicije zaloge dobavitelja | PIM |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph W[\"🌐 Splet\"]\r\n    A[(XML in zaloga dobavitelja)]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    B([Posel na 6 ur ali 30 min]) --\u003e C[[Prevzem datoteke]]\r\n    C --\u003e D{Prevzem uspel?}\r\n    D -- ne --\u003e E([Branje preskočeno])\r\n    D -- da --\u003e F[[Branje v surove strani]]\r\n    F --\u003e G{Ista vsebina kot prej?}\r\n    G -- da --\u003e H([Brez novih podatkov])\r\n    G -- ne --\u003e I[[Preslikava]]\r\n    I --\u003e J{Artikel v PIM po šifri ali EAN?}\r\n    J -- da --\u003e K[[Obogati artikel ali zapiše zalogo]]\r\n    J -- ne --\u003e L[(Kandidat za nov artikel)]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    M[Pregleda Novi artikli]\r\n  end\r\n  A --\u003e C\r\n  L --\u003e M\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class B,E,H endp; class M user; class C,D,F,G,I,J,K auto; class A,L data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Avtomatika | — | — | Prevzemnik prenese datoteko v mapo prevzema (`\u003cLANDING_ROOT\u003e\\NW_XML` …). Nowodvorski katalog se prenese največ vsakih 6 h (varovalka `MinIntervalMinutes = 360`). Če prevzem pade (npr. manjka naslov), se branje istega vira preskoči, da stara datoteka ne ustvari videza svežine. | `/sistem` → posel → faza prevzema zelena. |\r\n| 2 | Avtomatika | — | — | Za **vsako vključeno podjetje** posebej se XML prebere v surove strani. Enaka vsebina kot že zajeta se ne zapiše znova (»uspelo, brez novih podatkov«). | Faze BRANJE in ZAPIS; na `/zajem/viri/NW_XML?podjetje=2` raste »Prejeto v 24 urah«. |\r\n| 3 | Avtomatika | — | — | Preslikava zapis poveže z artiklom po šifri ali EAN. Obstoječemu artiklu zapiše polja, katerih lastnik je dobavitelj (atributi, opisi, slike, dokumenti, kategorija dobavitelja); ne povozi polj SAOP in PIM. | Na kartici artikla so nove lastnosti in slike. |\r\n| 4 | Avtomatika | — | — | Zapis brez ujemanja postane **kandidat** (ne artikel). Če je artikel medtem nastal po drugi poti (SAOP), se kandidat samodejno zapre. | Na `/izdelki/novi-artikli` je nov kandidat »Čaka na ERP«. |\r\n| 5 | Avtomatika | — | — | Zaloga dobavitelja se zapiše vsakemu podjetju, a na strani Zaloga šteje samo pri artiklu, ki ga podjetje ima (262). | `/zaloge` pri artiklu kaže vir `NW_STOCK` ali `BT_STOCK`. |\r\n| 6 | Urednik | `/zajem` | Pregledaš vrstice »Dobaviteljev XML« in »Zaloga dobavitelja« (stanje, zadnji uspeh, čaka, zavrnjeno). | — | Stanje »V redu«; »Čaka« 0. |\r\n| 6b | Urednik | `/izdelki/novi-artikli?pogled=spremembe` (zavihek »Spremembe iz XML«) | Vpišeš šifro artikla ali izbereš podjetje, vir, vrsto (atributi, besedila, slike) in obdobje. | Prebere se zgodovina polj (`pim.ProductFieldHistory`), ki jo je zapisal zajem **dobaviteljevega** XML (paketi `PIM.XmlMapping:NW_XML` / `BT_XML`); spremembe preslikave SAOP in ročni popravki niso zraven. Listanje po 50, štetje v bazi. | Vrstice »šifra · kaj · prej → potem · kdaj · vir«; zgoraj »Zadnji prevzem datoteke« po viru (rumeno, če je starejši od dneva). Klik na šifro odpre kartico artikla. |\r\n| 6c | Urednik | isti zavihek, gumb »Izvozi Excel (N)« | Klikneš izvoz; med gradnjo lahko prekličeš. | Iste vrstice in isti vrstni red kot na zaslonu, a vse strani (`SupplierCandidateReadService.WriteXmlChangesWorkbookAsync`, bere sproti, piše na disk, vrsta izvozov `HeavyWorkGate.Exports`); datoteka gre prek `ExportResultStore` na `/izvoz/prenos/{žeton}`. Nič ne zapiše v bazo. | Prenos `PIM_spremembe_iz_XML_\u003cdatum\u003e.xlsx`: šifra, podjetje, vir, vrsta, kaj, sprememba, prej, potem, kdaj; pod tabelo opomba z uporabljenimi filtri. Cela zgodovina (≈385.000 vrstic) v ~4 s. |\r\n| 7 | Urednik | `/izdelki/novi-artikli` → »Vrzeli in ponovna preslikava …« | Če XML prinaša kategorije ali atribute brez preslikave, jih zapreš in klikneš »Ponovno preslikaj vir«. | Glej [Preslikava virov in ponovna obdelava](preslikava-virov-in-ponovna-obdelava.md). | Artikli dobijo manjkajoče vrednosti. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- XML **nikoli ne ustvari artikla** v PIM (257); ustvari samo kandidata. Artikel nastane šele po poti v SAOP in povratnem zajemu.\r\n- XML ne povozi polj, katerih lastnik je SAOP ali PIM.\r\n- Zaloga dobavitelja se ne pokaže pri artiklu, ki ga podjetje nima (262).\r\n- Svežina: `NW_XML` sme biti star 7 dni, `BT_XML` 36 h; zaloga `NW_STOCK` 4 h, `BT_STOCK` 6 h (merjeno po **novih** podatkih — Braytron je 2026-09-22 pet dni vračal isto datoteko). Prekoračitev odpre alarm »SourceStale«.\r\n- Naslov z dostopnim žetonom stoji samo v `appsettings.Local.json` na strežniku, ne v bazi.\r\n- Vsaka sprememba, ki jo zajem XML naredi pri obstoječem artiklu, gre v zgodovino polj (sprožilci 034, `ChangeSource = XML_FEED`, `ChangedBy = PIM.XmlMapping:\u003cvir\u003e`); pregled po šifri je zavihek »Spremembe iz XML« (#7). Povratka teh sprememb ni in ga ne bo (odločitev lastnika pri #27, 2026-09-29: samo pregled, filtri in izvoz v Excel, brez zaklepanja polj) — naslednji zajem bi vrnjeno vrednost spet prepisal.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš)
