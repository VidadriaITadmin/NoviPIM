** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nIzdelku ročno določiti kategorije na posameznem spletišču (Svetila, Videlektro …), kadar samodejna preslikava dobaviteljeve kategorije ne da pravega rezultata. Rezultat je ročna uvrstitev, ki je ponovna preslikava vira ne povozi.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ne sodeluje (stran ji ni dostopna). |\r\n| Urednik kataloga | Poišče izdelek, izbere kategorije po spletiščih, shrani ali vrne uvrstitev pod vir. |\r\n| Skrbnik | Kot urednik. |\r\n| Avtomatika (PIM) | Preveri, da pot obstaja v drevesu spletišča, zapiše zgodovino, ponovno validira izdelek in ga po potrebi umakne s spletišča. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik, ko izdelek nima kategorije na spletišču (napaka »brez kategorije«, kljukica spletišča se ne da shraniti) ali je uvrščen napačno.\r\n- **Po urniku:** ni (samodejna uvrstitev iz vira je del zajema, glej povezane procese).\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifra artikla, izbrane poti kategorij po spletišču, opomba | Uporabnik |\r\n| **Vhod** | Drevo kategorij spletišča in trenutna uvrstitev | PIM |\r\n| **Izhod** | Ročna uvrstitev izdelka po spletišču (lahko tudi namenoma prazna) | PIM → validacija → katalog.csv ob naslednjem izvozu |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Stran Uvrstitev izdelka]) --\u003e B[Vpiše šifro in klikne Poišči]\r\n    B --\u003e C[Uredi pri spletišču]\r\n    C --\u003e D[Doda kategorije in klikne Shrani uvrstitev]\r\n    C --\u003e E[Klikne Vrni pod vir]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F{Pot obstaja v drevesu?}\r\n    G[[Ročna uvrstitev in zgodovina]]\r\n    H[[Ponovna validacija in morebiten umik s spleta]]\r\n    I[[Ročna uvrstitev odstranjena]]\r\n    K([Uvrstitev osvežena])\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    L[(katalog.csv ob naslednjem izvozu)]\r\n  end\r\n  D --\u003e F\r\n  F -- ne --\u003e K\r\n  F -- da --\u003e G --\u003e H --\u003e K\r\n  E --\u003e I --\u003e K\r\n  H --\u003e L\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class B,C,D,E user; class F,G,H,I auto; class L data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/izdelki/kategorije` (ali neposredno `/izdelki/{šifra}/kategorije`) | V glavi strani preveriš izbrano podjetje, vpišeš **Šifra artikla** in klikneš **Poišči**. | Prebere uvrstitev izdelka po vseh aktivnih spletiščih. | Tabela »2. Kje je izdelek zdaj«: ena vrstica na spletišče, stolpec Izvor »ročno« ali »iz vira«; »brez uvrstitve« je rdeče. |\r\n| 2 | Urednik | isto | Pri spletišču klikneš **Uredi**. | Naloži se drevo kategorij tega spletišča. | Pojavi se izbirnik »Dodaj kategorijo« in trenutni seznam. |\r\n| 3 | Urednik | isto | V izbirnik vpišeš del imena ali poti, izbereš kategorijo in klikneš **Dodaj na seznam**; odvečne odstraniš z **odstrani**. Po želji vpišeš **Opombo**. | Samo osnutek na strani. | Seznam izbranih poti. |\r\n| 4 | Urednik | isto | Klikneš **Shrani uvrstitev**. | Stare kategorije izdelka na tem spletišču se zamenjajo z izbranimi, stara vrednost gre v zgodovino, izdelek se ponovno validira; če zaradi tega ne sme več na spletišče, ga PIM (ob vklopljenem umiku) odkljuka. | »Uvrstitev je shranjena. …«; Izvor se spremeni v »ročno« z imenom in časom. |\r\n| 5 | Urednik | isto | Če želiš, da spet velja dobaviteljeva kategorija, klikneš **Vrni pod vir**. | Ročna uvrstitev se odstrani; vrednost iz vira vrne naslednja preslikava. | »Ročna uvrstitev je odstranjena …«; Izvor ni več »ročno«. |\r\n| 6 | Urednik | `/izdelki/{ProductId}` (kartica, zavihek Splet → Kategorije po spletnih straneh) | Iste korake 2–5 narediš kar na kartici (gumb **Spremeni** pri spletišču), nato po potrebi označiš spletišče. | Isti gradnik `ProductCategoryEditor` kot na tej strani; podjetje pride iz izdelka, ne iz glave strani. Kartica se po shranjevanju naloži znova (nov nabor atributov). | Pri spletišču »ročno«; razdelek »Objava za splet«: stolpec Kategorija = da. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Samo obstoječe poti:** baza zavrne pot, ki je v drevesu tega spletišča ni; prosto besedilo ni mogoče.\r\n- **Ročna je močnejša od vira:** ponovna preslikava dobaviteljevega XML ročne uvrstitve ne povozi. Enako velja za kategorije, zapisane z uvozom delovnega lista.\r\n- **Prazen seznam** shranjen namenoma pomeni »namenoma brez kategorije«, kar ni isto kot »še ni preslikano«.\r\n- Uvrstitev velja samo za izbrano podjetje in samo za eno spletišče naenkrat.\r\n- Izdelek brez kategorije na spletišču tja ne gre, tudi če ima kljukico.\r\n- **Pravice:** stran samo ADMIN in CATALOG_EDITOR.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Napaka pri shranjevanju (pot ne obstaja) | Pot ni v drevesu spletišča ali je v drugem jeziku. | Izberi pot iz izbirnika, ne vpisuj ročno. |\r\n| Izdelka ni mogoče najti ali so vse vrstice »brez uvrstitve« | V glavi strani je izbrano drugo podjetje, kot mu izdelek pripada. | Zamenjaj podjetje v glavi in klikni Poišči znova. |\r\n| »Ni aktivnih spletnih strani.« | V registru spletišč ni aktivnega spletišča. | Skrbnik preveri `/nastavitve/kanali`. |\r\n| Po shranjevanju sporočilo o umiku s spleta | Izdelek zaradi nove uvrstitve ni več veljaven za spletišče. | Dopolni uvrstitev in spletišče na kartici ponovno označi. |\r\n| Po »Vrni pod vir« izdelek ostane brez kategorije | Preslikava se še ni ponovno izvedla ali za dobaviteljevo pot ni preslikave. | Preveri `/kakovost/kategorije` (nepreslikane poti). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/ProductCategories.razor` (`/izdelki/kategorije`, `/izdelki/{ItemId}/kategorije`), podjetje iz piškotka izbire podjetja (`PimOrganizationScope`, `IntranetDataService.GetCurrentOrganizationAsync`).\r\n- **Storitve / delavci:** `CategoryMappingService` (`GetProductCategoriesAsync`, `GetTreeNodesAsync`, `SetProductCategoriesAsync`, `ClearProductCategoryOverrideAsync`), `WebWithdrawalService.AfterChangeByItemsAsync` (vir `KATEGORIJE`).\r\n- **Tabele in pogledi:** `intranet.GetProductCategories`, `pim.SetProductCategories`, `pim.ClearProductCategoryOverride`, `pim.ProductCategoryOverride`, `canon.ProductCategory`, `canon.CategoryPathTranslated`, `pim.ProductFieldHistory` (`ProductCategory.CategoryPath`), `map.ResolveProductCategories` (spoštuje ročno uvrstitev).\r\n- **Migracije:** 059 (drevo kategorij in preslikava dobaviteljev), 109 (ročna uvrstitev), 251 (umik s spleta).\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Stran vzame podjetje iz izbire v glavi strani, ne iz izdelka. Na kartici izdelka (2026-09-28) tega problema ni — tam podjetje pride iz izdelka.\r\n- ✅ 2026-09-28: `SetProductCategoriesAsync` in `ClearProductCategoryOverrideAsync` preverita vlogo v storitvi (`CatalogWrite`). Uvoz delovnega lista z vlogo COMMERCIAL kategorij ne zapiše (vrstica dobi razlog) — enako kot že velja za besedila in atribute v istem uvozu.\r\n- ⚠️ »Vrni pod vir« ne sproži preslikave; kdaj se vrednost iz vira dejansko vrne (naslednji zajem dobavitelja, ponovna obdelava vira), stran ne pove in iz kode strani ni razvidno.\r\n- ⚠️ »Vrni pod vir« pusti trenutno vrstico kategorije (zdaj označeno »iz vira«), dokler je ne nadomesti naslednja preslikava; če vir kategorije nima, ostane zadnja ročna vrednost. Preverjeno 2026-09-28 na razvojni bazi.\r\n- ✅ 2026-09-28: gumbi uporabljajo `primary-button` / `ghost-button` (prej nedefiniran `button-primary`).\r\n\r\n## Povezani procesi\r\n\r\n- [Iskanje in kartica izdelka](iskanje-in-kartica-izdelka.md): urejanje kategorij na kartici (isti gradnik) in kljukice spletišč.\r\n- [Uvoz delovnega lista](uvoz-delovnega-lista.md): množični vpis kategorij prek stolpcev »Kategorije — {spletišče}«.\r\n- [Manjkajoče kategorije](../04-kakovost/manjkajoce-kategorije.md): preslikava dobaviteljevih poti, ki določi uvrstitev »iz vira«.\r\n- [Drevo kategorij](../08-upravljanje/drevo-kategorij.md): kategorije, ki jih je mogoče izbrati.\r\n- [Dobaviteljski katalogi XML](../02-vhodi/dobaviteljski-katalogi-xml.md): vir uvrstitve »iz vira«.\r\n- [Umaknjeni artikli in obvestila](../06-izhod-splet/umaknjeni-s-spleta.md): umik zaradi manjkajoče kategorije.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): kategorije v katalog.csv.\r\n"},{"pot":"03-izdelki/mediji.md","vsebina":"---\r\nid: mediji\r\nnaslov: Pregled in urejanje medijev izdelkov\r\npodrocje: 03-izdelki\r\nstanje: delno\r\nbere: [pim.mediji, pim.izdelek, pim.besedila]\r\npise: [pim.mediji]\r\nstrani: [/mediji, /izdelki/{ProductId}, /izdelki/uvoz]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Media.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCard/ProductMediaGallery.razor, PIM_Solution/src/PIM.Intranet/Services/CatalogReadService.cs, PIM_Solution/src/PIM.Intranet/Services/MediaKindPolicy.cs, PIM_Solution/src/PIM.Intranet/Services/MediaUrlPolicy.cs, PIM_Solution/src/PIM.Intranet/Services/ProductWorkbookService.cs]\r\nmigracije: [245]\r\n---\r\n\r\n# Pregled in urejanje medijev izdelkov\r\n\r\n\u003e **Področje:** Izdelki · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nNa enem mestu videti vse slike, videe in dokumente izdelkov vseh podjetij, najti izdelke brez slike in preveriti, ali naslovi medijev delujejo. Stran je samo za branje; slike in dokumente se spreminja z uvozom delovnega lista (ali pa pridejo iz zajema).\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Išče slike in dokumente (npr. tehnični list) za kupca. |\r\n| Urednik kataloga | Išče izdelke brez slike, preverja nove medije, popravlja sezname slik prek Excela. |\r\n| Skrbnik | Ni posebne vloge. |\r\n| Avtomatika (PIM) | Zajem iz SAOP in dobaviteljskih XML prinese naslove medijev; uvoz delovnega lista jih dopolni ali odstrani. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** kadar urednik ali komercialist potrebuje slike/dokumente ali preverja popolnost (npr. »aktivnih brez slike«).\r\n- **Po urniku:** mediji pridejo z zajemom (npr. `SUPPLIER_CATALOG_IMPORT` vsakih 6 ur, zajem SAOP) — stran jih samo prikaže.\r\n- **Ob dogodku:** po uvozu delovnega lista s stolpcema »Slike« ali »Dokumenti«.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Naslovi slik, videov in dokumentov | Dobavitelj (XML) / SAOP / Excel |\r\n| **Izhod** | Pregled medijev, predogled, povezava na izdelek | Zaslon (brez zapisa) |\r\n| **Izhod** | Dopolnjen ali skrajšan seznam slik in dokumentov (prek Excela) | PIM → katalog.csv ob naslednjem izvozu |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Stran Mediji]) --\u003e B[Iskanje in filtri]\r\n    B --\u003e C[Predogled in Odpri izdelek]\r\n    D[Popravi stolpca Slike in Dokumenti v Excelu]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    E[(Mediji izdelkov)]\r\n    F[[Uvoz delovnega lista]]\r\n    G{Izdelek brez slike?}\r\n    Z([Pregled končan])\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    H[(katalog.csv)]\r\n  end\r\n  E --\u003e B\r\n  C --\u003e G\r\n  G -- ne --\u003e Z\r\n  G -- da --\u003e D --\u003e F --\u003e E\r\n  E --\u003e H\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,Z endp; class B,C,D user; class F,G auto; class E,H data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik / komerciala | `/mediji` | Vpišeš iskalni niz (šifra, naziv, EAN, naslov, vloga, dobavitelj; več besed zoži iskanje, npr. »203 pdf«). | Rezultati se osvežijo med tipkanjem; privzeto vsa aktivna podjetja, najnovejši najprej. | Števec rezultatov ob izbiri vrste medija. |\r\n| 2 | Urednik / komerciala | `/mediji` | Zožiš: podjetje, razvrstitev, vloga medija, strežnik, čas vnosa (24 ur … 90 dni), stanje izdelka; vrsta (Vse, Slike, Videi, Dokumenti, Drugo). **Počisti** vrne vse. | — | Izbrani čip vrste je obarvan. |\r\n| 3 | Urednik | `/mediji` | Klikneš **novih v 7 dneh** ali **aktivnih brez slike**. | Prvo pokaže medije zadnjih 7 dni; drugo odpre seznam `/izdelki` s filtrom »Brez slike« in »Samo aktivni«. | Seznam izdelkov s čipoma filtrov. |\r\n| 4 | Urednik / komerciala | `/mediji` | Preklapljaš **Mreža** / **Seznam**; klikneš predogled. | Odpre se povečava: slika, predogled videa ali prva stran PDF; če tuji strežnik vgradnje ne dovoli, povezava **Odpri izvirnik**. | Okno predogleda z vlogo, vrstnim redom in časom vnosa. |\r\n| 5 | Urednik | `/mediji` ali okno predogleda | Klikneš šifro ali **Odpri izdelek**. | Odpre se kartica izdelka; zavihek **Mediji** pokaže vse slike in dokumente tega izdelka. | Galerija na kartici. |\r\n| 6 | Urednik | `/izdelki` → **Izvozi Excel** | Izvoziš izdelke s stolpcema »Slike« in »Dokumenti«, dopolniš ali popraviš naslove (ločeni z `\\|`, prva slika je glavna). | — | — |\r\n| 7 | Urednik | `/izdelki/uvoz` | Uvoziš datoteko. | Naslov, ki ga v celici ni več, izdelek izgubi; novi se dodajo. | Izid uvoza: »slik in dokumentov dodanih: N, odstranjenih: M«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Stran Mediji nič ne zapisuje; trajni popravek napačnega naslova je naloga preslikave vira ali uvoza delovnega lista.\r\n- Vrsta medija (slika, video, dokument, drugo) se določi po naslovu datoteke, enako na strani Mediji in v izvozu.\r\n- Naslov brez `https` dobi opombo (»Dodan https:«, »Nešifrirana povezava«, »Naslov ni varna spletna povezava«); nevarni naslovi se ne odprejo.\r\n- V Excelu prazna celica »Slike« pomeni »ne dotikaj se«, zato vseh slik z uvozom ni mogoče odstraniti.\r\n- Če uvoz pobriše edino sliko, izdelek lahko izgubi pravico do spletišča in ga PIM odkljuka (samodejni umik).\r\n- **Pravice:** stran vidi vsak prijavljen uporabnik z dovoljenjem za Medije; spreminjanje prek uvoza zahteva ADMIN ali CATALOG_EDITOR.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Predogled prazen, oznaka »!« | Naslov ne deluje ali ni varen. | Odpri izvirnik; če ne deluje, popravi naslov v Excelu ali prijavi napako vira. |\r\n| PDF se ne prikaže znotraj strani | Strežnik dobavitelja ne dovoli vgradnje. | Klikni **Odpri izvirnik v novem zavihku**. |\r\n| Slik nekega podjetja ni | Izbrano je drugo podjetje. | Izberi »Vsa podjetja«. |\r\n| Po uvozu izdelek nima več slik | V celici »Slike« je ostal samo del seznama. | Uvoz povrni v zgodovini uvozov ali vpiši cel seznam znova. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Media.razor` (`/mediji`, parametri `?izdelek=`, `?podjetje=`, `?vrsta=`, `?naslov=`), `Pages/ProductCard/ProductMediaGallery.razor` (zavihek Mediji na kartici).\r\n- **Storitve / delavci:** `CatalogReadService` (`GetMediaAsync`, `GetMediaKindCountsAsync`, `GetMediaRolesAsync`, `GetMediaHostsAsync`, `GetMediaSummaryAsync`), `MediaKindPolicy`, `MediaUrlPolicy`, zapis prek `ProductWorkbookService` → `ProductEditService.SaveMediaBulkAsync`.\r\n- **Tabele in pogledi:** `canon.ProductMedia`, `canon.ProductDocument` (vse, kar pride iz uvozov); `pim.ProductMedia` je podmnožica za izvoz; `pim.SaveProductMediaBulk`.\r\n- **Migracije:** 245 (slike in dokumenti v uvozu delovnega lista).\r\n- **Urniki:** zajem iz virov (glej 02-vhodi).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Medija ni mogoče naložiti (datoteka) ne urediti posamezno; edina uporabniška pot je naslov v Excelu. Pošiljanje datotek na strežnik (npr. arhiv slik na FTP) v kodi te strani ni.\r\n- ⚠️ Kako se medij iz `canon.ProductMedia` prenese v `pim.ProductMedia` (in s tem v katalog.csv), s strani ni razvidno; stran kaže vse medije, tudi tiste, ki na splet ne gredo.\r\n- ⚠️ Filter stanja naslova (`?naslov=INVALID`) je ostal samo v naslovu strani, na zaslonu ga ni.\r\n\r\n## Povezani procesi\r\n\r\n- [Uvoz delovnega lista](uvoz-delovnega-lista.md): edina pot za spreminjanje slik in dokumentov.\r\n- [Iskanje in kartica izdelka](iskanje-in-kartica-izdelka.md): zavihek Mediji in filter »Brez slike«.\r\n- [Dobaviteljski katalogi XML](../02-vhodi/dobaviteljski-katalogi-xml.md): od kod pride večina slik.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): mediji iz ERP.\r\n- [Umaknjeni artikli in obvestila](../06-izhod-splet/umaknjeni-s-spleta.md): umik izdelka brez slike.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): slike v katalog.csv.\r\n"},{"pot":"03-izdelki/odprodaja.md","vsebina":"---\r\nid: odprodaja\r\nnaslov: Odprodaja in razstavni eksponati\r\npodrocje: 03-izdelki\r\nstanje: deluje\r\nbere: [excel.odprodaja, pim.izdelek, pim.odprodaja, pim.cene, pim.narocila, pim.zaloge]\r\npise: [pim.odprodaja]\r\nstrani: [/izdelki/odprodaja, /izdelki/uvoz-odprodaje, /izdelki/{ProductId}]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/ClearanceImport.razor, PIM_Solution/src/PIM.Intranet/Services/ClearanceService.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCard.razor, PIM_Solution/src/PIM.Intranet/Services/ProductEditService.cs]\r\nmigracije: [153, 154, 232, 233, 234, 275, 276, 288, 289, 296, 297]\r\n---\r\n\r\n# Odprodaja in razstavni eksponati\r\n\r\n\u003e **Področje:** Izdelki · **Lastnik:** komerciala · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-28, na razvojni bazi s testnimi naročili\r\n\r\n## 1. Namen\r\n\r\nArtikle dati v odprodajo s količino in popustom ter jih označiti kot razstavni eksponat — ročno ali z uvozom dobaviteljevega seznama iz Excela. Rezultat so stolpci »Odprodaja«, »Odprodaja - popust %«, »Odprodaja - količina« in »Razstavni eksponat« v katalog.csv ob naslednjem izvozu; cena se ne spremeni, popust uporabi spletna trgovina. Naročila kupcev iz SAOP količino sproti zmanjšujejo (288). Isti popust in količino dobita tudi stara stolpca »Popust odprodaje %« in »Količina odprodaje« (304, 305), da Magento vidi odprodajo ne glede na to, katerega bere. »Popust na artikel« odprodaje ne nosi (305): ostane oddelčni popust X/O iz Nadzora kataloga, sicer 0 — sicer bi artikel lahko dobil popust dvakrat.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Dodaja artikle, ureja količino in popust, uvaža odprodajne sezname, zaključuje odprodajo. |\r\n| Urednik kataloga | Enako; na kartici izdelka še ročni vnos in oznaka »Razstavni eksponat«. |\r\n| Skrbnik | Kot urednik. |\r\n| Avtomatika (PIM) | Ob ponovnem uvozu istega vira zaključi vrstice, ki jih v datoteki ni več; ob zaključitvi odstrani oznako razstavni eksponat; naročila kupcev (delavec SAOP_ORDERS_VNK, vsaki 2 uri) zmanjšajo količino; izvoz katalog.csv prebere preostanek. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** ko dobavitelj pošlje odprodajni seznam (npr. Azzardo), ko se odloči za odprodajo posameznega artikla ali ko je artikel razstavljen v salonu.\r\n- **Po urniku:** naročila kupcev iz SAOP (SAOP_ORDERS_VNK, vsaki 2 uri) zmanjšajo količino; podatki gredo v katalog.csv ob naslednjem rednem izvozu.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifra, količina, popust %, razstavni eksponat, vir | Uporabnik |\r\n| **Vhod** | Excel s stolpci Šifra, Količina, Popust, Cena (samo pregled), Razstavni eksponat | Dobavitelj / Excel |\r\n| **Izhod** | Vrstice odprodaje po viru in oznaka razstavni eksponat | PIM |\r\n| **Vhod** | Naročila kupcev (VNK) za artikle v odprodaji | SAOP (sales.OrderLine) |\r\n| **Izhod** | Odprodaja DA/NE, popust %, preostala količina, razstavni eksponat DA/NE; popust in količina tudi v starih stolpcih »Popust odprodaje %«, »Količina odprodaje« (304, 305); »Popust na artikel« ne | katalog.csv (ob naslednjem izvozu) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Stran Odprodaja]) --\u003e B[Dodaj v odprodajo ročno]\r\n    A --\u003e C[Vir in datoteka Excel]\r\n    D[Pregleda predogled in klikne Uvozi]\r\n    E[Ureja vrstico ali klikne Zaključi]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[[Predogled - ujemanje šifer in vrstice za zaključitev]]\r\n    G[(Odprodaja po virih in oznaka razstavni)]\r\n    N[[Naročila kupcev iz SAOP odštejejo prodano]]\r\n    H{Ostane nad 0 in spletišče obkljukano?}\r\n    Z([Ni v odprodaji v katalogu])\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    I[(katalog.csv ob naslednjem izvozu)]\r\n  end\r\n  C --\u003e F --\u003e D --\u003e G\r\n  B --\u003e G\r\n  E --\u003e G\r\n  G --\u003e N --\u003e H\r\n  H -- da --\u003e I\r\n  H -- ne --\u003e Z\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,Z endp; class B,C,D,E user; class F,H,N auto; class G,I data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | `/izdelki/odprodaja` (meni **Odprodaja** ali zavihek na Izdelkih) | Pogledaš povzetek: V odprodaji, Gre v katalog.csv, Razstavni eksponati, Ni na spletu. | Privzeto je izbrano podjetje IQLighting (2). | Ploščice s števili. |\r\n| 2 | Komerciala | isto, »Dodaj artikel v odprodajo« | Izbereš **Podjetje**, vpišeš **Šifra artikla**, **Količina**, **Popust %**, **Vir** (privzeto »Ročno«), po potrebi **Razstavni eksponat**, klikneš **Dodaj v odprodajo**. | Vrstica se zapiše; če artikel pod istim virom že obstaja, se posodobi. | Sporočilo »… je v odprodaji: količina …, popust … %«; vrstica v tabeli. |\r\n| 3 | Komerciala | isto, tabela »Artikli v odprodaji« | Popraviš količino, popust ali kljukico Razstavni in klikneš **Shrani**; ali **Zaključi**. Zaključene prikažeš s »Pokaži tudi zaključene« in jih vrneš z **Obnovi**. | Zaključitev: artikel gre v katalog z Odprodaja = NE; oznaka razstavni se odstrani, če artikel nima druge aktivne odprodaje. | Stolpec »V katalog.csv«: DA / NE — količina 0 / NE — velja novejši vir / zaključena. |\r\n| 4 | Komerciala | isto, »Uvoz odprodajnega seznama iz Excela« | Preveriš, da je zgoraj izbrano pravo podjetje, vpišeš **Vir** (npr. »Azzardo 2026-09«) in izbereš datoteko. | PIM poišče šifre v podjetju in izračuna odprodajno ceno za pregled. | Predogled: ujemajoče/neujemajoče šifre, razstavni, prvih 20 vrstic. |\r\n| 5 | Komerciala | isto | Prebereš opozorila: podvojene šifre, popust izven 0–100, **»Uvoz bo zaključil N aktivnih odprodaj vira …«**. Klikneš **Uvozi N ujemajočih vrstic**. | Vrstice vira se posodobijo, vrstice istega vira, ki jih v datoteki ni, se zaključijo. Neujemajoče šifre se preskočijo. | »Uvoz končan: N vrstic zapisanih«; prejetih/zapisanih/preskočenih. |\r\n| 6 | Urednik | Kartica `/izdelki/{ProductId}`, zavihek **Splet → Odprodaja** | Pogledaš Vpisano / Prodano / Ostane; vpišeš Količina na zalogi in Popust % in klikneš **Daj v odprodajo** / **Posodobi odprodajo**; ali **Zaključi** pri vrstici. | Ročni vnos gre pod vir »Ročno«; obrazec pokaže obstoječo ročno vrstico; nova količina začne štetje prodaje znova. | »Artikel je v odprodaji.« |\r\n| 7 | Urednik | Kartica, **Splet → Oznake** | Označiš »Razstavni eksponat« in klikneš **Shrani oznake**. | Oznaka brez odprodaje; na strani Odprodaja je vrstica »samo oznaka«. | Na `/izdelki/odprodaja` vrstica z **Odstrani oznako**. |\r\n| 8 | Komerciala | Kartica, **Splet → Spletišča** | Preveriš, da ima artikel obkljukano spletišče (Svetila, Videlektro). | Brez kljukice ga katalog ne izvozi. | Stolpec »Spletne strani« na strani Odprodaja ni »ni na spletu«. |\r\n| 9 | Avtomatika | — | — | Naročila kupcev iz SAOP (vsa: splet, trgovina, B2B) zmanjšajo količino od trenutka vpisa; stornirana ne štejejo. | Stolpca »Prodano« (s številkami naročil) in »Ostane«; pri 0 »NE — razprodano«. |\r\n| 10 | Avtomatika | — | — | Ob naslednjem izvozu katalog.csv prebere preostanek. | Glej [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md). |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Artikel je v odprodaji, dokler ima aktivna vrstica **preostanek večji od 0**; če ima več virov, v katalog gre najnovejša aktivna vrstica.\r\n- **Preostanek = vpisano − naročeno pri kupcih.** Štejejo vsa naročila kupcev iz SAOP istega podjetja z datumom na dan vpisa ali pozneje, ki jih je PIM videl po vpisu; stornirano/preklicano ne šteje, zaprta vrstica šteje samo odpremljeno. Pri 0 gre v katalog Odprodaja = NE in količina 0, vrstica ostane (»razprodano«).\r\n- **Zaloga v glavnem skladišču (297):** ob vpisu količine PIM primerja zalogo. *Vsa zaloga za odprodajo* (zaloga = vpisano): velja zaloga, ki jo SAOP ob prodaji sam zmanjša, naročila samo za vsak slučaj. *Del redne zaloge* (zaloga \u003e vpisano): velja vpisano minus naročila. *Zaloge premalo* (zaloga \u003c vpisano): napaka v seznamu — opozorilo v predogledu, na strani (števec, filter) in na kartici; na splet gre največ toliko, kolikor je na zalogi. *Zaloga ni znana*: velja vpisano minus naročila.\r\n- Na splet gre vedno manjše od (vpisano − naročeno) in sveže zaloge (posnetek \u003c 30 min); stara zaloga ne zniža ničesar, razen pri »zaloge premalo«.\r\n- **Popravek količine v stolpcu Ostane** je nova zaloga: štetje prodaje začne znova. Ponovni uvoz iste datoteke z isto količino štetja ne ponastavi (prodano ostane odšteto).\r\n- **Vir je ključ:** ponovni uvoz pod istim virom je celotno stanje tega seznama — kar v datoteki manjka, se **samodejno zaključi** (samo v izbranem podjetju). Za ločen seznam uporabi drugo ime vira.\r\n- Popust mora biti med 0 in 100; sicer uvoz ni mogoč (gumb se ne ponudi). Količina 0 ali več.\r\n- Ista šifra večkrat v datoteki: upošteva se prva vrstica.\r\n- **Razstavni eksponat v uvozu:** če stolpec obstaja, prazna celica pomeni NE in oznako odstrani (1/da/x = DA); če stolpca ni, oznake ostanejo nespremenjene. To je drugače kot pri delovnem listu izdelkov, kjer prazna celica pomeni »ne dotikaj se«.\r\n- Odprodaja v SAOP ne gre; cena v PIM se ne spremeni.\r\n- **Pravice:** stran ADMIN, CATALOG_EDITOR, COMMERCIAL; odprodaja in oznake na kartici ter gumb **Odstrani oznako** samo ADMIN in CATALOG_EDITOR.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Vnesi vir … pred izbiro datoteke.« | Polje Vir je prazno. | Vpiši vir in izberi datoteko znova. |\r\n| »Datoteka nima stolpca \u0027Šifra\u0027.« | Drugačen naslov stolpca. | Preimenuj stolpec v »Šifra«. |\r\n| Veliko neujemajočih šifer | Izbrano je napačno podjetje ali šifre dobavitelja niso naše. | Zamenjaj podjetje zgoraj; šifre preslikaj v naše. |\r\n| »Uvoz bo zaključil N aktivnih odprodaj …« a tega nočeš | Isti vir je bil uporabljen za drug seznam. | Uporabi novo ime vira. |\r\n| »V katalog.csv: NE — velja novejši vir« | Artikel je v odprodaji pod več viri. | Zaključi starejšo vrstico ali popravi novejšo. |\r\n| »ni na spletu« / »NE — ni na spletu« | Artikel nima obkljukanega spletišča. | Na kartici obkljukaj spletišče (in kategorijo). |\r\n| »Zaloga: zaloge premalo« | V seznamu je več kosov, kot jih je na zalogi v glavnem skladišču. | Preveri seznam ali zalogo v SAOP; popravi količino v stolpcu Ostane. |\r\n| »NE — razprodano« | Naročila so porabila vso količino. | Nič; če je kos še na zalogi (preklic), vpiši pravo količino v Ostane. |\r\n| »Artikla ni bilo mogoče dodati« / uvoz ne uspe ob hkratnem zajemu iz SAOP | Zastoj v bazi, ki ga trije samodejni poskusi niso rešili. | Poskusi znova čez minuto. |\r\n| Prodaja se ne odšteva | Delavec naročil iz SAOP ne teče ali ne vidi SAOP. | Preveri SAOP_ORDERS_VNK na /sistem (zadnji tek). |\r\n| »Tvoja vloga ne dovoljuje urejanja oznak.« pri Odstrani oznako | Komercialist nima pravice urejanja kataloga. | Oznako odstrani urednik kataloga. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/ClearanceImport.razor` (`/izdelki/odprodaja` in stara pot `/izdelki/uvoz-odprodaje`), razdelka Odprodaja in Oznake v `ProductCard.razor`.\r\n- **Storitve / delavci:** `ClearanceService` (`PreviewAsync`, `ApplyAsync`, `GetOverviewAsync`, `GetForProductAsync`, `SaveItemAsync`, `EndAsync`), `ProductEditService.SaveProductFlagsAsync` (CatalogWrite), `HeavyWorkGate.Imports`.\r\n- **Tabele in pogledi:** `pim.ClearanceItem`, `pim.ProductFlag` (`RAZSTAVNI_EKSPONAT`), `pim.SaveClearanceItems`, `pim.SaveClearanceItem`, `pim.EndClearanceItem`, `pim.SetShowcaseFlags`, `pim.ClearanceItemRemaining` (preostanek po naročilih), `sales.OrderLine`/`sales.OrderHeader` (naročila), `intranet.GetClearanceOverview`, `intranet.GetClearanceItemsForProduct`, `intranet.GetClearanceItemsToEnd`, `out.GetExportRows` (stolpci v katalog.csv).\r\n- **Migracije:** 153, 154 (tabela), 232 (uvoz), 233 (oznake), 234 (stolpci v katalogu), 275 (pregled, ročni vnos, razstavni), 276 (uvoz po podjetju, brez dvojnikov, meja popusta), 288/289 (naročila kupcev zmanjšajo količino), 296 (preostanek na kartici), 297 (primerjava z zalogo glavnega skladišča).\r\n- **Urniki:** SAOP_ORDERS_VNK (`PIM.SaopOrdersWorker`, 2 uri) prinese naročila; izvoz katalog.csv glej 06-izhod-splet.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Uvoz odprodaje se **ne** zapiše v zgodovino uvozov (`/uvozi`) in ga ni mogoče povrniti; napačen uvoz pod obstoječim virom tiho zaključi aktivne vrstice (predogled sicer opozori).\r\n- ⚠️ `ClearanceService` nima preverbe vloge; zaščita je samo na strani. Komercialist lahko na strani Odprodaja oznako razstavni **postavi** (prek zapisa odprodaje), **odstraniti** pa je z gumbom Odstrani oznako ne more (CatalogWrite).\r\n- ⚠️ Na kartici izdelka sta odprodaja in oznake urejivi samo za ADMIN/CATALOG_EDITOR, na strani Odprodaja pa tudi za COMMERCIAL — neenotno.\r\n- ⚠️ Stran dovoli odprodajo za vsa podjetja (privzeto 2), katalog.csv pa se izdeluje samo za IQLighting (organizacija 2); stolpec »V katalog.csv = DA« pri drugih podjetjih verjetno ne pomeni, da gre artikel res v datoteko (od 285 gre v katalog tudi ViD za videlektro).\r\n- ⚠️ Na razvojni bazi (2026-09-28) delavec naročil še ni zapisal nobenega naročila (`sales.OrderLine` prazna); odštevanje je preverjeno samo s testnimi naročili.\r\n- ⚠️ **Artikel v IQ in ViD:** katalog.csv vzame vrstico (tudi stolpce odprodaje) iz IQ, če ga IQ objavlja; odprodaja, vpisana v ViD, se takrat ne upošteva, stran Odprodaja pri ViD pa kaže »V katalog.csv: DA«. Zaloga in naročila se štejejo samo v podjetju vrstice. Uporabnik 2026-09-28: rešimo pozneje.\r\n- ⚠️ Zaloga premalo še ne sproži obvestila v zvoncu (samo stran, kartica, predogled).\r\n- ⚠️ Stolpec »Cena« iz datoteke se shrani le kot redna cena za pregled in izračun odprodajne cene; na izvoz ne vpliva.\r\n\r\n## Povezani procesi\r\n\r\n- [Iskanje in kartica izdelka](iskanje-in-kartica-izdelka.md): razdelka Odprodaja, Oznake in Spletišča na kartici.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): stolpci Odprodaja in Razstavni eksponat v katalog.csv.\r\n- [Varovalke](../01-nadzor/varovalke.md): zadržki pri objavi katalog.csv.\r\n- [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md): uvoz odprodaje tja (še) ne pride.\r\n- [Cene in ceniki](../07-poslovanje/cene-in-ceniki.md): redna cena, na katero trgovina uporabi popust.\r\n"},{"pot":"03-izdelki/uvoz-delovnega-lista.md","vsebina":"---\r\nid: uvoz-delovnega-lista\r\nnaslov: Izvoz in uvoz delovnega lista izdelkov\r\npodrocje: 03-izdelki\r\nstanje: delno\r\nbere: [excel.izdelki, pim.izdelek, pim.besedila, pim.atributi, pim.kategorije, pim.kategorije-izdelka, pim.mediji, pim.popusti, pim.validacija, pim.nastavitve]\r\npise: [excel.izdelki, pim.izdelek, pim.besedila, pim.atributi, pim.kategorije-izdelka, pim.mediji, pim.popusti, pim.nastavitve, pim.saop-vrsta, pim.zgodovina-uvozov, pim.validacija]\r\nstrani: [/izdelki, /izdelki/uvoz]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/ProductImport.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/Products.razor, PIM_Solution/src/PIM.Intranet/Services/ProductWorkbookService.cs, PIM_Solution/src/PIM.Intranet/Services/ExportJobService.cs, PIM_Solution/src/PIM.Operations/ProductWorkbookContract.cs, PIM_Solution/src/PIM.Operations/Workbook*.cs, PIM_Solution/src/PIM.Intranet/Services/ProductEditService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/ImportHistoryService.cs, PIM_Solution/src/PIM.Intranet/Services/CategoryMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/WebWithdrawalService.cs]\r\nmigracije: [218, 245, 251, 273, 274, 276, 280, 301, 302]\r\n---\r\n\r\n# Izvoz in uvoz delovnega lista izdelkov (Excel)\r\n\r\n\u003e **Področje:** Izdelki · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nMnožično urejanje izdelkov v Excelu: izbrane izdelke izvoziš v delovni zvezek, ga popraviš in vrneš v PIM. Rezultat: spletni podatki, atributi, kategorije, slike, dokumenti, S-popusti in ERP polja so v PIM zapisani takoj; ERP polja gredo poleg tega v odhodno vrsto za SAOP, kjer čakajo odobritev.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Lahko izvozi in naloži datoteko; zapis večine polj ji baza zavrne (glej razdelek 10). |\r\n| Urednik kataloga | Izvozi pogled, uredi datoteko, jo uvozi in pregleda izid. |\r\n| Skrbnik | Kot urednik; odobri skupine za SAOP na Izhodu v SAOP. |\r\n| Avtomatika (PIM) | Zgradi datoteko v ozadju, primerja datoteko s stanjem, zapiše spremembe, ponovno validira, zapiše zgodovino uvoza in po potrebi umakne izdelke s spleta. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik, kadar mora popraviti več izdelkov naenkrat (npr. dopolniti spletne opise, atribute, kategorije, slike).\r\n- **Po urniku:** ni.\r\n- **Ob dogodku:** povratek uvoza iz zgodovine uvozov (`/izdelki/uvoz?povrni=N`).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Delovni zvezek `.xlsx` (izvožen s strani Izdelki, do 16 MB) | Excel / uporabnik |\r\n| **Izhod** | Spletne strani (kljukice), kategorije po spletiščih, spletni nazivi in opisi po jezikih, atributi, slike, dokumenti, S-popusti | PIM, takoj |\r\n| **Izhod** | ERP polja iz registra SAOP (npr. EAN, dobavitelj, aktivnost, pakiranje, izloči iz rezervacije) | PIM takoj + odhodna vrsta za SAOP (čaka odobritev) |\r\n| **Izhod** | Zapis uvoza »prej → potem« | Zgodovina uvozov `/uvozi` |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Filtri na seznamu Izdelki]) --\u003e B[Izvozi Excel]\r\n    B eseno«. |\r\n| 4 | Urednik | Excel | Popraviš celice. Ne spreminjaj naslovov stolpcev. Prazna celica = »ne dotikaj se«. Več vrednosti v celici loči z `\\|`. Logična polja: D/N (sprejme tudi da/ne, 1/0). | — | Rumene glave označujejo obvezna polja, rdeče celice manjkajoče vrednosti. |\r\n| 5 | Urednik | `/izdelki/uvoz` | Če datoteka nima stolpca »Podjetje«, izbereš podjetje v »Podjetje za vrstice brez stolpca Podjetje«. Nato izbereš datoteko. | PIM prebere zvezek in ga primerja s trenutnim stanjem (skozi vrata za uvoze — hkrati tečeta največ dva). | Razdelek **2. Kaj bo uvoz naredil**: število vrstic, sprememb za PIM in ERP polj, predogled prvih 20 vrstic. |\r\n| 6 | Urednik | `/izdelki/uvoz` | Prebereš opozorila: stolpci samo za branje, neprepoznani stolpci, **Novi atributi**, podvojeni artikli, »ni D ali N«, »ni število«, vodilne ničle. | Nič se še ne zapiše. | Rumena opozorila nad predogledom. |\r\n| 7 | Urednik | `/izdelki/uvoz` | Vpišeš **Opombo k spremembi** in klikneš **Uvozi N sprememb**. | Po korakih: novi atributi v šifrant, spletišča, kategorije, besedila, atributi, slike in dokumenti, ERP polja v vrsto za SAOP (vir »EXCEL«) in v PIM, S-popusti. Nato zapis v zgodovino uvozov in preverba, ali je kak izdelek izgubil pravico do spleta. | Razdelek **3. Izid**: spremenjenih izdelkov, zapisano v PIM, ERP polj, slik dodanih/odstranjenih, uvrščeno v vrsto / že v vrsti / zavrnjeno, povezava »uvoz #N«. |\r\n| 8 | Urednik | `/izdelki/uvoz` | Prebereš opozorila izida in seznam »Umaknjeni s spleta«. | Opozorilo velja samo za navedeno polje; ostalo je zapisano. | Seznam opozoril in povezava na `/splet/umaknjeni`. |\r\n| 9 | Urednik / skrbnik | `/saop/artikli` (Izhod v SAOP) | Odobriš skupino ERP sprememb. | Šele zdaj gre zadnja vrednost v SAOP. | Glej [Množični izhod](../05-izhod-saop/mnozicni-izhod.md). |\r\n| 10 | Urednik | `/nastavitve/nabori-atributov` | Nove atribute dodaš v nabor kategorije. | Brez tega atribut ne gre na splet. | Atribut je na kartici v skupini »Atributi kategorije (nabor)«. |\r\n| 11 | Urednik | `/uvozi` → uvoz #N | Po potrebi uvoz povrneš (povezava vodi na `/izdelki/uvoz?povrni=N`). | Pripravi se predogled s prejšnjimi vrednostmi; polja, ki jih je medtem nekdo spremenil, se izpustijo in izpišejo. Potrdiš z istim gumbom **Uvozi**. | Glej [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md). |\r\n\r\n**Kaj je v datoteki:** Ključ · ERP (stolpci iz registra pisljivih polj SAOP) · Splet (Spletne strani, Kategorije — {spletišče}, Spletni naziv/opis po jezikih, Slike, Dokumenti) · S-popust (S koda, Posebni S — tipi strank, Posebni S — stranke) · Oznake (Pakirno naročanje, Razstavni eksponat — D/N) · Atributi kategorije — nabor · Atributi izven nabora · Stanje (samo za branje).\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Prazna celica nikoli ne izprazni polja.** Izjema so polja S-popusta, kjer znak `-` odstrani S.\r\n- **ERP polja:** v PIM takoj, v SAOP šele po odobritvi. Zajem iz SAOP neposlanega polja ne povozi. SAOP ne dobi praznih vrednosti; logičnega polja ni mogoče izprazniti.\r\n- **Slike in dokumenti:** celica je cel seznam v vrstnem redu (prva slika je glavna); naslov, ki ga v celici ni več, izdelek izgubi.\r\n- **Kategorije:** pot mora obstajati v drevesu spletišča, sicer se vrstica zavrne z opozorilom. Jezikovna različica spletišča (npr. Videlektro angleško) brez svojega stolpca dobi isto kategorijo v svojem jeziku. Kategorija, zapisana z uvozom, velja kot ročna uvrstitev (ponovna preslikava vira je ne povozi).\r\n- **Spletne strani:** sprejme ime ali kodo (»svetila«, »Videlektro«); kljukica, ki je PIM ne dovoli (npr. brez kategorije), se ne postavi.\r\n- **Enote atributov (301):** atribut z enoto (npr. Dolžina = mm) sprejme karkoli: »5 m«, »3,5 m« ali 5 + stolpec »Enota dolžine« se pretvori v mm; ista enota se samo odstrani; vrednost, ki je ni mogoče pretvoriti (»5 ft«, »do 30m«), se zapiše, kot je, predogled pa opozori, naj bo v enoti atributa. Stolpec pod skupino »Atributi …«, katerega naslov je ime atributa, gre v atribut tudi, če ima polje SAOP isto ime (»Dolžina«).\r\n- **Dvoumni naslovi (#6):** stolpec z naslovom Naziv, Naziv artikla, Naziv izdelka, Ime artikla, Ime izdelka, Naslov, Name, Title, Product name ali Item name uvoz preskoči: ne gre v spletni naziv, ne v atribut (tudi pod skupino »Atributi …« ne in ne ponudi se v oknu »Manjkajoče«). Predogled in izid to povesta, opozorilo gre v `ops.ImportRun.Problems`. Primerjava je natančna, zato »Spletni naziv (sl)«, »Naziv 1« in atributi »Nazivna …« ostanejo, kot so. Opozorilo predlaga stolpca, ki ju ima list res (vzeta iz stolpcev lista): spletni naziv in naziv iz ERP, ki ima na delovnem listu naslov iz registra SAOP (danes »Naziv 1«; sprememba gre v vrsto za SAOP). Naslov »Naziv ERP (sl)« je samo v pregledni predlogi izvoza in ga uvoz ne pozna.\r\n- **Novi atributi:** stolpec pod skupino atributov, ki ga šifrant ne pozna, uvoz ustvari kot besedilni atribut.\r\n- **Oznake (302):** »Pakirno naročanje« in »Razstavni eksponat« sta D/N (sprejme tudi da/ne, 1/0; `-` = ne). Druga vrednost (npr. »morda«) je napaka vrstice »… ni D ali N; polje se preskoči« — pokaže se v predogledu, v izidu uvoza in se zapiše v zgodovino uvozov (`ops.ImportRun.Problems`). Predogled pokaže naslov stolpca in Da/Ne (npr. »Pakirno naročanje = Ne«). Zapis gre v PIM z zgodovino (`pim.SetProductFlagsBulk`), v SAOP ne. Pakirno naročanje brez Pakiranja 2 (\u003e 1) artikel zadrži s spleta; izid uvoza pove, koliko artiklov je zadržanih. Povratek uvoza vrne prejšnjo vrednost (manjkajoča oznaka = N).\r\n- **S-popust** se zapiše samo izdelku, ki je že objavljen v PIM; brez PAK2 nima učinka.\r\n- **Isti artikel večkrat** v datoteki: upošteva se prva vrstica. Dva stolpca za isto polje z različno vrednostjo: polje se preskoči.\r\n- **Hkratni uvozi:** največ dva hkrati, ostali čakajo v vrsti (stran to izpiše).\r\n- **Pravice:** stran odpre ADMIN, CATALOG_EDITOR, COMMERCIAL; zapis besedil, atributov, slik, spletišč in ERP polj pa zahteva ADMIN ali CATALOG_EDITOR (glej ⚠️ v razdelku 10).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Zvezek nima stolpca Podjetje, podjetje pa ni izbrano.« | Datoteka ni izvožena iz PIM ali je stolpec izbrisan. | Izberi podjetje na vrhu strani in naloži znova. |\r\n| »Stolpci brez ustreznega polja (ne bodo uvoženi)« | Preimenovan naslov ali polje, ki ni več pisljivo. | Vrni izvirni naslov ali izvozi svežo datoteko. |\r\n| »Stolpec »Naziv« je preskočen, ker je dvoumen …« | Stara datoteka (pred 29. 9.) ali ročno dodan stolpec z naslovom Naziv, Naziv artikla, Name, Title … Tak naslov ne pove, ali gre za spletni naziv ali naziv ERP, zato ga uvoz ne vpiše nikamor (ne v polje, ne v atribut); opozorilo ostane v zgodovini uvoza. | Vrednosti prepiši v stolpec, ki ga predlaga opozorilo: »Spletni naziv (sl)« za spletni naziv ali »Naziv 1« za naziv iz ERP (gre v vrsto za SAOP), in uvozi znova. Stolpca »Naziv ERP (sl)« ne dodajaj — uvoz ga ne pozna in bi ponudil nov atribut. |\r\n| »V zvezku ni nobene vrstice, ki bi kaj spremenila.« | Vse je v PIM že tako. | Nič. |\r\n| »… se razlikuje samo po vodilnih ničlah« | Excel je šifro spremenil v število. | Celico zapiši kot besedilo (z apostrofom) in uvozi znova. |\r\n| »kategorija … ni v drevesu« | Pot ne obstaja na tem spletišču. | Kopiraj pot iz izvoza ali s strani Kategorije. |\r\n| »Datoteka je večja od 16 MB.« | Prevelik izvoz. | Izvozi manj stolpcev ali razdeli izdelke. |\r\n| »Uvoz čaka v vrsti …« | Tečeta že dva uvoza. | Počakaj, začne se sam. |\r\n| Veliko opozoril »ni zapisano« za komercialista | Vloga COMMERCIAL nima pravice pisanja kataloga. | Uvoz naj izvede urednik kataloga. |\r\n| Umaknjeni s spleta po uvozu | Uvoz je pobrisal sliko, kategorijo ali obvezno polje. | Dopolni izdelek in spletišče ponovno označi. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Products.razor` (izvoz, okno Stolpci), `ProductImport.razor` (`/izdelki/uvoz`), `Components/Shared/ImportUndoBanner`.\r\n- **Storitve / delavci:** `ProductWorkbookService` (`DescribeColumnsAsync`, `PreviewAsync`, `ApplyAsync`, `PlanUndoAsync`), `ExportJobService.StartWorkbookExport` + prenos `izvoz/zvezek/{jobId}` (največ 90 min gradnje), `PIM.Operations/ProductWorkbookContract.cs` (stolpci, D/N, `|`), `SaopWriteService.EnqueueAsync` (vir `EXCEL`), `ProductEditService` (`SaveTextsBulkAsync`, `SaveAttributesBulkAsync`, `SaveMediaBulkAsync`, `SaveErpFieldsBulkAsync`, `SaveWebShopsAsync`), `CategoryMappingService.SetProductCategoriesAsync`, `PackagingDiscountService`, `ImportHistoryService.RecordAsync`, `WebWithdrawalService.AfterChangeByItemsAsync`, `HeavyWorkGate.Imports`.\r\n- **Tabele in pogledi:** `intranet.GetProductWorkbook`, `intranet.GetProductExportSheet`, `pim.SaveProductTextsBulk`, `pim.SaveProductAttributesBulk`, `pim.SaveProductMediaBulk`, `pim.SetProductCategories`, `out.SaopXmlField`, `ops.ImportRun`, `ops.ImportChange`.\r\n- **Migracije:** 218 (množični zapis), 245 (ERP takoj, slike, dokumenti), 251, 273, 274, 276 (rumene glave), 280 (zgodovina uvozov), 301 (enote atributov), 302 (oznake D/N, `pim.SetProductFlagsBulk`).\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Stran `/izdelki/uvoz` je odprta vlogi COMMERCIAL, zapisovalne storitve pa so neenotne: besedila, atributi, slike/dokumenti, kljukice spletišč (CatalogWrite) in ERP polja (SaopWrite) so dovoljeni samo ADMIN in CATALOG_EDITOR, kategorije (`CategoryMappingService`) in S-popusti (`PackagingDiscountService`) pa nimajo preverbe vloge v storitvi. Komercialist tako zapiše kategorije in S-popuste, ostalo pade kot opozorila »niso zapisana«; uvoz se kljub temu zapiše v zgodovino uvozov.\r\n- ⚠️ Z Excelom ni mogoče izprazniti spletnega besedila ali atributa (prazna celica = ne dotikaj se; znak `-` velja samo za S-popust). Prav tako ni mogoče odstraniti vseh slik izdelka.\r\n- ⚠️ Podnaslov strani uvoza omenja gumb »Delovni list«, gumb na seznamu pa se imenuje **Izvozi Excel**.\r\n- ⚠️ Izid uvoza za odobritev napoti na `/izvozi/mnozicno` in `/outbound`, drugod v intranetu pa je odobritev na `/saop/artikli` (Izhod v SAOP) — preveriti, katera pot je prava za uporabnika.\r\n- ⚠️ Kategorija iz uvoza se zapiše kot ročna uvrstitev; ponovna preslikava dobaviteljevega XML je nato ne spremeni več — uporabnik tega verjetno ne ve.\r\n- ⚠️ Znano: `ProductWorkbookTests` z delom na bazi ne poganjati na računalniku z 8 GB RAM.\r\n\r\n## Povezani procesi\r\n\r\n- [Iskanje in kartica izdelka](iskanje-in-kartica-izdelka.md): isti podatki za en izdelek; izvoz se začne na seznamu.\r\n- [Kategorije izdelka](kategorije-izdelka.md): ročna uvrstitev, ki jo zapiše tudi uvoz.\r\n- [Mediji](mediji.md): stolpca Slike in Dokumenti.\r\n- [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md): uvoz #N in povratek.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md) in [Množični izhod](../05-izhod-saop/mnozicni-izhod.md): odobritev ERP polj.\r\n- [Umaknjeni artikli in obvestila](../06-izhod-splet/umaknjeni-s-spleta.md): izdelki, umaknjeni po uvozu.\r\n- [Atributi in nabori](../08-upravljanje/atributi-in-nabori.md): novi atributi v nabor kategorije.\r\n- [Popusti](../07-poslovanje/popusti.md): stolpci S-popusta.\r\n- [Zaloge in rezervacija](../07-poslovanje/zaloge-in-rezervacija.md): polje »Izloči iz rezervacije zaloge«.\r\n"},{"pot":"04-kakovost/ai-spletna-besedila.md","vsebina":"---\r\nid: ai-spletna-besedila\r\nnaslov: AI predlog spletnega naziva in opisa\r\npodrocje: 04-kakovost\r\nstanje: delno\r\nbere: [pim.izdelek, pim.besedila, pim.atributi, pim.kategorije-izdelka]\r\npise: [pim.besedila]\r\nstrani: [/izdelki/{id}]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Services/AiTextService.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCard.razor]\r\nmigracije: []\r\n---\r\n\r\n# AI predlog spletnega naziva in opisa\r\n\r\n\u003e **Področje:** Kakovost · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nIz podatkov artikla v PIM (ERP nazivi in opisi, atributi, kategorije, proizvajalec, dobavitelj) AI predlaga spletni naziv in spletni opis v izbranem jeziku. Rezultat je osnutek na kartici, ki ga urednik prebere, popravi in shrani kot ročno spremembo.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ne sodeluje (razen če ima pravico urejanja kartice). |\r\n| Urednik kataloga | Na kartici izbere jezik, klikne gumb za AI predlog, pregleda besedili in ju shrani. |\r\n| Skrbnik | Nastavi ključ `Ai:ApiKey` (in po želji model in napor) na strežniku intraneta. |\r\n| Avtomatika (PIM) | Ne sodeluje; množičnega ali samodejnega generiranja ni. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik na kartici izdelka, zavihek Splet, klikne »Predlagaj naziv in opis (AI)«.\r\n- **Po urniku:** ni.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifra, EAN, proizvajalec, dobavitelj, ERP besedila, kategorije po spletiščih, neprazni atributi, obstoječa spletna besedila v drugih jezikih | PIM (kartica izdelka) |\r\n| **Izhod** | Osnutek spletnega naziva (`WEB_TITLE`) in opisa (`DESCRIPTION`) v izbranem jeziku | Kartica (osnutek) → PIM šele po »Shrani spremembe« |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Na kartici zavihek Splet izbere jezik]\r\n    B --\u003e C[Klikne Predlagaj naziv in opis]\r\n    F[Pregleda in popravi osnutek] --\u003e G[Klikne Shrani spremembe]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    D{AI ključ nastavljen?}\r\n    D -- ne --\u003e X([Gumb onemogočen z navodilom])\r\n    D -- da --\u003e E[[AI sestavi naziv in opis iz podatkov PIM]]\r\n    H[(Spletno besedilo v PIM)]\r\n  end\r\n  C --\u003e D\r\n  E --\u003e F\r\n  G --\u003e H\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,X endp; class B,C,F,G user; class D,E auto; class H data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/izdelki/{id}` | Na kartici odpreš zavihek Splet; v »AI predlog v jeziku« izbereš jezik. | — | Gumb »Predlagaj naziv in opis (AI)« je omogočen; če piše »AI ni nastavljen«, glej razdelek 8. |\r\n| 2 | Urednik | `/izdelki/{id}` | Klikneš »Predlagaj naziv in opis (AI)«. | Intranet pošlje podatke artikla modelu (privzeto `claude-opus-5`); gumb kaže »AI piše …«. | Sporočilo »AI (model) je predlagal spletni naziv in opis v jeziku … Besedili sta v osnutku …«. |\r\n| 3 | Urednik | `/izdelki/{id}` | Prebereš in po potrebi popraviš naziv (do 80 znakov) in opis (60–140 besed). | Besedili sta samo v osnutku, v bazi še ni nič. | Polji sta označeni kot spremenjeni. |\r\n| 4 | Urednik | `/izdelki/{id}` | Klikneš »Shrani spremembe«. | Besedili se zapišeta kot ročna sprememba (ista sled in pravice), artikel se validira. | Sporočilo o shranjenih besedilih; napaka spletnega profila za naziv ali opis izgine. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Predlog nikoli ne gre naravnost v bazo**; shrani ga uporabnik z istim gumbom kot ročno spremembo.\r\n- AI sme uporabiti samo podatke iz PIM; navodilo prepoveduje izmišljanje lastnosti, šifro in EAN v nazivu, klicaje, HTML in superlative brez podlage.\r\n- Artikel brez ERP besedil in brez atributov se zavrne (»AI ne bi imel iz česa pisati«).\r\n- Gumb je viden samo, kdor sme urejati kartico.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »AI ni nastavljen« | Na strežniku ni ključa `Ai:ApiKey` (ali `ANTHROPIC_API_KEY`). | Skrbnik doda v `appsettings.Local.json` ob intranetu razdelek `\"Ai\": { \"ApiKey\": \"…\" }` in znova zažene intranet. |\r\n| »Klic AI ni uspel: …« | Ni povezave, napačen ključ, omejitev. | Poskusi znova; skrbnik preveri ključ in dnevnik. |\r\n| »AI ni vrnil pričakovanega JSON odgovora« | Model je odgovoril v napačni obliki. | Poskusi znova. |\r\n| »Artikel nima ERP nazivov, opisov ali atributov« | Premalo podatkov. | Najprej dopolni ERP opis ali atribute. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/ProductCard.razor` (`SuggestWithAiAsync`, `ApplyAiDraft`).\r\n- **Storitve / delavci:** `PIM.Intranet/Services/AiTextService.cs` (uradni Anthropic SDK); nastavitve `Ai:ApiKey`, `Ai:Model` (privzeto `claude-opus-5`), `Ai:Effort` (`low`, `medium`, `high`, `max`; privzeto `medium`); registracija v `Program.cs`.\r\n- **Tabele in pogledi:** zapis prek običajnega shranjevanja besedil (`ProductEditService`).\r\n- **Migracije:** ni.\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Iz kode ni razvidno, ali je ključ `Ai:ApiKey` nastavljen na produkciji; brez njega funkcija ne dela.\r\n- ⚠️ Ni množičnega generiranja (npr. za vse artikle brez spletnega opisa); vsak artikel posebej.\r\n- ⚠️ Ni zapisa, da je besedilo napisal AI (sled pokaže samo uporabnika, ki je shranil).\r\n- ⚠️ Podatki artikla se pošiljajo zunanji storitvi; poslovna odobritev tega v kodi ni zabeležena.\r\n\r\n## Povezani procesi\r\n\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): kje je gumb.\r\n- [Manjkajoči prevodi](prevodi.md): prevodi vrednosti lastnosti (brez AI).\r\n- [Kakovost in validacija](kakovost-in-validacija.md): spletni profil zahteva naziv in opis.\r\n"},{"pot":"04-kakovost/kakovost-in-validacija.md","vsebina":"---\r\nid: kakovost-in-validacija\r\nnaslov: Kakovost in validacija artiklov\r\npodrocje: 04-kakovost\r\nstanje: delno\r\nbere: [pim.izdelek, pim.atributi, pim.besedila, pim.kategorije-izdelka, pim.mediji, pim.pravila]\r\npise: [pim.validacija]\r\nstrani: [/kakovost, /kakovost/artikli, /kakovost/napake]\r\nposli: [PRODUCT_VALIDATION, PRODUCT_PUBLICATION, NIGHTLY_RECONCILIATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Quality.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/QualityProducts.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ValidationErrors.razor, PIM_Solution/src/PIM.Intranet/Services/Quality*.cs, PIM_Solution/src/PIM.Intranet/Services/ValidationLayer.cs, PIM_Solution/src/PIM.Intranet/Services/GovernanceReadService.cs, PIM_Solution/src/PIM.Automation/JobCatalog.cs]\r\nmigracije: [102, 146, 147, 148, 177, 211, 218, 236, 242, 249, 251]\r\n---\r\n\r\n# Kakovost in validacija artiklov\r\n\r\n\u003e **Področje:** Kakovost · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nPokaže, kateri artikli so pripravljeni za ERP in za splet, katere zahteve validacijskih profilov jim manjkajo in kje se to popravi. Rezultat je popravljen artikel, ki po naslednji validaciji izgine s seznama napak in (če izpolnjuje pravila izvoza) pride v `katalog.csv`.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Urednik kataloga | Pregleda seznam na `/kakovost/artikli` in `/kakovost/napake`, odpre kartico izdelka in dopolni manjkajoča polja, po potrebi artikel ročno zadrži ali sprosti. |\r\n| Komerciala | Vidi iste sezname; sme tudi klikniti »Preveri zdaj« in postaviti ročni zadržek (pravica `BusinessWrite`). |\r\n| Skrbnik | Ureja profile in zahteve na `/pravila/validacija`; na kartici izdelka potrdi izjemo za polje, ki ga artikel namenoma nima (EAN, proizvajalec, dobavitelj). |\r\n| Avtomatika (PIM) | Vsako uro (in po uspešnem zajemu iz SAOP) validira vsa podjetja, nato objavi veljavne artikle in po potrebi odkljuka spletišča artiklom, ki niso več veljavni za splet. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik ali komerciala klikne »Preveri zdaj« pri artiklu na `/kakovost/artikli` (validira samo ta artikel).\r\n- **Po urniku:** posel `PRODUCT_VALIDATION` (»Validacija artiklov«) vsakih 3600 s za vsako podjetje; za njim `PRODUCT_PUBLICATION` (objava, samo po sveži validaciji, mlajši od 2 ur). Ista koraka tečeta tudi v nočni uskladitvi `NIGHTLY_RECONCILIATION` (skupini »Validacija vseh podjetij« in »Objava vseh podjetij«).\r\n- **Ob dogodku:** uspešen zajem artiklov `SAOP_PRODUCT_IMPORT` takoj sproži validacijo. Shranjevanje besedil, lastnosti in kljukic spletišč (kartica, uvoz delovnega lista) v bazi znova validira prizadete artikle.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Podatki artikla (ERP polja, besedila, atributi, kategorije, kljukice spletišč) in zahteve profilov | PIM (`canon`), register profilov `val.ValidationProfile` / `val.FieldRequirement` |\r\n| **Vhod** | Ročni zadržek z razlogom | Uporabnik na `/kakovost/artikli` |\r\n| **Izhod** | Odprte težave po artiklu, stanje pripravljenosti ERP in splet, čas zadnje validacije | PIM (`val.ProductIssue`, `val.ProductValidationState`) |\r\n| **Izhod** | Excel s filtriranim seznamom napak | Prenos `izvoz/kakovost-napake.xlsx` |\r\n| **Izhod** | Objavljeni veljavni artikli, iz katerih nastane `katalog.csv` | PIM (`pim`) → splet |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Odpre seznam Artikli za popravilo]\r\n    B --\u003e C[Filtrira po stanju ali odpre Napake validacije]\r\n    C --\u003e D[Odpre in popravi na kartici izdelka]\r\n    D --\u003e E[Klikne Preveri zdaj]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[[Urna validacija vseh podjetij]] --\u003e G{Artikel izpolnjuje profile?}\r\n    E --\u003e G\r\n    G -- ne --\u003e H[(Odprte težave in blokade)]\r\n    G -- da --\u003e I[[Objava veljavnih artiklov]]\r\n    H --\u003e B\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    J[(katalog.csv)]\r\n  end\r\n  I --\u003e J\r\n  I --\u003e K([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class B,C,D,E user; class F,G,I auto; class H,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/kakovost` | Odpreš meni »Kakovost podatkov«. | Stran brez `?pogled=` te preusmeri na prvi zavihek `/kakovost/artikli` (»Artikli za popravilo«). | Vidiš kartice »Pripravljeni za ERP«, »ERP blokirani«, »Objavljeni na spletu«, »Splet blokirani«, »Brez spletnega mesta«, »Vrstic v katalog.csv«, »Ročni zadržki«, »Zastarela validacija«. |\r\n| 2 | Urednik | `/kakovost/artikli` | Klikneš kartico (npr. »Splet blokirani«) ali izbereš podjetje, stanje in iskanje ter klikneš »Uporabi filtre«. | Seznam 50 artiklov na stran s stolpci ERP, Splet / katalog.csv, Težave, Validirano, Ročni zadržek. Stanje spleta se računa po istih pravilih kot `katalog.csv` (migracija 242). | Število artiklov desno v orodni vrstici; filtri so v naslovu (povezavo lahko deliš). |\r\n| 3 | Urednik | `/kakovost/napake` | Za podrobnosti odpreš zavihek »Napake validacije«, izbereš podjetje, nivo (ERP_SLO, ERP_EU/THIRD, KOMERCIALA, SPLET), profil, resnost, »Blokira«, drevo in kategorijo, polje; klikneš »Uporabi filtre«. | Po 25 artiklov na stran, za vsakega do 4 manjkajoča polja s profilom in resnostjo; spodaj tabeli »Katera zahteva ustavi največ izdelkov« in »Pri katerem dobavitelju se napake kopičijo«. | Številka »… izdelkov z odprto težavo«; aktivni filtri so kot čipi nad tabelo. |\r\n| 4 | Urednik | `/kakovost/napake` | Po želji klikneš »Izvozi Excel«. | Prenos `kakovost-napake.xlsx` z natanko istimi filtri; vrstice obarvane po resnosti. | Datoteka se prenese. |\r\n| 5 | Urednik | `/izdelki/{id}` | Pri artiklu klikneš »Odpri in popravi →« (ali ime izdelka) in na kartici dopolniš polje. | Kartica odpre zavihek, ki ustreza nivoju (ERP, komerciala, splet). ERP polja gredo v PIM takoj in v vrsto za SAOP (glej [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md)). | Na kartici izgine opozorilo za to polje po validaciji. |\r\n| 6 | Urednik ali komerciala | `/kakovost/artikli` | Klikneš »Preveri zdaj« pri artiklu. | Pokliče se `val.RunValidationForProduct` samo za ta artikel (največ 120 s). Nič ne gre v SAOP in CSV se ne izdela. | Sporočilo »Preverba za … je končana«, stolpec »Validirano« dobi nov čas, stanje se osveži. |\r\n| 7 | Urednik | `/kakovost/artikli` | Če artikla namenoma ne želiš ven: »Zadrži …« → izbereš kanal (Vsi kanali, ERP, Splet), vpišeš obvezen razlog → »Zadrži«. Za sprostitev »Sprosti«. | `val.SetProductHold` zapiše zadržek z akterjem in razlogom. Zadržek za splet ali vse kanale izključi artikel iz `katalog.csv`. | Stolpec »Ročni zadržek« pokaže čip kanala; kartica »Ročni zadržki« se poveča. |\r\n| 8 | Avtomatika | — | — | Urni `PRODUCT_VALIDATION` validira vsa podjetja in pokliče `pim.WithdrawIneligibleWebShops`; `PRODUCT_PUBLICATION` objavi veljavne artikle; `WEB_CATALOG_EXPORT` iz objavljenega stanja naredi `katalog.csv`. | Na `/kakovost/artikli` kartica »Zastarela validacija« (starejša od 2 ur) pada na 0. |\r\n| 9 | Urednik | `/kakovost?pogled=kategorije` | Za pregled po drevesu odpreš zavihek »Po kategorijah«, izbereš drevo (Svetila, Videlektro) in resnost. | Vsaka vrstica šteje artikle kategorije in vseh podkategorij (vsa podjetja skupaj); »Odpri napake →« odpre `/kakovost/napake` s filtrom kategorije. | Stolpec »Najpogosteje manjka« pokaže polja, ki jih je treba dopolniti. |\r\n| 10 | Skrbnik | `/kakovost?pogled=profili` | Pregleda profile (stran nima zavihka, dosegljiva samo z naslovom). | Tabela profilov z nivojem, obsegom, številom zahtev, neveljavnimi in vplivom (ERP, splet). Profil brez nivoja je označen. | Povezava na profil vodi na `/pravila/validacija?profil=…`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Napake ni mogoče ročno zapreti.** Izgine sama, ko je polje dopolnjeno in je artikel znova validiran.\r\n- **Karantena ni napaka validacije:** karantena je zapis iz vira, ki ga preslikava ni sprejela (artikla še ni); napaka validacije je na obstoječem artiklu. Glej [Karantena](karantena.md).\r\n- **Nivoji:** `SHARED` profil šteje v ERP in splet (kar blokira), `ERP` profil v ERP_SLO ali ERP_EU/THIRD (po imenu profila), `COMMERCIAL` v KOMERCIALA (nikoli ne blokira), `WEB` v SPLET. Napaka profila, ki nič ne blokira, je prikazana kot »Manjka (ne blokira)«.\r\n- **Resnost:** `ERROR` naredi profil neveljaven, `WARNING` se samo pokaže.\r\n- **Svežina:** validacija, starejša od 2 ur, velja za zastarelo; objava (`PRODUCT_PUBLICATION`) teče samo po uspešni in sveži validaciji.\r\n- **Splet:** stolpec »Splet / katalog.csv« uporablja ista pravila kot izvoz: kljukice spletišč, kategorija na označenem spletišču, ročni zadržek, izključitev iz kataloga, veljavnost spletnih profilov. Oznaka »ERP: za splet« iz SAOP je samo informativna.\r\n- **ERP pripravljenost je samo informativna.** Od migracije 236 ne blokira vpisa ali pošiljanja v SAOP; odloči SAOP ob prejemu. ⚠️ glej razdelek 10.\r\n- **Pravice:** vse strani kakovosti zahtevajo prijavo; »Preveri zdaj« in »Zadrži« zahtevata `BusinessWrite` (ADMIN, CATALOG_EDITOR, COMMERCIAL); izjema polja na kartici samo ADMIN (`FieldWaiver`). Zavihki imajo dodatne ključe dostopa `tab.quality.*`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Veliko artiklov ima »Potrebna preverba« / »Zastarelo« | Urna validacija ni tekla ali je padla (počasna, ~11 min za podjetje 2). | Preveri posel »Validacija artiklov« na `/sistem` (posel `/sistem/posel/PRODUCT_VALIDATION`) (glej [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md)); za posamezen artikel klikni »Preveri zdaj«. |\r\n| »Validacije ni bilo mogoče dokončati« po »Preveri zdaj« | Ni pravice, časovna omejitev 120 s ali zaklep med nočno validacijo. | Poskusi čez nekaj minut; če se ponavlja, poglej dnevnik aplikacije. |\r\n| `/kakovost/napake` kaže bistveno manj artiklov kot `/kakovost/artikli` | Stran napak privzeto pokaže samo eno podjetje (prvo po šifri); pripravljenost privzeto vsa. | V izbirniku podjetja izberi pravo podjetje in klikni »Uporabi filtre«. |\r\n| Artikel je popravljen, a je še »Splet blokiran« | Validacija še ni tekla, ali manjka kljukica/kategorija, ali je aktiven ročni zadržek. | »Preveri zdaj«; preveri stolpec »spletišča N/M« in zadržek. |\r\n| Napaka za polje, ki ga artikel res nima (npr. brez EAN) | Zahteva profila velja za vse. | Skrbnik na kartici potrdi izjemo polja (samo ADMIN). |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Quality.razor` (`/kakovost`, pogleda `profili` in `kategorije`), `QualityProducts.razor` (`/kakovost/artikli`), `ValidationErrors.razor` (`/kakovost/napake`); zavihki `Components/Shared/PimTab.cs` → `QualityTabs`.\r\n- **Storitve / delavci:** `QualityReadService` (`GetProductReadinessAsync`, `GetIssuesAsync`, `GetByCategoryAsync`, `GetOverviewAsync`), `QualityWriteService` (`val.RunValidationForProduct`, `val.SetProductHold`, `val.SetProductFieldWaiver`), `GovernanceReadService`, `QualityIssueExportService`, `ValidationLayer.cs`; avtomatika `PIM.Automation/JobCatalog.cs` (koraka `Validate`, `Promote`).\r\n- **Tabele in pogledi:** `val.ValidationProfile`, `val.FieldRequirement`, `val.ProductIssue`, `val.ProductValidationState`, `val.ProductHold`, `val.ProductChannelReadiness`; procedure `val.RunValidation`, `val.RunValidationForProducts`, `val.Promote`, `pim.WithdrawIneligibleWebShops`, `intranet.GetQualityIssues`, `intranet.GetQualityOverview`, `intranet.GetQualityByCategory`.\r\n- **Migracije:** 102 (bralne procedure), 146–148 (zahteve po kategoriji), 177 (po kategorijah), 194/195/236 (ERP varovalka uvedena in odstranjena), 211 (prioriteta zastoja), 218 (zmogljivost), 236 (sveža validacija), 242 (pripravljenost = pravila izvoza), 249 (izjema polja), 251 (samodejni umik kljukic).\r\n- **Urniki:** `PRODUCT_VALIDATION` 3600 s, `PRODUCT_PUBLICATION` 3600 s (odvisen od validacije, največ 7200 s stare), `NIGHTLY_RECONCILIATION`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ `/kakovost/napake` kartica »Blokira ERP« piše »težav v profilih, ki ustavijo zapis v SAOP«, a od migracije 236 blokirajoče napake zapisa v SAOP ne ustavijo več (sprožilec `out.TR_OutboxMessage_ErpQualityGate` je odstranjen). Besedilo zavaja.\r\n- ⚠️ Ročni zadržek za kanal **ERP** na `/kakovost/artikli` nima učinka na vrsto za SAOP (236: »za ERP ostane samo informativen«). Uporabnik lahko misli, da je artikel zadržan pred SAOP.\r\n- ⚠️ `/kakovost/napake` privzeto kaže samo prvo podjetje (`GetCurrentOrganizationAsync`), `/kakovost/artikli` pa vsa podjetja; številke se med zavihkoma ne ujemajo.\r\n- ⚠️ Gumb »Zadrži …« je viden vsem, pravica se preveri šele ob kliku (napaka pri vlogi brez `BusinessWrite`).\r\n- ⚠️ Pogled `/kakovost?pogled=profili` nima zavihka; dosegljiv je samo z vpisanim naslovom.\r\n- ⚠️ Celotna validacija podjetja 2 je bila izmerjena ~11 min (prej ~3,5 min); pri urnem ritmu lahko artikli pogosto kažejo »zastarelo«. Potrebna ponovna meritev.\r\n- ⚠️ Ali shranjevanje vsake vrste polja na kartici res sproži validacijo, je razvidno le iz komentarjev kode (`val.RunValidationForProducts` pri množičnem zapisu besedil); ni preverjeno za vsa polja.\r\n\r\n## Povezani procesi\r\n\r\n- [Karantena](karantena.md): zapisi, ki sploh niso postali artikel.\r\n- [Manjkajoči prevodi](prevodi.md) in [Manjkajoče kategorije](manjkajoce-kategorije.md): pogosta vzroka napak spletnega profila.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): kje se napaka dejansko popravi.\r\n- [Pravila validacije, slovar, preslikave](../08-upravljanje/pravila-validacije-slovar-preslikave.md): kje se urejajo profili in zahteve.\r\n- [Atributi in nabori](../08-upravljanje/atributi-in-nabori.md): nabor atributov kategorije določa, kaj se zahteva.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): kaj se zgodi z veljavnimi artikli.\r\n- [Umaknjeni artikli in obvestila](../06-izhod-splet/umaknjeni-s-spleta.md): samodejni umik kljukic po validaciji.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posla `PRODUCT_VALIDATION` in `PRODUCT_PUBLICATION`.\r\n"},{"pot":"04-kakovost/karantena.md","vsebina":"---\r\nid: karantena\r\nnaslov: Karantena (napake uvoza)\r\npodrocje: 04-kakovost\r\nstanje: delno\r\nbere: [pim.surovi-zajem]\r\npise: []\r\nstrani: [/kakovost/karantena]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/RawQuarantine.razor, PIM_Solution/src/PIM.Intranet/Services/IntranetDataService.cs, PIM_Solution/src/PIM.Intranet/Services/QualityIssueExportService.cs]\r\nmigracije: []\r\n---\r\n\r\n# Karantena (napake uvoza)\r\n\r\n\u003e **Področje:** Kakovost · **Lastnik:** skrbnik podatkov · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nPokaže vhodne zapise (iz SAOP ali dobaviteljev), ki jih preslikava ni sprejela, zato iz njih artikel v PIM sploh ni nastal ali ni bil posodobljen. Rezultat je seznam z razlogom izločitve, na podlagi katerega se popravi preslikava ali izvorni podatek.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Običajno ne sodeluje; lahko pogleda, zakaj artikla dobavitelja ni v PIM. |\r\n| Urednik kataloga | Pregleda seznam, izvozi ga v Excel in javi skrbniku, kaj je treba popraviti. |\r\n| Skrbnik | Popravi preslikavo, slovar ali izvorni podatek in sproži ponovno obdelavo vira. |\r\n| Avtomatika (PIM) | Ob vsaki preslikavi vhodnega zapisa (`map.ProcessRawInbox`) zapis, ki ne gre skozi, pusti v karanteni z razlogom. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik odpre `/kakovost/karantena`, ko artikla ni v PIM ali ko nadzorna plošča kaže napake uvoza.\r\n- **Po urniku:** zapisi nastajajo med zajemi (`SAOP_PRODUCT_IMPORT`, `SUPPLIER_CATALOG_IMPORT` …); sama stran nima urnika.\r\n- **Ob dogodku:** vsak neuspešno preslikan zapis iz `raw.Inbox`.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Neuspešno preslikani vhodni zapisi z virom, entiteto, stranjo in razlogom | PIM (`raw.Inbox`) iz SAOP ali dobaviteljev |\r\n| **Izhod** | Pregled in Excel `karantena.xlsx` | Uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph S[\"🏢 SAOP\"]\r\n    A[(Zapis iz vira)]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    B[[Preslikava vhodnega zapisa]] --\u003e C{Preslikava sprejme zapis?}\r\n    C -- da --\u003e D([Artikel v PIM])\r\n    C -- ne --\u003e E[(Karantena z razlogom)]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    F[Odpre Napake uvoza in filtrira] --\u003e G[Izvozi Excel]\r\n    G --\u003e H[Skrbnik popravi preslikavo ali vir]\r\n    H --\u003e I[Ponovna obdelava vira]\r\n  end\r\n  A --\u003e B\r\n  E --\u003e F\r\n  I --\u003e B\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class D endp; class F,G,H,I user; class B,C auto; class A,E data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/kakovost/karantena` | Odpreš zavihek »Napake uvoza«. | Naložijo se karantenski zapisi privzetega podjetja (`intranet.GetRawQuarantine`). | Tabela z Vir, Entiteta, Stran, Razlog izločitve, Prejeto. |\r\n| 2 | Urednik | `/kakovost/karantena` | Izbereš podjetje, vir, entiteto ali vpišeš iskanje (vir, entiteta, razlog) in klikneš »Uporabi filtre« (ali Enter). | Filtri se zapišejo v naslov; filtriranje po viru in entiteti je nad že naloženimi vrsticami. | Število »… rezultatov«; čipi aktivnih filtrov, »Počisti vse«. |\r\n| 3 | Urednik | `/kakovost/karantena` | Klikneš »Izvozi Excel«. | Prenos `karantena.xlsx` z istimi filtri. | Datoteka se prenese. |\r\n| 4 | Skrbnik | `/pravila/...`, `/kakovost/kategorije` | Glede na razlog popravi preslikavo polja, kategorije ali vrednosti v slovarju. | Pravilo preslikave se spremeni. | — |\r\n| 5 | Skrbnik | stran zajema (glej 02-vhodi) | Sproži ponovno obdelavo vira. | `map.ProcessRawInbox` zapis obdela znova; sprejet zapis izgine iz karantene. | Po osvežitvi `/kakovost/karantena` zapisa ni več; artikel je na `/izdelki`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Stran je **samo bralna**: zapisa ni mogoče izbrisati, popraviti ali ponovno obdelati s te strani.\r\n- Karantena je pred PIM (artikel ne obstaja), napaka validacije je za PIM (artikel obstaja, a mu manjka polje).\r\n- Za ogled je dovolj prijava in dostop do zavihka `tab.quality.quarantine`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Razlog ni podan« | Preslikava ni zapisala razloga. | Skrbnik pogleda zapis v `raw.Inbox` po `InboxId`. |\r\n| Veliko zapisov istega vira z istim razlogom | Sprememba oblike pri dobavitelju ali manjkajoča preslikava. | Popravi preslikavo in ponovno obdelaj vir (glej [Težave in neujemanja zajema](../02-vhodi/tezave-in-neujemanja-zajema.md)). |\r\n| Seznam je prazen, artikla pa ni v PIM | Izbrano napačno podjetje, ali artikel ni prišel niti do `raw.Inbox`. | Zamenjaj podjetje; preveri zajem na nadzorni plošči. |\r\n| »Karantene trenutno ni mogoče naložiti« | Baza ni dosegljiva ali procedura manjka. | Skrbnik preveri povezavo in dnevnik. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/RawQuarantine.razor`\r\n- **Storitve / delavci:** `IntranetDataService.GetQuarantineAsync`, `QualityIssueExportService` (Excel); preslikavo izvaja `PIM.XmlMapping` / `map.ProcessRawInbox`.\r\n- **Tabele in pogledi:** `raw.Inbox` (stolpci `InboxId`, `RunId`, `SourceCode`, `EntityType`, `PageNumber`, `FailureReason`, `ReceivedUtc`), procedura `intranet.GetRawQuarantine`.\r\n- **Migracije:** ni posebne; ponovna obdelava vira 244.\r\n- **Urniki:** ni lastnega; zapisi nastajajo ob zajemih.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Na strani ni gumba za ponovno obdelavo ali za povezavo na preslikavo; uporabnik mora vedeti, kam iti.\r\n- ⚠️ Privzeto podjetje je prvo po šifri; brez izbire podjetja so zapisi drugih podjetij nevidni.\r\n- ⚠️ Iz kode ni razvidno, ali in kdaj se stari karantenski zapisi čistijo (seznam lahko raste).\r\n- ⚠️ Vsi zapisi podjetja se naložijo naenkrat, brez strani; pri velikem številu je stran lahko počasna.\r\n\r\n## Povezani procesi\r\n\r\n- [Kakovost in validacija](kakovost-in-validacija.md): napake na že obstoječih artiklih.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md) in [Dobaviteljski katalogi XML](../02-vhodi/dobaviteljski-katalogi-xml.md): od kod pridejo zapisi.\r\n- [Težave in neujemanja zajema](../02-vhodi/tezave-in-neujemanja-zajema.md): ponovna obdelava vira.\r\n- [Pravila validacije, slovar, preslikave](../08-upravljanje/pravila-validacije-slovar-preslikave.md): kje se popravi preslikava.\r\n"},{"pot":"04-kakovost/manjkajoce-kategorije.md","vsebina":"---\r\nid: manjkajoce-kategorije\r\nnaslov: Manjkajoče kategorije (preslikave kategorij dobaviteljev)\r\npodrocje: 04-kakovost\r\nstanje: deluje\r\nbere: [pim.surovi-zajem, pim.kategorije]\r\npise: [pim.pravila, pim.kategorije]\r\nstrani: [/kakovost/kategorije]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/MissingCategories.razor, PIM_Solution/src/PIM.Intranet/Services/CategoryMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/CategoryTreeService.cs]\r\nmigracije: [109, 178]\r\n---\r\n\r\n# Manjkajoče kategorije (preslikave kategorij dobaviteljev)\r\n\r\n\u003e **Področje:** Kakovost · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nVsaki poti kategorije, ki jo pošlje dobavitelj (vir), določi našo kategorijo v drevesu spletišča. Dokler pot nima cilja, artikel na spletu nima uvrstitve. Rezultat je aktivna preslikava, ki velja za vsa podjetja in vse artikle za to potjo.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ne sodeluje. |\r\n| Urednik kataloga | Izbere ciljno kategorijo za pot, po potrebi ustvari novo kategorijo, spremeni ali ugasne preslikavo. |\r\n| Skrbnik | Ureja drevo kategorij in prevode poti (pogoj za shranjevanje). |\r\n| Avtomatika (PIM) | Ob naslednji preslikavi vira artiklom za to potjo dodeli kategorijo. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik odpre `/kakovost/kategorije` (zavihek »Nepreslikane kategorije«), npr. po novem dobaviteljevem katalogu.\r\n- **Po urniku:** nove poti nastajajo ob zajemih dobaviteljev (`SUPPLIER_CATALOG_IMPORT`).\r\n- **Ob dogodku:** vir pošlje pot, ki je še ni v preslikavah.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Poti iz vira (do 3 ravni), število artiklov za potjo | PIM (`map.SourceCategory`) iz dobaviteljevih datotek |\r\n| **Izhod** | Preslikava pot → naša kategorija (ali nova kategorija v drevesu) | PIM (preslikave kategorij, drevo) → uvrstitev na spletu |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Filtrira Nepreslikano po viru in drevesu]\r\n    B --\u003e C[Klikne Preslikaj]\r\n    C --\u003e D{Kategorija obstaja?}\r\n    D -- ne --\u003e E[Ustvari novo kategorijo pod nadrejeno]\r\n    D -- da --\u003e F[Izbere kategorijo in klikne Shrani]\r\n    E --\u003e F\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    G[[Baza preveri kategorijo in prevedeno pot]] --\u003e H[(Aktivna preslikava)]\r\n    H --\u003e I[[Naslednja preslikava vira uvrsti artikle]]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    J[(Uvrstitev v katalog.csv)]\r\n  end\r\n  F --\u003e G\r\n  I --\u003e J\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A endp; class B,C,D,E,F user; class G,I auto; class H,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/kakovost/kategorije` | Odpreš zavihek »Nepreslikane kategorije«. | Privzeto so prikazane poti v stanju »Nepreslikano«, razvrščene po številu artiklov, 50 na stran. | Števec »… poti«. |\r\n| 2 | Urednik | `/kakovost/kategorije` | Izbereš vir, drevo, stanje (Nepreslikano, Preslikano, Ugasnjeno) ali vpišeš iskanje. | Seznam se takoj osveži. | Stolpci: Vir, Pot iz vira, Izdelkov, Stanje, Naša kategorija. |\r\n| 3 | Urednik | `/kakovost/kategorije` | Pri vrstici klikneš »Preslikaj« (ali »Uredi«). | Naloži se drevo tega spletišča v izbirnik s tipkanjem. | Pod vrstico se odpre obrazec »Ciljna kategorija«. |\r\n| 4 | Urednik | `/kakovost/kategor
