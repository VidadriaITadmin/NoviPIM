 | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Prevzem javi »Naslov ni nastavljen«. | Na strežniku manjka `Fetch:NW_XML` (ali `Fetch:BT_XML`) v `appsettings.Local.json`. | Skrbnik doda naslov (ročni korak migracije 270). |\r\n| Vir »Zamuja«, alarm »SourceStale«. | Dobavitelj ne odgovarja ali vrača isto datoteko. | Skrbnik preveri prevzem na `/sistem`; po potrebi kontaktira dobavitelja. |\r\n| Artikel nima atributov ali kategorije iz XML. | Manjka preslikava kategorije ali atributa vira. | Zapri vrzeli in ponovno preslikaj vir. |\r\n| Datoteka v karanteni. | Pokvarjen ali nepričakovan XML. | `/zajem/tezave?vrsta=INBOX`; skrbnik pogleda predogled vhoda. |\r\n| Zavihek »Spremembe iz XML« je prazen ali zadnja sprememba je stara. | XML ne prihaja (glej »Zadnji prevzem datoteke«) ali dobavitelj ni ničesar spremenil. | Pri rumenem prevzemu preveri posel `SUPPLIER_CATALOG_IMPORT` na `/sistem`. |\r\n| Pri opisu piše »skrajšano«. | Zgodovina hrani prvih 400 znakov. | Celotno besedilo je na kartici artikla. |\r\n| »Zavrnjena zaloga« na `/zajem` raste. | Šifre v datoteki zaloge se ne ujemajo z artikli. | `/zajem/tezave?vrsta=STOCK`. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `/zajem` (`Ingest.razor`), `/zajem/viri/{SourceCode}` (`IngestSourceDetail.razor`), zavihek »Spremembe iz XML« (`SupplierXmlChanges.razor` v `IngestCandidates.razor`, `SupplierCandidateReadService.GetXmlChangesAsync` in `WriteXmlChangesWorkbookAsync` (izvoz v Excel) — parametriziran SELECT nad `pim.ProductChangeBatch` + `pim.ProductFieldHistory`, brez migracije).\r\n- **Storitve / delavci:** `PIM.SourceFetchWorker` (`SourceFetcher`, `FetchLocation`; register `map.SourceFetchLocation`), `PIM.XmlFileWorker` (branje XML in delovnih zvezkov, okolje `PIM_XML_SOURCE_CODE`, `PIM_XML_ORGANIZATION_ID`; stikala `--map-run`, `--znova-preslikaj`), `PIM.StockFileWorker` (`NwFtpTransport`, `BtXmlTransport`), knjižnici `PIM.XmlMapping` (`XPathMappingExtractor`, `SqlMappingPipeline`) in `PIM.StockMapping` (`StockMappingExtractor`, `StockLandingWriter`); posli v `PIM.Automation/JobCatalog.cs` (`PlanSupplierCatalog`) in `WorkerSchedulerPolicy.cs` (`XmlSteps`, `StockFilesSteps`).\r\n- **Tabele in pogledi:** `raw.Inbox`, `map.ExtractedValue`, `map.SourceConnector` (`CanCreateProducts = 0` za ne-SAOP), `map.SupplierProductCandidate`, `stock.Position`, `map.StockIdentityRule`.\r\n- **Migracije:** 240 (kandidati po EAN), 256 (viri in svežina), 257 (ERP-first), 262 (zaloga dobavitelja samo obstoječim), 270 (NW_XML prek HTTP), 273.\r\n- **Urniki:** `SUPPLIER_CATALOG_IMPORT` (21600 s), `SUPPLIER_STOCK_IMPORT` (1800 s), `NIGHTLY_RECONCILIATION` (00:30).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Nočna uskladitev pri XML koraku, če mapa prevzema nima datotek, uporabi **testne datoteke** (`nw`, `bt` v mapi fixtures), redni posel `SUPPLIER_CATALOG_IMPORT` pa ne. Nočni tek lahko torej na strežniku z mapo fixtures zajame testni XML.\r\n- ⚠️ Oznaka `XML_FEED` v zgodovini pokriva tudi preslikavo SAOP (`PIM.XmlMapping:SAOP_*`); dobavitelja loči samo `ChangedBy`. Paket XML nima podjetja (`pim.ProductChangeBatch.OrganizationId` je NULL), podjetje je v vrstici zgodovine.\r\n- ⚠️ Stara in nova vrednost v zgodovini sta odrezani na 400 znakov (sprožilci 034).\r\n- ⚠️ `Fetch:BT_XML` na PRD po zapisih prejšnjih sej verjetno manjka; iz kode ni mogoče preveriti.\r\n- ⚠️ Znana napaka iz prejšnjih sej: MERGE medijev iz NW XML in časovna omejitev za podjetje 4 — v kodi nisem našel potrditve, da sta odpravljeni.\r\n- ⚠️ XML se bere za vsa vključena podjetja, čeprav ima katalog za splet samo podjetje 2; pri velikem podjetju preslikava traja 10 min in več.\r\n\r\n## Povezani procesi\r\n\r\n- [Novi artikli dobaviteljev](novi-artikli-dobaviteljev.md): kaj se zgodi s kandidati.\r\n- [Preslikava virov in ponovna obdelava](preslikava-virov-in-ponovna-obdelava.md): zapiranje vrzeli in ponovna preslikava.\r\n- [Pregled vhodov in virov](pregled-vhodov-in-virov.md): stanje virov.\r\n- [Težave in neujemanja zajema](tezave-in-neujemanja-zajema.md): karantena, zavrnjena zaloga.\r\n- [Mediji](../03-izdelki/mediji.md): slike in dokumenti iz XML.\r\n- [Kategorije izdelka](../03-izdelki/kategorije-izdelka.md): kategorija dobavitelja → naše drevo.\r\n- [Zaloge in rezervacija](../07-poslovanje/zaloge-in-rezervacija.md): uporaba zaloge dobavitelja.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posli in ročni zagon.\r\n"},{"pot":"02-vhodi/novi-artikli-dobaviteljev.md","vsebina":"---\r\nid: novi-artikli-dobaviteljev\r\nnaslov: Novi artikli dobaviteljev (kandidati iz XML v SAOP)\r\npodrocje: 02-vhodi\r\nstanje: delno\r\nbere: [pim.kandidati, pim.surovi-zajem, pim.izdelek, pim.nastavitve, pim.saop-vrsta, pim.kategorije, pim.pravila]\r\npise: [pim.kandidati, pim.saop-vrsta]\r\nstrani: [/izdelki/novi-artikli, /zajem/novi-artikli]\r\nposli: [SUPPLIER_CATALOG_IMPORT, SAOP_OUTBOUND_DISPATCH, SAOP_PRODUCT_IMPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/IngestCandidates.razor, PIM_Solution/src/PIM.Intranet/Services/SupplierCandidateReadService.cs, PIM_Solution/src/PIM.Intranet/Services/SupplierCandidateWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/SupplierCandidateSaopService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopItemWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Outbound/*.cs]\r\nmigracije: [219, 240, 241, 257, 273]\r\n---\r\n\r\n# Novi artikli dobaviteljev (kandidati iz XML v SAOP)\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-29, iz kode (#7)\r\n\r\n## 1. Namen\r\n\r\nArtikel, ki ga dobavitelj ponuja v XML, v PIM pa ga ni (ne po šifri ne po EAN), postane **kandidat**. Urednik ga pregleda, dopolni obvezne podatke ERP in pošlje v SAOP kot nov artikel. Pravi artikel v PIM nastane šele, ko ga povratni zajem iz SAOP prebere; XML ga nato obogati.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Odloči, ali artikel prodajamo (lahko ga predlaga uredniku). |\r\n| Urednik kataloga | Pregleda kandidata (»Podatki iz XML«), dopolni polja ERP, uvrsti v vrsto SAOP ali zavrne. |\r\n| Skrbnik | Enako kot urednik; rešuje primere, ko SAOP dodeli drugo šifro. |\r\n| Avtomatika (PIM) | Ustvari kandidate ob zajemu XML; pošlje odobrena sporočila v SAOP; zajem SAOP ustvari artikel; naslednji zajem XML kandidata zapre. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik odpre `/izdelki/novi-artikli` (zavihek »Novi artikli« pod Izdelki; stara pot `/zajem/novi-artikli` še deluje).\r\n- **Po urniku:** kandidati nastanejo s poslom `SUPPLIER_CATALOG_IMPORT` (vsakih 6 ur); pošiljanje `SAOP_OUTBOUND_DISPATCH`; artikel v PIM ustvari `SAOP_PRODUCT_IMPORT` (vsako uro).\r\n- **Ob dogodku:** nova šifra ali EAN v XML dobavitelja.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Kandidat s posnetkom vrednosti iz XML (naziv, EAN, šifra, slike, atributi), pogodba polj SAOP, privzetki ERP | dobavitelj (XML) / uporabnik |\r\n| **Izhod** | Sporočila »nov artikel« (POST) v odhodni vrsti za SAOP; zavrnjen kandidat z razlogom | PIM → SAOP |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Zajem XML]) --\u003e B[(Kandidat čaka na ERP)]\r\n    G\u003eČaka odobritev v vrsti]\r\n    I[[Zajem SAOP ustvari artikel]] --\u003e J[[Zajem XML zapre kandidata in obogati]]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    C[Pregleda podatke iz XML] --\u003e D{Prodajamo?}\r\n    D -- ne --\u003e E([Zavrni z razlogom])\r\n    D -- da --\u003e F[Dopolni polja ERP in uvrsti]\r\n    F --\u003e K[Odobri in pošlji]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    H[(Nov artikel s šifro)]\r\n  end\r\n  B --\u003e C\r\n  F --\u003e G\r\n  G --\u003e K\r\n  K --\u003e H\r\n  H --\u003e I\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,E endp; class C,F,K user; class D,I,J auto; class G wait; class B,H data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/izdelki/novi-artikli` | Izbereš podjetje, vir (`NW_XML`, `BT_XML`) in stanje (privzeto »Čaka na ERP«); iščeš po šifri ali EAN in klikneš »Uporabi filtre«. | Prebere se do 50 kandidatov na stran; zgoraj števci (Čaka na ERP, Kandidati čakajo na SAOP, V čakalni vrsti SAOP, SAOP zavrnil, Potrjeni v SAOP, Zavrnjeni). | Seznam kandidatov; oznaka »šifra = EAN«, kadar dobavitelj šifre ne pošilja. |\r\n| 2 | Urednik | isto | Pri vrstici klikneš »Podatki iz XML«. | Pokažejo se vrednosti, ki jih je poslal dobavitelj, po skupinah (tudi do 12 slik). | Vidiš naziv, lastnosti, slike. |\r\n| 2b | Urednik | isto, stolpec »Uvrstitev v kategorijo« | Pogledaš, kam bo artikel uvrščen. Vrstica ima oznako »nov v katalogu dobavitelja«. | Iz zadnjega zajema (zapis Classification) se prebere dobaviteljeva pot in prevede po preslikavah kategorij (`map.CategoryPathMap`) za vsako drevo — isto pravilo, kot ga uporabi zajem, ko artikel obstaja (#7). | »Bo uvrščen v: Notranja svetila \u003e …« ali rdeče »Kategorija dobavitelja nima preslikave« z gumbom »Preslikaj …« (okno vrzeli) in povezavo na Preslikave kategorij. »Dobavitelj kategorije ne pošlje« pomeni ročno uvrstitev po ustvaritvi. |\r\n| 3a | Urednik | isto | Če artikla ne želimo: »Zavrni …«, vpišeš razlog, »Potrdi zavrnitev«. | Kandidat dobi stanje »Zavrnjeni« z razlogom, tvojim imenom in časom. | Sporočilo »Artikel … je zavrnjen.« |\r\n| 3b | Urednik | isto | Če ga želimo: »V SAOP …« (en artikel) ali kljukice + »V čakalno vrsto SAOP izbrane (N) …« (več artiklov **istega podjetja**). | Odpre se priprava: polja ERP, ki jih PIM sme pisati; obvezna so označena z `*`, manjkajoča obarvana. Skupne vrednosti šifrantov vpišeš enkrat, naziv po artiklu. | Števec pripravljenih artiklov v gumbu. |\r\n| 4 | Urednik | priprava | Klikneš »Uvrsti v čakalno vrsto (N)« ali »Uvrsti in odobri (N)«. | Za popolne artikle nastane skupina v vrsti za SAOP (vir `XML`, POST). Nepopolni ostanejo tu z razlogom (»Preskočenih: N«). Z »Uvrsti in odobri« so sporočila takoj odobrena. | Sporočilo »Skupina N: v čakalno vrsto SAOP uvrščenih …«; kandidat ima oznako »SAOP: v čakalni vrsti«. |\r\n| 5 | Urednik | isto ali Izhod v SAOP | Če še ni odobreno: »Odobri v vrsti (N)«; nato »Pošlji zdaj« ali počakaš odhodno vrsto. | Sporočila gredo v SAOP; SAOP vrne šifro. | Oznaka »SAOP: poslan, čaka potrditev«. |\r\n| 6 | Avtomatika | — | — | Zajem artiklov iz SAOP (vsako uro) ustvari artikel v PIM; naslednji zajem XML kandidata zapre in artikel obogati. | Oznaka »Potrjeni v SAOP«, povezava »Odpri artikel«; če je SAOP dodelil drugo šifro, piše »šifra SAOP X (prej Y)«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **XML ne ustvari artikla v PIM** — samo kandidata. Stari ukaz »uvozi kandidata v PIM« je zaprt (257).\r\n- Nepopoln dokument ne gre v vrsto: SAOP bi ga zavrnil in poskus bi bil porabljen.\r\n- V SAOP nič ne gre samodejno: brez »Uvrsti in odobri« ali »Odobri v vrsti« sporočila čakajo odobritev.\r\n- Paketna priprava velja za artikle **enega podjetja** (šifranti ERP in kanal so na podjetje). Če kanal SAOP za podjetje ni vklopljen, sta gumba za uvrstitev onemogočena.\r\n- Kandidat, ki ga SAOP že pozna, se preskoči (»spremembe gredo s kartice artikla«).\r\n- Kdo sme: zavrnitev `CatalogWrite` (skrbnik, urednik); uvrstitev v vrsto, **odobritev v vrsti** in »Pošlji zdaj« `SaopWrite` (skrbnik, urednik) — vse tri preveri servis `SupplierCandidateSaopService` (#7), stran brez pravice gumbe onemogoči in pokaže »Samo za branje«; ponovna preslikava vira `CatalogWrite`.\r\n- Predlagana kategorija ne sproži ničesar: uvrstitev naredi zajem XML, ko artikel po zajemu SAOP obstaja; SAOP s tem nima opravka.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Noben artikel ni šel v vrsto: … manjka …« | Manjka obvezno polje ERP. | Dopolni označena polja in ponovi. |\r\n| »Za pot v SAOP izberi artikle enega podjetja …« | Izbrani kandidati več podjetij. | Filtriraj po podjetju. |\r\n| Oznaka »SAOP zavrnil« z napako. | SAOP je dokument zavrnil. | Preberi napako v vrstici, popravi in ponovno uvrsti. |\r\n| »SAOP je dodelil šifro X, ki je PIM ni prevzel …« | Šifro že ima drug artikel v PIM. | Uskladi ročno (skrbnik). |\r\n| »Pošlji zdaj« ne pošlje, sporočilo o poverilnicah. | Na strežniku ni poverilnic SAOP. | Počakaj odhodno vrsto ali javi skrbniku. |\r\n| Kandidat ostaja »poslan« dolgo po pošiljanju. | Zajem SAOP ali naslednji zajem XML še ni tekel. | Preveri posla na `/sistem`. |\r\n| Rdeče »Kategorija dobavitelja nima preslikave«. | Za dobaviteljevo pot ni preslikave v nobenem drevesu. | »Preslikaj …« (vrzeli vira) ali Kakovost → Preslikave kategorij; ob naslednjem zajemu gre artikel v kategorijo. |\r\n| Gumbi »V SAOP …«, »Odobri v vrsti« sivi, zgoraj »Samo za branje«. | Tvoja vloga nima pravice `SaopWrite`. | Prosi urednika kataloga ali skrbnika. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/IngestCandidates.razor` (`/izdelki/novi-artikli`, `/zajem/novi-artikli`), okno `Components/Shared/ImportGapsDialog.razor`.\r\n- **Storitve / delavci:** `SupplierCandidateReadService.GetCandidatesAsync` / `GetCategoryPredictionsAsync` (#7, en SELECT za stran), `SupplierCandidateWriteService.RejectAsync`, `SupplierCandidateSaopService` (`PrepareAsync`, `QueueAsync`, `ApproveAsync`, `SendNowAsync` — vse z `SaopWrite`), `SaopItemWriteService.BuildPlan` / `GetSupplierCandidateStateAsync`, `SaopWriteService.EnqueueAsync`, `IntranetDataService.ApproveItemAsync` (`out.ApproveItemDocument`, klican samo prek `ApproveAsync`), `PIM.Outbound.SaopNewItemQueue`.\r\n- **Tabele in pogledi:** `map.SupplierProductCandidate` (PENDING, APPROVED, REJECTED), za uvrstitev `raw.Inbox` + `map.ExtractedValue` (`ProductCategory.SourceLevel1..3`), `map.CategoryPathMap`, `canon.CategoryPathTranslated`, `out.OutboxMessage`, `out.OutboundBatch`, `out.SaopItemAssignment`, `out.SaopAddDefault`, `out.SaopXmlField`; procedure `intranet.GetSupplierProductCandidates`, `out.GetSupplierCandidateSaopWriteState`, `map.RejectSupplierProductCandidate`.\r\n- **Migracije:** 219, 240, 241, 257 (ERP-first; datoteka nosi v glavi številko 256), 273 (samodejno zapiranje kandidata).\r\n- **Urniki:** `SUPPLIER_CATALOG_IMPORT`, `SAOP_OUTBOUND_DISPATCH`, `SAOP_PRODUCT_IMPORT`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ✅ (#7) Gumb »Odobri v vrsti (N)« je šel mimo varovalke; zdaj gre prek `SupplierCandidateSaopService.ApproveAsync` z `SaopWrite`.\r\n- ⚠️ Pot dobavitelja, ki je še na nobenem obstoječem artiklu, se v »Preslikave kategorij« (`map.SourceCategory`) pokaže šele, ko jo zajem vidi pri artiklu; do takrat jo najdeš v oknu »Vrzeli in ponovna preslikava«.\r\n- ⚠️ Stanje »V PIM« (APPROVED) in »Potrjeni v SAOP« nastaneta šele, ko po zajemu SAOP teče še **zajem XML**, ki kandidata poveže z artiklom (vsakih 6 ur). Do takrat kandidat kaže »poslan, čaka potrditev«, čeprav je artikel že v PIM.\r\n- ⚠️ Odločitveni dokument (`docs/ODLOCITEV_ERP_FIRST_NOVI_ARTIKLI.md`) predvideva ročni »Nov predlog« in stanja `DOPOLNITI_ERP`, `NEJASNO_UJEMANJE` …; v kodi ju ni — stanja so samo PENDING, APPROVED, REJECTED in izpeljano stanje SAOP.\r\n- ⚠️ Opis storitve `SupplierCandidateSaopService` še govori o »artiklu, ki ga je ustvaril PIM« (stara pot 241), stran in baza pa že delata po ERP-first (257).\r\n- ⚠️ Filter vira ima samo `NW_XML` in `BT_XML`; nov dobavitelj zahteva spremembo kode.\r\n\r\n## Povezani procesi\r\n\r\n- Na isti strani je zavihek **»Spremembe iz XML«** (`?pogled=spremembe`): kaj je XML spremenil pri **obstoječih** artiklih — glej [Dobaviteljski katalogi XML](dobaviteljski-katalogi-xml.md), korak »Pregled sprememb po šifri«.\r\n- [Dobaviteljski katalogi XML](dobaviteljski-katalogi-xml.md): kje kandidati nastanejo.\r\n- [Preslikava virov in ponovna obdelava](preslikava-virov-in-ponovna-obdelava.md): gumb »Vrzeli in ponovna preslikava …« na tej strani.\r\n- [Zajem iz SAOP](zajem-iz-saop.md): povratni zajem ustvari artikel.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odobritev in pošiljanje sporočil.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): nadaljnje urejanje nastalega artikla.\r\n"},{"pot":"02-vhodi/pregled-vhodov-in-virov.md","vsebina":"---\r\nid: pregled-vhodov-in-virov\r\nnaslov: Pregled vhodov, virov in tekov zajema\r\npodrocje: 02-vhodi\r\nstanje: delno\r\nbere: [pim.surovi-zajem, pim.urniki, pim.kandidati, pim.zaloge]\r\npise: []\r\nstrani: [/zajem, /zajem/viri/{SourceCode}, /zajem/teki, /zajem/teki/{RunId}, /sistem/teki, /sistem/teki/{RunId}]\r\nposli: [SAOP_PRODUCT_IMPORT, PRICE_IMPORT, STOCK_IMPORT, SUPPLIER_CATALOG_IMPORT, SUPPLIER_STOCK_IMPORT, NIGHTLY_RECONCILIATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Ingest.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestSourceDetail.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestRuns.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestRunDetail.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/IngestTabs.razor, PIM_Solution/src/PIM.Intranet/Services/PipelineReadService.cs, PIM_Solution/src/PIM.Intranet/Services/PimNavigation.cs]\r\nmigracije: [256, 276]\r\n---\r\n\r\n# Pregled vhodov, virov in tekov zajema\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** skrbnik PIM · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nNa enem mestu pokaže vse registrirane vhode vseh podjetij (SAOP API, dobaviteljev XML, zaloga, ročni uvoz): kaj beremo, od kod, kdaj nazadnje in s kakšnim izidom. Zadnji poskus je ločen od zadnjega uspeha, da neuspeh ne ostane skrit za starim zelenim stanjem. Iz pregleda se gre v podrobnosti vira in posameznega teka.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Preveri, ali so cene in zaloga sveže (stolpec »Zadnji uspeh«). |\r\n| Urednik kataloga | Preveri, ali je XML dobavitelja prišel; gre na »Novi artikli iz XML«. |\r\n| Skrbnik | Išče vir, ki »Zamuja« ali je »Neuspešno«; odpre tek in njegove napake. |\r\n| Avtomatika (PIM) | Posli zapisujejo teke, faze in stanje virov, ki jih stran prebere. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik odpre `/zajem` (prek neposredne povezave ali zavihka »Vhodi«), `/zajem/viri/{SourceCode}`, `/sistem/teki` (zavihek »Teki« na Nadzoru sistema).\r\n- **Po urniku:** stran nima posla; kaže izid poslov zajema.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Registrirani tokovi po podjetjih, teki, faze, strani zajema, kandidati, zavrnjena zaloga | PIM |\r\n| **Izhod** | Samo prikaz s povezavami | uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A[[Posli zajema]] --\u003e B[(Teki, faze, strani)]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    C([Odpre zajem]) --\u003e D[Filtrira podjetje, vir, vrsto, stanje]\r\n    D --\u003e E{Stanje vira?}\r\n    E -- \"V redu\" --\u003e F([Konec])\r\n    E -- \"Zamuja ali Neuspešno\" --\u003e G[Odpre vir]\r\n    G --\u003e H[Odpre zadnji tek]\r\n    H --\u003e I[Pregleda korake in napake]\r\n    E -- \"čaka ali karantena\" --\u003e J[Odpre čakalno vrsto ali težave]\r\n  end\r\n  B --\u003e D\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class C,F endp; class D,G,H,I,J user; class A,E auto; class B data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Kdorkoli | `/zajem` | Odpreš »Zajem podatkov«. | Preberejo se tokovi, povzetek in števci kandidatov. | Zgoraj kartice: »Tokovi v redu«, »Čaka«, »V karanteni«, »Nerazvrščene vrednosti«, »Zavrnjena zaloga«, »Tehnične težave«, »Novi artikli iz XML«, »Uvoženi, čakajo na SAOP«. |\r\n| 2 | Kdorkoli | `/zajem` | Izbereš »Podjetje«, »Vir«, »Vrsta vhoda« (SAOP API, Dobaviteljev XML, Zaloga, Ročni uvoz), »Stanje« (V redu, Zamuja, Neuspešno, V teku, Še brez teka), »Aktivnost«. | Filtri se uporabijo takoj. | »N vhodnih tokov«. |\r\n| 3 | Kdorkoli | `/zajem` | Klikneš kartico (npr. »Čaka« → `/zajem/cakalna-vrsta`, »Nerazvrščene vrednosti« → `/zajem/neujemanja`, »Tehnične težave« → `/zajem/tezave`, »Novi artikli iz XML« → `/izdelki/novi-artikli`). | — | Odpre se ustrezna stran. |\r\n| 4 | Skrbnik | `/zajem` → `/zajem/viri/{SourceCode}?podjetje=N` | Klikneš ime vira. | Pokaže operativno stanje (zadnji poskus, uspeh, neuspeh, naslednji zagon), količine (prejeto v 24 h, čaka, zavrnjeno, ali sme ustvarjati artikle), zadnjo napako, entitete s preslikavo in mejnikom, zadnjih 20 tekov. Če je vir pri več podjetjih, so nad tabelo zavihki podjetij. | Entitete imajo »Preslikava: Aktivna«; »Čaka« 0. |\r\n| 5 | Skrbnik | `/sistem/teki` | Filtriraš po iskanju, podjetju, viru, postopku, statusu in klikneš »Uporabi filtre«. | Zgodovina vseh tekov po 50 na stran. | Prebrano, uspešno, zavrnjeno, trajanje. |\r\n| 6 | Skrbnik | `/sistem/teki/{RunId}` | Klikneš začetek teka. | Pokaže identiteto teka, rezultat, korake obdelave, napake teka (povezava na težavo), zavrnjene pozicije zaloge in strani zajema. | Vzrok napake je viden; stran vodi na `/zajem/tezave/…`. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Stran samo bere; zagon posla je na `/sistem` (glej [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md)).\r\n- »Sme ustvarjati« je dovoljeno samo virom SAOP (257).\r\n- Privzeto so prikazana **vsa podjetja**, ker se delo enega podjetja pogosto ustavi zaradi vira, ki ga polni drugo.\r\n- Podrobnosti teka (tehnični del) so enake za vse vloge; tehnični predogled vhoda na težavi vidi samo skrbnik.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Pregleda vhodnih podatkov trenutno ni mogoče naložiti.« | Baza ne odgovori. | Osveži; če se ponavlja, javi skrbniku. |\r\n| »Vira X ni v nobenem podjetju — konektor ni registriran.« | Napačna šifra vira v naslovu ali vir ni v registru. | Odpri vir s seznama na `/zajem`. |\r\n| Stanje »Zamuja«. | Meja svežine prekoračena. | Odpri vir → zadnji tek; skrbnik preveri posel na `/sistem`. |\r\n| Entiteta »Preslikava: Manjka«. | Za to vrsto podatkov ni preslikave. | Skrbnik doda preslikavo (Pravila in izvor podatkov); strani čakajo. |\r\n| »Ta worker korakov ne zapisuje …« | Zalogovni tok ne piše korakov. | Uporabi rezultat teka in zavrnjene pozicije. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `Ingest.razor` (`/zajem`), `IngestSourceDetail.razor` (`/zajem/viri/{SourceCode}`), `IngestRuns.razor` (`/sistem/teki`, `/zajem/teki`), `IngestRunDetail.razor` (`/sistem/teki/{RunId}`, `/zajem/teki/{RunId}`), zavihki `Components/Shared/IngestTabs.razor` (Vhodi, Teki, Težave) in `NadzorTabs` v `PimTab.cs`.\r\n- **Storitve / delavci:** `PipelineReadService` (`GetInboundFlowsAsync`, `GetInboundOverviewSummaryAsync`, `GetInboundFilterOptionsAsync`, `GetSourceEntitiesAsync`, `GetInboundRunsAsync`, pogled teka), `SupplierCandidateReadService` (števci).\r\n- **Tabele in pogledi:** `map.SourceConnector`, `raw.Inbox`, `ops.PipelineRun`, koraki teka, `ops.JobSourceState()`, `stock.*` (zavrnjene pozicije).\r\n- **Migracije:** 256 (viri in svežina), 276 (meja svežine na strani posla).\r\n- **Urniki:** vsi posli zajema.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Meni »Zajem podatkov« je bil 2026-09-24 odstranjen (`PimNavigation.cs`): `/zajem` in podstrani niso več v meniju; dosegljive so samo z neposredno povezavo, z zavihkov na straneh zajema in s kartic na `/zajem`. Uporabnik jih težko najde.\r\n- ⚠️ Stran kaže dve različni meri: stare teke (`ops.PipelineRun`) in stanje virov iz novih faz (`/sistem`); lahko se ne ujemata.\r\n- ⚠️ Stran podrobnosti teka ima zavihek »Teki« iz zajema, seznam tekov pa zavihke Nadzora sistema — navigacija med njima ni enotna.\r\n\r\n## Povezani procesi\r\n\r\n- [Zajem iz SAOP](zajem-iz-saop.md) in [Dobaviteljski katalogi XML](dobaviteljski-katalogi-xml.md): viri, ki jih stran prikazuje.\r\n- [Čakalna vrsta zajema](cakalna-vrsta-zajema.md): kartica »Čaka«.\r\n- [Težave in neujemanja zajema](tezave-in-neujemanja-zajema.md): kartice »Tehnične težave«, »Zavrnjena zaloga«, »Nerazvrščene vrednosti«.\r\n- [Novi artikli dobaviteljev](novi-artikli-dobaviteljev.md): kartici kandidatov.\r\n- [Nadzor sistema](../09-administracija/nadzor-sistema.md): posli, faze, alarmi.\r\n- [Nadzorna plošča](../01-nadzor/nadzorna-plosca.md): skupni pregled.\r\n"},{"pot":"02-vhodi/preslikava-virov-in-ponovna-obdelava.md","vsebina":"---\r\nid: preslikava-virov-in-ponovna-obdelava\r\nnaslov: Preslikava atributov in kategorij virov ter ponovna obdelava vira\r\npodrocje: 02-vhodi\r\nstanje: delno\r\nbere: [pim.surovi-zajem, pim.pravila, pim.nastavitve, pim.kategorije]\r\npise: [pim.pravila, pim.nastavitve, pim.kategorije, pim.atributi, pim.kategorije-izdelka, pim.mediji, pim.besedila, pim.kandidati]\r\nstrani: [/zajem/atributi, /izdelki/novi-artikli]\r\nposli: [SUPPLIER_CATALOG_IMPORT, NIGHTLY_RECONCILIATION]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/IngestAttributes.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/ImportGapsDialog.razor, PIM_Solution/src/PIM.Intranet/Services/AttributeMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/CategoryMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/SupplierCandidateWriteService.cs, PIM_Solution/workers/PIM.KatalogWorker/Program.cs, PIM_Solution/workers/PIM.XmlFileWorker/Program.cs]\r\nmigracije: [121, 177, 240, 244]\r\n---\r\n\r\n# Preslikava atributov in kategorij virov ter ponovna obdelava vira\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nDobavitelj pošilja svoje atribute (npr. »Colour temperature«) in svoje poti kategorij. Da pridejo v PIM, mora vsak imeti cilj: **našo lastnost** oziroma **našo kategorijo**. Ta proces zapre take vrzeli (preslika ali ustvari nov atribut ali kategorijo) in nato isto, že zajeto datoteko vira še enkrat pošlje skozi preslikavo — brez ponovnega nalaganja. Tudi že obstoječi artikli tako dobijo manjkajoče vrednosti.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ni. |\r\n| Urednik kataloga | Na `/zajem/atributi` preslika atribute; v oknu vrzeli ustvari ali preslika kategorije in atribute; klikne »Ponovno preslikaj vir«. |\r\n| Skrbnik | Enako; po potrebi ponovna preslikava SAOP vira na strežniku. |\r\n| Avtomatika (PIM) | Ponovna preslikava obdela vse zajeme vira; nočna uskladitev pobere zaostanek. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:**\r\n  - `/zajem/atributi` — delovni seznam izvornih atributov (privzeto »Nepreslikano«).\r\n  - `/izdelki/novi-artikli` → gumb »Vrzeli in ponovna preslikava …« — okno z manjkajočimi kategorijami, atributi in drugimi napakami uvoza za izbrani vir (ali oba XML vira) in **vsa podjetja** s tem virom.\r\n- **Po urniku:** nova preslikava velja ob naslednjem zajemu vira (`SUPPLIER_CATALOG_IMPORT`) — a nespremenjena datoteka se ne zajame znova, zato je za obstoječe podatke potrebna ponovna preslikava. Nočna uskladitev preslika samo strani, ki so še »Pending«.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Izvorni atributi z vzorcem vrednosti in številom izdelkov, nepreslikane poti kategorij, že zajete surove strani vira | dobavitelj (XML) / PIM |\r\n| **Izhod** | Preslikava atributa (lastnost, jezik, ali je enota), nov atribut v registru, preslikava ali nova kategorija, ponovno preslikani artikli in kandidati | PIM |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Odpre atribute ali okno vrzeli]) --\u003e B{Vrzel}\r\n    B -- atribut --\u003e C[Preslikaj ali Ustvari atribut]\r\n    B -- kategorija --\u003e D[Ustvari in preslikaj ali Preslikaj]\r\n    C --\u003e E[Ponovno preslikaj vir]\r\n    D --\u003e E\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[(Preslikave in register)]\r\n    G[[Vse zajete strani vira znova skozi preslikavo]]\r\n    H[(Artikli dobijo atribute in kategorije)]\r\n    I[[Kategorija ročne uvrstitve ostane]]\r\n  end\r\n  C --\u003e F\r\n  D --\u003e F\r\n  E --\u003e G\r\n  F --\u003e G\r\n  G --\u003e H\r\n  G --\u003e I\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A endp; class C,D,E user; class B,G,I auto; class F,H data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n**A. Delovni seznam atributov (`/zajem/atributi`)**\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/zajem/atributi` | Izbereš »Vir«, »Stanje« (Nepreslikano, Preslikano, Ugasnjeno) in iščeš po imenu ali oznaki. | Seznam je razvrščen po številu izdelkov za atributom; prikazan je vzorec vrednosti. | »N atributov«. |\r\n| 2 | Urednik | isto | Klikneš »Preslikaj« (ali »Uredi«); v polju »Naša lastnost« izbereš lastnost ali vpišeš novo ime in klikneš »Ustvari nov atribut«; izbereš »Jezik vrednosti«; po potrebi »Vir nosi enoto te lastnosti, ne vrednosti«; klikneš »Shrani«. | Preslikava se zapiše s tvojim imenom. Izbirnik opozori na enako ali podobno ime, da se atribut ne podvoji. | »Preslikava je zapisana. Velja ob naslednji preslikavi vira za N izdelkov.« |\r\n| 3 | Urednik | isto | Napačno preslikavo izklopiš z »Ugasni preslikavo«. | Preslikava je ugasnjena, atribut gre v stanje »Ugasnjeno«. | Stanje v vrstici. |\r\n\r\n**B. Okno vrzeli in ponovna preslikava (`/izdelki/novi-artikli`)**\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/izdelki/novi-artikli` | Po želji izbereš vir, klikneš »Vrzeli in ponovna preslikava …«. | Okno poišče nepreslikane kategorije (do 100 po številu izdelkov) in atribute vira. | Razdelka »Manjkajoče kategorije«, »Manjkajoči atributi« ali »Ni odprtih vrzeli«. |\r\n| 2 | Urednik | okno | Pri kategoriji: »Ustvari / preslikaj« → vpišeš »Ime« in »Nadrejena kategorija« → »Ustvari in preslikaj«, ali izbereš obstoječo → »Preslikaj«. | Kategorija in preslikava poti se zapišeta. | Vrstica izgine; »Zaprtih vrzeli v tem oknu: N«. |\r\n| 3 | Urednik | okno | Pri atributu: »Ustvari »ime««, ali »Poveži z obstoječim …« → lastnost, jezik, enota → »Preslikaj«. | Atribut in preslikava se zapišeta. | Vrstica izgine. |\r\n| 4 | Urednik | okno | Klikneš »Ponovno preslikaj vir« in okna ne zapreš (traja lahko 10 min in več). | Za vsako podjetje z virom gredo vsi zajemi vira znova skozi preslikavo (atributi, dokumenti, kategorije). Ročna uvrstitev kategorije se ohrani. Števec pojavov kandidatov se ne poveča. | »Vir je šel znova skozi preslikavo …« in vrstice »N zajemov, M strani je šlo znova skozi preslikavo«. |\r\n| 5 | Urednik | kartica artikla | Odpreš artikel iz vira. | — | Ima nove lastnosti in kategorijo. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Preslikave so **po viru**, ne po podjetju: ena preslikava velja za vsa podjetja, ki berejo isti vir.\r\n- Ponovna preslikava ne nalaga datoteke znova in ne odobri kandidatov; ne ustvari artikla v PIM.\r\n- Ponovna preslikava je združevalna in varna za večkraten zagon; ročna uvrstitev kategorije ima prednost.\r\n- Kdo sme: preslikava in nov atribut `CatalogWrite` (skrbnik, urednik); stran `/zajem/atributi` samo vlogi ADMIN in CATALOG_EDITOR; ponovna preslikava vira `CatalogWrite`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Izberi našo lastnost.« | Polje »Naša lastnost« je prazno. | Izberi ali ustvari lastnost. |\r\n| Napaka iz baze pri »Shrani«. | Neznana lastnost, jezik ali izvorni atribut. | Preveri izbiro; lastnost uredi na `/nastavitve/atributi`. |\r\n| »Preslikava je končana, nekateri zajemi pa so padli …« | Napaka v enem od zajemov. | Preberi vrstice napak v oknu; javi skrbniku. |\r\n| Okno »Preslikujem vir …« traja zelo dolgo, drugi posli čakajo. | Veliko podjetje (IQLighting), vsi zajemi vira. | Poganjaj izven delovnega časa; okna ne zapiraj. |\r\n| Po preslikavi SAOP vira ni sprememb. | Okno velja samo za XML vire. | Skrbnik na strežniku zažene `--znova-preslikaj` ali počaka nočni zaostanek. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `IngestAttributes.razor` (`/zajem/atributi`, `[Authorize(Roles = \"ADMIN,CATALOG_EDITOR\")]`), okno `Components/Shared/ImportGapsDialog.razor` na `IngestCandidates.razor`.\r\n- **Storitve / delavci:** `AttributeMappingService` (`GetSourceAttributesAsync`, `SaveMapAsync` → `map.SaveAttributeMap`, `DeactivateMapAsync`, `CreateDefinitionAsync`), `CategoryMappingService` (`GetMappingsAsync`, `SaveMappingAsync` → `map.SaveCategoryPathMap`), `SupplierCandidateWriteService.ReprocessSourceAsync` → `map.ReprocessSupplierSource` (časovna meja 1800 s); workerji `--map-run`, `--znova-preslikaj`, `--preslikaj-zaostanek`.\r\n- **Tabele in pogledi:** preslikave atributov (`map.SaveAttributeMap`, `map.DeactivateAttributeMap`), register atributov, preslikave poti kategorij, `raw.Inbox`, `map.ExtractedValue`; jedro `map.ProcessRawInbox`, `map.ProcessAttributePairInbox`, `map.ProcessDocumentInbox`, `map.ResolveProductCategories`.\r\n- **Migracije:** 121 (delovni seznam izvornih atributov), 177 (nov atribut iz izbirnika), 240, 244 (`map.ReprocessSupplierSource`).\r\n- **Urniki:** `SUPPLIER_CATALOG_IMPORT`, `NIGHTLY_RECONCILIATION`.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Po zapisih prejšnjih sej ponovna preslikava podjetja 2 traja več kot 12 minut in medtem **blokira druge workerje**; okno teče v brskalniku in se prekine, če ga uporabnik zapre ali poteče seja.\r\n- ⚠️ `CategoryMappingService.SaveMappingAsync` nima preverjanja vloge, okno vrzeli pa je na strani, odprti vsem prijavljenim — preslikavo kategorije lahko zapiše tudi bralna vloga.\r\n- ⚠️ `/zajem/atributi` ne ponudi ponovne preslikave; sporočilo »Velja ob naslednji preslikavi vira« zavaja, ker se nespremenjena datoteka ne zajame znova — uporabnik mora iti na Novi artikli in odpreti okno vrzeli.\r\n- ⚠️ Okno vrzeli je samo za `NW_XML` in `BT_XML`; za SAOP vire in delovne zvezke ni gumba.\r\n\r\n## Povezani procesi\r\n\r\n- [Dobaviteljski katalogi XML](dobaviteljski-katalogi-xml.md): vir, ki ga preslikava obdela.\r\n- [Novi artikli dobaviteljev](novi-artikli-dobaviteljev.md): stran z oknom vrzeli.\r\n- [Čakalna vrsta zajema](cakalna-vrsta-zajema.md): strani, ki po preslikavi preidejo v »Processed«.\r\n- [Manjkajoče kategorije](../04-kakovost/manjkajoce-kategorije.md): preslikave kategorij na `/kakovost/kategorije`.\r\n- [Atributi in nabori](../08-upravljanje/atributi-in-nabori.md): šifrant lastnosti.\r\n- [Drevo kategorij](../08-upravljanje/drevo-kategorij.md): kam se ustvari nova kategorija.\r\n- [Pravila validacije, slovar, preslikave](../08-upravljanje/pravila-validacije-slovar-preslikave.md): slovar vrednosti.\r\n"},{"pot":"02-vhodi/tezave-in-neujemanja-zajema.md","vsebina":"---\r\nid: tezave-in-neujemanja-zajema\r\nnaslov: Težave in neujemanja zajema\r\npodrocje: 02-vhodi\r\nstanje: delno\r\nbere: [pim.surovi-zajem, pim.zaloge, pim.saop-vrsta, pim.urniki]\r\npise: []\r\nstrani: [/zajem/tezave, /zajem/tezave/{IssueKind}/{IssueId}, /zajem/neujemanja]\r\nposli: [SAOP_PRODUCT_IMPORT, SUPPLIER_CATALOG_IMPORT, SUPPLIER_STOCK_IMPORT, STOCK_IMPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/IngestIssues.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestIssueDetail.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/IngestUnmapped.razor, PIM_Solution/src/PIM.Intranet/Services/PipelineReadService.cs]\r\nmigracije: []\r\n---\r\n\r\n# Težave in neujemanja zajema\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** skrbnik PIM (težave), urednik kataloga (neujemanja) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nEn delovni seznam vseh tehničnih težav zajema — strani v karanteni ali zastale v čakalni vrsti, zavrnjena zaloga, mrtva pisma in sistemske napake — združen po viru in vzroku (ne tisočkrat ista vrstica). Poleg tega seznam **neujemanj**: vrednosti iz virov, ki jih preslikava ni znala razvrstiti (npr. neznana enota ali barva), združene po vrednosti in pogostosti.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ni. |\r\n| Urednik kataloga | Pregleda neujemanja in doda vrednost v slovar ali preslikavo. |\r\n| Skrbnik | Pregleda težave, odpre tek in tehnične podrobnosti; odpravi vzrok (preslikava, poverilnice, vir). |\r\n| Avtomatika (PIM) | Workerji in preslikava beležijo napake, karanteno, zavrnjene pozicije in neznane vrednosti. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** odpreš `/zajem/tezave` (zavihek »Težave« ali kartice »V karanteni«, »Zavrnjena zaloga«, »Tehnične težave« na `/zajem`) oziroma `/zajem/neujemanja` (kartica »Nerazvrščene vrednosti«).\r\n- **Po urniku:** težave nastajajo med posli zajema.\r\n- **Ob dogodku:** vsaka napaka ali neznana vrednost ob zajemu.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Karantena in čakajoče strani, zavrnjene pozicije zaloge, mrtva pisma, sistemske napake (7 dni), neznane vrednosti preslikave | PIM |\r\n| **Izhod** | Prikaz; popravek se naredi drugje (slovar, preslikave, nastavitve vira) | uporabnik |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Zajem]) --\u003e B{Kaj se zgodi?}\r\n    B -- \"napaka ali karantena\" --\u003e C[(Težava)]\r\n    B -- \"neznana vrednost\" --\u003e D[(Neujemanje)]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    E[Pregleda težave] --\u003e F[Odpre podrobnosti in tek]\r\n    F --\u003e G[Odpravi vzrok pri viru ali preslikavi]\r\n    H[Pregleda neujemanja] --\u003e I[Doda v slovar ali preslikavo]\r\n    I --\u003e J[Ponovna preslikava vira]\r\n  end\r\n  C --\u003e E\r\n  D --\u003e H\r\n  G --\u003e J\r\n  J --\u003e A\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A endp; class E,F,G,H,I,J user; class B auto; class C,D data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Skrbnik | `/zajem/tezave` | Vpišeš iskanje (vir, razlog, podjetje), izbereš »Podjetje«, »Vir«, »Vrsta težave« (Čakalna vrsta in karantena, Zavrnjena zaloga, Mrtva pisma, Sistemske napake) in klikneš »Uporabi filtre«. | Prebere se do 50 skupin težav na stran. | »N skupin težav«; stolpci resnost, težava, podjetje, vir, ponovitev, prvič, nazadnje. |\r\n| 2 | Skrbnik | isto | Klikneš naslov težave. | Odpre se `/zajem/tezave/{vrsta}/{id}`: »Kaj se je zgodilo« (vzrok z besedami, vrsta, stanje, koda, vir, entiteta) in »Kontekst« (podjetje, prvič, nazadnje, tek). Skrbnik vidi še »Tehnične podrobnosti za administratorja« z omejenim predogledom vhoda (do 20.000 znakov). | Vzrok je razumljiv. |\r\n| 3 | Skrbnik | isto | Klikneš »Odpri tek«. | Odpre se `/sistem/teki/{RunId}` s koraki in napakami. | Vidiš, v katerem koraku je padlo. |\r\n| 4 | Skrbnik | drugje | Odpraviš vzrok: preslikava (Pravila in izvor podatkov), poverilnice ali naslov prevzema, dobavitelj. | Naslednji zajem ali ponovna preslikava obdela strani. | Število ponovitev se ne povečuje več; »Nazadnje« ostane star. |\r\n| 5 | Urednik | `/zajem/neujemanja` | Pregledaš ciljno polje, vrednost iz vira, razlog, pojavitve (do 300 najpogostejših). | — | Vidiš, katere vrednosti manjkajo v slovarju. |\r\n| 6 | Urednik | `/pravila/slovar` | Dodaš vrednost v slovar ali preslikavo. | Velja ob naslednji preslikavi. | Po ponovni preslikavi vrednost izgine s seznama. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Strani samo berejo; nič se ne da »razrešiti« neposredno na njih.\r\n- Ne-skrbnik vidi podrobnosti težave samo za izbrano podjetje in brez tehničnega predogleda; skrbnik vidi vsa podjetja in predogled. Poverilnice se v predogled nikoli ne berejo.\r\n- Ponavljajoči vzroki so združeni (en vzrok = ena vrstica s številom ponovitev).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Veliko »Zavrnjena zaloga«. | Šifre v datoteki zaloge nimajo artikla v podjetju ali pravilo identitete ne ujame. | Skrbnik preveri pravilo identitete zaloge; artikli, ki jih podjetje nima, so pričakovani. |\r\n| »Mrtva pisma«. | Sporočilo za SAOP je po vseh poskusih obupalo. | Glej Izhod v SAOP; popravi in ponovno pošlji. |\r\n| »Sistemske napake« s kodo. | Napaka workerja ali baze. | Odpri tek, preberi napako; javi razvoju, če ni jasna. |\r\n| »Težava ne obstaja ali ni več dostopna.« | Drugo podjetje (ne-skrbnik) ali je bila zapis očiščen. | Zamenjaj podjetje ali prosi skrbnika. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `IngestIssues.razor` (`/zajem/tezave`, parameter `?vrsta=INBOX|STOCK|DEADLETTER|ERROR`), `IngestIssueDetail.razor`, `IngestUnmapped.razor` (`/zajem/neujemanja`).\r\n- **Storitve / delavci:** `PipelineReadService.GetInboundIssuesAsync`, `GetInboundIssueDetailAsync`, `GetUnmappedValuesAsync`.\r\n- **Tabele in pogledi:** `raw.Inbox` (karantena), zavrnjene pozicije zaloge, `out.OutboxMessage` (Dead), dnevnik napak, tabela nerazvrščenih vrednosti preslikave.\r\n- **Migracije:** ni posebne.\r\n- **Urniki:** vsi posli zajema.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Na `/zajem/tezave` ni nobenega dejanja (potrdi, razreši, ponovi) — težava izgine šele, ko je vzrok odpravljen in pretečejo dnevi okna. Uporabnik ne ve, ali je težavo že kdo pregledal.\r\n- ⚠️ `/zajem/neujemanja` kaže samo izbrano podjetje in nima povezave na slovar; urednik mora sam vedeti, kam iti.\r\n- ⚠️ Mrtva pisma odhodne vrste za SAOP so pomešana med težave zajema (vhod), čeprav gre za izhod.\r\n- ⚠️ Resnost in stanja so deloma v angleščini (Pending, Quarantined, Dead).\r\n\r\n## Povezani procesi\r\n\r\n- [Pregled vhodov in virov](pregled-vhodov-in-virov.md): kartice, ki vodijo sem.\r\n- [Čakalna vrsta zajema](cakalna-vrsta-zajema.md): strani, ki čakajo preslikavo.\r\n- [Preslikava virov in ponovna obdelava](preslikava-virov-in-ponovna-obdelava.md): kako se po popravku podatki obdelajo znova.\r\n- [Karantena](../04-kakovost/karantena.md): zapisi, ki jih obdelava ni prevzela.\r\n- [Pravila validacije, slovar, preslikave](../08-upravljanje/pravila-validacije-slovar-preslikave.md): kje dodaš vrednost v slovar.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): mrtva pisma.\r\n"},{"pot":"02-vhodi/zajem-iz-saop.md","vsebina":"---\r\nid: zajem-iz-saop\r\nnaslov: Zajem artiklov, cen in zaloge iz SAOP\r\npodrocje: 02-vhodi\r\nstanje: deluje\r\nbere: [saop.artikli, saop.cene, saop.zaloge, saop.narocila, pim.saop-vrsta, pim.pravila]\r\npise: [pim.surovi-zajem, pim.izdelek, pim.atributi, pim.besedila, pim.prevodi, pim.cene, pim.zaloge, pim.narocila, pim.urniki]\r\nstrani: [/zajem, /zajem/viri/{SourceCode}, /sistem, /sistem/teki]\r\nposli: [SAOP_PRODUCT_IMPORT, PRICE_IMPORT, STOCK_IMPORT, SAOP_ORDER_IMPORT, SAOP_DELIVERY_IMPORT, NIGHTLY_RECONCILIATION, PRODUCT_VALIDATION]\r\nkoda: [PIM_Solution/workers/PIM.KatalogWorker/*.cs, PIM_Solution/workers/PIM.SaopStockWorker/*.cs, PIM_Solution/workers/PIM.SaopOrdersWorker/*.cs, PIM_Solution/src/PIM.XmlMapping/*.cs, PIM_Solution/src/PIM.Automation/JobCatalog.cs, PIM_Solution/src/PIM.Automation/AutomationEngine.cs]\r\nmigracije: [199, 240, 246, 256, 257, 260, 261, 264, 273, 276, 284]\r\n---\r\n\r\n# Zajem artiklov, cen in zaloge iz SAOP\r\n\r\n\u003e **Področje:** Vhodi · **Lastnik:** skrbnik PIM · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nSAOP je vir resnice za šifrant artiklov. PIM iz njega samodejno bere artikle (osnovna polja, opise, nazive po jezikih, lastnosti, planske in zalogovne podatke), cene, zalogo, naročila in datume dobave ter jih zapiše v katalog PIM. **Samo zajem iz SAOP sme ustvariti nov artikel v PIM.**\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Artikel in cene ureja v SAOP; v PIM jih vidi po naslednjem zajemu. |\r\n| Urednik kataloga | Preveri, da je nov artikel iz SAOP prišel v PIM; dopolni spletne podatke. |\r\n| Skrbnik | Spremlja posle na `/sistem`, po potrebi klikne »Poženi zdaj«; ureja mejo svežine vira; izključi podjetje iz avtomatike. |\r\n| Avtomatika (PIM) | Posli kličejo SAOP po urniku, podatke shranijo surovo, preslikajo v katalog in premaknejo mejnik; uspešen zajem artiklov sproži validacijo. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** skrbnik na `/sistem` pri poslu klikne »Poženi zdaj« → »Potrdi zagon«. Ročna zahteva ima v pasu SAOP prednost pred rednimi posli.\r\n- **Po urniku:**\r\n\r\n| Posel | Kaj prebere | Pogostost |\r\n|---|---|---|\r\n| `SAOP_PRODUCT_IMPORT` | 8 točk za artikle (`GetItemsGeneralData`, `GetItemsDescriptions`, `GetItemsTitlesLanguage`, `GetItemsCustomProperties`, `GetItemsPlanningData`, `GetItemsStockData`, `GetItemsStockAccountingData`, `GetItemCustomerDataV2`) | vsako uro |\r\n| `PRICE_IMPORT` | spremembe cen (`GetPrices`) | vsakih 10 min |\r\n| `STOCK_IMPORT` | količine zaloge | vsakih 10 min |\r\n| `SAOP_ORDER_IMPORT` | naročila kupcev (VNK) in dobaviteljem (VND): od največje znane številke naprej (`GetOrder`/`GetPurchaseOrder` po leto/knjiga/številka), odprta enkrat na dan znova; zgodovina enkrat z `--zgodovina-od` | vsako uro |\r\n| `SAOP_DELIVERY_IMPORT` | datumi in količine prihoda | privzeto izklopljen, ročno |\r\n| `NIGHTLY_RECONCILIATION` | poln kontrolni pregled (šifranti, SAOP katalog, dobave …), nato validacija in objava | vsak dan ob 00:30 |\r\n\r\n- **Ob dogodku:** uspešen `SAOP_PRODUCT_IMPORT` sproži `PRODUCT_VALIDATION`; uspešen `STOCK_IMPORT` sproži izvoz cen in zaloge za splet (če je vklopljen).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Artikli, opisi, nazivi, lastnosti, planski in zalogovni podatki, cene, zaloga, naročila, dobave | SAOP (API, samo v načinu `Live`) |\r\n| **Izhod** | Surove strani zajema, kanonični artikli (tudi novi), atributi, besedila, cene, zaloga, mejnik, faze teka | PIM |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph S[\"🏢 SAOP\"]\r\n    A[(Artikli, cene, zaloga)]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    B([Posel po urniku]) --\u003e C{Pas SAOP prost?}\r\n    C -- ne --\u003e D\u003eČaka tišino 2 min]\r\n    D --\u003e C\r\n    C -- da --\u003e E[[Prenos po podjetjih]]\r\n    E --\u003e F[(Surove strani)]\r\n    F --\u003e G[[Preslikava v katalog]]\r\n    G --\u003e H{Polje čaka pošiljanje v SAOP?}\r\n    H -- da --\u003e I[[Ohrani vrednost iz PIM]]\r\n    H -- ne --\u003e J[[Zapiše vrednost iz SAOP]]\r\n    J --\u003e K[[Premakne mejnik]]\r\n    I --\u003e K\r\n    K --\u003e L[[Sproži validacijo]]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    M[Poženi zdaj na nadzoru] --\u003e C\r\n  end\r\n  A --\u003e E\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class B endp; class M user; class C,E,G,H,I,J,K,L auto; class D wait; class A,F data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Komerciala | SAOP | Ustvariš ali spremeniš artikel oziroma ceno. | — | — |\r\n| 2 | Avtomatika | — | — | Posel počaka, da je pas SAOP prost (samo en SAOP posel naenkrat, 2 min tišine vmes), nato za vsako vključeno podjetje posebej kliče SAOP. Padec enega podjetja ne ustavi drugih. | Na `/sistem` ima posel zeleno fazo PRENOS. |\r\n| 3 | Avtomatika | — | — | Odgovori se shranijo kot surove strani; preslikava jih zapiše v katalog. Nov artikel iz SAOP se ustvari v PIM (samo SAOP vir to sme). Polja, ki imajo v vrsti za SAOP še neposlano spremembo iz PIM, ostanejo, kot jih je zapisal PIM. | Faza PRESLIKAVA zelena; na `/zajem/viri/{SourceCode}` »Obdelano« raste, »Čaka« je 0. |\r\n| 4 | Avtomatika | — | — | Mejnik (do kdaj je prebrano) se premakne šele, ko je podatek v katalogu. | Faza MEJNIK; naslednji zajem bere samo spremembe od mejnika. |\r\n| 5 | Avtomatika | — | — | Uspešen zajem artiklov sproži validacijo in nato objavo. | `/nadzorna-plosca` števci se osvežijo. |\r\n| 6 | Urednik | `/izdelki` | Poiščeš artikel po šifri. | — | Artikel ima nove vrednosti iz SAOP. |\r\n| 7 | Skrbnik (po potrebi) | `/sistem` | Pri poslu »Artikli iz SAOP« klikneš »Poženi zdaj« → »Potrdi zagon«. | Zahteva ima prednost v pasu SAOP; če SAOP ravno uporablja drug posel, stran napiše »čaka …«. | Stanje posla »v teku«, nato zeleno. |\r\n| 8 | Skrbnik | `/zajem`, `/zajem/viri/{SourceCode}` | Pregledaš stanje vira (zadnji poskus, zadnji uspeh, naslednji zagon, čaka, zavrnjeno). | — | Stanje »V redu«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Samo SAOP ustvarja artikle** (`CanCreateProducts` dovoljen le konektorjem SAOP; baza to ščiti s pravilom od 257). XML, Excel, zaloga in cene samo dopolnjujejo obstoječe.\r\n- **Neposlana sprememba iz PIM ima prednost** pred zajemom (273): dokler sporočilo za isto polje čaka odobritev, pošiljanje ali ponovni poskus, zajem polja ne povozi. Ko je poslano, zajem spet prinese vrednost iz SAOP (tako se preveri, ali je SAOP spremembo sprejel).\r\n- V SAOP se v tem procesu nič ne piše — zajem samo bere.\r\n- Posli, ki kličejo SAOP, nikoli ne tečejo hkrati; med njimi je 2 min tišine (zahteva ekipe SAOP 2026-09-22).\r\n- Živ klic na SAOP se izvede samo v načinu `PIM_SAOP_MODE=Live`; sicer worker samo izpiše, kaj bi poklical.\r\n- Svežina: vir »zamuja«, ko je zadnji uspešen stik starejši od meje (artikli 2 h, cene 30 min, zaloga 30 min — po novih podatkih). Mejo lahko skrbnik spremeni na strani posla (276).\r\n- Podjetje, izključeno iz avtomatike, se ne bere.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Nov artikel iz SAOP ni v PIM. | Zajem še ni tekel (vsako uro) ali je padel za to podjetje. | Na `/sistem` preveri »Artikli iz SAOP«; po potrebi »Poženi zdaj«. |\r\n| Vrednost v PIM je drugačna kot v SAOP. | V vrsti za SAOP čaka neposlana sprememba za to polje (PIM ima prednost). | Odobri ali prekliči sporočilo v Izhodu v SAOP. |\r\n| Vir na `/zajem` »Zamuja« ali alarm »SourceStale«. | SAOP ne odgovarja, poverilnice, posel izklopljen ali pas SAOP zaseden. | Skrbnik: `/sistem` → posel → faze in izpis. |\r\n| »Čaka« na viru raste. | Preslikava ni obdelala strani (manjka preslikava entitete ali je padla). | Glej [Čakalna vrsta zajema](cakalna-vrsta-zajema.md). |\r\n| Posel »čaka na tišino SAOP«. | Drug SAOP posel je ravno končal ali teče. | Počakaj; ročna zahteva gre naprej prva. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `/zajem`, `/zajem/viri/{SourceCode}` (`Ingest.razor`, `IngestSourceDetail.razor`), upravljanje poslov na `/sistem` in `/sistem/posel/{JobKey}` (`Monitor.razor`, `MonitorJob.razor`).\r\n- **Storitve / delavci:** `PIM.KatalogWorker` (`SaopIngestRunner`, `SaopApiClient`, `SaopEndpoints`, `OrganizationLoop`, `RawInboxWriter`; stikala `--map-run`, `--znova-preslikaj`, `--preslikaj-zaostanek`, `--only-ingest`), `PIM.SaopStockWorker` (zaloga in dobave), `PIM.SaopOrdersWorker` (naročila); preslikava `PIM.XmlMapping` (`SqlMappingPipeline`, `MappingPhaseReport`); gostitelj `PIM.Automation` (`JobCatalog`, `AutomationEngine`, pas SAOP `SaopQuietSeconds = 120`).\r\n- **Tabele in pogledi:** `raw.Inbox`, `map.ExtractedValue`, `map.SourceConnector`, `map.EntityMapping`, `canon.Product` in podrejene, mejniki; faze `ops.JobPhaseRun`, viri `ops.JobSource` / `ops.JobSourceState()`; procedura `map.ProcessRawInbox`.\r\n- **Migracije:** 240 (jedro preslikave), 246 (en motor avtomatike), 256 (viri in svežina), 257 (samo SAOP ustvarja), 260/261 (zamuda, premor SAOP), 264 (DEMO neaktiven), 273 (PIM ima prednost pred zajemom), 276 (meja svežine na strani).\r\n- **Urniki:** glej tabelo v razdelku 3 (`JobCatalog.All`).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Cene se berejo samo kot **spremembe** v oknu `Saop:LookbackDays`; cena, spremenjena pred tem oknom in zgrešena, pride šele z nočno uskladitvijo.\r\n- ⚠️ Šifranti in poln zajem tečejo samo v nočni uskladitvi (00:30); nova vrednost šifranta v SAOP je v PIM vidna šele naslednji dan.\r\n- ⚠️ Po zapisih prejšnjih sej tečejo na razvojnem računalniku in PRD hkrati trije razporejevalniki proti živemu SAOP (Windows opravila, razporejevalnik v IIS, gostitelj avtomatike); iz kode ni mogoče preveriti, kateri je zdaj edini aktiven.\r\n- ⚠️ `SAOP_DELIVERY_IMPORT` je privzeto izklopljen; datume dobave prinese samo nočna uskladitev (≈50 min za IQLighting).\r\n\r\n## Povezani procesi\r\n\r\n- [Pregled vhodov in virov](pregled-vhodov-in-virov.md): kje vidiš stanje zajema.\r\n- [Čakalna vrsta zajema](cakalna-vrsta-zajema.md): strani, ki čakajo preslikavo.\r\n- [Težave in neujemanja zajema](tezave-in-neujemanja-zajema.md): napake in nerazvrščene vrednosti.\r\n- [Novi artikli dobaviteljev](novi-artikli-dobaviteljev.md): artikel, poslan v SAOP, se v PIM ustvari s tem zajemom.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): sproži se po zajemu.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): neposlane spremembe, ki imajo prednost pred zajemom.\r\n- [Zaloge in rezervacija](../07-poslovanje/zaloge-in-rezervacija.md): uporaba prebrane zaloge.\r\n- [Cene in ceniki](../07-poslovanje/cene-in-ceniki.md): uporaba prebranih cen.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posli, pas SAOP, ročni zagon.\r\n"},{"pot":"03-izdelki/iskanje-in-kartica-izdelka.md","vsebina":"---\r\nid: iskanje-in-kartica-izdelka\r\nnaslov: Iskanje izdelka, urejanje na kartici in paketno na seznamu\r\npodrocje: 03-izdelki\r\nstanje: deluje\r\nbere: [pim.izdelek, pim.besedila, pim.atributi, pim.prevodi, pim.kategorije-izdelka, pim.mediji, pim.cene, pim.zaloge, pim.popusti, pim.odprodaja, pim.validacija, pim.saop-vrsta, pim.nastavitve, pim.surovi-zajem]\r\npise: [pim.izdelek, pim.besedila, pim.atributi, pim.kategorije-izdelka, pim.odprodaja, pim.validacija, pim.saop-vrsta, pim.zgodovina-uvozov]\r\nstrani: [/izdelki, /izdelki/{ProductId}]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Products.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCard.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCard/*, PIM_Solution/src/PIM.Intranet/Services/ProductWorkbenchService.cs, PIM_Solution/src/PIM.Intranet/Services/ProductEditService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/CategoryMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/CategoryTreeService.cs, PIM_Solution/src/PIM.Intranet/Services/WebWithdrawalService.cs, PIM_Solution/src/PIM.Intranet/Services/AiTextService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopEndpointSnapshotService.cs, PIM_Solution/src/PIM.Intranet/Services/PimAuthorization.cs, PIM_Solution/src/PIM.Intranet/Components/Shared/PimTab.cs, PIM_Solution/src/PIM.Intranet/Services/ProductBulkEdit.cs, PIM_Solution/src/PIM.Intranet/Components/Shared/PimBulkBar.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/PimRowSelection.cs]\r\nmigracije: [101, 108, 109, 182, 186, 233, 239, 242, 249, 251, 273, 298, 300, 302, 306]\r\n---\r\n\r\n# Iskanje izdelka, urejanje na kartici in paketno na seznamu\r\n\r\n\u003e **Področje:** Izdelki · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-28, v brskalniku (razvojna baza)\r\n\r\n## 1. Namen\r\n\r\nNajti izdelek (ali skupino izdelkov) po šifri, EAN in filtrih ter na kartici izdelka pregledati in popraviti njegove podatke — ali pa isto polje popraviti **paketno** za več izdelkov naenkrat na seznamu (izbrane vrstice ali vse, ki ustrezajo filtru). Rezultat je popravljen izdelek v PIM: spletna besedila in atributi veljajo takoj, polja SAOP veljajo v PIM takoj, v SAOP pa gredo šele po odobritvi.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Išče in pregleduje izdelke, na seznamu nastavlja S-popuste; kartice ne more urejati (samo branje). |\r\n| Urednik kataloga | Ureja kartico: spletna besedila, atribute, polja SAOP, spletišča, oznake, odprodajo. Na seznamu paketno nastavi polje PIM za več izdelkov. |\r\n| Skrbnik | Vse kot urednik; poleg tega potrdi, da artikel nima EAN, proizvajalca ali dobavitelja. |\r\n| Avtomatika (PIM) | Po shranjevanju ponovno validira izdelek, uvrsti polja SAOP v odhodno vrsto in po potrebi sam odkljuka spletišče (samodejni umik s spleta). |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik ali komercialist išče izdelek na `/izdelki` in odpre kartico `/izdelki/{ProductId}`; povezave na kartico so tudi na straneh Mediji, Odprodaja, Kakovost ipd.\r\n- **Po urniku:** ni (kartica samo bere, kar so pripravili zajem in validacija).\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifra, EAN ali filtri; ročni popravki polj | Uporabnik |\r\n| **Vhod** | Podatki izdelka (ERP polja, besedila, atributi, kategorije, mediji, cene, zaloga, težave) | PIM (zajem iz SAOP in dobaviteljev) |\r\n| **Izhod** | Spletna besedila, atributi, kljukice spletišč, oznake, odprodaja | PIM, takoj |\r\n| **Izhod** | Polja SAOP (npr. EAN, dobavitelj, aktivnost, teže, pakiranje) | PIM takoj + odhodna vrsta za SAOP (čaka odobritev) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Iskanje na seznamu Izdelki]) --\u003e B[Filtri in iskanje po šifri ali EAN]\r\n    B --\u003e C[Odpre kartico izdelka]\r\n    C --\u003e D[Popravi polja in klikne Shrani spremembe]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    E{Kdo je lastnik polja?}\r\n    F[[Besedila in atributi zapisani takoj]]\r\n    G[[Polje SAOP zapisano v PIM takoj]]\r\n    H[[Ponovna validacija in morebiten umik s spleta]]\r\n    I\u003eSprememba čaka odobritev v odhodni vrsti]\r\n    Z([Kartica osvežena])\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    J[(Artikel v ERP)]\r\n  end\r\n  D --\u003e E\r\n  E -- PIM --\u003e F --\u003e H --\u003e Z\r\n  E -- SAOP --\u003e G --\u003e I\r\n  G --\u003e Z\r\n  I -- po odobritvi --\u003e J\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,Z endp; class B,C,D user; class E,F,G,H auto; class I wait; class J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik / komerciala | `/izdelki` | V polje »Išči po šifri artikla ali EAN …« vpišeš šifro ali EAN in pritisneš Enter. | Seznam se zoži; filtri so v naslovu strani, zato povezavo lahko deliš. | Desno od iskanja piše število rezultatov. |\r\n| 2 | Urednik / komerciala | `/izdelki` | Po potrebi odpreš **Filtri** (podjetje, napaka, proizvajalec, dobavitelj, skupina, kategorija, slika, ABC, pripravljenost za ERP/splet, aktivnost, zastavica za splet, popolnost, S-popust, rabatna skupina, posebni S) in klikneš **Uporabi filtre**. | Privzeto so prikazana vsa podjetja. Aktivni filtri se pokažejo kot čipi nad tabelo. | Čipi filtrov; napis tabele pove obseg (»Izdelki podjetja …« ali »vseh podjetij«). |\r\n| 3 | Urednik / komerciala | `/izdelki` | Klikneš vrstico izdelka. | Odpre se kartica `/izdelki/{ProductId}` (zavihek Pregled). | Naslov kartice je naziv, podnaslov podjetje, šifra in EAN. |\r\n| 4 | Urednik | Kartica, zavihek **Pregled** | Pogledaš stanje treh kanalov (ERP, Komerciala, Splet) in **Odprte naloge**. | Kartica pokaže blokirajoče napake za ERP in splet ter opozorila komerciale. | Rdeča pasica »… napak blokira ERP« z gumbom **Odpri kakovost**. |\r\n| 5 | Urednik | Kartica, zavihek **ERP** | Popraviš katerokoli polje (EAN, davčna stopnja, dobavitelj, teže, dolžina/širina/višina, prostornina, pakiranje, ERP nazivi in opisi …). Ob vsakem polju je značka, kam gre sprememba: **PIM + SAOP** (v PIM takoj, v SAOP po odobritvi), **PIM** (velja takoj) ali **samo PIM** (podatek iz SAOP, ki ga SAOP od PIM ne sprejme — zajem ga lahko prepiše). Pot izbere kartica sama iz registra, ne uporabnik. | Polje dobi osnutek (poudarjen levi rob, »Spremenjeno, še ni shranjeno«); zgoraj piše »N gre v odobritev SAOP«. | Povzetek na vrhu zavihka: kaj je prazno in ustavi objavo, kaj je priporočeno, kaj čaka SAOP, česa nisi shranil — z imeni polj. |\r\n| 6 | Urednik | Kartica, zavihek **Splet** | Popraviš spletni naziv, spletni opis ali atribut; po želji klikneš **Predlagaj naziv in opis (AI)** v izbranem jeziku. Atribut, ki ga izdelek še nima, dodaš v razdelku **Dodaj atribut** (izbirnik iz šifranta, oznaka »nabor« pove, ali gre na splet) → **Dodaj na kartico**, vpišeš vrednost. | AI predlog in dodani atribut gresta samo v osnutek, v bazo ne. Atribut, ki ga SAOP sprejme (Garancija), gre po poti PIM + SAOP tudi s tega zavihka. | Polje je označeno kot spremenjeno; »N velja takoj«. Po shranjevanju je atribut med »Atributi« in ostane urejljiv; prazna vrednost ga izbriše. |\r\n| 6a | Urednik | Kartica, zavihek **Splet → Kategorije po spletnih straneh** | Pri spletišču klikneš **Spremeni**, izbereš kategorijo v izbirniku, **Dodaj na seznam** (ali **Odstrani**), **Shrani kategorije**; **Vrni pod vir** odstrani ročno izbiro. | Isti postopek kot na strani Uvrstitev izdelka ([Kategorije izdelka](kategorije-izdelka.md)): ročna izbira, zgodovina, ponovna validacija; kartica se naloži znova, ker se s kategorijo spremeni nabor atributov. | Pri spletišču piše »ročno«, kdo in kdaj; zgoraj sporočilo, da so kategorije shranjene. |\r\n| 7 | Urednik | Kartica, zgoraj desno | Klikneš **Shrani spremembe** (ali **Prekliči** za zavrnitev osnutkov). | Besedila in atributi se zapišejo takoj; polja SAOP se zapišejo v PIM in uvrstijo v odhodno vrsto (vir »CARD«); izdelek se ponovno validira. | Sporočilo npr. »3 besedil shranjenih — velja takoj · 1 polj velja v PIM takoj; v SAOP gre zadnja vrednost po odobritvi na Izhod v SAOP (skupina …)«. |\r\n| 8 | Urednik | Kartica, **Splet → Spletišča** | Obkljukaš ali odkljukaš spletišče in klikneš **Shrani spletišča**. | Kljukica določa, kam gre izdelek in kateri spletni profil ga validira. Kljukica, ki je PIM ne dovoli (npr. ni kategorije), se ne shrani. | Sporočilo »Shranjeno. Izdelek gre na N spletišč(a)« ali razlog zavrnitve. |\r\n| 9 | Urednik | Kartica, **Splet → Objava za splet (katalog.csv)** | Klikneš **Preveri zdaj**. | Validacija tega izdelka se požene znova; v SAOP se nič ne pošlje in CSV se ne izdela. | Tabela po spletiščih pove, ali gre izdelek v stolpec »Spletne strani« in zakaj ne. |\r\n| 10 | Urednik | Kartica, **Splet → Oznake** | Označiš npr. »Razstavni eksponat« ali »Pakirno naročanje« in klikneš **Shrani oznake**. | Oznaka se zapiše v PIM z zgodovino (`pim.ProductFieldHistory`, polje `ProductFlag.\u003ckoda\u003e`). Pri »Pakirnem naročanju« brez objavljenega Pakiranja 2 (večjega od 1) dobi artikel takoj zadržek za splet (302). | »Oznake shranjene. Ob naslednjem izvozu gre v katalog.csv »Pakirno naročanje« = 1« (ali 0) oziroma opozorilo, da je artikel zadržan s spleta in zakaj (Pakiranje 2 manjka ali je vpisano, a še ni objavljeno v PIM). V razdelku Objava za splet vrstica »Zadržek« pove kanal, ali je ročni (kdo) ali samodejni (pravilo), in razlog. |\r\n| 11 | Skrbnik | Kartica, **ERP**, pri napaki EAN/proizvajalec/dobavitelj | Klikneš »… — potrdi«. | Potrditev skrbnika se zapiše, izdelek se takoj ponovno validira. | Napaka izgine, potrditev je vidna pod »Potrditve skrbnika«. |\r\n| 12 | Urednik | Kartica, **Kakovost in zgodovina** | Pregledaš odprte težave, »Zapisi v SAOP« in »Izvor podatkov«. | Izvor se naloži šele ob odprtju zavihka (počasno iskanje). | Tabela sporočil na poti v SAOP s stanjem (Čaka odobritev, Poslano, Potrjeno, Odklon). |\r\n\r\n### Paketno urejanje na seznamu (#10, 2026-09-29)\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| P1 | Urednik | `/izdelki`, vrstica nad tabelo | Označiš vrstice (kljukica na vrstici), **Označi vse na strani** ali **Označi vse, ki ustrezajo filtru (N)**. | Izbira živi čez strani in filtre; »vse po filtru« je filter, ne seznam (ob drugem filtru se sprosti). | Vrstica pove »Izbranih N« (ali »vsi, ki ustrezajo filtru«). |\r\n| P2 | Urednik | Vrstica izbire → **Nastavi polje …** | Izbereš polje (spletni naziv/opis po jeziku, atribut, kategorija spletišča, spletišča, oznaka) in vpišeš vrednost; pri seznamih izbereš **Dodaj k obstoječim** ali **Zamenjaj ves seznam**; **Izprazni polje** polje pobriše. | Nič se še ne zapiše. | Gumb **Pokaži predogled (N)** je omogočen, ko je vrednost veljavna. |\r\n| P3 | Urednik | Isto okno | Klikneš **Pokaži predogled**. | PIM sestavi majhen delovni list (Podjetje, Šifra, polje) in ga prebere kot uvoz Excela: preveri vrednost, izloči izdelke, ki vrednost že imajo, prebere »prej«. Teče skozi vrata za uvoze; **Prekliči** ga ustavi. | Vprašanje »Nastaviti ›polje‹ na ›vrednost‹ za N izdelkov v podjetju …?«, razdelitev po podjetjih, tabela prej → potem (prvih 25), opozorilo, koliko izdelkov izgubi spletišče. |\r\n| P4 | Urednik | Isto okno | Klikneš **Potrdi in zapiši (N)**. | NAJPREJ zapis v zgodovini uvozov (»Seznam izdelkov – paketno«, celoten prej → potem), nato zapis po paketih po 200 izdelkov skozi uvoz delovnega lista (`pim.Save*Bulk`, `pim.SetProductFlagsBulk`); vsak paket validira samo svoje izdelke in takoj preveri samodejni umik s spleta. Preklic velja med paketi. | Napredek »Paket k od m: zapisanih X od N izdelkov · še približno … min«; na koncu »Zapisano: N vrednosti na M izdelkih …« in ali gre polje na splet (atribut izven nabora ne gre) s povezavo na `/uvozi/{Id}`. |\r\n| P5 | Urednik | `/uvozi/{Id}` | Klikneš **Povrni**. | Povratek vrne »prej« povsod, kjer je v PIM še vrednost paketa (glej [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md)). | Nov zapis »Povratek uvoza #Id«. |\r\n\r\nZavihek **Komerciala** ureja ABC, skupino, aktivnost in »Objava na spletu (SAOP)« (vse po poti PIM + SAOP); cene po cenikih so tabela (urejanje na strani Cene), S-popust glej [Popusti](../07-poslovanje/popusti.md). Samo za branje so **SAOP endpoint** (zapis, kot ga ima ERP, z označenimi odkloni), **Mediji**, **Zaloga**. Desni stolpec **Aktivnosti** pokaže zadnje spremembe izdelka.\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **V SAOP nič samodejno.** Polje SAOP, shranjeno na kartici, velja v PIM takoj, v SAOP pa gre šele po odobritvi na strani Izhod v SAOP. Zajem iz SAOP polja z neposlanim sporočilom ne povozi.\r\n- **Deaktivacija** (Aktivnost = Ne) gre prav tako v vrsto in čaka potrditev (glej [Varovalke](../01-nadzor/varovalke.md)).\r\n- **Logična polja** so na kartici Da / Ne, v vrsto gredo kot 1/0.\r\n- **Hkratno urejanje:** če je nekdo polje spremenil med tvojim urejanjem, se tvoja vrednost ne shrani; kartica pokaže »Nekdo je bil hitrejši« s tvojo in trenutno vrednostjo.\r\n- **Delni izid:** če shranjevanje pade na pol poti, ostane shranjeno, kar je šlo skozi, osnutki ostalega ostanejo v obrazcu.\r\n- **Samodejni umik s spleta:** če po spremembi besedila, atributa ali po »Preveri zdaj« izdelek ni več veljaven za označeno spletišče, ga PIM (ob vklopljenem umiku) odkljuka in to izpiše; na kartici se pojavi pasica »Samodejno umaknjen s spleta«.\r\n- **Pravice:** urejanje kartice samo ADMIN in CATALOG_EDITOR (vsi ostali vidijo »Samo za branje«); **Preveri zdaj** tudi COMMERCIAL; potrditev manjkajočega EAN/proizvajalca/dobavitelja samo ADMIN. Na seznamu gumb **S-popust …** vidijo ADMIN, CATALOG_EDITOR in COMMERCIAL.\r\n- Šifra artikla je enolična samo znotraj podjetja, zato je podjetje vedno izpisano ob šifri.\r\n- **Paketno urejanje (#10):** samo podatki PIM (spletna besedila, atributi, kategorije primarnega spletišča, spletišča, oznake). **Polj SAOP paketno ne ponuja** (PRIVZETO ZA NOČ 2026-09-29, odločitev lastnika je odprta kot ločena naloga) — ta ostanejo uvozu Excela, kjer gredo v vrsto za SAOP; pomočnica zapis s poljem SAOP zavrne. S-popust ima svoje dejanje (Komerciala), slike in dokumenti ne (naloga #32). Pravico preveri `ProductBulkEdit.ApplyAsync` (`CatalogWrite`) in zapisovalne procedure; Komerciala gumba **Nastavi polje** ne vidi. Zapis ni ena transakcija: zgodovina se zapiše PRED zapisom izdelkov, nato gre zapis po paketih po 200 (`ProductBulkEdit.ChunkSize`), ker vsak paket validira svoje izdelke (`val.RunValidationForProducts`, pri 1.000 izdelkih 9,5 min in zaklepi za druge seje — hitrost validacije je naloga #105). Če se zapis ustavi (preklic med paketi, napaka, izpad intraneta), povratek na `/uvozi/{Id}` povrne natanko celice, ki nosijo novo vrednost.\r\n- **Vse je okence (2026-09-28).** Zaklenjeni (onemogočeni okenci z razlogom) ostajata samo **Šifra artikla** (ključ v SAOP in PIM) in **Sledenje serij** (vpliva na zalogo, nastavi se v SAOP). Katero polje gre v SAOP, pove register `out.SaopXmlField` + pravilo lastništva `out.OwnershipPolicy` (Owner = PIM); dolžina (`ItemLength`) in prostornina (`ItemVolumePerUnit`) sta tam od migracij 298/300.\r\n- **Števci pomenijo isto povsod:** značke v levem meniju in številki »Ustavi objavo« / »Priporočeno« v glavi zavihka štejejo prazna polja **na tem zavihku** (napaka komercialnega profila, npr. Pak1, se šteje tam, kjer polje stoji — na ERP). Rdeče je samo, kar ustavi objavo; število slik in zalogovnih vrstic je sivo in ima opis.\r\n- **Prazno = kot validacija:** 0 v številskem polju pakiranja/mer šteje za prazno.\r\n- **Pakirno naročanje (302):** oznaka Da/Ne, samo v PIM (v SAOP ne gre), po podjetju. Privzeto Ne. V `katalog.csv` gre kot stolpec »Pakirno naročanje« = 1/0 (303, odločitev lastnika 29. 9.); količino paketa Magento vzame iz »Pakirna količina« (Pakiranje 2). Artikel z oznako brez **objavljenega** Pakiranja 2 (\u003e 1) je zadržan s spleta (`val.ProductHold`, »pravilo 302«). Kartica drugje kaže Pakiranje 2 iz zajema/uvoza; na splet gre objavljena vrednost (`pim.ProductCommercial`, prenese jo objava v PIM po uspešni validaciji). Opomba ob oznaki zato pove obe, ko se razlikujeta (npr. »vpisano 50, na splet gre še 1«). Zadržek se sprosti sam, ko je objavljeno Pakiranje 2 večje od 1 — ob shranjevanju kartice, uvozu Excela ali najkasneje ob naslednjem izvozu `katalog.csv` (306: razlog zadržka loči »manjka« in »čaka objavo«).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Samo za branje« na kartici | Tvoja vloga ni ADMIN ali CATALOG_EDITOR. | Popravek naroči uredniku ali uporabi uvoz delovnega lista (če imaš pravico). |\r\n| »Nekdo je bil hitrejši« | Drug uporabnik je polje spremenil med tvojim urejanjem. | Preveri vrednost v katalogu in jo po potrebi vpiši znova. |\r\n| »… zavrnjenih« pri shranjevanju polja SAOP | Vrsta za SAOP je polje zavrnila (razlog je izpisan, npr. prazna vrednost). | Popravi vrednost; SAOP ne sprejema praznih vrednosti. |\r\n| Kljukica spletišča se ne shrani | Izdelek tja ne sme (npr. nima kategorije na tem spletišču ali nima slike). | Dopolni izdelek (kategorija: [Kategorije izdelka](kategorije-izdelka.md)), nato spletišče ponovno označi. |\r\n| Spletišče obkljukano, izdelka pa ni v katalog.csv | Neaktiven, zadržan, izključen, ni objavljen v PIM ali ima blokirajoče napake. | Poglej stolpec »V stolpcu Spletne strani« v razdelku Objava za splet in klikni **Preveri zdaj**. |\r\n| Gumb AI je siv, »AI ni nastavljen« | Na strežniku ni ključa AI. | Skrbnik nastavi ključ (Ai:ApiKey). |\r\n| »Kartice izdelka trenutno ni mogoče naložiti.« | Napaka baze ali povezave. | Osveži; če ostane, skrbnik pogleda dnevnik. |\r\n| Predogled paketa: »Nobenemu … se ne spremeni« | Izbrani izdelki vrednost že imajo (ali jih ni). | Preveri filter ali izbiro. |\r\n| Predogled paketa: »… poti kategorij ne obstaja« | Kategorija ni v drevesu tega spletišča. | Izberi kategorijo iz izbirnika; nove ustvariš na strani kategorij ali z uvozom Excela. |\r\n| »Zapis se je ustavil …« po paketu | Napaka baze sredi zapisa. | Zapis je v zgodovini uvozov: odpri ga in po potrebi **Povrni**, nato ponovi paket. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Products.razor` (`/izdelki`), `ProductCard.razor` (`/izdelki/{ProductId:long}`), deli v `Pages/ProductCard/` (`ProductChannelPanel`, `ProductMediaGallery`, `ProductPackagingPanel`); zavihki `ProductTabs` v `Components/Shared/PimTab.cs`.\r\n- **Storitve / delavci:** `ProductWorkbenchService` (seznam, fasete, kartica, izvor), `ProductEditService` (`SaveTextsAsync`, `SaveAttributesAsync`, `SaveErpFieldsBulkAsync`, `SaveWebShopsAsync`, `SaveProductFlagsAsync`), `SaopWriteService.EnqueueAsync` (vir `CARD`), `QualityWriteService` (`ValidateAsync`, `SetFieldWaiverAsync`), `WebWithdrawalService.AfterChangeAsync`, `AiTextService.SuggestWebTextsAsync`, `SaopEndpointSnapshotService`.\r\n- **Tabele in pogledi:** `intranet.GetProductList`, `intranet.GetProductListFilters`, `intranet.GetProductCard`, `intranet.GetProductOrigin`, `val.ProductChannelReadiness`, `pim.ProductWebShop`, `pim.ProductFlag`, `out.SaopXmlField` (register pisljivih polj), `pim.ProductFieldHistory`.\r\n- **Pravice:** politike `CatalogWrite` (ADMIN, CATALOG_EDITOR), `SaopWrite`, `BusinessWrite`, `FieldWaiver` (ADMIN) v `Services/PimAuthorization.cs`; ključ strani `view.products.list`.\r\n- **Migracije:** 101, 108 (seznam), 182 (spletišča), 186 (spori), 233 (oznake), 239 (ERP besedila), 242 (objava za splet), 249 (potrditve), 251 (umik s spleta), 273 (PIM takoj, SAOP po odobritvi), 302 (Pakirno naročanje, `pim.SetProductFlagsBulk`, `val.SyncPackageOrderHolds`), 306 (razlog zadržka).\r\n- **Paketno urejanje (#10):** `Services/ProductBulkEdit.cs` (statična pomočnica: zvezek → `ProductWorkbookService.PreviewAsync` / `ApplyAsync` → `ImportHistoryService.RecordAsync(ImportKinds.Products)` → `WebWithdrawalService.AfterChangeByItemsAsync`), skupna gradnika `Components/Shared/PimRowSelection.cs` (izbira: stran / vse po filtru / nič) in `PimBulkBar.razor` (vrstica izbranih in dejanj). Brez nove migracije. Test `PIM.F10.BulkEditTests`.\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ✅ 2026-09-28 rešeno: kategorije in dodajanje atributov sta na kartici; »Davčna stopnja« bere pravi ključ (`Product.VatRateId`); prazna mesta »Kosov v paketu«, »Nabavni podatki«, »Knjigovodske šifre« in »Cenovna polja« so odstranjena.\r\n- ⚠️ Polja »samo PIM« (ERP opisi, ERP nazivi v drugih jezikih, kratki naziv) SAOP od PIM ne sprejme; naslednji zajem artikla iz SAOP jih lahko prepiše. Za trajno rešitev bi jih bilo treba pošiljati v SAOP (SAOP ima za to ločeni vmesnik ItemsDescriptions / ItemsTitlesLanguage).\r\n- ✅ »Dimenzije artikla« (`ProductCommercial.Dimensions`) odstranjeno: 0 artiklov z vrednostjo, ni polja v SAOP ne zapisa v PIM. Davčna stopnja se bere posebej (`ProductEditService.GetVatRateIdAsync`), ker je `intranet.GetProductCard` ne vrača.\r\n- ⚠️ »Objava na spletu (SAOP)« (`Product.WebPublish`) se še vedno ureja in pošilja v SAOP, o objavi pa odločajo kljukice spletišč; uporabnik lahko zamenja pomen obeh.\r\n- ⚠️ Filter »Napaka → Čaka SAOP« in oznaka »čaka SAOP (N)« štejeta sporočila v odhodni vrsti; ni preverjeno, ali štejeta tudi sporočila v stanju odklon/mrtvo.\r\n\r\n## Povezani procesi\r\n\r\n- [Uvoz delovnega lista](uvoz-delovnega-lista.md): isti podatki množično, prek Excela; izvoz se sproži z gumbom na seznamu Izdelki. Paketno urejanje na seznamu gre po isti poti (navidezen zvezek).\r\n- [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md): povratek paketne spremembe.\r\n- [Kategorije izdelka](kategorije-izdelka.md): ročna uvrstitev — isti gradnik je na kartici (Splet) in na strani Uvrstitev izdelka.\r\n- [Mediji](mediji.md): vse slike in dokumenti izdelka.\r\n- [Odprodaja](odprodaja.md): razdelek Odprodaja na kartici.\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odobritev polj, shranjenih na kartici.\r\n- [Zgodovina in popravki SAOP](../05-izhod-saop/zgodovina-in-popravki-saop.md): kaj je bilo poslano in potrjeno.\r\n- [Kakovost in validacija](../04-kakovost/kakovost-in-validacija.md): odprte težave in pripravljenost za ERP/splet.\r\n- [Umaknjeni artikli in obvestila](../06-izhod-splet/umaknjeni-s-spleta.md): samodejni umik s spleta.\r\n- [Katalog in stranke CSV](../06-izhod-splet/katalog-in-stranke-csv.md): kdaj pride izdelek v katalog.csv.\r\n- [Popusti](../07-poslovanje/popusti.md): S-popust na seznamu in na kartici.\r\n- [Novi artikli dobaviteljev](../02-vhodi/novi-artikli-dobaviteljev.md): zavihek »Novi artikli« na strani Izdelki.\r\n"},{"pot":"03-izdelki/kategorije-izdelka.md","vsebina":"---\r\nid: kategorije-izdelka\r\nnaslov: Ročna uvrstitev izdelka v kategorije\r\npodrocje: 03-izdelki\r\nstanje: deluje\r\nbere: [pim.kategorije, pim.kategorije-izdelka, pim.izdelek]\r\npise: [pim.kategorije-izdelka, pim.izdelek, pim.validacija]\r\nstrani: [/izdelki/kategorije, /izdelki/{ItemId}/kategorije, /izdelki/{ProductId}]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCategories.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ProductCard/ProductCategoryEditor.razor, PIM_Solution/src/PIM.Intranet/Services/CategoryMappingService.cs, PIM_Solution/src/PIM.Intranet/Services/WebWithdrawalService.cs]\r\nmigracije: [059, 109, 251]\r\n---\r\n\r\n# Ročna uvrstitev izdelka v kategorije\r\n\r\n\u003e **Področje:** Izdelki · **Lastnik:
