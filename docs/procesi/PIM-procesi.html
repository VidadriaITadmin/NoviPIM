  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>Vpliv spremembe</h3>
    ${r.podre.length ? '<p><b style="color:var(--bad)">PODRE</b> – nekaj, kar drugi procesi potrebujejo, ne bo več delovalo.</p>' : ''}
    <ul class="impact">${sez(r.podre, 'podre', '✖')}${sez(r.pozor, 'pozor', '!')}${sez(r.obogati, 'obogati', '+')}</ul>
    ${nic ? '<p>✅ Povezave med procesi se ne spremenijo.</p>' : ''}
    ${r.nasl.length ? `<p class="muted">Ta proces vpliva na: ${esc(r.nasl.join(', '))}. Preveri, ali njihovi opisi še držijo.</p>` : ''}
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ${r.podre.length ? '' : 'primary'}" id="mOk">${r.podre.length ? 'Vseeno shrani' : 'Shrani'}</button><button class="btn" id="mNo">Nazaj na urejanje</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#mNo').onclick = () => ov.remove();
  ov.querySelector('#mOk').onclick = async () => {
    try {
      await Vir.zapisi(pot, nova.replace(/\r?\n/g, '\r\n'));
      ov.remove(); urejanje = false;
      await Vir.naloziMapo(); M = Jedro.zgradi(Vir.datoteke, Vir.slovar); zgradiMeni(); osveziVir();
      pojdi('proces/' + (Jedro.razcleni(nova).id || id)); prikazi();
    } catch (e) { alert('Shranjevanje ni uspelo: ' + (e.message || e)); }
  };
}
function obvestilo(t) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><p style="margin-top:0">${esc(t)}</p><button class="btn primary">V redu</button></div>`;
  ov.querySelector('button').onclick = () => ov.remove();
  document.body.appendChild(ov);
}

/* ===== meni in usmerjanje ===== */
function zgradiMeni() {
  const pp = vsi(), odprto = pp.reduce((a, p) => a + p.odprto.length, 0), op = Jedro.opozorila(M).length;
  let h = `<a class="nav-item" data-pot="" href="#/">🗺️ Glavni proces</a>
    <a class="nav-item" data-pot="odprto" href="#/odprto">🚩 Kaj ni pod kontrolo<span class="cnt warn">${odprto}</span></a>
    <a class="nav-item" data-pot="podatki" href="#/podatki">◆ Podatki</a>
    <a class="nav-item" data-pot="opozorila" href="#/opozorila">🧩 Skladnost<span class="cnt ${op ? 'warn' : ''}">${op}</span></a>
    <div class="nav-sec">Področja</div>`;
  for (const pd of Object.keys(Jedro.PODROCJA)) {
    const a = pp.filter(p => p.podrocje === pd); if (!a.length) continue;
    const slab = a.filter(p => p.razred !== 'deluje').length;
    h += `<a class="nav-item" data-pot="podrocje/${pd}" href="#/podrocje/${pd}">${esc(Jedro.podrocjeNaziv(pd))}<span class="cnt">${slab ? `<span style="color:var(--warn)">${slab}⚠</span> · ` : ''}${a.length}</span></a>`;
  }
  $('#nav').innerHTML = h; oznaciMeni();
}
function oznaciMeni() {
  const pot = trenutno.startsWith('proces/') && M.procesi[trenutno.split('/')[1]] ? 'podrocje/' + M.procesi[trenutno.split('/')[1]].podrocje : trenutno;
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.pot === pot));
}
async function prikazi() {
  if (!M) return;
  trenutno = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  oznaciMeni(); $('#aside').classList.remove('open');
  const [v, a, b] = trenutno.split('/');
  $('#view').parentElement.classList.toggle('siroko', !v);
  if (v === 'proces') await pogledProcesa(a, b);
  else if (v === 'podrocje') pogledPodrocja(a);
  else if (v === 'podatek') await pogledPodatka(decodeURIComponent(a));
  else if (v === 'podatki') pogledPodatkov();
  else if (v === 'sistem') pogledSistema(a);
  else if (v === 'vpliv') await pogledVpliva(a);
  else if (v === 'odprto') pogledOdprto();
  else if (v === 'opozorila') pogledOpozoril();
  else pogledDomov();
  if (v !== 'proces' || !b) $('#main').scrollTop = 0;
}
function osveziVir() {
  const s = $('#srcInfo');
  if (Vir.nacin === 'mapa') s.innerHTML = `🟢 <b>V živo</b> iz mape „${esc(Vir.mapa.name)}“. Spremembe se prikažejo same.`;
  else if (window.PROCESI_PODATKI) s.innerHTML = `Posnetek ${esc(Vir.ustvarjeno)}. Za sprotne spremembe in urejanje poveži mapo.`;
  else s.innerHTML = `Ni vgrajenih podatkov. Klikni »Poveži z mapo« in izberi <b>docs\\procesi</b>.`;
  $('#brandSub').textContent = `${Object.keys(M ? M.procesi : {}).length} procesov · ${Vir.nacin === 'mapa' ? 'v živo' : 'posnetek'}`;
}
async function poveziMapo(h) {
  Vir.mapa = h; Vir.nacin = 'mapa';
  await Vir.naloziMapo();
  if (!Vir.datoteke.length) { obvestilo('V tej mapi ni procesov. Izberi mapo docs\\procesi (tisto z mapami 01-nadzor, 02-vhodi …).'); Vir.nacin = 'vgrajeno'; Vir.naloziVgrajeno(); }
  else await Rocaj.shrani(h);
  M = Jedro.zgradi(Vir.datoteke, Vir.slovar); zgradiMeni(); osveziVir(); prikazi();
}
$('#btnConnect').onclick = async () => {
  if (!window.showDirectoryPicker) { obvestilo('Povezava z mapo deluje v brskalnikih Edge in Chrome. Tu je na voljo branje posnetka.'); return; }
  try {
    const s = await Rocaj.beri();
    if (s && (await s.requestPermission({ mode: 'readwrite' })) === 'granted') return poveziMapo(s);
    await poveziMapo(await showDirectoryPicker({ id: 'pim-procesi', mode: 'readwrite' }));
  } catch (e) { if (e.name !== 'AbortError') obvestilo('Mape ni bilo mogoče odpreti: ' + (e.message || e)); }
};
$('#btnTheme').onclick = () => {
  document.documentElement.setAttribute('data-theme', temna() ? 'light' : 'dark');
  try { localStorage.setItem('pim-procesi-tema', document.documentElement.getAttribute('data-theme')); } catch { }
  mermaidInit(); prikazi();
};
$('#btnSearch').onclick = odpriIskanje;
addEventListener('hashchange', () => { if (!urejanje) prikazi(); });
setInterval(async () => {
  if (Vir.nacin !== 'mapa' || urejanje || document.hidden) return;
  try { if (await Vir.spremenjeno()) { M = Jedro.zgradi(Vir.datoteke, Vir.slovar); zgradiMeni(); osveziVir(); prikazi(); } } catch { }
}, 4000);

(async () => {
  try { const t = localStorage.getItem('pim-procesi-tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch { }
  mermaidInit();
  Vir.naloziVgrajeno();
  M = Jedro.zgradi(Vir.datoteke, Vir.slovar);
  zgradiMeni(); osveziVir(); prikazi();
  // če je bila mapa že povezana in dovoljenje še velja, preklopi na živ način
  try {
    const h = await Promise.race([Rocaj.beri(), new Promise(ok => setTimeout(() => ok(null), 1500))]);
    if (h && (await h.queryPermission({ mode: 'readwrite' })) === 'granted') await poveziMapo(h);
  } catch { }
})();
</script>
</body>
</html>
