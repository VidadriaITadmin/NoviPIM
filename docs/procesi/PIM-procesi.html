ije` | Vpišeš del imena ali poti in izbereš kategorijo; neobvezno »Opomba«. | — | Izbrana pot je vidna v polju. |\r\n| 4a | Urednik | `/kakovost/kategorije` | Če kategorije ni: v izbirniku »Ustvari novo kategorijo«, izbereš nadrejeno (prazno = koren) → »Ustvari in izberi«. | Nova kategorija nastane v drevesu; enako ime pod istim staršem je zavrnjeno že na strani. | Sporočilo »Kategorija … je ustvarjena … Shrani preslikavo.« |\r\n| 5 | Urednik | `/kakovost/kategorije` | Klikneš »Shrani«. | Baza preveri, da kategorija obstaja in ima prevedeno pot; zapiše preslikavo z imenom uporabnika. | Sporočilo »Preslikava je zapisana. Velja za N izdelkov ob naslednji preslikavi vira.«; stanje »Preslikano«. |\r\n| 6 | Urednik | `/kakovost/kategorije` | Za preklic pri preslikani vrstici »Uredi« → »Ugasni preslikavo«. | Vrstica ostane v stanju »Ugasnjeno« (sled odločitve). | Stanje »Ugasnjeno«. |\r\n| 7 | Avtomatika | — | — | Naslednja preslikava vira artiklom za to potjo dodeli kategorijo. | Na kartici izdelka je kategorija; zavihek »Po kategorijah« na `/kakovost` jo šteje. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Seznam in preslikava sta **skupna vsem podjetjem**, ker je drevo dobaviteljevo.\r\n- Baza zavrne neobstoječo kategorijo (napaka 106003) in kategorijo brez prevedene poti (106004); sporočilo baze se pokaže nespremenjeno.\r\n- Preslikava se ne briše, samo ugasne.\r\n- Učinek ni takojšen: velja ob naslednji preslikavi vira.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Napaka o kategoriji brez prevedene poti | Kategorija nima prevoda poti v jezik spletišča. | V drevesu dodaj prevod (glej [Drevo kategorij](../08-upravljanje/drevo-kategorij.md)) in shrani znova. |\r\n| »Izberi ciljno kategorijo« | Klik »Shrani« brez izbire. | Izberi kategorijo. |\r\n| Preslikava shranjena, artikli še brez kategorije | Vir še ni bil znova preslikan. | Počakaj na naslednji zajem ali ponovno obdelaj vir. |\r\n| »Ustvari in izberi« je onemogočen | Pod istim staršem že obstaja enako ime. | Izberi obstoječo kategorijo. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/MissingCategories.razor`\r\n- **Storitve / delavci:** `CategoryMappingService` (`GetMappingsAsync`, `SaveMappingAsync`, `DeactivateMappingAsync`, `GetTreeNodesAsync`), `CategoryTreeService.CreateCategoryAsync`.\r\n- **Tabele in pogledi:** `map.SourceCategory`, preslikave kategorij (migracija 109), procedura `intranet.GetCategoryMappings`.\r\n- **Migracije:** 109 (urejanje preslikav), 178 (nova kategorija iz izbirnika).\r\n- **Urniki:** ni lastnega.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ `CategoryMappingService` pravice ne preverja sam (nima `PimWriteGuard`); zapis varuje samo dostop do zavihka `tab.quality.categories` in pravila v bazi. Vsak prijavljen uporabnik z dostopom do zavihka lahko spremeni preslikavo, ki velja za vsa podjetja.\r\n- ⚠️ Stran ne ponudi ponovne obdelave vira; uporabnik ne ve, kdaj bo sprememba vidna.\r\n- ⚠️ Ime datoteke je »manjkajoče kategorije«, v meniju pa se zavihek imenuje »Nepreslikane kategorije« in naslov strani »Preslikave kategorij«.\r\n\r\n## Povezani procesi\r\n\r\n- [Drevo kategorij](../08-upravljanje/drevo-kategorij.md): kategorije in njihovi prevodi.\r\n- [Kategorije izdelka](../03-izdelki/kategorije-izdelka.md): ročna uvrstitev posameznega izdelka.\r\n- [Dobaviteljski katalogi XML](../02-vhodi/dobaviteljski-katalogi-xml.md): od kod pridejo poti.\r\n- [Kakovost in validacija](kakovost-in-validacija.md): artikel brez kategorije na označenem spletišču ni objavljen.\r\n"},{"pot":"04-kakovost/prevodi.md","vsebina":"---\r\nid: prevodi\r\nnaslov: Manjkajoči prevodi\r\npodrocje: 04-kakovost\r\nstanje: deluje\r\nbere: [pim.surovi-zajem, pim.pravila, pim.atributi]\r\npise: [pim.pravila]\r\nstrani: [/kakovost/prevodi]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/MissingTranslations.razor, PIM_Solution/src/PIM.Intranet/Services/PipelineReadService.cs, PIM_Solution/src/PIM.Intranet/Services/AttributeMappingService.cs]\r\nmigracije: []\r\n---\r\n\r\n# Manjkajoči prevodi\r\n\r\n\u003e **Področje:** Kakovost · **Lastnik:** urednik kataloga · **Stanje:** ✅ deluje · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nPokaže vrednosti iz virov (npr. barva, material), za katere slovar nima prevoda v posamezni jezik, in vodi urednika naravnost v slovar, kjer prevod doda. Rezultat je prevod, ki velja za vsa podjetja in se uporabi ob naslednji preslikavi.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Ne sodeluje. |\r\n| Urednik kataloga | Pregleda seznam, klikne »Dodaj prevod« in v slovarju vpiše prevod. |\r\n| Skrbnik | Po potrebi sproži ponovno obdelavo vira, da se prevod takoj uporabi. |\r\n| Avtomatika (PIM) | Med preslikavo zabeleži vsako vrednost brez prevoda in šteje pojavitve. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik odpre `/kakovost/prevodi`, npr. ko ima artikel prazno lastnost v angleščini.\r\n- **Po urniku:** vrstice nastajajo med zajemi; stran nima urnika.\r\n- **Ob dogodku:** preslikava naleti na vrednost, ki je v slovarju ni za ciljni jezik.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Vrednosti brez prevoda z domeno, jezikom, številom pojavitev in časom zadnjega pojava | PIM (`map.MissingTranslationOpen`) |\r\n| **Izhod** | Nov vnos v slovarju | PIM, stran `/pravila/slovar` |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A[[Preslikava vira]] --\u003e B{Prevod v slovarju obstaja?}\r\n    B -- ne --\u003e C[(Seznam manjkajočih prevodov)]\r\n    B -- da --\u003e D([Prevedena vrednost na artiklu])\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    E[Odpre Manjkajoči prevodi in izbere jezik] --\u003e F[Klikne Dodaj prevod]\r\n    F --\u003e G[V slovarju vpiše in shrani prevod]\r\n  end\r\n  C --\u003e E\r\n  G --\u003e A\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class D endp; class E,F,G user; class A,B auto; class C data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/kakovost/prevodi` | Odpreš zavihek »Manjkajoči prevodi«. | Naloži se največ 300 vrstic, razvrščenih po številu pojavitev (najpogostejše najprej). | Tabela: Domena, Jezik, Vrednost iz vira, Pojavitev, Nazadnje. |\r\n| 2 | Urednik | `/kakovost/prevodi` | V izbirniku izbereš jezik (ali »Vsi jeziki«). | Seznam se takoj osveži za ta jezik. | Števec »… vrstic (največ 300)«. |\r\n| 3 | Urednik | `/kakovost/prevodi` | Pri vrstici klikneš »Dodaj prevod«. | Odpre se `/pravila/slovar` z vnaprej izpolnjeno domeno, vrednostjo in jezikom. | Na slovarju vidiš izpolnjen obrazec. |\r\n| 4 | Urednik | `/pravila/slovar` | Vpišeš prevod in ga shraniš. | Vnos slovarja velja za vsa podjetja. | Ob naslednji preslikavi vrstica izgine s seznama. |\r\n| 4a | Urednik | `/kakovost/prevodi`, razdelek »Kaj bi slovar prevedel« | Izbereš jezik (SL, DE, HR, IT) in pri angleški vrednosti atributa klikneš »Dodaj prevod«. | Za vsako različno angleško vrednost atributa pri izdelkih se preveri, ali ima slovar prevod (domena * ali ime atributa). Samo pregled; prevod se vpiše v slovar. Rimske številke in števila (npr. Električni razred I/II/III) niso na seznamu, ker se ne prevajajo. | Število »prevedenih / vseh« za jezik se poveča. |\r\n| 5 | Avtomatika | — | — | Naslednji zajem ali ponovna obdelava vira uporabi nov prevod. | Na kartici izdelka je lastnost prevedena. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Slovar je **skupen vsem podjetjem**: prevod velja povsod.\r\n- Seznam je posledica dejanskega zajema, ne domneve: vrstica nastane šele, ko preslikava vrednost res sreča.\r\n- Stran je bralna; zapis gre prek slovarja (pravice po strani `/pravila/slovar`).\r\n- Samodejni prevod vrednosti je pretvorba LOOKUP ob zajemu (slovar); zunanjega prevajalnika ali AI ni (privzeto za noč #15, lastnik lahko spremeni).\r\n- Izdelek hrani vrednosti atributov samo v sl in en, katalog.csv jih izvaža kot ANG/SLO. Nemški, hrvaški in italijanski prevodi v slovarju zato (še) ne gredo na splet — odločitev lastnika.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| Prevod je dodan, vrstica pa je še na seznamu | Preslikava vira od takrat še ni tekla. | Počakaj na naslednji zajem ali prosi skrbnika za ponovno obdelavo vira. |\r\n| V izbirniku jezikov manjka jezik | Izbirnik pozna samo jezike z vrzelmi ob prvem nalaganju. | Osveži stran. |\r\n| Seznam se ustavi pri 300 | Namerna meja. | Najprej reši najpogostejše vrstice ali filtriraj po jeziku. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/MissingTranslations.razor`; cilj povezave `/pravila/slovar?domena=…\u0026vrednost=…\u0026jezik=…`.\r\n- **Storitve / delavci:** `PipelineReadService.GetMissingTranslationsAsync` (TOP 300).\r\n- **Tabele in pogledi:** `map.MissingTranslationOpen`.\r\n- **Migracije:** ni posebne.\r\n- **Urniki:** ni lastnega.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Prevod se ne uporabi za nazaj takoj; artikli dobijo prevedeno vrednost šele ob naslednji preslikavi vira.\r\n- ⚠️ Stran ne kaže, katerih artiklov se vrednost tiče, samo število pojavitev (razdelek »Kaj bi slovar prevedel« kaže število izdelkov).\r\n- ❓ Odločitev lastnika (#15): ali naj katalog.csv dobi vrednosti atributov tudi v nemščini, hrvaščini in italijanščini (zdaj samo ANG/SLO).\r\n- Samodejnih (AI) prevodov slovarja v kodi ni; AI piše samo spletni naziv in opis na kartici (glej [AI spletna besedila](ai-spletna-besedila.md)).\r\n\r\n## Povezani procesi\r\n\r\n- [Pravila validacije, slovar, preslikave](../08-upravljanje/pravila-validacije-slovar-preslikave.md): urejanje slovarja.\r\n- [Jeziki, kanali, skladišča, povezave](../08-upravljanje/jeziki-kanali-skladisca-povezave.md): kateri jeziki obstajajo.\r\n- [AI spletna besedila](ai-spletna-besedila.md): predlog spletnega naziva in opisa v drugem jeziku.\r\n- [Kakovost in validacija](kakovost-in-validacija.md): manjkajoč prevod lahko povzroči napako spletnega profila.\r\n"},{"pot":"05-izhod-saop/cakalna-vrsta-in-posiljanje-saop.md","vsebina":"---\r\nid: cakalna-vrsta-in-posiljanje-saop\r\nnaslov: Čakalna vrsta in pošiljanje v SAOP\r\npodrocje: 05-izhod-saop\r\nstanje: delno\r\nbere: [pim.saop-vrsta, pim.izdelek, pim.varovalke]\r\npise: [pim.saop-vrsta, pim.varovalke, saop.artikli]\r\nstrani: [/outbound, /saop]\r\nposli: [SAOP_OUTBOUND_DISPATCH]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/Outbound.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/Saop.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/SaopSafeguardBanner.razor, PIM_Solution/src/PIM.Intranet/Components/Shared/SaopDeactivationConfirm.razor, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/SafeguardService.cs, PIM_Solution/src/PIM.Intranet/Services/IntranetDataService.cs, PIM_Solution/src/PIM.Outbound/*.cs, PIM_Solution/workers/PIM.OutboxDispatcher/*.cs, PIM_Solution/src/PIM.Automation/JobCatalog.cs]\r\nmigracije: [46, 152, 193, 195, 236, 243, 265, 281]\r\n---\r\n\r\n# Čakalna vrsta in pošiljanje v SAOP\r\n\r\n\u003e **Področje:** Izhod v SAOP · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nNa enem mestu pokaže vse spremembe za SAOP, ki še niso zaključene (en artikel = ena vrstica), in omogoča odobritev, preklic, ponovni poskus in takojšnje pošiljanje. Rezultat je artikel, poslan v SAOP, ali jasen razlog, zakaj ni bil.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Stran vidi; odobritev in pošiljanje sta namenjena vlogam s `SaopWrite` (⚠️ glej razdelek 10). |\r\n| Urednik kataloga | Pregleda vrsto, odobri ali prekliče artikle (posamično ali skupinsko), potrdi deaktivacije, ponovi neuspele. |\r\n| Skrbnik | Nastavi poverilnice SAOP (razdelek `Saop` v `appsettings.Local.json`), profil `SAOP_PRODUCT` in razpored `OUTBOUND`; odloča o vklopu odhodnega posla. |\r\n| Avtomatika (PIM) | Ob odobritvi takoj poskusi poslati ta artikel; odhodni posel (privzeto izklopljen) bi pošiljal preostanek. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik na `/outbound` klikne »Odobri«, »Odobri izbrane artikle« ali »Pošlji zdaj«.\r\n- **Po urniku:** posel `SAOP_OUTBOUND_DISPATCH` (»Pošiljanje v SAOP (odhodna vrsta)«, `PIM.OutboxDispatcher`, razmik 300 s) — **privzeto izklopljen**.\r\n- **Ob dogodku:** nova skupina iz `/saop/artikli`, kartice, uvoza, množičnega urejanja ali popravka zgodovine se pojavi v vrsti.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Sporočila v vrsti (Čaka odobritev, V obdelavi, Napaka) | PIM (`out.OutboxMessage`) |\r\n| **Vhod** | Poverilnice in naslov SAOP | Nastavitve strežnika, `dbo.IntegrationProfile` |\r\n| **Izhod** | Dokument POST ali PATCH na artikel | SAOP (iCenter API) |\r\n| **Izhod** | Stanje sporočila (Poslano, Napaka, Preklicano), odgovor SAOP, potrjene deaktivacije | PIM (`out.OutboxMessage`, `out.OutboxAttempt`, `ops.SafeguardApproval`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Odpre Čakalna vrsta in izbere artikle]\r\n    B --\u003e C[Klikne Odobri]\r\n    K[Potrdi deaktivacije v pasici]\r\n    M[Poglej napako in Pošlji znova]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    D{Deaktivacija artikla?}\r\n    D -- da --\u003e E\u003eČaka potrditev]\r\n    D -- ne --\u003e F{Poverilnice nastavljene?}\r\n    F -- ne --\u003e G\u003eČaka odhodni posel]\r\n    F -- da --\u003e H[[Sestavi dokument in pošlje]]\r\n    J{SAOP sprejel?}\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    I[(Artikel v SAOP)]\r\n  end\r\n  C --\u003e D\r\n  E --\u003e K\r\n  K --\u003e F\r\n  H --\u003e I\r\n  I --\u003e J\r\n  J -- ne --\u003e M\r\n  M --\u003e F\r\n  J -- da --\u003e L([Poslano])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,L endp; class B,C,K,M user; class D,F,H,J auto; class E,G wait; class I data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/outbound` | Odpreš zavihek »Čakalna vrsta« (naslov strani »Izvozi«), izbereš podjetje. | Prikažejo se samo artikli z vsaj enim nezaključenim sporočilom, 10 na stran; status artikla je »najnujnejši« status njegovih polj. | Stolpci Šifra, Operacija, Polja, Status, Zadnja sprememba, Odklon, Dejanja. Nad tabelo ni kartic hitrega pregleda (odstranjene 18. 9.; ali jih vrniti, odloča lastnik — naloga #36); koliko artiklov ustreza filtrom, pove števec zadetkov ob iskanju. |\r\n| 2 | Urednik | `/outbound` | Filtriraš po šifri in statusu; »Poglej XML« pokaže dokument, ki bi šel v SAOP. | Predogled se sestavi iz čakajočih sprememb brez prevzema (ne porabi poskusa). | Okno s POST/PATCH, potjo in XML; opozorilo, če manjka obvezno polje. |\r\n| 3 | Urednik | `/outbound` | Klikneš »Odobri« pri artiklu (ali označiš več, »Izberi vse filtrirane (N)« → »Odobri izbrane artikle«). | `out.ApproveItemDocument` odobri vsa čakajoča polja artikla, nato intranet **takoj** poskusi poslati prav ta artikel (`TrySendArticleAsync`, omejitev 25 s). | Sporočilo »Artikel je odobren. Poslano v SAOP: 1 od 1. NW.…: PATCH uspešno« ali »SAOP poverilnice niso nastavljene na tem strežniku — čaka na worker«. |\r\n| 4 | Urednik | `/outbound` | Če se pojavi pasica »V SAOP N artiklov bo neaktivnih«: pregledaš seznam (Šifra, Naziv, Od kod, Pripravil) in klikneš »Da, namenoma — pošlji v SAOP« ali »Ne zdaj«. | Deaktivacija (Aktiven = Ne) se pri odobritvi preskoči (napaka 52901); potrditev jo zapiše v `ops.SafeguardApproval` in odobri. | »Potrjeno: N neaktivnih artiklov gre v SAOP.« Nato »Pošlji zdaj«. |\r\n| 5 | Urednik | `/outbound` | Za že odobren artikel v stanju »V obdelavi« klikneš »Pošlji zdaj«. | Isti takojšnji poskus kot v koraku 3. | Artikel izgine s seznama (je v Zgodovini) ali dobi »Napaka«. |\r\n| 6 | Urednik | `/outbound` | Pri »Napaka« klikneš »Poglej napako«, popraviš vzrok, nato »Pošlji znova«. | Neuspela sporočila se vrnejo v vrsto (`out.RequeueOutboxMessage`) z zapisom, kdo je sprožil. | Status se spremeni v »V obdelavi«; po »Pošlji zdaj« v »Poslano«. |\r\n| 7 | Urednik | `/outbound` | Česar ne želiš poslati: »Prekliči« ali »Prekliči izbrane artikle«. | `out.CancelItemDocument` prekliče vsa nezaključena polja artikla. | »Artikel je preklican.«; v Zgodovini »Preklicano«. |\r\n| 8 | Urednik | `/outbound` | Po naslednjem zajemu iz SAOP klikneš »Preveri potrditve SAOP«. | Sporočila v stanju Poslano se primerjajo s trenutno vrednostjo v PIM (243); preverijo se samo tista, po katerih je zajem `SAOP_PRODUCTS` že tekel. | »Preverjenih N sporočil« ali »N še čaka na vhodno sinhronizacijo«. |\r\n| 9 | Urednik | `/saop` | Na »Pregled« po potrebi »Pošlji znova vse neuspele« za celo skupino. | `out.RequeueOutboundBatch`. | Števec »Napake« pade. |\r\n| 10 | Avtomatika | — | — | Če je `SAOP_OUTBOUND_DISPATCH` vklopljen in je razpored `OUTBOUND` omogočen, `PIM.OutboxDispatcher` prevzema in pošilja sporočila iz vrste. | Na `/sistem/posel/SAOP_OUTBOUND_DISPATCH` uspešen tek posla. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Nič ne gre v SAOP brez odobritve.** Odobritev je hkrati ukaz za takojšnje pošiljanje (če so poverilnice nastavljene).\r\n- **Odobritev in preklic veljata za cel artikel**, ne za posamezno polje; SAOP dobi en dokument na artikel.\r\n- **Deaktivacija vedno čaka izrecno potrditev** (281), tudi če bi bil profil nastavljen na samodejno odobritev; ostale spremembe iste skupine gredo normalno.\r\n- **Pošiljanje je zaprto brez poverilnic:** brez uporabnika in gesla SAOP se ne poskusi nič, sporočilo ostane v vrsti.\r\n- **HTTP 200 ni dokaz:** odgovor z `ResultCode=Error` se šteje kot zavrnitev; napaka se zapiše kot navodilo (npr. manjka šifrant, dobavitelj).\r\n- **Samopopravek metode:** če SAOP javi »artikel že obstaja« ali »ne obstaja«, PIM v istem poskusu ponovi z drugo metodo.\r\n- **Vloge:** vpis, odobritev skupine in pošiljanje zahtevajo `SaopWrite` (ADMIN, CATALOG_EDITOR); potrditev deaktivacij prav tako.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »SAOP poverilnice niso nastavljene na tem strežniku — čaka na worker« | Na strežniku intraneta ni razdelka `Saop` / `PIM_SAOP_*`. | Skrbnik nastavi poverilnice; do takrat artikel čaka (odhodni posel je privzeto izklopljen). |\r\n| »SAOP se ni odzval pravočasno« | SAOP počasen (\u003e 25 s). | Kasneje »Pošlji zdaj«. |\r\n| »Artikel bo v SAOP neaktiven — preveri ga na seznamu spodaj« | Sprememba Aktiven = Ne čaka potrditev. | Potrdi v pasici ali prekliči artikel. |\r\n| Status »Napaka«, `CodebookMissing` | Vrednost (tarifa, skupina, tip) ni v šifrantu SAOP. | Popravi vrednost v PIM ali šifrant v SAOP, nato »Pošlji znova«. |\r\n| Status »Napaka«, `AuthConfig` | Napačna poverilnica ali pravica; kanal se ustavi. | Skrbnik popravi poverilnico in znova omogoči profil. |\r\n| Artikel ostaja »Poslano«, nikoli potrjen | Potrditev se ne izvaja sama. | Po zajemu klikni »Preveri potrditve SAOP«. |\r\n| »Dejanja trenutno ni mogoče izvesti« po odobritvi | Odobritev je lahko že uspela, pošiljanje pa ne (npr. vloga brez `SaopWrite`). | Osveži stran in preveri status; pošlje naj uporabnik z ustrezno vlogo. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/Outbound.razor` (`/outbound`), `Saop.razor` (`/saop`); pasica `Components/Shared/SaopSafeguardBanner.razor` in `SaopDeactivationConfirm.razor`.\r\n- **Storitve / delavci:** `SaopWriteService.TrySendArticleAsync` (poverilnice `ReadSaopCredentials`: `PIM_SAOP_*` ali razdelek `Saop`), `IntranetDataService` (`ApproveItemAsync`, `CancelItemAsync`, `RetryOutboundAsync`, `GetOutboundAsync`), `SafeguardService` (`GetSaopDeactivationsAsync`, `ConfirmSaopDeactivationsAsync`), `ProductWorkbookService.VerifyPendingEchoesAsync`; `PIM.Outbound` (`SaopDocumentRunner.SendOneAsync`, `SaopDocumentSender`, `SaopErrorTranslator`, `SaopResponseReader`); worker `PIM_Solution/workers/PIM.OutboxDispatcher` (pot `--saop-documents [--send] [--org N] [--max N]`, privzeto suhi tek).\r\n- **Tabele in pogledi:** `out.OutboxMessage`, `out.OutboxAttempt`, `out.OutboundBatch`, `dbo.IntegrationProfile`, `ops.ScheduleProfile` (razpored `OUTBOUND`), `ops.SafeguardRule` (`SAOP_NEAKTIVEN`), `ops.SaopHeldDeactivation`, `ops.SafeguardApproval`; procedure `out.ApproveItemDocument`, `out.CancelItemDocument`, `out.ClaimItemDocumentByKey`, `out.CompleteItemDocument`, `out.RequeueOutboxMessage`, `out.RequeueOutboundBatch`, `out.VerifyEchoBatch`, `ops.ConfirmSaopDeactivations`, `intranet.GetOutboundMessages`.\r\n- **Migracije:** 046 (nadomeščanje), 152 (po artiklu), 193 (pošiljanje po šifri), 195 (prevzem zastalih), 236, 243 (potrditev odmeva), 265 (cene in ceniki), 281 (deaktivacije).\r\n- **Urniki:** `SAOP_OUTBOUND_DISPATCH`, 300 s, privzeto izklopljen, v SAOP-pasu (ne teče hkrati z drugimi klici SAOP).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Posel `SAOP_OUTBOUND_DISPATCH` zažene `PIM.OutboxDispatcher` **brez** argumentov, torej staro pot po enem sporočilu (`out.ClaimMessage`), ne pot po dokumentu (`--saop-documents --send`), ki jo uporablja intranet. Če bi ga vklopili, ni jasno, kako bi obdelal sporočila artiklov. V praksi artikle pošilja samo intranet ob »Odobri« / »Pošlji zdaj«.\r\n- ⚠️ `/izvozi/mnozicno` piše »Pošlje jo šele odhodni worker«, ki je izklopljen — odobrena skupina tam obstane, dokler nekdo na `/outbound` ne klikne »Pošlji zdaj«.\r\n- ⚠️ `/outbound` je odprt tudi vlogi COMMERCIAL; odobritev, preklic in ponovni poskus gredo prek `IntranetDataService` **brez** preverjanja `SaopWrite` (preveri samo pošiljanje). Komerciala lahko odobri ali prekliče artikel, pošiljanje pa ji pade s splošno napako.\r\n- ⚠️ Potrditev odmeva (243) je ročni gumb »Preveri potrditve SAOP«, ni povezana v redni cikel; brez klika sporočila ostanejo »Poslano«.\r\n- ⚠️ Stran naloži vsa sporočila podjetja v zgodovini (`intranet.GetOutboundMessages` brez omejitve) in filtrira v pomnilniku; s časom bo počasna.\r\n- ⚠️ Na seznamu so tudi cene in ceniki (265), »Pošlji zdaj« pa pošilja samo artikle (`SAOP_PRODUCT`).\r\n- ⚠️ Naslov strani je »Izvozi«, zavihek pa »Čakalna vrsta«; drugje se imenuje »Odhodna pošta« ali »Odhodna vrsta«.\r\n- ⚠️ Deaktivacije (281) in te datoteke prav zdaj ureja druga seja; opis velja za stanje 2026-09-24.\r\n\r\n## Povezani procesi\r\n\r\n- [Izhod v SAOP](izhod-v-saop.md): priprava skupine.\r\n- [Množični izhod](mnozicni-izhod.md): drugi vir skupin.\r\n- [Zgodovina in popravki SAOP](zgodovina-in-popravki-saop.md): kaj je bilo poslano, potrditev in popravek.\r\n- [Varovalke](../01-nadzor/varovalke.md): potrditev deaktivacij na `/varovalke`.\r\n- [Cene in ceniki](../07-poslovanje/cene-in-ceniki.md): cene v isti vrsti.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): posel `SAOP_OUTBOUND_DISPATCH` in SAOP-pas.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): zajem, ki omogoči potrditev odmeva.\r\n"},{"pot":"05-izhod-saop/izhod-v-saop.md","vsebina":"---\r\nid: izhod-v-saop\r\nnaslov: Izhod v SAOP – priprava novih artiklov in sprememb\r\npodrocje: 05-izhod-saop\r\nstanje: delno\r\nbere: [pim.izdelek, pim.nastavitve, excel.izdelki]\r\npise: [pim.saop-vrsta]\r\nstrani: [/saop/artikli, /saop, /saop/polja]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/SaopItems.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/Saop.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/SaopFields.razor, PIM_Solution/src/PIM.Intranet/Services/SaopItemWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/SaopFieldLabels.cs, PIM_Solution/src/PIM.Intranet/Services/SaopOrganizationContext.cs, PIM_Solution/src/PIM.Outbound/SaopItem*.cs, PIM_Solution/src/PIM.Outbound/SaopDocumentBuilder.cs, PIM_Solution/src/PIM.Outbound/SaopIntentResolver.cs, PIM_Solution/src/PIM.Operations/WorkbookChangeMapper.cs, PIM_Solution/src/PIM.Intranet/Components/Shared/PimTab.cs]\r\nmigracije: [89, 152, 169, 193, 236, 245, 273, 281]\r\n---\r\n\r\n# Izhod v SAOP – priprava novih artiklov in sprememb\r\n\r\n\u003e **Področje:** Izhod v SAOP · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nNa enem mestu pripravi nove artikle za SAOP in spremembe obstoječih (samo polja, ki jih sme pisati PIM). Rezultat je nadzorovana skupina sprememb v čakalni vrsti za SAOP; v SAOP gre šele po odobritvi.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Strani `/saop/artikli` ne vidi; spremembe lahko sproži prek kartice ali uvoza, če ima pravico. |\r\n| Urednik kataloga | Vnese šifre ali naloži Excel, izbere polja, vpiše vrednosti, odda skupino v vrsto in jo po potrebi odobri ali prekliče. |\r\n| Skrbnik | Nastavi zapisovalno pot (profil `SAOP_PRODUCT` v `dbo.IntegrationProfile`) in lastništvo polj; odloča, katera polja sme PIM pisati. |\r\n| Avtomatika (PIM) | Za vsak artikel ugotovi, ali ga SAOP že pozna (nov → POST, obstoječ → PATCH), sestavi dokument in pokaže manjkajoča obvezna polja. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik na `/saop/artikli` (meni »Izhod v SAOP«, zavihek »Artikli«).\r\n- **Po urniku:** ni; priprava je vedno ročna.\r\n- **Ob dogodku:** enake spremembe v vrsto pošljejo tudi kartica izdelka (vir `CARD`), uvoz delovnega lista (`EXCEL`), novi artikli dobaviteljev (`XML`), popravek iz zgodovine in množično urejanje (`BULK`) — vse končajo na isti čakalni vrsti.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifre artiklov (ročno ali Excel predloga) in nove vrednosti polj | Uporabnik / Excel |\r\n| **Vhod** | Trenutne vrednosti artikla, ali ga SAOP pozna, privzetki za nov artikel, pogodba polj | PIM |\r\n| **Izhod** | Sporočila v odhodni vrsti (eno na polje) v skupini, stanje »Čaka odobritev« | PIM (`out.OutboxMessage`, `out.OutboundBatch`) |\r\n| **Izhod** | Po odobritvi: dokument POST ali PATCH v SAOP | SAOP (glej [Čakalna vrsta in pošiljanje](cakalna-vrsta-in-posiljanje-saop.md)) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Vnese šifre ali naloži Excel]\r\n    B --\u003e C[Izbere polja in vpiše vrednosti]\r\n    C --\u003e D[Klikne Pripravi spremembe za pošiljanje]\r\n    G[Odobri ali prekliče skupino]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    E[[Preveri obstoj v SAOP in sestavi dokument]] --\u003e F{Manjka obvezno polje?}\r\n    F -- da --\u003e C\r\n    H[(Skupina v vrsti za SAOP)] --\u003e I\u003eČaka odobritev]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    J[(Artikel v SAOP)]\r\n  end\r\n  B --\u003e E\r\n  D --\u003e H\r\n  I --\u003e G\r\n  G --\u003e J\r\n  F -- ne --\u003e D\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A endp; class B,C,D,G user; class E,F auto; class I wait; class H,J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/saop/artikli` | Odpreš »Izhod v SAOP« (zavihek »Artikli«) in izbereš podjetje. | Naloži se pogodba dokumenta in stanje povezave. Menjava podjetja počisti tabelo. | Čip »SAOP: Povezava je pripravljena«; če ni, rumeno opozorilo (pripraviš lahko, oddati ne). |\r\n| 2a | Urednik | `/saop/artikli` | Za nekaj artiklov: prilepiš šifre v »Šifre artiklov« → »Preveri in dodaj artikle«. | Za vsako šifro se prebere stanje v PIM in ali ga SAOP pozna; največ 300 vrstic. | Povzetek »N artiklov v pripravi«, čipa »Novih (POST)« in »Sprememb (PATCH)«. |\r\n| 2b | Urednik | `/saop/artikli` | Za več artiklov: »Prenesi predlogo (XLSX)«, izpolniš, izbereš datoteko (do 8 MB). | Zvezek se prebere, stolpci se preslikajo na pisljiva polja; neznani stolpci so navedeni kot prezrti. Uvoz sam ne pošlje ničesar. | Sporočilo »Prebranih N vrstic, prevzetih M vrednosti«. |\r\n| 3 | Urednik | `/saop/artikli` | V koraku 2 klikaš polja (čipi), ki jih želiš spreminjati; »Ponastavi priporočeni izbor« vrne obvezna polja za nov artikel + naziv in EAN. | Izbrana polja postanejo stolpci tabele. Polja z oznako »upravlja SAOP« so zaklenjena. | »Izbranih polj: N«. |\r\n| 4 | Urednik | `/saop/artikli` | V koraku 3 vpišeš vrednosti; z vrstico »Velja za vse« in gumbom »↓« vpišeš isto vrednost v vse vrstice. | Po vsakem vnosu se dokument sestavi znova; stolpec »Dokument« kaže »N polj«, »manjka N«, »nič za poslati« ali »napaka«. »Tehnični predogled XML« pokaže dokument. | Povzetek »Pripravljenih / Za dopolniti / Sprememb« v koraku 4. |\r\n| 5 | Urednik | `/saop/artikli` | Klikneš »Pripravi N sprememb za pošiljanje«. | Samo pripravljene vrstice in samo neprazne vrednosti gredo v `out.EnqueueSaopItemChanges`; nastane skupina. Gumb **še ne pošlje v SAOP**. | »Priprava je zabeležena v skupini N. Uvrščenih · že v vrsti · zavrnjenih«; zavrnjene vrstice z razlogom v tabeli. |\r\n| 6 | Urednik | `/saop/artikli` | Če povezava zahteva odobritev: »Odobri skupino N« ali »Prekliči skupino«. | Odobritev preda sporočila v stanje za pošiljanje; deaktivacije (Aktiven = Ne) ostanejo zadržane in se pokažejo v pasici za potrditev. | »Odobrenih sporočil: N«; povezava »Odpri čakalno vrsto«. |\r\n| 7 | Urednik | `/outbound` | Nadaljuješ na čakalni vrsti. | Glej [Čakalna vrsta in pošiljanje](cakalna-vrsta-in-posiljanje-saop.md). | — |\r\n| 8 | Urednik | `/saop` | Za pregled klikneš zavihek »Pregled«. | Števci po entitetah (Artikli, Cene, Ceniki, Stranke, Dokumenti): Čaka, V vrsti, Poslano, Potrjeno, Napake; tabeli neuspelih sporočil in skupin z gumboma »Pošlji znova« in »Pošlji znova vse neuspele«. | Števec »Napake« je 0. |\r\n| 9 | Kdorkoli | `/saop/polja` | Pregledaš, katera polja sme PIM pisati. | Samo bralni seznam: polje, XML element, sekcija, oblika, obvezno ob dodajanju. | — |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **V SAOP se nič ne pošlje samodejno.** Priprava ustvari samo skupino v vrsti; pošiljanje sledi odobritvi.\r\n- **Prazna celica pomeni »ne spreminjaj«** — obstoječi podatki v SAOP se ne izbrišejo. Prazne vrednosti se na tej strani ne uvrstijo.\r\n- **Metode POST/PATCH ne izbira uporabnik**; določi jo PIM glede na to, ali SAOP artikel pozna (`ErpExistence`). Ob napačni izbiri se pošiljatelj sam popravi.\r\n- **Nov artikel brez obveznih polj ne odide** (»Za nov artikel manjka …«), da ga SAOP ne zavrne z 409.\r\n- **Samo polja v lasti PIM** so pisljiva; ostala (»upravlja SAOP«) se popravijo v SAOP.\r\n- **Zadnja sprememba zmaga:** starejša neposlana sprememba istega polja postane »Nadomeščeno«.\r\n- **PIM ima vrednost takoj:** kartica in uvoz polje zapišeta v PIM takoj; zajem iz SAOP polja z neposlano spremembo ne povozi (273).\r\n- **Deaktivacija čaka potrditev** (281): sprememba »Aktiven = Ne« se ob odobritvi preskoči, dokler je nekdo izrecno ne potrdi.\r\n- **Blokirajoče napake validacije ne ustavijo vpisa** (236); zavora je samo validacija SAOP ob prejemu.\r\n- **Vloge:** `/saop/artikli`, `/saop`, `/saop/zgodovina` samo ADMIN in CATALOG_EDITOR; vpis v vrsto, odobritev in preklic zahtevajo `SaopWrite`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Povezava za artikle ni nastavljena / je izklopljena« | Profil `SAOP_PRODUCT` manjka ali je izklopljen (napaka 51001). | Skrbnik vklopi profil za to podjetje. |\r\n| Stolpec »Dokument«: »manjka N« | Nov artikel brez obveznega polja. | Dodaj polje med stolpce in vpiši vrednost; vrstica brez tega ne gre v vrsto. |\r\n| »nič za poslati« | Vrednosti niso vpisane ali so enake. | Vpiši novo vrednost ali odstrani vrstico (»×«). |\r\n| Zavrnjena vrstica z razlogom | Polje ni pisljivo, vrednost ni »da/ne« ali ni število, predolga vrednost, artikla ni v podjetju. | Popravi vrednost ali artikel po razlogu. |\r\n| »Izpuščenih N šifer« | Več kot 300 vrstic. | Razdeli na več delov ali uporabi uvoz delovnega lista. |\r\n| Artikel po odobritvi še »Čaka odobritev« | Deaktivacija čaka potrditev (281). | Potrdi v pasici »V SAOP … neaktiven« ali na `/varovalke`. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/SaopItems.razor` (`/saop/artikli`), `Saop.razor` (`/saop`), `SaopFields.razor` (`/saop/polja`); zavihki `SaopTabs` v `Components/Shared/PimTab.cs`; izbrano podjetje se deli med stranmi prek `SaopOrganizationContext`.\r\n- **Storitve / delavci:** `SaopItemWriteService` (pogodba, stanje artikla, `BuildPlan`, `PreviewQueuedAsync`, `MaxRows = 300`), `SaopWriteService` (`EnqueueAsync` → `out.EnqueueSaopItemChanges`, `ApproveBatchAsync`, `CancelBatchAsync`, `PreviewWorkbook`); knjižnica `PIM.Outbound` (`SaopItemPlanner`, `SaopDocumentBuilder`, `SaopIntentResolver`); predloga `izvoz/izdelki.xlsx?predloga=saop`.\r\n- **Tabele in pogledi:** `out.OutboxMessage`, `out.OutboundBatch`, `out.SaopXmlField`, `out.SaopAddDefault`, `out.OwnershipPolicy`, `dbo.IntegrationProfile`, `canon.Product.ErpExistence`; procedure `out.GetSaopXmlContract`, `out.GetSaopItemWriteState`, `intranet.GetWritableSaopFields`, `out.ApproveOutboundBatch`, `out.CancelOutboundBatch`, `intranet.GetOutboundBatches`.\r\n- **Migracije:** 089 (množične spremembe, prekrivka), 152 (odobritev po artiklu), 169 (obstoj v SAOP), 193 (pošiljanje po šifri), 236 (umik ERP varovalke), 245 (ERP v PIM takoj), 273 (neposlana sprememba ima prednost), 281 (deaktivacije).\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ `/saop/polja` vedno kaže samo privzeto (prvo) podjetje; izbirnika ni. Zavihka za to stran v meniju SAOP ni.\r\n- ⚠️ Pregled `/saop` šteje entitete po imenu (»Cene«, »Stranke« …) in za entitete brez zapisov piše »pot nazaj še ne obstaja«, kar za cene ne drži več (265).\r\n- ⚠️ Po odobritvi na tej strani se artikel **ne** poskusi poslati takoj (za razliko od gumba »Odobri« na `/outbound`); pošlje ga šele »Pošlji zdaj« na `/outbound` ali odhodni posel, ki je privzeto izklopljen.\r\n- ⚠️ Področje deaktivacij (281: `SaopItems.razor`, `SaopSafeguardBanner`, `SaopDeactivationConfirm`, `SafeguardService`) prav zdaj ureja druga seja; opis velja za stanje datotek 2026-09-24.\r\n- ⚠️ Ročni zadržek za kanal ERP (`/kakovost/artikli`) na to pot ne vpliva.\r\n\r\n## Povezani procesi\r\n\r\n- [Čakalna vrsta in pošiljanje v SAOP](cakalna-vrsta-in-posiljanje-saop.md): odobritev in dejansko pošiljanje.\r\n- [Množični izhod](mnozicni-izhod.md): ena vrednost za veliko artiklov.\r\n- [Zgodovina in popravki SAOP](zgodovina-in-popravki-saop.md): kaj je bilo poslano in popravek.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md) in [Uvoz delovnega lista](../03-izdelki/uvoz-delovnega-lista.md): drugi viri sprememb za SAOP.\r\n- [Novi artikli dobaviteljev](../02-vhodi/novi-artikli-dobaviteljev.md): kandidati iz XML v vrsto za SAOP.\r\n- [Varovalke](../01-nadzor/varovalke.md): potrditev deaktivacij.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): potrditev, da je SAOP spremembo prevzel.\r\n"},{"pot":"05-izhod-saop/mnozicni-izhod.md","vsebina":"---\r\nid: mnozicni-izhod\r\nnaslov: Množični izhod v SAOP (množično urejanje)\r\npodrocje: 05-izhod-saop\r\nstanje: delno\r\nbere: [pim.nastavitve, excel.izdelki]\r\npise: [pim.saop-vrsta]\r\nstrani: [/izvozi/mnozicno]\r\nposli: []\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/BulkOutbound.razor, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Operations/WorkbookChangeMapper.cs, PIM_Solution/src/PIM.Intranet/Components/Shared/SaopSafeguardBanner.razor]\r\nmigracije: [89, 152, 245, 281]\r\n---\r\n\r\n# Množični izhod v SAOP (množično urejanje)\r\n\r\n\u003e **Področje:** Izhod v SAOP · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nHitro nastavi isto vrednost enega polja za veliko artiklov ali uvozi Excel z več polji in vse uvrsti v vrsto za SAOP. Rezultat je skupina sporočil, ki jo uporabnik odobri ali prekliče.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Stran vidi, vpis v vrsto pa zahteva `SaopWrite`, zato ji ne uspe (⚠️). |\r\n| Urednik kataloga | Vpiše šifre, izbere polje in vrednost ali naloži Excel; skupino odobri ali prekliče. |\r\n| Skrbnik | Določa, katera polja so pisljiva. |\r\n| Avtomatika (PIM) | Preveri vsako vrstico (lastništvo polja, oblika vrednosti, podvojitve) in zapiše izid. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik odpre `/izvozi/mnozicno` neposredno ali s seznama izdelkov (šifre in podjetje pridejo v naslovu `?items=…\u0026podjetje=…`); povezava je tudi na strani uvoza izdelkov in na `/varovalke`.\r\n- **Po urniku:** ni.\r\n- **Ob dogodku:** ni.\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Šifre artiklov + eno polje + nova vrednost | Uporabnik |\r\n| **Vhod** | Excel: prvi stolpec »Šifra artikla« ali `ItemID`, ostali stolpci imena polj | Uporabnik |\r\n| **Izhod** | Skupina sporočil v vrsti, stanje »Čaka odobritev« | PIM (`out.OutboxMessage`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B{Ročno ali Excel?}\r\n    B -- ročno --\u003e C[Šifre, polje in vrednost]\r\n    B -- Excel --\u003e D[Izbere datoteko in pregleda predogled]\r\n    C --\u003e E[Klikne Uvrsti v vrsto]\r\n    D --\u003e E\r\n    G[Odobri skupino ali Prekliči skupino]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    F[[Preveri vrstice in ustvari skupino]] --\u003e H\u003eČaka odobritev]\r\n    I\u003eČaka pošiljanje na Čakalni vrsti]\r\n  end\r\n  E --\u003e F\r\n  H --\u003e G\r\n  G --\u003e I\r\n  I --\u003e J([Konec])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,J endp; class B,C,D,E,G user; class F auto; class H,I wait;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/izvozi/mnozicno` | Odpreš stran (npr. z izbranimi izdelki s seznama izdelkov). | Naloži se seznam pisljivih polj za podjetje; šifre iz naslova se vpišejo v polje. | V glavi »… podjetja NAZIV«. |\r\n| 2a | Urednik | `/izvozi/mnozicno` | Razdelek 1: v »Šifre artiklov« vpišeš šifre, izbereš »Polje«, vpišeš »Nova vrednost« (za da/ne: da ali ne) → »Uvrsti v vrsto (N artiklov)«. | `out.EnqueueSaopItemChanges` z virom `BULK`. | Razdelek »3. Izid«: skupina, uvrščenih, že v vrsti, zavrnjenih. |\r\n| 2b | Urednik | `/izvozi/mnozicno` | Razdelek 2: izbereš `.xlsx` (do 8 MB), pregledaš predogled prvih 20 vrstic in opozorila → »Uvrsti N sprememb v vrsto«. | Zvezek se preslika na pisljiva polja; prazna celica pomeni »ne spreminjaj«; vir `EXCEL`. | Isti izid; stolpci brez polja so navedeni kot neuvoženi. |\r\n| 3 | Urednik | `/izvozi/mnozicno` | »Odobri skupino« ali »Prekliči skupino«. | `out.ApproveOutboundBatch` / `out.CancelOutboundBatch`; deaktivacije ostanejo zadržane in se pokažejo v pasici. | »Odobrenih sporočil: N« ali »Preklicanih sporočil: N«. |\r\n| 4 | Urednik | `/izvozi/mnozicno` | Če se pokaže pasica »V SAOP N artiklov bo neaktivnih«, pregledaš seznam in potrdiš ali »Ne zdaj«. | Glej [Čakalna vrsta in pošiljanje](cakalna-vrsta-in-posiljanje-saop.md). | — |\r\n| 5 | Urednik | `/outbound` | Odobrene artikle pošlješ z »Pošlji zdaj«. | Odobritev na tej strani **ne** pošlje takoj. | Artikli preidejo v Zgodovino kot »Poslano«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Na voljo so samo polja, ki jih sme PIM pisati; ostala so last SAOP.\r\n- Nič ne odide, dokler skupine ne odobriš; tudi po odobritvi je treba poslati (glej razdelek 10).\r\n- Zadnja sprememba istega polja zmaga; starejša neposlana postane »Nadomeščeno«.\r\n- Deaktivacije (Aktiven = Ne) čakajo izrecno potrditev (281).\r\n- Stran **ne** zapiše vrednosti v PIM (za razliko od kartice in uvoza delovnega lista); ⚠️ glej razdelek 10.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Sprememb trenutno ni mogoče uvrstiti v vrsto« | Vloga brez `SaopWrite` ali povezava ni omogočena. | Prijavi se z vlogo urednika; skrbnik preveri profil `SAOP_PRODUCT`. |\r\n| Zavrnjene vrstice | Artikel ne obstaja v podjetju, polje ni pisljivo, napačna oblika vrednosti. | Popravi po stolpcu »Razlog«. |\r\n| »Stolpci brez ustreznega polja« | Ime stolpca v Excelu ne ustreza polju. | Uporabi imena iz seznama polj (XML element ali slovenski naslov). |\r\n| Po odobritvi se v SAOP nič ne zgodi | Odhodni posel je izklopljen. | Na `/outbound` klikni »Pošlji zdaj«. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/BulkOutbound.razor`; parametra naslova `items`, `podjetje`.\r\n- **Storitve / delavci:** `SaopWriteService` (`GetWritableFieldsAsync`, `PreviewWorkbook`, `EnqueueAsync`, `ApproveBatchAsync`, `CancelBatchAsync`), `PIM.Operations/WorkbookChangeMapper.cs`.\r\n- **Tabele in pogledi:** `out.OutboxMessage`, `out.OutboundBatch`, `intranet.GetWritableSaopFields`, `out.EnqueueSaopItemChanges`.\r\n- **Migracije:** 089, 152, 245, 281.\r\n- **Urniki:** ni.\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Besedilo »Odobritev skupino samo uvrsti v vrsto. Pošlje jo šele odhodni worker.« — odhodni posel je privzeto izklopljen, zato odobrena skupina obvisi, dokler je nekdo ne pošlje na `/outbound`.\r\n- ⚠️ Ročni vnos s prazno »Nova vrednost« uvrsti prazno vrednost (storitev: »prazna vrednost pomeni izpraznitev polja«); to je v nasprotju s pravilom »SAOP ne dobi praznih vrednosti« in s predlogo, kjer prazno pomeni »ne spreminjaj«. Ali baza prazno zavrne, iz kode ni jasno.\r\n- ⚠️ Spremembe se ne zapišejo v PIM takoj (kartica, uvoz in popravek iz zgodovine jih zapišejo); PIM do zajema kaže staro vrednost.\r\n- ⚠️ Stran nima izbirnika podjetja; brez `?podjetje=` dela s privzetim (prvim) podjetjem.\r\n- ⚠️ V glavi in meniju se stran imenuje »Množično urejanje«, v registru dostopov »Množični izhod« (področje splet).\r\n- ⚠️ Stran je odprta vlogi COMMERCIAL, vpis pa ji ne uspe.\r\n\r\n## Povezani procesi\r\n\r\n- [Izhod v SAOP](izhod-v-saop.md): bogatejša priprava z več polji in predogledom dokumenta.\r\n- [Čakalna vrsta in pošiljanje v SAOP](cakalna-vrsta-in-posiljanje-saop.md): pošiljanje odobrene skupine.\r\n- [Uvoz delovnega lista](../03-izdelki/uvoz-delovnega-lista.md): uvoz, ki vrednosti zapiše v PIM in v vrsto.\r\n- [Iskanje in kartica izdelka](../03-izdelki/iskanje-in-kartica-izdelka.md): izbor izdelkov za množično urejanje.\r\n- [Varovalke](../01-nadzor/varovalke.md): potrditev deaktivacij.\r\n"},{"pot":"05-izhod-saop/obvestila-odhodne-poti.md","vsebina":"---\r\nid: obvestila-odhodne-poti\r\nnaslov: Obvestila odhodne poti v SAOP (potrjevanje napak in stopnjevanje)\r\npodrocje: 05-izhod-saop\r\nstanje: delno\r\nbere: [pim.saop-vrsta, pim.uporabniki]\r\npise: [obvestila]\r\nstrani: [/izvozi/obvestila]\r\nposli: [SAOP_OUTBOUND_DISPATCH, ALERT_DELIVERY]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/OutboundEvents.razor, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/workers/PIM.AlertDispatcher/Program.cs]\r\nmigracije: [90, 196, 209]\r\n---\r\n\r\n# Obvestila odhodne poti v SAOP (potrjevanje napak in stopnjevanje)\r\n\r\n\u003e **Področje:** Izhod na splet (vsebinsko Izhod v SAOP) · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nVsaka sprememba, ki gre iz PIM v SAOP, pusti sled po korakih (uvrščeno, odobreno, poslano, potrjeno, zavrnjeno …). Uspeh je tih; napaka se pokaže na `/izvozi/obvestila` in mora jo nekdo potrditi, sicer se po preteku roka pošlje po e-pošti.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda obvestila in potrdi napako, ko jo je obravnaval. |\r\n| Urednik kataloga | Enako; napako odpravi na kartici artikla ali v odhodni vrsti. |\r\n| Skrbnik | Enako; poskrbi, da imajo uporabniki e-poštni naslov in da je dostava alarmov vklopljena. |\r\n| Avtomatika (PIM) | Zapiše obvestilo ob vsakem koraku odhodnega dokumenta; nepotrjene napake stopnjuje v alarm in e-pošto. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik odpre `/izvozi/obvestila` (vloge ADMIN, CATALOG_EDITOR, COMMERCIAL).\r\n- **Po urniku:** `ALERT_DELIVERY` (`PIM.AlertDispatcher`, vsakih 300 s) stopnjuje nepotrjene napake in pošlje e-pošto, če je dostava vklopljena.\r\n- **Ob dogodku:** zaključek odhodnega dokumenta v SAOP (poslano, zavrnjeno, odklon, samopopravek).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Koraki odhodnih dokumentov (artikel, polje, izid) | PIM (odhodna vrsta) |\r\n| **Izhod** | Potrjeno obvestilo (kdo, kdaj) | PIM |\r\n| **Izhod** | Alarm in e-pošta za nepotrjene napake | Obvestila |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph S[\"🏢 SAOP\"]\r\n    A([Odgovor SAOP na dokument])\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    B[[Zapis koraka]]\r\n    C{Napaka?}\r\n    D([Tiho, v redu])\r\n    E\u003eNapaka čaka potrditev]\r\n    F{Potrjena v roku?}\r\n    G[[Stopnjevanje v alarm in e-pošto]]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    H[Pregleda in klikne Potrdi]\r\n  end\r\n  A --\u003e B --\u003e C\r\n  C -- ne --\u003e D\r\n  C -- da --\u003e E --\u003e F\r\n  F -- ne --\u003e G --\u003e H\r\n  F -- da --\u003e H\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,D endp; class H user; class B,C,F,G auto; class E wait;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Avtomatika | — | — | Ob vsakem koraku odhodnega dokumenta nastane obvestilo z resnostjo V redu, Opozorilo ali Napaka. | — |\r\n| 2 | Urednik / komerciala | `/izvozi/obvestila` | Pogledaš kartice »Nepotrjene napake«, »Opozorila«, »Stopnjevanih«, »Tihih (24 h)«. Privzeto je obkljukano »Pokaži samo nepotrjena«. | Tabela: kdaj, resnost, korak, artikel in polje, kaj se je zgodilo, kaj naredi. | Števci na karticah. |\r\n| 3 | Urednik | Kartica artikla ali `/outbound` | Odpraviš vzrok po navodilu v stolpcu »Kaj naredi«. | — | — |\r\n| 4 | Urednik / komerciala | `/izvozi/obvestila` | Pri vrstici klikneš **Potrdi**. | Obvestilo je potrjeno s tvojim imenom; opozorilo se ne ponavlja več. | Sporočilo »Obvestilo je potrjeno …«; v stolpcu Dejanje tvoje ime. |\r\n| 5 | Avtomatika | — | — | Napaka, ki ni potrjena v dogovorjenem času, postane alarm in gre po e-pošti. | Rdeče sporočilo »N obvestil ni bilo potrjenih …«. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Uspešne spremembe so tihe (resnost »V redu«, brez gumba).\r\n- Stopnjevanje se ponavlja, dokler obvestilo ni potrjeno.\r\n- E-pošta gre samo uporabnikom z vpisanim naslovom in samo, če je dostava alarmov vklopljena.\r\n- Potrditev ne popravi vzroka — samo utiša opozorilo.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Obvestil trenutno ni mogoče naložiti.« | Povezava z bazo | Osveži; skrbnik preveri bazo. |\r\n| Napaka se ponavlja po e-pošti | Obvestilo ni potrjeno | Potrdi ga po pregledu. |\r\n| Ni e-pošte kljub stopnjevanju | Uporabnik brez naslova ali dostava izklopljena | Skrbnik: `/uporabniki`, nastavitev dostave. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/OutboundEvents.razor`\r\n- **Storitve / delavci:** `SaopWriteService.GetEventsAsync`, `GetEventCountsAsync`, `AcknowledgeAsync`; `PIM.AlertDispatcher` (`ops.EscalateOutboundEvents`).\r\n- **Tabele in pogledi:** `ops.OutboundEvent`, `ops.Alert`, `ops.AlertDelivery`, `sec.LocalUser.Email`, `intranet.AcknowledgeOutboundEvent`.\r\n- **Migracije:** 090, 196, 209.\r\n- **Urniki:** `ALERT_DELIVERY` (300 s), `SAOP_OUTBOUND_DISPATCH` (privzeto izklopljen).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Stran je v meniju pod »Izhod na splet« (dovoljenje `view.web.events`, opis »Napake in dogodki spletnega izvoza«), vsebina pa so samo dogodki poti v **SAOP**. O spletnem izvozu (`katalog.csv`) tu ni ničesar. Predlog: premakniti v področje 05-izhod-saop.\r\n- ⚠️ Stran kaže samo trenutno izbrano organizacijo.\r\n- ⚠️ Stopnjevanje po e-pošti je odvisno od stikala dostave (`PIM_ALERT_DELIVERY_ENABLED`); ali je vklopljeno, iz kode ni razvidno.\r\n\r\n## Povezani procesi\r\n\r\n- [Izhod v SAOP](../05-izhod-saop/izhod-v-saop.md): odhodna vrsta, iz katere nastajajo obvestila.\r\n- [Zgodovina in popravki SAOP](../05-izhod-saop/zgodovina-in-popravki-saop.md).\r\n- [Uporabniki in vloge](../09-administracija/uporabniki-in-vloge.md): e-poštni naslovi.\r\n- [Nadzor sistema](../09-administracija/nadzor-sistema.md): alarmi in dostava.\r\n"},{"pot":"05-izhod-saop/zgodovina-in-popravki-saop.md","vsebina":"---\r\nid: zgodovina-in-popravki-saop\r\nnaslov: Zgodovina, potrditve in popravki poslanega v SAOP\r\npodrocje: 05-izhod-saop\r\nstanje: delno\r\nbere: [pim.saop-vrsta, pim.izdelek, saop.artikli]\r\npise: [pim.saop-vrsta, pim.izdelek]\r\nstrani: [/saop/zgodovina, /saop/odkloni]\r\nposli: [SAOP_PRODUCT_IMPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/SaopHistory.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/SaopDrifts.razor, PIM_Solution/src/PIM.Intranet/Services/SaopWriteService.cs, PIM_Solution/src/PIM.Intranet/Services/ProductEditService.cs, PIM_Solution/src/PIM.Intranet/Services/ProductWorkbookService.cs, PIM_Solution/src/PIM.Outbound/EchoVerifier.cs]\r\nmigracije: [21, 46, 243, 245, 273]\r\n---\r\n\r\n# Zgodovina, potrditve in popravki poslanega v SAOP\r\n\r\n\u003e **Področje:** Izhod v SAOP · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nPokaže, kaj je bilo kdaj pripravljeno, odobreno in poslano v SAOP, kaj je SAOP odgovoril in ali je vrednost potrjena. Iz izbranih poslanih sprememb omogoča popravek (novo polje in vrednost), ki velja v PIM takoj, v SAOP pa po odobritvi.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Strani `/saop/zgodovina` ne vidi; `/saop/odkloni` lahko odpre. |\r\n| Urednik kataloga | Išče po zgodovini, pregleda napake, ponovno pošlje neuspelo, pripravi popravek poslanih vrednosti. |\r\n| Skrbnik | Pregleda odgovore SAOP in odklone pri težavah. |\r\n| Avtomatika (PIM) | Zajem iz SAOP prinese vrednost, s katero se poslano sporočilo potrdi ali označi kot odklon. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** urednik odpre `/saop/zgodovina` (zavihek »Zgodovina« ali »Zgodovina pošiljanja« na `/saop/artikli`).\r\n- **Po urniku:** zajem `SAOP_PRODUCT_IMPORT` (urni) prinese vrednosti iz SAOP, potrebne za potrditev.\r\n- **Ob dogodku:** napaka v SAOP ali ugotovitev, da je bila poslana napačna vrednost (npr. artikli poslani kot neaktivni).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Vsa sporočila podjetja z vrednostjo, odobriteljem, časom pošiljanja, odgovorom in napako | PIM (`out.OutboxMessage`) |\r\n| **Vhod** | Vrednost iz zadnjega zajema SAOP | SAOP prek zajema |\r\n| **Izhod** | Popravek: nova sprememba v vrsti (čaka odobritev) in takojšen zapis v PIM | PIM (`out.OutboxMessage`, `canon`) |\r\n| **Izhod** | Ponovni poskus neuspelega sporočila | PIM (vrsta) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Začetek]) --\u003e B[Filtrira Zgodovino po stanju, odobritelju, obdobju]\r\n    B --\u003e C{Kaj je narobe?}\r\n    C -- napaka pošiljanja --\u003e D[Poglej napako in Pošlji znova]\r\n    C -- napačna vrednost --\u003e E[Izbere sporočila, polje in novo vrednost]\r\n    E --\u003e F[Klikne Pripravi popravek]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    G[[Vrednost v PIM takoj]] --\u003e H\u003eČaka odobritev na Čakalni vrsti]\r\n    I[[Potrditev odmeva po zajemu]]\r\n  end\r\n  subgraph S[\"🏢 SAOP\"]\r\n    J[(Artikel v SAOP)]\r\n  end\r\n  F --\u003e G\r\n  D --\u003e H\r\n  H --\u003e J\r\n  J --\u003e I\r\n  I --\u003e K([Potrjeno ali odklon])\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,K endp; class B,C,D,E,F user; class G,I auto; class H wait; class J data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik | `/saop/zgodovina` | Izbereš podjetje, entiteto, stanje, odobritelja, obdobje (privzeto zadnjih 30 dni) in vpišeš iskanje (ključ, polje, cilj, vrednost). | Seznam vseh operacij, 10 na stran, najnovejše najprej. | Števec »N operacij«; stolpci Čas, Entiteta / ključ, Operacija, Polja, Vrednost, Odobril, Poslano, Odgovor ERP, Potrjeno, Rezultat. |\r\n| 2 | Urednik | `/saop/zgodovina` | Pri »Napaka« klikneš »Poglej napako«, nato »Pošlji znova«. | `out.RequeueOutboxMessage` vrne sporočilo v vrsto. | »Znova poslanih v čakalno vrsto: 1«; nato na `/outbound` »Pošlji zdaj«. |\r\n| 3 | Urednik | `/saop/zgodovina` | Za popravek označiš sporočila artiklov (ali »Izberi vse filtrirane (N)«). | Če so izbrana sporočila istega polja, se polje izbere samo. | Orodna vrstica »Izbranih sporočil: N (artiklov: M)«. |\r\n| 4 | Urednik | `/saop/zgodovina` | Izbereš polje in novo vrednost (za da/ne izbirnik Da/Ne) → »Pripravi popravek (čaka odobritev)«. | Za vsak izbran artikel nova sprememba v vrsto (vir `BULK`), sprejete se takoj zapišejo v PIM (`SaveErpFieldsBulkAsync`); starejša neposlana sprememba istega polja postane »Nadomeščeno«. | »Pripravljen popravek za N artiklov (skupina M) — v PIM velja takoj, v SAOP gre šele, ko ga odobriš na Čakalni vrsti.« |\r\n| 5 | Urednik | `/outbound` | Odobriš popravek (glej [Čakalna vrsta in pošiljanje](cakalna-vrsta-in-posiljanje-saop.md)). | Pošiljanje v SAOP. | V Zgodovini nova vrstica »Poslano«. |\r\n| 6 | Avtomatika + urednik | `/outbound` | Po naslednjem zajemu klikneš »Preveri potrditve SAOP«. | Poslana vrednost se primerja z vrednostjo iz zajema: ujemanje → potrjeno, razlika → odklon. | Stolpec »Potrjeno: Da« v Zgodovini; odklon je označen na `/outbound` in na `/saop/odkloni`. |\r\n| 7 | Urednik | `/saop/odkloni` | Pregledaš odklone (samo sporočila z zapisanim odklonom) in po potrebi »Pošlji znova«. | Sporočilo se pripravi za ponovni poskus. | »Operacija je pripravljena za ponovni poskus.« |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- **Popravek ne gre v SAOP sam:** vedno čaka odobritev na Čakalni vrsti.\r\n- **PIM ima popravljeno vrednost takoj**; zajem iz SAOP je ne povozi, dokler sprememba ni poslana (273).\r\n- **Poslana vrednost ni zaščitena:** po pošiljanju zajem prinese, kar ima SAOP, da je mogoče ločiti potrditev od odklona.\r\n- Popravek je mogoč samo za sporočila artiklov (`SAOP_PRODUCT`, entiteta `Product`) in samo za pisljiva polja.\r\n- Deaktivacija v popravku čaka izrecno potrditev (281).\r\n- Stanja so poenostavljena: »Čaka odobritev«, »V obdelavi«, »Poslano« (tudi potrjeno), »Napaka« (tudi odklon), »Preklicano«, »Nadomeščeno«.\r\n- **Vloge:** `/saop/zgodovina` ADMIN in CATALOG_EDITOR; popravek zahteva `SaopWrite`.\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Potrjeno« je ves čas »—« | Potrditev se izvede samo z gumbom »Preveri potrditve SAOP« po zajemu. | Klikni gumb na `/outbound` po naslednjem zajemu. |\r\n| »Ni zapisano v PIM: izdelek …« | Artikel ne obstaja v PIM ali polje nima mesta v katalogu. | Preveri artikel; sprememba za SAOP je vseeno v vrsti. |\r\n| »Zavrnjeno: …« pri popravku | Napačna oblika vrednosti ali nepisljivo polje. | Popravi vrednost. |\r\n| Starejše operacije manjkajo | Filter »Obdobje« je privzeto 30 dni. | Izberi »Vse obdobje«. |\r\n| Odklon pri pravilni vrednosti | Preverjeno pred zajemom (starejša različica) ali SAOP je vrednost preoblikoval. | Pošlji znova; skrbnik preveri primerjavo. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `PIM.Intranet/Components/Pages/SaopHistory.razor` (`/saop/zgodovina`, parameter `?stanje=`), `SaopDrifts.razor` (`/saop/odkloni`).\r\n- **Storitve / delavci:** `SaopWriteService` (`EnqueueAsync`, `RequeueMessageAsync`, `ResolveProductIdsAsync`, `GetWritableFieldsAsync`), `ProductEditService.SaveErpFieldsBulkAsync`, `ProductWorkbookService.VerifyPendingEchoesAsync` (`out.VerifyEchoBatch`), `IntranetDataService.RetryOutboundAsync`; `PIM.Outbound/EchoVerifier.cs`.\r\n- **Tabele in pogledi:** `out.OutboxMessage` (`DriftDetail`, `ResponseStatusCode`, `ResponseCorrelationId`, `LastError`, `PayloadJson`), `out.OutboxAttempt`; procedure `intranet.GetOutboundMessages` (273: vrne tudi poslano vrednost), `intranet.GetOutboundMessage` (obstaja, ni vezana na stran).\r\n- **Migracije:** 021, 046 (nadomeščanje), 243 (potrditev odmeva), 245, 273.\r\n- **Urniki:** `SAOP_PRODUCT_IMPORT` (urni zajem, pogoj za potrditev).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ `/saop/odkloni` nima zavihka v meniju SAOP, vedno kaže samo privzeto (prvo) podjetje in je v kodi označena kot nedokončana (»strukturiran posnetek poslanih vrednosti … manjka«); stolpca »Kaj je ERP vrnil« in »Razlika« ne kažeta prave primerjave (prazen oz. isti povzetek dvakrat).\r\n- ⚠️ Staro/novo vrednost ob spremembi in poskusi po posameznem pošiljanju (`out.OutboxAttempt`) na strani še niso prikazani.\r\n- ⚠️ Potrditev odmeva ni samodejna; brez klika »Preveri potrditve SAOP« zgodovina ne pokaže »Potrjeno«.\r\n- ⚠️ Stran naloži celotno zgodovino podjetja v pomnilnik; s časom bo počasna.\r\n- ⚠️ `/saop/odkloni` je odprt vlogi COMMERCIAL in »Pošlji znova« tam ne preverja `SaopWrite`.\r\n\r\n## Povezani procesi\r\n\r\n- [Čakalna vrsta in pošiljanje v SAOP](cakalna-vrsta-in-posiljanje-saop.md): odobritev popravka in potrditev odmeva.\r\n- [Izhod v SAOP](izhod-v-saop.md): prvotna priprava sprememb.\r\n- [Zajem iz SAOP](../02-vhodi/zajem-iz-saop.md): vrednosti za potrditev.\r\n- [Zgodovina uvozov in povratek](../01-nadzor/zgodovina-uvozov-in-povratek.md): povratek uvoza, ki je poslal v SAOP.\r\n- [Varovalke](../01-nadzor/varovalke.md): deaktivacije v popravkih.\r\n"},{"pot":"06-izhod-splet/izvoz-magento-profili.md","vsebina":"---\r\nid: izvoz-magento-profili\r\nnaslov: Izvozni profili in izvoz na zahtevo (predogled trenutnih podatkov)\r\npodrocje: 06-izhod-splet\r\nstanje: delno\r\nbere: [pim.izdelek, pim.atributi, pim.besedila, pim.prevodi, pim.kategorije-izdelka, pim.mediji, pim.cene, pim.zaloge, pim.stranke, pim.popusti, pim.validacija, pim.nastavitve]\r\npise: [splet.magento]\r\nstrani: [/splet/izvoz, /izvozi/profili/{Id}]\r\nposli: [WEB_STOCK_EXPORT]\r\nkoda: [PIM_Solution/src/PIM.Intranet/Components/Pages/WebExportBuild.razor, PIM_Solution/src/PIM.Intranet/Components/Pages/ExportProfileDetail.razor, PIM_Solution/src/PIM.Intranet/Services/WebExportBuildService.cs, PIM_Solution/src/PIM.Intranet/Services/GovernanceReadService.cs, PIM_Solution/workers/PIM.B2bWorker/ExportProfileRegistry.cs, PIM_Solution/workers/PIM.B2bWorker/MagentoExportCommand.cs]\r\nmigracije: [142, 146, 150, 151, 201, 202, 216, 217, 251, 271, 272, 277]\r\n---\r\n\r\n# Izvozni profili in izvoz na zahtevo (predogled trenutnih podatkov)\r\n\r\n\u003e **Področje:** Izhod na splet · **Lastnik:** urednik kataloga · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-24, iz kode\r\n\r\n## 1. Namen\r\n\r\nIzvozni profil (register stolpcev) določa, kateri stolpci, v katerem vrstnem redu, s katero glavo in iz katerega polja PIM gredo v datoteko za splet. Na `/splet/izvoz` uporabnik po izbranem profilu pogleda **trenutne** podatke v bazi in jih prenese kot CSV — ne da bi čakal na naslednjo izdelavo `katalog.csv`.\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pripravi predogled in prenese CSV za lastno uporabo (npr. seznam objavljenih artiklov enega spletišča). |\r\n| Urednik kataloga | Preveri, kako bo artikel videti v datoteki, preden se izdela prava; pogleda stolpce profila in preslikave. |\r\n| Skrbnik | Ureja register profilov v bazi (v intranetu ni urejevalnika); vklopi ali izklopi posel `WEB_STOCK_EXPORT`. |\r\n| Avtomatika (PIM) | Iste vrstice sestavi ista procedura kot za pravo datoteko; ročni prenos zapiše v zgodovino. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** uporabnik na `/splet/izvoz` (zavihek **Predogled izvoza** na vseh straneh izhoda na splet in povezava »Predogled trenutnih podatkov PIM« na `/splet`) ali na `/izvozi/profili/{Id}`.\r\n- **Po urniku:** `WEB_STOCK_EXPORT` (profil `MAGENTO_STOCK_PRICES`, datoteka `magento-stock-prices.csv` za vsako podjetje) — od migracije 272 **privzeto izklopljen**.\r\n- **Ob dogodku:** ni (če bi bil `WEB_STOCK_EXPORT` vklopljen, ga sproži uspešen zajem zaloge iz SAOP).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Izbran profil, spletno mesto, iskanje, »Samo objavljeni« | Uporabnik |\r\n| **Vhod** | Register stolpcev (`out.ExportProfile`, `out.ExportColumn`) in podatki PIM | PIM |\r\n| **Izhod** | Predogled največ 200 vrstic (na profilu 20) | Zaslon |\r\n| **Izhod** | Prenos CSV z istim ločilom in obliko števil kot prava datoteka | Uporabnikov računalnik (ne `EXPORT_ROOT`) |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    A([Odpre Pripravi spletni izvoz]) --\u003e B[Izbere profil in filtre]\r\n    B --\u003e C[Klikne Prikaži]\r\n    E[Klikne Prenesi CSV]\r\n  end\r\n  subgraph P[\"🗂️ PIM\"]\r\n    R[(Register stolpcev profila)]\r\n    D[[Ista procedura kot za pravo datoteko]]\r\n    F[[Zapis ročnega prenosa v zgodovino]]\r\n    G([CSV na računalniku uporabnika])\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    H[(katalog.csv ostane nespremenjen)]\r\n  end\r\n  C --\u003e D\r\n  R --\u003e D\r\n  D --\u003e E --\u003e F --\u003e G\r\n  D -. ne osveži .-\u003e H\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,G endp; class B,C,E user; class D,F auto; class R,H data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Urednik / komerciala | `/splet/izvoz` | V »Izvozni profil« izbereš profil (npr. katalog ali stranke). | Ponujeni so samo aktivni profili, ki jih zna sestaviti izvoz na zahtevo, brez SAOP/ERP kanalov. Podjetje je vedno 2. | — |\r\n| 2 | Urednik / komerciala | `/splet/izvoz` | Pri profilu izdelkov izbereš »Spletno mesto«, vpišeš iskanje (šifra, EAN, naziv) in pustiš ali odkljukaš »Samo objavljeni«. Pri strankah sta spletno mesto in objava onemogočena. | — | — |\r\n| 3 | Urednik / komerciala | `/splet/izvoz` | Klikneš **Prikaži** (ali Enter v iskanju); **Počisti filtre** vrne privzete. | Filtri gredo v naslov (`?profil=…\u0026spletisce=…\u0026isci=…\u0026objavljeni=false`), zato povezavo lahko deliš, osvežitev in »nazaj« pa obdržita izbor in predogled. Sestavi se prvih 200 vrstic trenutnega stanja podjetja kataloga (IQ Lighting, napisano v podnaslovu). | Tabela »Prvih N od M vrstic spletnega izvoza« in povzetek »v datoteki bo 2 vrstici« (sklanjano). |\r\n| 4 | Urednik / komerciala | `/splet/izvoz` | Klikneš **Prenesi CSV**. | Prenos cele datoteke po istih filtrih, z ločilom profila (`;` za katalog in stranke) in decimalno vejico pri cenah; zapis v zgodovino izvozov. | Datoteka v mapi Prenosi; na `/splet` v zgodovini vrsta »Prenos iz baze«. |\r\n| 5 | Urednik / skrbnik | `/izvozi/profili/{Id}` | Odpreš profil po številki (URL). | Stran pokaže stolpce: vrstni red, koda, izhodno ime, kanonično polje (ali »Ni preslikano«), obvezen/neobvezen, aktiven; spodaj predogled prvih 20 vrstic za izbrano podjetje. | Število vrstic celotne datoteke v napisu predogleda. |\r\n| 6 | Skrbnik | `/sistem/posel/WEB_STOCK_EXPORT` | Po potrebi vklopi posel cen in zaloge. | Za vsako podjetje nastane `magento-stock-prices.csv` v podmapi `EXPORT_ROOT`. | Faza DATOTEKA na strani posla. |\r\n\r\n## 7. Pravila in varovalke\r\n\r\n- Predogled in prenos berejo isto proceduro kot prava datoteka, zato pokažeta isto vsebino kot bi jo imela datoteka, izdelana v tem trenutku.\r\n- Ročni prenos **ne** zamenja datoteke v `EXPORT_ROOT` in ne sproži varovalke ali zapisa objave; Magento ga ne vidi.\r\n- »Samo objavljeni« odkljukano da vse izdelke podjetja, ne samo spletnih — tak CSV ni primeren za Magento.\r\n- Sprememba profila v registru takoj velja povsod, kjer se profil uporablja (tudi v pravi datoteki).\r\n- Profil cen in zaloge zahteva veljavnost za splet (cene in zaloga samo za objavljene artikle, 251).\r\n\r\n## 8. Ko gre kaj narobe\r\n\r\n| Znak (kaj vidiš) | Verjeten vzrok | Kaj narediš |\r\n|---|---|---|\r\n| »Predogleda trenutno ni mogoče pripraviti.« | Napaka v proceduri ali preobremenjena baza | Poskusi znova; skrbnik pogleda dnevnik. |\r\n| »Za ta profil izvoz na zahtevo ne zna sestaviti vrstic …« | Profil nima vira vrednosti, ki ga pozna `out.GetExportRows` | Profil se uporablja drugje (npr. SAOP); predogled ni mogoč. |\r\n| »Profil … trenutno nima nobene vrstice.« | Filtri ali izbrano podjetje brez podatkov | Preveri podjetje v zgornji vrstici (izbira organizacije). |\r\n| Stolpec je v predogledu prazen | Stolpec ni preslikan (»Ni preslikano«) ali vir nima vrednosti | `/splet/katalog` → »Stolpci brez nastavljenega vira«. |\r\n\r\n## 9. Tehnično ozadje\r\n\r\n\u003cdetails\u003e\r\n\u003csummary\u003eZa skrbnika in razvoj\u003c/summary\u003e\r\n\r\n- **Strani:** `WebExportBuild.razor` (`/splet/izvoz`), `ExportProfileDetail.razor` (`/izvozi/profili/{Id}`); prenos `izvoz/splet-na-zahtevo?…`.\r\n- **Storitve / delavci:** `WebExportBuildService` (`PreviewAsync`, zapis v `out.ExportRun`, ločilo iz `out.ExportProfile.FieldDelimiter`), `GovernanceReadService` (`GetExportProfilesAsync`, `GetExportColumnsAsync`); `PIM.B2bWorker --export-profile MAGENTO_STOCK_PRICES`.\r\n- **Tabele in pogledi:** `out.ExportProfile`, `out.ExportColumn`, `out.GetExportRows`, `intranet.GetWebExportRows`, `out.ExportRun`.\r\n- **Migracije:** 142 (izvoz iz tabel), 146 (pravila in zaloga), 150/151, 201/202, 216/217 (glave), 251, 271 (šumniki v glavah), 272 (izklop cen in zaloge), 277 (ločilo, decimalna vejica).\r\n- **Urniki:** `WEB_STOCK_EXPORT` (1800 s, privzeto izklopljen).\r\n\r\n\u003c/details\u003e\r\n\r\n## 10. Odprta vprašanja in razlike\r\n\r\n- ⚠️ Na `/izvozi/profili/{Id}` ne vodi nobena povezava v intranetu; seznama profilov ni. Stran je dosegljiva samo z ročnim vpisom številke.\r\n- ⚠️ Stolpcev profila v intranetu ni mogoče urejati; sprememba je poseg v bazo (skrbnik/razvoj).\r\n- ⚠️ `/splet/izvoz` je vedno za podjetje 2, `/izvozi/profili/{Id}` pa za trenutno izbrano organizacijo — predogleda se lahko razlikujeta.\r\n- ⚠️ `WEB_STOCK_EXPORT` je izklopljen (272); podmape 2, 3, 4 v `EXPORT_ROOT` z `magento-stock-prices.csv` so lahko še na disku (ročni korak je bil brisanje).\r\n\r\n## Povezani procesi\r\n\r\n- [Katalog in stranke za splet](katalog-in-stranke-csv.md): prava datoteka po istem profilu.\r\n- [Nadzor kataloga](nadzor-kataloga.md): stolpci brez vira.\r\n- [Atributi in nabori](../08-upravljanje/atributi-in-nabori.md): kanonična polja, ki jih profil preslika.\r\n- [Avtomatika in urniki](../09-administracija/avtomatika-in-urniki.md): vklop `WEB_STOCK_EXPORT`.\r\n"},{"pot":"06-izhod-splet/katalog-in-stranke-csv.md","vsebina":"---\r\nid: katalog-in-stranke-csv\r\nnaslov: Katalog in stranke za splet (katalog.csv in stranke.csv)\r\npodrocje: 06-izhod-splet\r\nstanje: delno\r\nbere: [pim.izdelek, pim.atributi, pim.besedila, pim.prevodi, pim.kategorije-izdelka, pim.mediji, pim.cene, pim.zaloge, pim.stranke, pim.popusti, pim.odprodaja, pim.validacija, pim.varovalke]\r\npise: [splet.katalog-csv, splet.stranke-csv, pim.varovalke, pim.izdelek, obvestila]\r\nstrani: [/splet]\r\nposli: [WEB_CATALOG_EXPORT]\r\nkoda: [PIM_Solution/workers/PIM.B2bWorker/*.cs, PIM_Solution/src/PIM.B2b/*.cs, PIM_Solution/src/PIM.Intranet/Components/Pages/Web.razor, PIM_Solution/src/PIM.Intranet/Services/MagentoArtifactService.cs, PIM_Solution/src/PIM.Intranet/Services/ExportDownloadEndpoint.cs, PIM_Solution/src/PIM.Intranet/Services/QualityReadService.cs, PIM_Solution/src/PIM.Automation/JobCatalog.cs]\r\nmigracije: [142, 146, 201, 202, 204, 208, 213, 216, 217, 234, 242, 251, 252, 253, 271, 274, 277, 279, 285, 291, 292, 293, 302, 306]\r\n---\r\n\r\n# Katalog in stranke za splet (katalog.csv in stranke.csv)\r\n\r\n\u003e **Področje:** Izhod na splet · **Lastnik:** urednik kataloga (vsebina), skrbnik (mapa in urnik) · **Stanje:** ⚠️ delno · **Preverjeno:** 2026-09-25, iz kode in s poskusnim izvozom na razvojni bazi\r\n\r\n## 1. Namen\r\n\r\nPIM iz objavljenih podatkov sam izdela par datotek za spletno trgovino Magento: `katalog.csv` (artikli) in `stranke.csv` (kupci s popusti). Datoteki sta ena sama para (katalog podjetja 2), vedno zamenjana skupaj, v izhodni mapi `EXPORT_ROOT`, od koder ju bere Magento.\r\n\r\n**Od 285 iz več podjetij** (register `out.CatalogSource`): artikli IQ Lighting (2) in Vidadria (3) v eni datoteki, en artikel = ena vrstica po šifri. »Spletne strani« so unija kljukic, vendar vsako podjetje samo za svoja spletišča: **svetila samo s kartice IQ, videlektro s kartice IQ ali ViD** (uporabnik 2026-09-25). Vsebina (nazivi, opisi, cene, atributi, slike) pride iz IQ, če IQ artikel objavlja, sicer iz ViD; kategorija spletišča iz podjetja, ki spletišče prispeva. Varovalka in zapis objave tečeta po podjetju. `stranke.csv` ima stranke obeh podjetij, vsako s svojo šifro, cenikom in popusti (Anja Zorenc: »Stranke so dvojne, imajo tudi dvojne šifre … Vodimo jo posebej.«).\r\n\r\n## 2. Kdo sodeluje\r\n\r\n| Vloga | Kaj naredi v procesu |\r\n|---|---|\r\n| Komerciala | Pregleda vsebino datotek na `/splet`, prenese datoteko za Excel, potrdi zadržane artikle na `/varovalke`. |\r\n| Urednik kataloga | Skrbi, da artikli izpolnjujejo pogoje za splet (kljukica, kategorija, validacija); razloge vidi na `/splet` v tabeli »Kaj gre v katalog.csv in zakaj ostali artikli ne, po podjetjih«. Potrdi zadržane artikle. |\r\n| Skrbnik | Nastavi izhodno mapo (`EXPORT_ROOT`) in pravice nanjo, urnik posla, samodejni umik; ročno zažene izvoz. |\r\n| Avtomatika (PIM) | Posel `WEB_CATALOG_EXPORT` izdela par datotek, pred tem umakne neveljavne kljukice (če je vklopljeno), varovalka zadrži sumljive artikle, zapiše, kaj je šlo na splet. |\r\n\r\n## 3. Kdaj se sproži\r\n\r\n- **Ročno:** skrbnik na `/splet` z gumbom **Izdelaj zdaj** (potrditev »Da, izdelaj«; ista zahteva kot na Nadzoru, sled `JOB_RUN_REQUEST`) ali na `/sistem/posel/WEB_CATALOG_EXPORT` (povezava »Urnik in zagon«). Ostale vloge gumba ne vidijo (»Samo za branje«; odločitev lastnika #26). Po potrditvi na `/varovalke` se zagon zahteva samodejno.\r\n- **Po urniku:** `WEB_CATALOG_EXPORT`, privzeti razmik 3600 s (vsako uro), meja trajanja 1800 s. ⚠️ Glej razdelek 10 (stran pričakuje 15 minut).\r\n- **Ob dogodku:** uspešna objava v PIM (`PRODUCT_PUBLICATION`, ta teče po uspešni validaciji) posel takoj postavi na vrsto. Brez uspešne objave je izvoz blokiran (odvisnost).\r\n\r\n## 4. Vhod in izhod\r\n\r\n| | Kaj | Od kod / kam |\r\n|---|---|---|\r\n| **Vhod** | Register virov kataloga `out.CatalogSource` (285): 2 prednost 10 vsa spletišča, 3 prednost 20 samo videlektro | PIM |\r\n| **Vhod** | Objavljeni artikli podjetij iz registra (2 in 3): nazivi SL/EN, atributi (enota v glavi, npr. `Bruto teža [kg]`), kategorije svetila in vid, slike, kljukice spletišč | PIM |\r\n| **Vhod** | Cena B2C iz cenika B2C podjetja 2; cena B2B iz cenika B2B podjetja 3 (Vidadria) po isti šifri | PIM (zajem cen iz SAOP) |\r\n| **Vhod** | Zaloga (lastna IQ + VID, ločeno dobaviteljeva), prihodi, popust odprodaje, S-popusti, posebni S po strankah in tipih | PIM |\r\n| **Vhod** | Aktivne stranke podjetij iz registra (2 in 3) z B2B profilom: tip → Magento skupina, cenik, plačnik, pragovi, skupine popustov (+ P2), B2B+ | PIM (zajem strank iz SAOP + ročne nastavitve) |\r\n| **Izhod** | `katalog.csv` (ločilo `;`, cene z decimalno vejico brez narekovajev) | `EXPORT_ROOT` → Magento |\r\n| **Izhod** | `stranke.csv` (ločilo `;`) in oznaka `magento-export.complete` | `EXPORT_ROOT` → Magento |\r\n| **Izhod** | Zapis, kaj je bilo objavljeno (osnova za odjavne vrstice in varovalko), zgodovina izdelave | PIM |\r\n\r\n## 5. Diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph P[\"🗂️ PIM\"]\r\n    A([Uspešna objava ali urnik]) --\u003e B[[Samodejni umik neveljavnih kljukic]]\r\n    B --\u003e C[[Sestava vrstic po izvoznem profilu]]\r\n    C --\u003e D{Varovalka najde sumljiv artikel?}\r\n    D -- da --\u003e E\u003eArtikel zadržan, čaka potrditev]\r\n    D -- ne --\u003e F[[Zamenjava para datotek]]\r\n    E -. ostali artikli .-\u003e F\r\n    F --\u003e G[[Zapis objave in zgodovine]]\r\n  end\r\n  subgraph U[\"👤 Uporabnik\"]\r\n    K[Pregled na strani splet]\r\n    L[Potrditev na strani varovalke]\r\n  end\r\n  subgraph W[\"🌐 Splet\"]\r\n    H[(katalog.csv)]\r\n    I[(stranke.csv)]\r\n    J([Magento uvozi par])\r\n  end\r\n  F --\u003e H\r\n  F --\u003e I\r\n  H --\u003e J\r\n  I --\u003e J\r\n  G --\u003e K\r\n  E --\u003e L\r\n  L -- nov zagon --\u003e C\r\n\r\n  classDef user fill:#e8f1ff,stroke:#2f6fd6,color:#0b2a5b;\r\n  classDef auto fill:#eef7ee,stroke:#3a8a3a,color:#123812;\r\n  classDef wait fill:#fff4e0,stroke:#d08a00,color:#4a3000;\r\n  classDef data fill:#f3f0fa,stroke:#6b54b0,color:#2a1f4d;\r\n  classDef endp fill:#f2f2f2,stroke:#777,color:#222;\r\n  class A,J endp; class K,L user; class B,C,D,F,G auto; class E wait; class H,I data;\r\n```\r\n\r\n## 6. Koraki\r\n\r\n| # | Kdo | Kje (stran) | Kaj narediš | Kaj se zgodi v sistemu | Kako preveriš, da je uspelo |\r\n|---|---|---|---|---|---|\r\n| 1 | Avtomatika | — | — | Po uspešni objavi (ali najkasneje po urniku) se zažene `PIM.B2bWorker --export-magento --organization-id 2`. Če drug zagon že teče, se ta umakne. | `/sistem/posel/WEB_CATALOG_EXPORT`: zadnji tek. |\r\n| 2 | Avtomatika | — | — | Najprej se uskladijo zadržki za »Pakirno naročanje« (302, `val.SyncPackageOrderHolds`, ena poizvedba na podjetje): artikel z oznako brez **objavljenega** Pakiranja 2 (\u003e 1; to je vrednost, ki gre v »Pakirno količino«) dobi zadržek za splet, artikel, ki ga je medtem dobil, se sprosti. Zajem iz SAOP piše Pakiranje 2 v zajem (`canon`); na splet pride šele z objavo v PIM (`val.Promote`, po uspešni validaciji) — do takrat razlog zadržka pove »Pakiranje 2 je vpisano (X), čaka objavo« (306). Nato se osveži čakalna vrsta pregleda artiklov z oznako O (glej [Nadzor kataloga](nadzor-kataloga.md)). Če je za podjetje vklopljen samodejni umik, PIM artikle, ki na spletišče ne smejo več, ponovno validira in jim odkljuka spletišče z zapisanim razlogom. | `/splet/umaknjeni`, zavihek »Samodejni umik«. |\r\n| 3 | Avtomatika | — | — | Vrstice se sestavijo po izvoznem profilu `MAGENTO_PRODUCTS`: artikel je v datoteki, če je aktiven, ima kljukico svetila ali videlektro, kategorijo na tem spletišču, je objavljen v PIM, veljaven za splet, brez ročnega zadržka in ni izključen. Artikel, ki je bil na spletu in ne sme več, gre še 14 dni kot **odjavna vrstica** s prazno »Spletne strani«. Stranke: profil `MAGENTO_CUSTOMERS`. | — |\r\n| 4 | Avtomatika | — | — | **Varovalka** primerja nove vrstice z zadnjo objavo (cena ni število, ×10/×100, 0, prazna, skok nad 25 %, množičen umik …). Sumljive artikle izpusti iz datoteke, ostale objavi. Posel zaradi varovalke nikoli ne pade. | Na `/splet` pasica varovalke in čip »brez zadržanih artiklov: N« ob katalog.csv. |\r\n| 5 | Avtomatika | — | — | Obe datoteki se zapišeta ob strani in šele nato skupaj zamenjata; nastane oznaka `magento-export.complete`. Ob kakršnikoli napaki ostane prejšnji veljavni par. | `/splet` → tabela »Zadnji izdelani datoteki za Magento«: čas, vrstice, velikost. |\r\n| 6 | Avtomatika | — | — | Zapiše se, kaj je šlo na splet (osnova za odjavne vrstice in naslednjo primerjavo varovalke) in vrstica v zgodovini izdelave s kontrolno vsoto. | `/splet` → »Zgodovina izdelave« (zložljivo; ročni prenosi skriti, dokler ne označiš »Tudi ročni prenosi iz baze«): vrsta »Izdelana datoteka«. |\r\n| 7 | Komerciala / urednik | `/splet` (zavihek **Pregled**) | Klikneš **Osveži**. Prebereš stavek stanja (npr. »katalog.csv je bil uspešno izdelan danes ob 18:22, 2.894 vrstic«) in čipa obeh datotek. | Stran prebere datoteki v mapi, zgodovino tekov (število vrstic iz zadnje uspešne izdelave) in urnik posla. Rdeče samo ob napaki (zadnji poskus ni uspel, datoteke ni); oranžno, ko je datoteka starejša od meje svežine posla (`SlaSeconds`), varovalka zadrži artikle ali je izdelava izklopljena. Mapa, račun in pravice so pod »Tehnične podrobnosti« (odprte samo, ko so vzrok). | Zelen stavek; čipa »V redu«. |\r\n| 8 | Komerciala / urednik | `/splet` | Pri datoteki klikneš **Preglej vsebino**, vpišeš šifro, EAN ali naziv in klikneš **Poišči v datoteki**; po želji **Vsi stolpci**. | Prikaže se vsebina dejansko izdelane datoteke (ne trenutne baze), po 50 vrstic. | Artikel je v zadetkih;
